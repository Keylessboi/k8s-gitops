---
# Build cellarr from the Keylessboi/cellarr fork and publish it to GHCR, for
# apps/cellarr-shadow (a read-only shadow of Lidarr) and, after cutover, as the
# Lidarr replacement. See docs/runbooks/cellarr-cutover.md.
#
# Same shape as octo.yaml: no personal access token (GITHUB_TOKEN with
# packages: write), nothing vendored, and the source checked out at a PINNED
# COMMIT, so the image only changes when FORK_REF does. The Deployment pins the
# digest this prints; tags are for humans.
#
# The binary is a static musl build (bundled SQLite, the web UI embedded), so
# the image is cellarr's own Dockerfile: alpine plus one file. amd64 only, like
# the other images built here.
name: cellarr

"on":
  push:
    branches: [main]
    paths: ['.github/workflows/cellarr.yaml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Keylessboi/cellarr branch ccr-28dccdf6-ysjbz9: the Lidarr face, shadow
  # mode, `cellarr snapshot`, streamed history, plugin sidecar.
  FORK_REPO: Keylessboi/cellarr
  FORK_REF: b0a43957e866cd835d65907ea2d75f6bbd55e14f
  IMAGE: ghcr.io/keylessboi/cellarr

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the fork at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.FORK_REF }}
          path: cellarr

      # The web UI is embedded into the binary at compile time.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Build the web UI
        working-directory: cellarr/web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build the static binary
        working-directory: cellarr
        run: |
          cross build --release --locked -p cellarr-cli --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/cellarr ./cellarr-amd64
          file ./cellarr-amd64

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          set -eu
          short="${FORK_REF:0:12}"
          date="$(date -u +%Y.%m.%d)"
          echo "tags=${IMAGE}:${date},${IMAGE}:fork-${short}" >> "$GITHUB_OUTPUT"
          echo "built ${IMAGE}:${date} from ${FORK_REPO}@${short}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: cellarr
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.FORK_REPO }}
            org.opencontainers.image.revision=${{ env.FORK_REF }}

      - name: Report the digest to pin
        run: echo "::notice::${IMAGE}@${{ steps.build.outputs.digest }}"
