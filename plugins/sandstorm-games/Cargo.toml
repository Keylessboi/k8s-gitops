[package]
name = "sandstorm-games"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lobby, TNT Run and Mob Arena for the sandstorm Pumpkin server"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must match the server release in the image (apps/pumpkin-games): the plugin
# ABI follows the host's WIT version.
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.2+26.3-26.60" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
