Log {
    Default_Log_Level = WARN;
}
NFS_CORE_PARAM {
    NFS_Port = 2049;
    mount_port = 20048;
    allow_set_io_flusher_fail = true;
    # Enable_UDP MUST be in THIS block. Ganesha takes the first block of a
    # given name and ignores later duplicates, so writing it as its own
    # second block lower down parsed cleanly, changed nothing, and left the
    # UDP listener running. That refilled /var/log with 72 GB and took the
    # k3s API server down a second time - the fix had been in this file, and
    # in git, and in the doctor log, for a day.
    #
    # The listener spins on a malformed datagram, logging
    # "svc_dg_rendezvous: Bad message sa_family is 0xffff" at ~10 MB/s.
    # Every export here is Transports = TCP and NFSv4 is TCP-only, so
    # nothing needs the datagram listener.
    Enable_UDP = false;
}

EXPORT_DEFAULTS {
    Access_Type = *;
    Squash = no_root_squash;
    Protocols = 3,4;
    Transports = TCP;
}

EXPORT {
    Export_Id = 1;
    Path = /volume1/k8s;
    FSAL {
        Name = VFS;
    }
    Access_Type = RW;
    Squash = No_Root_Squash;
    Protocols = 3,4;
    Transports = TCP;
    Pseudo = /volume1/k8s;
    Sectype = sys;
}
