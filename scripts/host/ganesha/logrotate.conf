# nfs-ganesha writes here unbounded. It reached 43GB and filled the node,
# which put the kubelet into DiskPressure and had it evicting pods - the
# qBittorrent pod died every few minutes and rechecked 2,228 torrents on
# each restart. copytruncate because ganesha holds the file open and does
# not reopen on SIGHUP.
/var/log/ganesha/ganesha.log {
    daily
    rotate 3
    maxsize 200M
    compress
    missingok
    notifempty
    copytruncate
}
