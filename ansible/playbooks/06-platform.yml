---
# 06-platform.yml - install the platform services via Helm.
#
# MetalLB, NFS CSI, CloudNativePG, and Redis.
# Runs on the k3s server with kubectl access.
#
#   doppler run --project kubernetes --config prd -- \
#     ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/06-platform.yml
#
# Rollback: helm uninstall each chart in reverse order.

- name: Install platform services
  hosts: k3s_server
  become: true
  gather_facts: true

  vars:
    redis_password: "{{ lookup('ansible.builtin.env', 'REDIS_PASSWORD') }}"

  pre_tasks:
    - name: Require REDIS_PASSWORD from Doppler
      ansible.builtin.assert:
        that:
          - redis_password | length > 0
        fail_msg: "REDIS_PASSWORD must come from Doppler. Run under doppler run -p kubernetes -c prd."

    - name: Ensure helm is available
      ansible.builtin.command: helm version --short
      register: helm_check
      changed_when: false
      failed_when: helm_check.rc != 0

  tasks:
    # --- MetalLB ----------------------------------------------------------
    - name: Install MetalLB
      block:
        - name: Add MetalLB Helm repo
          kubernetes.core.helm_repository:
            name: metallb
            repo_url: https://metallb.github.io/metallb

        - name: Install MetalLB chart
          kubernetes.core.helm:
            name: metallb
            chart_ref: metallb/metallb
            chart_version: "{{ metallb_chart_version }}"
            release_namespace: metallb
            create_namespace: true
            values:
              config:
                address-pools:
                  - name: default
                    protocol: layer2
                    addresses:
                      - "{{ metallb_pool_start }}-{{ metallb_pool_end }}"

      rescue:
        - name: Uninstall MetalLB on failure
          kubernetes.core.helm:
            name: metallb
            release_namespace: metallb
            state: absent
          ignore_errors: true

        - name: Fail after MetalLB rollback
          ansible.builtin.fail:
            msg: "MetalLB install failed. Chart was uninstalled."

    # --- NFS CSI ----------------------------------------------------------
    - name: Install NFS CSI driver
      block:
        - name: Add NFS CSI Helm repo
          kubernetes.core.helm_repository:
            name: csi-driver-nfs
            repo_url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts

        - name: Install NFS CSI chart
          kubernetes.core.helm:
            name: csi-driver-nfs
            chart_ref: csi-driver-nfs/csi-driver-nfs
            chart_version: "{{ nfs_csi_chart_version }}"
            release_namespace: kube-system
            values:
              driver:
                name: nfs.csi.k8s.io

      rescue:
        - name: Uninstall NFS CSI on failure
          kubernetes.core.helm:
            name: csi-driver-nfs
            release_namespace: kube-system
            state: absent
          ignore_errors: true

        - name: Fail after NFS CSI rollback
          ansible.builtin.fail:
            msg: "NFS CSI install failed. Chart was uninstalled."

    # --- Create NFS StorageClass ------------------------------------------
    - name: Create NFS StorageClass
      block:
        - name: Apply NFS StorageClass manifest
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: nfs-csi
              provisioner: nfs.csi.k8s.io
              parameters:
                server: "{{ nas_ip }}"
                share: "{{ nfs_share }}"
              reclaimPolicy: Retain
              volumeBindingMode: Immediate
              mountOptions:
                - nfsvers=4.1

      rescue:
        - name: Warn about StorageClass failure
          ansible.builtin.debug:
            msg: "NFS StorageClass creation failed. Check NFS connectivity."

    # --- CloudNativePG ----------------------------------------------------
    - name: Install CloudNativePG
      block:
        - name: Add CNPG Helm repo
          kubernetes.core.helm_repository:
            name: cnpg
            repo_url: https://cloudnative-pg.github.io/charts

        - name: Install CNPG chart
          kubernetes.core.helm:
            name: cnpg
            chart_ref: cnpg/cloudnative-pg
            chart_version: "{{ cnpg_chart_version }}"
            release_namespace: cnpg-system
            create_namespace: true

      rescue:
        - name: Uninstall CNPG on failure
          kubernetes.core.helm:
            name: cnpg
            release_namespace: cnpg-system
            state: absent
          ignore_errors: true

        - name: Fail after CNPG rollback
          ansible.builtin.fail:
            msg: "CNPG install failed. Chart was uninstalled."

    # --- Redis ------------------------------------------------------------
    - name: Install Redis
      block:
        - name: Add Bitnami Helm repo
          kubernetes.core.helm_repository:
            name: bitnami
            repo_url: https://charts.bitnami.com/bitnami

        - name: Install Redis chart
          kubernetes.core.helm:
            name: redis
            chart_ref: bitnami/redis
            chart_version: "{{ redis_chart_version }}"
            release_namespace: redis
            create_namespace: true
            values:
              architecture: standalone
              auth:
                enabled: true
                password: "{{ redis_password }}"
              master:
                persistence:
                  enabled: true
                  size: 2Gi
              replica:
                replicaCount: 0

      rescue:
        - name: Uninstall Redis on failure
          kubernetes.core.helm:
            name: redis
            release_namespace: redis
            state: absent
          ignore_errors: true

        - name: Fail after Redis rollback
          ansible.builtin.fail:
            msg: "Redis install failed. Chart was uninstalled."

    # --- Final status -----------------------------------------------------
    - name: Show installed Helm releases
      ansible.builtin.command: helm list --all-namespaces
      register: helm_list
      changed_when: false

    - name: Print Helm releases
      ansible.builtin.debug:
        msg: "{{ helm_list.stdout_lines }}"

    - name: Verify all pods are running
      ansible.builtin.command: kubectl get pods --all-namespaces --field-selector=status.phase!=Running,status.phase!=Succeeded
      register: failed_pods
      changed_when: false

    - name: Report pod status
      ansible.builtin.debug:
        msg: "{{ failed_pods.stdout_lines }}"
      when: failed_pods.stdout | length > 0

    - name: Confirm platform is ready
      ansible.builtin.debug:
        msg: "Platform services installed. MetalLB, NFS CSI, CNPG, and Redis are ready."
