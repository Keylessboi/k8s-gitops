---
# 06-platform.yml - verify the platform came up. Installs nothing.
#
#   ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/06-platform.yml
#
# This playbook used to `helm install` MetalLB, csi-driver-nfs, CloudNativePG
# and Redis. All four are ArgoCD Applications (apps/metallb, apps/nfs-csi,
# apps/cnpg, apps/redis) with automated sync and selfHeal, so the two owners
# fought each other continuously:
#
#   - MetalLB was installed here into namespace `metallb`, and by ArgoCD into
#     `metallb-system`. The values here also used the pre-0.13 `config`
#     ConfigMap style, which is a silent no-op on 0.14.9.
#   - csi-driver-nfs went into `kube-system` here and `nfs-csi` under ArgoCD:
#     two DaemonSets registering the same nfs.csi.k8s.io driver.
#   - It also created its own `nfs-csi` StorageClass without subDir or
#     onDelete. StorageClass parameters are immutable, so selfHeal could never
#     reconcile the difference — it just failed forever.
#   - CloudNativePG was pinned to 0.23.0 here and 0.23.2 in git.
#   - Redis was installed with an inline auth.password while ArgoCD's manifest
#     expects auth.existingSecret, so each owner clobbered the other.
#
# The ownership rule this restores: Ansible does host and cluster bootstrap
# (LXC, k3s). ArgoCD owns every workload. Nothing is installed by both.

- name: Verify platform services are healthy
  hosts: k3s_server
  become: true
  gather_facts: false

  # Ansible's non-login shell drops /usr/local/bin, where both the helm binary
  # and the k3s kubectl symlink live. Setting it once here beats patching each
  # task, which is what the previous ad-hoc fix did (and it only ever covered
  # a preflight check and two debug tasks, leaving every real install broken).
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Wait for every ArgoCD Application to report Healthy
      ansible.builtin.command:
        cmd: >-
          kubectl get applications -n argocd
          -o jsonpath={range .items[*]}{.metadata.name}={.status.health.status}{"\n"}{end}
      register: argo_apps
      changed_when: false
      retries: 30
      delay: 20
      until: "'Degraded' not in argo_apps.stdout and 'Missing' not in argo_apps.stdout"

    - name: Report application health
      ansible.builtin.debug:
        msg: "{{ argo_apps.stdout_lines }}"

    - name: Find pods that are neither Running nor Succeeded
      ansible.builtin.command:
        cmd: >-
          kubectl get pods --all-namespaces
          --field-selector=status.phase!=Running,status.phase!=Succeeded
      register: failed_pods
      changed_when: false

    - name: Report pod status
      ansible.builtin.debug:
        msg: "{{ failed_pods.stdout_lines | default(['all pods Running or Succeeded']) }}"

    - name: Confirm the ingress controller holds its LoadBalancer address
      ansible.builtin.command:
        cmd: >-
          kubectl get svc traefik -n kube-system
          -o jsonpath={.status.loadBalancer.ingress[0].ip}
      register: traefik_ip
      changed_when: false
      failed_when: traefik_ip.stdout != "192.168.1.240"
