# Hosts for the kubernetes-gitops cluster.
# Run any playbook with secrets loaded from Doppler:
#
#   doppler run --project proxmox --config prd -- \
#     ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/02-proxmox-lxc.yml
#
# Phone and Pi LAN IPs are still TBD (see facts.env in proxmox-128gb-infra).
# Fill them in here once the devices are flashed and on the LAN.

all:
  children:

    proxmox:
      # Proxmox hosts. We talk to these over SSH for prep tasks.
      # The API itself is called from localhost via community.proxmox.
      hosts:
        vostro:
          ansible_host: 192.168.1.153
          ansible_user: root
          pve_node: pve
          pve_ts_ip: 100.125.108.56
        dl360p:
          ansible_host: 192.168.1.220
          ansible_user: root
          pve_node: vmhub
          pve_ts_ip: 100.87.40.52

    nas:
      # Arch NAS. Arch uses doas, never sudo.
      hosts:
        arch-nas:
          ansible_host: 192.168.1.67
          ansible_user: travis
          ansible_become: true
          ansible_become_method: doas
          nas_ts_ip: 100.69.240.8

    k3s_server:
      # The k3s control plane. Lives inside the LXC that 02-proxmox-lxc.yml
      # creates on the Vostro. Set its IP after the LXC exists.
      hosts:
        k3s-lxc:
          ansible_host: "{{ k3s_lxc_lan_ip }}"
          ansible_user: root
          ansible_become: false

    phones:
      # Two Pixel 3a phones on postmarketOS. pmOS also uses doas.
      hosts:
        phone1:
          ansible_host: "{{ phone1_ip }}"   # fill in after flashing
          ansible_user: user
          ansible_become: true
          ansible_become_method: doas
        phone2:
          ansible_host: "{{ phone2_ip }}"   # fill in after flashing
          ansible_user: user
          ansible_become: true
          ansible_become_method: doas

    pis:
      # Raspberry Pi 4b (2GB). Ansible connects as root post-flash.
      hosts:
        pi4b:
          ansible_host: "{{ pi_ip }}"       # fill in after flashing
          ansible_user: root
          ansible_become: false

    k3s_agents:
      # Everything that joins the cluster as an agent.
      children:
        phones:
        pis:
