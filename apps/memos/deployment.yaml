---
# Memos: notes at notes.sandstorm.chat, replacing the Obsidian CouchDB endpoint.
#
# WHY IT REPLACED THAT. The old pair was a CouchDB sync endpoint with no UI of
# its own plus a proprietary client that gates plugin installation behind
# Restricted Mode - which is what made it look broken. The CouchDB held zero
# documents, so nothing was migrated and nothing was lost.
#
# WHY MEMOS RATHER THAN flatnotes, WHICH WAS ALMOST BUILT INSTEAD. flatnotes
# keeps notes as loose .md files, which is a genuinely nicer property - but it
# has no OIDC and, more decisively, NO USER SEPARATION AT ALL. Behind
# forward-auth every person with an authentik account would have shared one
# notebook. That stopped being hypothetical the moment accounts started being
# created for other people. Memos has real per-user accounts and OAuth2/OIDC.
# The trade accepted: notes live in Postgres rather than as files on disk.
#
# POSTGRES, NOT SQLITE. CONTRIBUTING rule 1. Memos ships a complete
# store/db/postgres driver, so there was no reason to add a fifth SQLite file
# to this cluster - unlike remux/ghost/convertx, which genuinely cannot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The kube-router race, for the seventh time in this repo: a pod can be
        # scheduled and start work before its NetworkPolicy is programmed, and
        # an allowed egress comes back REJECTed - which reads as "connection
        # refused", not as a timeout. Memos opens its database connection on
        # its first line of work, so it loses that race outright.
        - name: wait-for-db
          image: busybox:1.37
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              for attempt in $(seq 1 30); do
                if nc -z app-databases-rw.databases.svc.cluster.local 5432; then
                  echo "postgres reachable after ${attempt} attempt(s)"
                  exit 0
                fi
                echo "attempt ${attempt}/30: waiting for postgres"
                sleep 2
              done
              echo "postgres unreachable after 60s"
              exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
      containers:
        - name: memos
          image: neosmemo/memos:stable
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MEMOS_DRIVER
              value: postgres
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: memos, key: db-user}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: memos, key: db-password}
            # Composed by dependent env expansion so the password never appears
            # in git. The Doppler value is deliberately alphanumeric: a '@' or
            # '/' inside it would silently corrupt this DSN - the same trap
            # already documented on AIOStreams.
            - name: MEMOS_DSN
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/memos?sslmode=disable
            - name: MEMOS_PORT
              value: "5230"
            - name: MEMOS_MODE
              value: prod
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 5230
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          # Small on purpose: Memos was chosen partly BECAUSE the node sits at
          # its memory tripwire. A 21 MB image should not be handed 1 Gi.
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
