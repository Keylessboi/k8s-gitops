---
# notes.sandstorm.chat.
#
# NO forward-auth, and that is deliberate - it is how every OIDC app here is
# published (Immich, Nextcloud, Grafana all carry only crowdsec + rate-limit).
# Memos does its own OIDC against authentik and keeps real per-user accounts,
# so the middleware would be a second, redundant gate.
#
# It also does not WORK: the forward-auth middleware asks authentik's embedded
# outpost about the incoming host, and the outpost only knows hosts that have a
# PROXY provider. Memos has an OAuth2 provider instead, so the outpost has no
# entry for notes.sandstorm.chat and answers 404 - which is exactly what this
# host returned until the middleware was removed. Verified, not assumed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos
  namespace: memos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - notes.sandstorm.chat
      secretName: memos-tls
  rules:
    - host: notes.sandstorm.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memos
                port:
                  number: 80
