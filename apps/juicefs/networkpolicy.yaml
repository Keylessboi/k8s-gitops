---
# The CSI driver needs the Kubernetes API, the metadata database and the S3
# endpoint. Without a policy here the storage layer sat unrestricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: juicefs
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # kubelet probes and the CSI sidecars talk within the namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: juicefs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  egress:
    # Provisioning and node-publish both drive the API.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {port: 443, protocol: TCP}
    # The node plugin runs on the host network, so the apiserver may also be
    # reached on the node address.
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - {port: 6443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # PostgreSQL metadata engine.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - {port: 5432, protocol: TCP}
    # MinIO: the actual chunk store.
    - to:
        - ipBlock:
            cidr: 192.168.1.67/32
      ports:
        - {port: 9000, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: juicefs
