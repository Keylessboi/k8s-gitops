---
# S3-backed POSIX storage. This is the default class for app data, replacing
# nfs-csi for everything except media streaming.
#
# The referenced secret (juicefs-sc-secret) is bootstrapped out of band: it
# carries the MinIO service-account keys and the PostgreSQL metadata URL, and
# committing either to git is exactly the placeholder-secret trap that broke
# this repo before.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs
provisioner: csi.juicefs.com
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-sc-secret
  csi.storage.k8s.io/provisioner-secret-namespace: juicefs
  csi.storage.k8s.io/node-publish-secret-name: juicefs-sc-secret
  csi.storage.k8s.io/node-publish-secret-namespace: juicefs
  # Each PVC gets its own subdirectory inside the shared filesystem.
  pathPattern: "${.PVC.namespace}-${.PVC.name}"
  # JuiceFS runs ONE mount pod per volume, and its defaults are 1 CPU / 1Gi
  # each. With 14 volumes that reserved ~14Gi on a 12Gi node, so everything
  # newly scheduled sat Pending on "Insufficient memory".
  #
  # These are requests, not ceilings: the limits below still allow a mount to
  # burst when it is actually moving data. Raise the requests if a specific
  # workload turns out to need sustained throughput.
  juicefs/mount-cpu-request: 50m
  juicefs/mount-memory-request: 128Mi
  juicefs/mount-cpu-limit: "1"
  juicefs/mount-memory-limit: 1Gi
# Retain, so deleting a PVC never silently destroys app data. Matches the
# posture already used for nfs-csi.
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
