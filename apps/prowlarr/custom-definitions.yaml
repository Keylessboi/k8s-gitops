---
# Custom Cardigann definitions, mounted over Prowlarr's user-definition
# directory (/config/Definitions). Prowlarr loads anything here in preference
# to the built-in definition of the same id, so this is how a fix ships ahead
# of upstream - kept in git rather than edited inside a pod.
#
# Internet Archive was removed: its scanned books are OCR'd and the text
# quality is poor. IA reached the book pipeline ONLY through this definition
# (Shelfmark's own sources are Anna's Archive / LibGen / Z-Lib / Welib), so
# dropping it here plus deleting the live Prowlarr indexer removes it entirely.
#
# The ConfigMap is intentionally kept (empty) because prowlarr/deployment.yaml
# mounts it as a volume; deleting it would leave a dangling volume reference.
# Add future custom definitions back under data:.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-definitions
  namespace: prowlarr
data: {}
