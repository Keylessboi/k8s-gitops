---
# Prowlarr: indexer manager for *arr apps. Manages public indexers.
# Light workload. Runs on a compute node with tight limits.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: prowlarr
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: prowlarr

commonLabels:
  app.kubernetes.io/name: prowlarr
  app.kubernetes.io/part-of: homelab
  app.kubernetes.io/component: media
  app.kubernetes.io/managed-by: argocd
  homelab/tier: apps

resources:
  - namespace.yaml
  - pvc-config.yaml
  - networkpolicy.yaml
  - deployment.yaml

