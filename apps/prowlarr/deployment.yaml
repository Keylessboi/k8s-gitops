---
# Plain manifests: the bjw-s app-template chart ships an empty values.yaml,
# which kustomize's helmCharts generator cannot inflate.
#
# Prowlarr is INTERNAL ONLY — no Ingress. It is an indexer manager and is
# deliberately not published to the internet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      initContainers:
        # SEED THE API KEY, so losing the config volume cannot silently break
        # everything that calls Prowlarr.
        #
        # Prowlarr keeps its indexers, applications and credentials in Postgres
        # (PROWLARR__POSTGRES__* below), so the config PVC is nearly disposable
        # - with one exception. config.xml holds <ApiKey>, and that value is not
        # in Postgres. If this volume is ever lost or rebuilt, Prowlarr mints a
        # fresh random key on first start and comes up looking perfectly
        # healthy, while every caller that has the OLD key starts getting 401s:
        #   - remux's Torznab addon (apps/remux), which is where its stream
        #     sources come from, so playback simply stops finding anything
        #   - book-downloader (apps/books), via the bookdl-extras secret
        # Nothing alerts on that. It presents as "search returns no results",
        # which is exactly the kind of failure that costs an evening.
        #
        # Moving the volume to local-path made this worth fixing rather than
        # just noting: node-local storage is the one that can plausibly go away.
        #
        # The key is therefore DECLARATIVE - Doppler is the source of record and
        # this container makes the file agree with it. Consequence to know
        # before "fixing" it: rotating the key in Prowlarr's own UI will be
        # reverted on the next restart. Rotate it in Doppler instead.
        - name: seed-apikey
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          env:
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef: {name: prowlarr-apikey, key: api-key}
          args:
            - |
              set -eu
              CFG=/config/config.xml
              if [ -z "${PROWLARR_API_KEY}" ]; then
                echo "no API key in the secret - leaving config.xml alone"
                exit 0
              fi
              if [ ! -f "$CFG" ]; then
                # Disaster recovery: a fresh volume. Write a complete file
                # rather than letting Prowlarr generate one, because the whole
                # point is that the key must not be random.
                echo "config.xml absent - seeding a fresh one"
                {
                  echo '<Config>'
                  echo '  <BindAddress>*</BindAddress>'
                  echo '  <Port>9696</Port>'
                  echo '  <SslPort>6969</SslPort>'
                  echo '  <EnableSsl>False</EnableSsl>'
                  echo '  <LaunchBrowser>False</LaunchBrowser>'
                  echo '  <AuthenticationMethod>Forms</AuthenticationMethod>'
                  echo '  <AuthenticationRequired>Enabled</AuthenticationRequired>'
                  echo '  <Branch>master</Branch>'
                  echo '  <LogLevel>Info</LogLevel>'
                  echo '  <SslCertPath></SslCertPath>'
                  echo '  <SslCertPassword></SslCertPassword>'
                  echo '  <UrlBase></UrlBase>'
                  echo '  <InstanceName>Prowlarr</InstanceName>'
                  echo '  <UpdateMechanism>Docker</UpdateMechanism>'
                  echo "  <ApiKey>${PROWLARR_API_KEY}</ApiKey>"
                  echo '</Config>'
                } > "$CFG"
                chown 1000:1000 "$CFG"
                exit 0
              fi
              cur=$(sed -n 's#.*<ApiKey>\([^<]*\)</ApiKey>.*#\1#p' "$CFG")
              if [ "$cur" = "${PROWLARR_API_KEY}" ]; then
                echo "api key already matches the declared one - nothing to do"
                exit 0
              fi
              # Never echo either value. Lengths are enough to debug with.
              echo "api key differs (file=${#cur} chars, declared=${#PROWLARR_API_KEY} chars) - rewriting"
              cp "$CFG" "$CFG.bak.$(date +%s)"
              sed -i "s#<ApiKey>[^<]*</ApiKey>#<ApiKey>${PROWLARR_API_KEY}</ApiKey>#" "$CFG"
              chown 1000:1000 "$CFG"
              echo "rewritten"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: UTC
            # External Postgres instead of local SQLite. The *arr apps read
            # these as PostgresOptions and create their schema on first start.
            #
            # Postgres starts EMPTY - the app does not migrate its own data - so
            # the existing config is loaded separately with pgloader after the
            # schema exists. Cutting over without that step silently presents an
            # empty install.
            - name: PROWLARR__POSTGRES__HOST
              value: app-databases-rw.databases.svc.cluster.local
            - name: PROWLARR__POSTGRES__PORT
              value: "5432"
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr_main
            - name: PROWLARR__POSTGRES__LOGDB
              value: prowlarr_log
            - name: PROWLARR__POSTGRES__USER
              valueFrom:
                secretKeyRef: {name: prowlarr-db, key: user}
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef: {name: prowlarr-db, key: password}
          ports:
            - name: http
              containerPort: 9696
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            # Same defect that took Lidarr out of service: the default one-second
            # timeout is not enough once an *arr app has real work to do, and this
            # one is about to be given ~88 indexers to test and sync.
            timeoutSeconds: 15
            failureThreshold: 6
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
            # Custom Cardigann definitions. Prowlarr reads user definitions
            # from here and prefers them over the built-in set of the same id.
            - name: definitions
              mountPath: /config/Definitions
              readOnly: true
      volumes:
        - name: definitions
          configMap:
            name: prowlarr-definitions
            # Prowlarr 2.5.2 reads user definitions ONLY from
            # /config/Definitions/Custom (IndexerDefinitionUpdateService.All
            # reads that subdirectory for the meta listing; the full-definition
            # lookup then searches /config/Definitions recursively). ConfigMap
            # keys cannot contain "/", so every key in prowlarr-definitions
            # needs an items entry projecting it into Custom/ - a flat mount
            # would only be picked up by the disk-fallback path that runs when
            # indexers.prowlarr.com is unreachable.
            items:
              - key: libgen.yml
                path: Custom/libgen.yml
        - name: config
          persistentVolumeClaim:
            # prowlarr-config-local, NOT prowlarr-config. prowlarr.db is
            # SQLite and a search writes every result and history row into it,
            # on a volume where a 512-byte fsync cost 2.7-4.7s (1.2-2.5s even
            # after sync=disabled) against 0.006s on local disk. See
            # apps/prowlarr/pvc-config-local.yaml. The nfs-csi PVC stays
            # declared in pvc-config.yaml as the rollback.
            claimName: prowlarr-config-local
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
