---
# Plain manifests: the bjw-s app-template chart ships an empty values.yaml,
# which kustomize's helmCharts generator cannot inflate.
#
# Prowlarr is INTERNAL ONLY — no Ingress. It is an indexer manager and is
# deliberately not published to the internet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: UTC
            # External Postgres instead of local SQLite. The *arr apps read
            # these as PostgresOptions and create their schema on first start.
            #
            # Postgres starts EMPTY - the app does not migrate its own data - so
            # the existing config is loaded separately with pgloader after the
            # schema exists. Cutting over without that step silently presents an
            # empty install.
            - name: PROWLARR__POSTGRES__HOST
              value: app-databases-rw.databases.svc.cluster.local
            - name: PROWLARR__POSTGRES__PORT
              value: "5432"
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr_main
            - name: PROWLARR__POSTGRES__LOGDB
              value: prowlarr_log
            - name: PROWLARR__POSTGRES__USER
              valueFrom:
                secretKeyRef: {name: prowlarr-db, key: user}
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef: {name: prowlarr-db, key: password}
          ports:
            - name: http
              containerPort: 9696
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            # Same defect that took Lidarr out of service: the default one-second
            # timeout is not enough once an *arr app has real work to do, and this
            # one is about to be given ~88 indexers to test and sync.
            timeoutSeconds: 15
            failureThreshold: 6
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
            # Custom Cardigann definitions. Prowlarr reads user definitions
            # from here and prefers them over the built-in set of the same id.
            - name: definitions
              mountPath: /config/Definitions
              readOnly: true
      volumes:
        - name: definitions
          configMap:
            name: prowlarr-definitions
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
