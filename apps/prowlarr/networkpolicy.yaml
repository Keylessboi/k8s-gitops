apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Readarr (books) and Lidarr query Prowlarr for indexers. qui (downloads)
  # queries Prowlarr too - for the torznab "1-click" indexer sync and for
  # cross-seed searches, which qui stores in its own DB. This cluster enforces
  # NetworkPolicy at both ends, so the matching downloads egress to
  # prowlarr:9696 must exist as well.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: books
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lidarr
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: downloads
    # remux queries the Torznab feed here. Its DHT lookups cannot work at all
    # through the TCP-only SOCKS5 proxy it uses, so Torznab over plain HTTP is
    # what actually gives it sources.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: remux
    ports:
    - port: 9696
      protocol: TCP
  # cert-manager creates HTTP-01 solver pods in this namespace on demand and
  # Traefik must reach them on 8089. Without this the ACME challenge 502s and
  # no certificate is ever issued for this host.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8089
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prowlarr
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 9696
  egress:
  # The ntfy relay on the Proxmox host - health-issue notifications only.
  # travisbackupserver, where ntfy actually runs, is unreachable from this
  # cluster (separate L2 segment reusing the same /24), so the relay forwards
  # over Tailscale. See docs/ntfy.md.
  - to:
    - ipBlock:
        cidr: 192.168.1.153/32
    ports:
    - port: 9098
      protocol: TCP
  # Postgres. The *arr apps keep their main and log databases in the shared
  # CNPG cluster rather than local SQLite.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: databases
    ports:
    - port: 5432
      protocol: TCP
  # Out to the applications Prowlarr syncs indexers into.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: books
    ports:
    - port: 8787
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lidarr
    ports:
    - port: 8686
      protocol: TCP
  # bitmagnet: Prowlarr queries its Torznab endpoint directly, in-cluster
  # (indexer test, RSS, searches). NetworkPolicy is enforced at both ends in
  # this cluster, so this rule only works because bitmagnet's own policy
  # allows ingress from this namespace on 3333 — keep the two in step.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: bitmagnet
    ports:
    - port: 3333
      protocol: TCP
  # qBittorrent's WebUI, so Prowlarr can push a manual grab to a download
  # client. Lidarr and Readarr each drive qBittorrent directly and do not need
  # this - the automated path already works - but a "Grab" from Prowlarr's own
  # search UI has nowhere to go without it.
  #
  # The downloads side ALREADY allowed prowlarr on 8080; only this half was
  # missing, so the flow failed with a bare 000. Note the asymmetry with the
  # hermes/lidarr bug on 2026-09-03: there the egress existed and the ingress
  # did not; here it is the other way round. Both halves are required and
  # neither implies the other.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: downloads
    ports:
    - port: 8080
      protocol: TCP
  # k3s apiserver. Reachable ONLY via ipBlock: a namespaceSelector for the
  # "default" namespace matches PODS in it, never the 10.43.0.1 service IP, so
  # the old rule was a no-op. Every NetworkPolicy in this repo was missing real
  # API access, which hard-broke the API clients (nfs-csi provisioner, doppler
  # operator, cnpg operator, prometheus) and cascaded to every PVC and secret.
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  # Tubifarry routes Cloudflare-protected indexer requests through
  # FlareSolverr; without this egress rule the connection silently times out.
  # k3s DNATs 10.43.0.1:443 to the node's own address before NetworkPolicy
  # egress is evaluated, so the Service rule above matches nothing for a new
  # connection and the API call fails. This is the defect that broke CNPG's
  # base backups and, here, kept the Doppler operator from ever winning leader
  # election - i.e. from ever syncing a secret.
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - port: 6443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: flaresolverr
    ports:
    - port: 8191
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
  # Reach our own services through the load balancer.
  # CoreDNS resolves *.sandstorm.chat to 192.168.1.240 in-cluster (see
  # apps/coredns), and the 0.0.0.0/0 rule below deliberately excludes
  # 192.168.0.0/16 - so without this rule that lookup succeeds and the connection
  # is then dropped. Needed by anything doing OIDC discovery against Authentik.
  - to:
    - ipBlock:
        cidr: 192.168.1.240/32
    ports:
    - port: 443
      protocol: TCP
      # Plain HTTP too. Several trackers redirect via port 80 or serve
      # torrent files there; with only 443 allowed the request is not
      # refused, it hangs - surfacing as "indexer's server is unavailable,
      # Http request timed out", which looks like the tracker being down
      # rather than a local policy drop.
    - protocol: TCP
      port: 80
  # ...and the same rule again in post-DNAT terms. k3s translates
  # 192.168.1.240:443 to the Traefik pod at :8443 BEFORE NetworkPolicy egress is
  # evaluated, so the ipBlock rule above matches nothing on a new connection -
  # the identical trap that broke CNPG's base backups and the Doppler operator.
  # Traefik listens on 8443/8000 internally, not 443/80.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8443
      protocol: TCP
    - port: 8000
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 172.16.0.0/12
    ports:
    - protocol: TCP
      port: 443
    # Plain HTTP too. Several trackers redirect via port 80 or serve their
    # torrent files there; with only 443 allowed the request is not refused,
    # it hangs - surfacing as "indexer's server is unavailable, Http request
    # timed out", which reads like the tracker being down rather than a
    # local policy drop.
    - port: 80
      protocol: TCP
