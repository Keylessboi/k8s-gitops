---
# NetworkPolicy is evaluated at BOTH ends in this cluster, so the matching
# ingress for the Postgres egress below is added to
# apps/databases/networkpolicy.yaml in the same commit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: invidious
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik reaches invidious on :3000 (TLS terminates at the Ingress).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 3000, protocol: TCP}
    # cert-manager creates HTTP-01 solver pods in THIS namespace on demand and
    # Traefik must reach them on 8089, or the ACME challenge 502s and no cert
    # is ever issued for invidious.sandstorm.chat.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 8089, protocol: TCP}
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Postgres on the shared CNPG cluster (matching ingress added to
    # apps/databases/networkpolicy.yaml).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - {port: 5432, protocol: TCP}
    # Outbound HTTPS/HTTP to the internet, minus the private ranges. This is
    # the app's whole job: invidious AND the companion sidecar fetch metadata,
    # player responses and video streams from YouTube/Google endpoints, so
    # unlike convertx this pod cannot be egress-locked to DNS only. Private
    # ranges are excluded so this rule never becomes a backdoor to in-cluster
    # or LAN services (Postgres is opened explicitly above).
    #
    # NOTE: this egresses from the HOME WAN with no VPN - the same posture as
    # the bgutil POT provider in the lidarr namespace. If YouTube starts
    # blocking the home IP, the gluetun pattern (apps/downloads/qbittorrent.yaml)
    # is the upgrade path.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 80}
