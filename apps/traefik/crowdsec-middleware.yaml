---
# The CrowdSec bouncer: enforces CrowdSec's decisions on every request.
#
# CrowdSec's agent watches Traefik's access logs and decides who is attacking;
# this middleware is what actually turns those decisions into blocks. Without
# it CrowdSec would observe and log, and nothing would ever be denied.
#
# It also enforces the community blocklist, so addresses already caught
# attacking other CrowdSec users are blocked here before they try anything.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec
  namespace: kube-system
spec:
  plugin:
    crowdsec:
      enabled: "true"
      # `stream` keeps a local cache of decisions refreshed in the background,
      # rather than calling the LAPI on every single request. `live` would put
      # CrowdSec in the hot path of every request and make it a availability
      # dependency for the whole cluster.
      crowdsecMode: stream
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiScheme: http
      # A file, not an inline value - see the volume mount in the chart values.
      crowdsecLapiKeyFile: /etc/crowdsec/bouncer-key
      # Requests from inside the cluster and the LAN are never bounced, so a
      # bad decision cannot lock out internal traffic or the ACME solver.
      clientTrustedIPs:
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 192.168.1.0/24
        # The owner's household WAN (dynamic ISP - update when it changes,
        # see apps/crowdsec/kustomization.yaml). Trusted IPs bypass every
        # bouncer check, so no CrowdSec decision - including
        # community-blocklist entries and decisions created before the
        # parser-stage whitelist existed - can ever 403 this source. That is
        # what killed the 2026-08-29 immich bulk restore: legitimate
        # hours-long upload traffic tripped the http scenarios into ban
        # storms. This only stops IP bans; auth middlewares and the
        # rate limiter are unaffected.
        - 74.101.53.75/32
        # Second observed household WAN (same flapping ISP - see the parser
        # whitelist in apps/crowdsec). Bulk-uploader IP during the 2026-08-29
        # immich restore.
        - 144.62.224.77/32
      # Traefik sits behind the router, so the real client address comes from
      # the forwarded header rather than the connection.
      forwardedHeadersTrustedIPs:
        - 10.42.0.0/16
        - 192.168.1.0/24
