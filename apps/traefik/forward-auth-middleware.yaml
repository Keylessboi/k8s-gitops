---
# Traefik middleware that sends every request to Authentik before letting it
# reach the backend. This is how apps with no OIDC support of their own
# (Lidarr, Prowlarr) get put behind SSO.
#
# It exists because Lidarr was published to the internet with
# AuthenticationMethod=None: anyone who found the hostname had full admin
# access. Rather than give each app its own local account, they share the
# Authentik login.
#
# Lives in kube-system alongside Traefik so a single middleware can be
# referenced cross-namespace as <namespace>-<name>@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: kube-system
spec:
  forwardAuth:
    # The embedded outpost inside the Authentik server serves this path.
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
