---
# The ingress controller. k3s ships Traefik but this cluster runs with
# `--disable=traefik`, and Pangolin (which the plan expected to bring its own
# Traefik via the chart's controller mode) is deployed here as a plain
# Deployment, so it brings none. The result was a cluster with Ingress objects,
# TLS annotations and an ingressClassName of "traefik" — and no ingress
# controller at all. Nothing was reachable.
#
# Deployed into kube-system deliberately: every per-app NetworkPolicy in this
# repo already allows ingress from kube-system, so putting Traefik anywhere
# else would require editing all of them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: traefik
  annotations:
    # Before cert-manager's HTTP-01 solver and before any app Ingress.
    argocd.argoproj.io/sync-wave: "-6"

namespace: kube-system

resources:
  - forward-auth-middleware.yaml
  - rate-limit-middleware.yaml
  - crowdsec-middleware.yaml
  - servicemonitor.yaml
  - lan-only-middleware.yaml

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    # Chart 41.x = Traefik v3.7. Notes from the 33 -> 41 jump that shaped the
    # values below (chart majors 34, 39 and 41 renamed keys this file uses):
    #   - ports.<ep>.redirectTo -> ports.<ep>.http.redirections.entryPoint
    #   - ports.<ep>.tls        -> ports.<ep>.http.tls
    #   - logs.general / logs.access -> log / accessLog
    # The chart's values.schema.json rejects the old keys, so a stale key
    # fails the render instead of being silently dropped.
    #
    # The chart no longer ships the Gateway API CRDs. Nothing here uses the
    # Gateway API (the provider is off), so ArgoCD prunes the copies this app
    # used to own; install them separately before enabling that provider.
    version: 41.6.1
    releaseName: traefik
    namespace: kube-system
    # CRDs are rendered into the manifest set and applied by ArgoCD with
    # ServerSideApply (set on the ApplicationSet), so they are updated in the
    # same sync as the Deployment rather than being left at their first-install
    # version the way `helm upgrade` would leave them.
    includeCRDs: true
    valuesInline:
      # The CrowdSec bouncer runs as a Traefik plugin, so Traefik itself has
      # to load it. Plugins are fetched at startup, which is why this lives in
      # the chart values rather than only in a Middleware.
      # The bouncer key is presented from a mounted file rather than inlined
      # in the Middleware, which is a plain-text CRD field readable by anyone
      # who can get middlewares. The Secret behind it comes from Doppler.
      deployment:
        additionalVolumes:
          - name: crowdsec-bouncer-key
            secret:
              secretName: crowdsec-bouncer-key
      additionalVolumeMounts:
        - name: crowdsec-bouncer-key
          mountPath: /etc/crowdsec
          readOnly: true
      experimental:
        plugins:
          crowdsec:
            moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
            version: v1.7.1
      ingressClass:
        enabled: true
        isDefaultClass: true
        name: traefik
      providers:
        kubernetesIngress:
          enabled: true
          allowExternalNameServices: true
          # Publish the LoadBalancer address onto every Ingress so
          # `kubectl get ingress` shows a real ADDRESS.
          publishedService:
            enabled: true
        kubernetesCRD:
          enabled: true
          allowCrossNamespace: true
      service:
        enabled: true
        type: LoadBalancer
        # Preserve the real client address.
        #
        # With the default `Cluster`, kube-proxy SNATs every inbound packet and
        # Traefik logged 10.42.0.1 - the node's own gateway - as the client for
        # ALL public traffic. CrowdSec would then only ever see one attacker and
        # ban an address internal to the cluster, and the rate limiter would
        # treat the entire internet as a single client. Both were effectively
        # inert. `Local` keeps the source address intact; on a single node there
        # is no imbalance cost, because every packet already lands on the only
        # node running Traefik.
        spec:
          externalTrafficPolicy: Local
        annotations:
          # Pin the forwarded address. The router sends 80/443 here, so any
          # other LoadBalancer grabbing this IP would siphon all public traffic.
          metallb.universe.tf/loadBalancerIPs: 192.168.1.240
      ports:
        web:
          port: 8000
          exposedPort: 80
          # Everything is HTTPS; bare HTTP only exists to redirect.
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
                permanent: true
                priority: 10
            aliasHeadersStrategy: delete
        websecure:
          port: 8443
          exposedPort: 443
          http:
            tls:
              enabled: true
            # Drop request headers whose names contain anything other than
            # letters, digits and dashes (Traefik >= 3.7.12).
            #
            # Go treats X-Authentik-Username and X_Authentik_Username as two
            # different headers, but CGI/WSGI/PHP backends map both to
            # HTTP_X_AUTHENTIK_USERNAME. ForwardAuth only overwrites the dash
            # form, so a client could smuggle the underscore form past it to
            # a backend that trusts the header. Calibre-Web (books) is WSGI;
            # its reverse-proxy header login is off today (checked 2026-10-01),
            # and this keeps it safe if anyone turns it on. The default `keep`
            # forwards such headers untouched.
            aliasHeadersStrategy: delete
          # Traefik v3 defaults respondingTimeouts.readTimeout to 60s (v2 was
          # unlimited). A multi-GB video upload at the measured ~25 MB/s needs
          # minutes in flight, so every 2.6-3.2 GB file died with a 504 at
          # exactly 60s (access log: "POST /api/assets" 504 ... 60000ms) while
          # files under ~1.5 GB flowed. Zero 413s across all upload windows
          # proves body size is not involved - do not add a body-size knob.
          # 20m matches immich-go's own client timeout, so Traefik can never
          # be the limiting factor for a legitimate upload, while staying
          # bounded: readTimeout: 0 would let a stalled upload hold an edge
          # connection open forever.
          transport:
            respondingTimeouts:
              readTimeout: 20m
        # Internal entrypoints: set too, so no entrypoint runs with the
        # unsafe default and Traefik's per-entrypoint startup warning stays
        # meaningful if a new one is ever added.
        metrics:
          http:
            aliasHeadersStrategy: delete
        traefik:
          http:
            aliasHeadersStrategy: delete
      log:
        level: INFO
      # CrowdSec parses these (apps/crowdsec acquires traefik-* pod logs with
      # the crowdsecurity/traefik parser), so keep the default `common` format.
      accessLog:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
