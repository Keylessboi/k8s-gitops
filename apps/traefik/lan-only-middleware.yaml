---
# Restrict a route to the LAN and Tailscale.
#
# Traefik v3 renamed this from ipWhiteList to ipAllowList; the old name is
# silently ignored on this version, which would leave the route wide open
# rather than erroring - so it is worth being explicit about which is in use.
#
# Deliberately NO ipStrategy: Traefik's Service runs with
# externalTrafficPolicy: Local, so the connection's source address IS the real
# client and Traefik matches on it directly. An ipStrategy of depth 1 reads
# X-Forwarded-For instead, which a direct browser request never sends - that
# denied LAN traffic with 403 while looking correct.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: kube-system
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24      # LAN
      - 100.64.0.0/10       # Tailscale (CGNAT range)
      - 10.42.0.0/16        # cluster pods
      - 10.43.0.0/16        # cluster services
