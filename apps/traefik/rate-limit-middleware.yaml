---
# Rate limiting at the edge.
#
# Everything here is internet-facing, and Traefik's access log already shows
# steady automated probing (WordPress paths, .env, wp-login and friends within
# minutes of exposure). Rate limiting does not stop a determined attacker but
# it flattens credential stuffing and scraping, and it keeps one noisy source
# from consuming the node.
#
# Declarative and in git, unlike a proxy that keeps its rules in its own
# database.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: kube-system
spec:
  rateLimit:
    # Sustained requests per second per source, averaged over the period.
    average: 50
    # Short bursts above that are allowed - a browser opening a page fires
    # many requests at once and should not be throttled for it.
    burst: 100
    period: 1s
    sourceCriterion:
      # Take the client IP from X-Forwarded-For, counting one hop back: the
      # router in front of Traefik. Without depth the limit would apply to the
      # router's address and rate-limit the whole internet as a single client.
      ipStrategy:
        depth: 1
---
# A stricter limit for login endpoints, where brute force actually matters.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-auth
  namespace: kube-system
spec:
  rateLimit:
    average: 5
    burst: 10
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
