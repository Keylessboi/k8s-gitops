---
# Maps Doppler configs to Kubernetes Secrets in each app namespace.
# The operator creates and refreshes the named Secrets.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: homelab-shared
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/name: doppler-operator
    app.kubernetes.io/part-of: homelab
spec:
  tokenSecret:
    name: doppler-token-secret
    key: serviceToken
  project: homelab
  config: prd
  managedSecret:
    name: homelab-shared
    namespace: monitoring
    type: Opaque
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: media-shared
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/name: doppler-operator
    app.kubernetes.io/part-of: homelab
spec:
  tokenSecret:
    name: doppler-token-secret
    key: serviceToken
  project: media
  config: prd
  managedSecret:
    name: media-shared
    namespace: media
    type: Opaque
