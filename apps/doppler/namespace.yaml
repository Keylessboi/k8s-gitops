---
apiVersion: v1
kind: Namespace
metadata:
  name: doppler-operator-system
  labels:
    app.kubernetes.io/name: doppler-operator
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Service-account token Secret. The operator reads it to reach Doppler.
# Do not commit a real token. Create it once by hand:
#   doppler configs tokens create -p homelab -c prd kubernetes \
#     | age -r <your-age-key> ... or store it out of band.
# This file holds an empty placeholder so kustomize builds clean.
apiVersion: v1
kind: Secret
metadata:
  name: doppler-token-secret
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/name: doppler-operator
    app.kubernetes.io/part-of: homelab
stringData:
  serviceToken: REPLACE_WITH_DOPPLER_SERVICE_TOKEN
