---
# Doppler operator. Syncs Doppler projects into Kubernetes secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: doppler
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: doppler-operator
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: doppler-operator-system

commonLabels:
  app.kubernetes.io/name: doppler-operator
  app.kubernetes.io/part-of: homelab
  app.kubernetes.io/component: secrets
  app.kubernetes.io/managed-by: argocd
  homelab/tier: platform

# The chart creates the doppler-operator-system Namespace itself, so declaring
# it here too makes kustomize fail with a duplicate-resource merge error.
resources:
  - dopplersecret.yaml
  - networkpolicy.yaml

helmCharts:
  # NOTE: this chart ships NO values.yaml. Supplying valuesInline makes kustomize
  # fail with "could not parse values file into rnode: EOF", which is what kept
  # the operator from ever rendering. It exposes no nodeSelector/resources knobs,
  # so there is nothing to configure here.
  - name: doppler-kubernetes-operator
    repo: https://helm.doppler.com
    version: 1.5.7
    releaseName: doppler-operator
    namespace: doppler-operator-system
