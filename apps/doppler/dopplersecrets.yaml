# Hardcover API key, the qBittorrent WebUI password and the Prowlarr API key,
# for the book downloader.
#
# All three land in one managed Secret rather than one DopplerSecret each: they
# share a consumer, a namespace and a lifetime, and the operator mirrors only
# the keys named in `secrets:` - so nothing extra leaks into `books` either way.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: bookdl-extras
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [HARDCOVER_API_KEY, QBITTORRENT_PASSWORD, PROWLARR_API_KEY]
  processors:
    HARDCOVER_API_KEY: {asName: hardcover-api-key, type: plain}
    QBITTORRENT_PASSWORD: {asName: qbittorrent-password, type: plain}
    PROWLARR_API_KEY: {asName: prowlarr-api-key, type: plain}
  managedSecret:
    name: bookdl-extras
    namespace: books
    type: Opaque
  resyncSeconds: 300
---
# Authentik OIDC client for qui's native login. Bound to its own `qui-oidc`
# application slug: the `qui` slug is already taken by the forward-auth proxy
# provider, and the discovery URL is derived from the slug, so sharing it would
# have served the wrong provider's metadata.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: qui-oidc
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [QUI_OIDC_CLIENT_ID, QUI_OIDC_CLIENT_SECRET]
  processors:
    QUI_OIDC_CLIENT_ID: {asName: client-id, type: plain}
    QUI_OIDC_CLIENT_SECRET: {asName: client-secret, type: plain}
