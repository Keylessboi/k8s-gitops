# Same pattern as prowlarr/readarr/lidarr/forgejo: a basic-auth secret in the
# databases namespace, referenced by passwordSecret in apps/databases/cluster.yaml.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: pelican-db-credentials
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [PELICAN_DB_USER, PELICAN_DB_PASSWORD]
  processors:
    PELICAN_DB_USER: {asName: username, type: plain}
    PELICAN_DB_PASSWORD: {asName: password, type: plain}
  managedSecret:
    name: pelican-db-credentials
    namespace: databases
    type: kubernetes.io/basic-auth
  resyncSeconds: 300
---
# Everything the Pelican Panel pod consumes, in one managed Secret in its own
# namespace. Like bookdl-extras, these share a consumer, a namespace and a
# lifetime, and the operator mirrors ONLY the keys named in `secrets:` — so
# nothing else in the Doppler config leaks into the pelican namespace.
#
#   - app-key           Laravel APP_KEY. Generated ONCE and stored here; it
#                       encrypts Wings node tokens, so regenerating it would
#                       silently invalidate every registered node.
#   - db-password       the same Postgres password as pelican-db-credentials,
#                       this side of the wire for DB_PASSWORD.
#   - redis-password    the shared redis-master requirepass (Doppler REDIS_PASSWORD).
#   - oidc-client-*     the Authentik OAuth2 provider "Pelican" (slug `pelican`).
#   - s3-*              the pre-provisioned MinIO service account scoped to the
#                       pterodactyl-backups bucket (see docs/pterodactyl-wings.md).
#   - admin-password    first admin account, consumed by the one-shot user Job.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: pelican-app
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets:
    - PELICAN_APP_KEY
    - PELICAN_DB_PASSWORD
    - REDIS_PASSWORD
    - PELICAN_OIDC_CLIENT_ID
    - PELICAN_OIDC_CLIENT_SECRET
    - MINIO_PTERODACTYL_ACCESS_KEY
    - MINIO_PTERODACTYL_SECRET_KEY
    - PELICAN_ADMIN_PASSWORD
  processors:
    PELICAN_APP_KEY: {asName: app-key, type: plain}
    PELICAN_DB_PASSWORD: {asName: db-password, type: plain}
    REDIS_PASSWORD: {asName: redis-password, type: plain}
    PELICAN_OIDC_CLIENT_ID: {asName: oidc-client-id, type: plain}
    PELICAN_OIDC_CLIENT_SECRET: {asName: oidc-client-secret, type: plain}
    MINIO_PTERODACTYL_ACCESS_KEY: {asName: s3-access-key, type: plain}
    MINIO_PTERODACTYL_SECRET_KEY: {asName: s3-secret-key, type: plain}
    PELICAN_ADMIN_PASSWORD: {asName: admin-password, type: plain}
  managedSecret:
    name: pelican-app
    namespace: pelican
    type: Opaque
  resyncSeconds: 300
---
# bitmagnet's Postgres role, in the shape CNPG's managed-roles reconciler
# wants. Same pattern as prowlarr/readarr/lidarr/pelican: a basic-auth secret
# in the databases namespace, referenced by passwordSecret in
# apps/databases/cluster.yaml.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: bitmagnet-db-credentials
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [BITMAGNET_DB_USER, BITMAGNET_DB_PASSWORD]
  processors:
    BITMAGNET_DB_USER: {asName: username, type: plain}
    BITMAGNET_DB_PASSWORD: {asName: password, type: plain}
  managedSecret:
    name: bitmagnet-db-credentials
    namespace: databases
    type: kubernetes.io/basic-auth
  resyncSeconds: 300
---
# ...and the same password in bitmagnet's own namespace, for its env vars.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: bitmagnet-db
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [BITMAGNET_DB_USER, BITMAGNET_DB_PASSWORD]
  processors:
    BITMAGNET_DB_USER: {asName: user, type: plain}
    BITMAGNET_DB_PASSWORD: {asName: password, type: plain}
  managedSecret:
    name: bitmagnet-db
    namespace: bitmagnet
    type: Opaque
  resyncSeconds: 300
---
# AirVPN WireGuard credentials for the gluetun sidecar in the JELLYFIN pod.
#
# The SAME four Doppler values the downloads pod uses (AIRVPN_*), synced into a
# second namespace. Jellyfin's gluetun builds its own separate tunnel - a second
# WireGuard session on the same AirVPN account - so the credentials are reused
# but the managed Secret is namespace-local (a Secret cannot be shared across
# namespaces). server-countries is carried for the record though gluetun leaves
# it unset (see the Deployment); only private-key/preshared-key/addresses are
# actually consumed.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: airvpn-jellyfin
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets:
    - AIRVPN_PRIVATE_KEY
    - AIRVPN_PRESHARED_KEY
    - AIRVPN_ADDRESSES
    - AIRVPN_SERVER_COUNTRIES
  processors:
    AIRVPN_PRIVATE_KEY: {asName: private-key, type: plain}
    AIRVPN_PRESHARED_KEY: {asName: preshared-key, type: plain}
    AIRVPN_ADDRESSES: {asName: addresses, type: plain}
    AIRVPN_SERVER_COUNTRIES: {asName: server-countries, type: plain}
  managedSecret:
    name: airvpn
    namespace: jellyfin
    type: Opaque
  resyncSeconds: 60
---
# AIOStreams' SECRET_KEY (64-char hex). It encrypts the stored addon
# configuration, and the manifest URL Gelato consumes is only decryptable with
# it, so it must be STABLE across pod rolls - generated once, kept here, never
# rotated (rotating it invalidates every existing manifest URL). Consumed by the
# aiostreams container via secretKeyRef.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: aiostreams
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [AIOSTREAMS_SECRET_KEY]
  processors:
    AIOSTREAMS_SECRET_KEY: {asName: secret-key, type: plain}
  managedSecret:
    name: aiostreams
    namespace: jellyfin
    type: Opaque
  resyncSeconds: 300
---
# The Authentik OIDC client for the jellyfin-plugin-sso, as the declared home of
# the credential so it survives a cluster rebuild.
#
# Like mam-prowlarr, NOTHING MOUNTS THIS SECRET. The SSO plugin stores its OIDC
# client id/secret in Jellyfin's own plugin config (entered in the dashboard UI
# on the fresh install - see docs/jellyfin-gelato.md), not in an env var. This
# DopplerSecret exists so the value has a source of record and re-applying it
# after a restore is a UI step, not a secret regeneration. Provider "jellyfin"
# (slug jellyfin) is created in Authentik via `ak shell`.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: jellyfin-oidc
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [JELLYFIN_OIDC_CLIENT_ID, JELLYFIN_OIDC_CLIENT_SECRET]
  processors:
    JELLYFIN_OIDC_CLIENT_ID: {asName: client-id, type: plain}
    JELLYFIN_OIDC_CLIENT_SECRET: {asName: client-secret, type: plain}
  managedSecret:
    name: jellyfin-oidc
    namespace: jellyfin
    type: Opaque
  resyncSeconds: 300
---
# ConvertX's JWT signing key, 64-char hex, generated once. ConvertX keeps
# accounts in its own sqlite and signs session cookies with this; rotating it
# only logs everyone out, so there is no reason to ever touch it again.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: convertx
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [CONVERTX_JWT_SECRET]
  processors:
    CONVERTX_JWT_SECRET: {asName: jwt-secret, type: plain}
  managedSecret:
    name: convertx
    namespace: convertx
    type: Opaque
  resyncSeconds: 300
