---
# Every DopplerSecret in the cluster lives here, next to the operator.
#
# Not by preference - by constraint. The operator refuses to reconcile a
# DopplerSecret that references a Secret outside its own namespace unless the
# DopplerSecret itself sits in the operator's namespace. Declaring these
# alongside the apps that consume them fails with
# "cannot reconcile dopplersecret (...) in a namespace different from the
# operator". The target namespace is carried in managedSecret.namespace.
#
# `secrets:` pins each sync to named keys. Without it the operator mirrors the
# ENTIRE Doppler config into the target namespace - which for `downloads`
# would hand every credential in the project to a torrent client running
# untrusted peer traffic.

# AirVPN credentials for gluetun. Setting these four values in Doppler is the
# only step between here and a running torrent stack; no kubectl required.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: airvpn
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets:
    - AIRVPN_PRIVATE_KEY
    - AIRVPN_PRESHARED_KEY
    - AIRVPN_ADDRESSES
    - AIRVPN_SERVER_COUNTRIES
  processors:
    AIRVPN_PRIVATE_KEY: {asName: private-key, type: plain}
    AIRVPN_PRESHARED_KEY: {asName: preshared-key, type: plain}
    AIRVPN_ADDRESSES: {asName: addresses, type: plain}
    AIRVPN_SERVER_COUNTRIES: {asName: server-countries, type: plain}
  managedSecret:
    name: airvpn
    namespace: downloads
    type: Opaque
  resyncSeconds: 60
---
# The CrowdSec bouncer key, needed identically in two namespaces: CrowdSec
# registers a bouncer under it, Traefik presents it. Both read the same Doppler
# value, so they cannot drift apart, and it is never committed to git.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: crowdsec-bouncer-key-lapi
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [CROWDSEC_BOUNCER_KEY]
  processors:
    CROWDSEC_BOUNCER_KEY: {asName: bouncer-key, type: plain}
  managedSecret:
    name: crowdsec-bouncer-key
    namespace: crowdsec
    type: Opaque
  resyncSeconds: 300
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: crowdsec-bouncer-key-traefik
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [CROWDSEC_BOUNCER_KEY]
  processors:
    CROWDSEC_BOUNCER_KEY: {asName: bouncer-key, type: plain}
  managedSecret:
    name: crowdsec-bouncer-key
    namespace: kube-system
    type: Opaque
  resyncSeconds: 300
---
# Immich's OAuth settings, as a config file.
#
# Immich has no environment variables for OIDC - the settings live in its
# database, edited through the admin UI, which is exactly the kind of state
# that vanishes on a rebuild and cannot be reviewed. IMMICH_CONFIG_FILE points
# it at a JSON file instead, so the configuration is declared rather than
# clicked. The client secret inside it comes from Doppler, so nothing sensitive
# is committed.
#
# Trade-off worth knowing: settings supplied by the config file become
# read-only in Immich's admin UI. That is the point.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: immich-config
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [IMMICH_CONFIG_JSON]
  processors:
    IMMICH_CONFIG_JSON: {asName: immich.json, type: plain}
  managedSecret:
    name: immich-config
    namespace: immich
    type: Opaque
  resyncSeconds: 300
---
# slskd's Soulseek login and the API key Lidarr uses to talk to it.
#
# The API key here is freshly generated - the one in the restored Lidarr
# database was exposed and has been replaced.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: slskd
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets:
    - SLSKD_USERNAME
    - SLSKD_PASSWORD
    - SLSKD_API_KEY
  processors:
    SLSKD_USERNAME: {asName: username, type: plain}
    SLSKD_PASSWORD: {asName: password, type: plain}
    SLSKD_API_KEY: {asName: api-key, type: plain}
  managedSecret:
    name: slskd
    namespace: downloads
    type: Opaque
  resyncSeconds: 300
---
# SMTP, for every service that needs to send mail.
#
# Gmail with an app password: a normal account password is rejected once 2FA is
# on, and an app password is scoped and individually revocable.
#
# One Doppler source synced into each consuming namespace, so rotating the app
# password is a single edit rather than four.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: smtp-authentik
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM]
  processors:
    SMTP_HOST: {asName: host, type: plain}
    SMTP_PORT: {asName: port, type: plain}
    SMTP_USERNAME: {asName: username, type: plain}
    SMTP_PASSWORD: {asName: password, type: plain}
    SMTP_FROM: {asName: from, type: plain}
  managedSecret:
    name: smtp
    namespace: authentik
    type: Opaque
  resyncSeconds: 300
---
