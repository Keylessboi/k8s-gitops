# vaultwarden-namespace entry here; the managed Secret is named `smtp` for its
# original purpose, so the deployment's PUSH_* env points at it by key name.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: smtp-vaultwarden
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM, BITWARDEN_INSTALLATION_ID, BITWARDEN_INSTALLATION_KEY]
  processors:
    SMTP_HOST: {asName: host, type: plain}
    SMTP_PORT: {asName: port, type: plain}
    SMTP_USERNAME: {asName: username, type: plain}
    SMTP_PASSWORD: {asName: password, type: plain}
    SMTP_FROM: {asName: from, type: plain}
    BITWARDEN_INSTALLATION_ID: {asName: push-installation-id, type: plain}
    BITWARDEN_INSTALLATION_KEY: {asName: push-installation-key, type: plain}
  managedSecret:
    name: smtp
    namespace: vaultwarden
    type: Opaque
  resyncSeconds: 300
