---
# Every DopplerSecret in the cluster lives here, next to the operator.
#
# Not by preference - by constraint. The operator refuses to reconcile a
# DopplerSecret that references a Secret outside its own namespace unless the
# DopplerSecret itself sits in the operator's namespace. Declaring these
# alongside the apps that consume them fails with
# "cannot reconcile dopplersecret (...) in a namespace different from the
# operator". The target namespace is carried in managedSecret.namespace.
#
# `secrets:` pins each sync to named keys. Without it the operator mirrors the
# ENTIRE Doppler config into the target namespace - which for `downloads`
# would hand every credential in the project to a torrent client running
# untrusted peer traffic.

# AirVPN credentials for gluetun. Setting these four values in Doppler is the
# only step between here and a running torrent stack; no kubectl required.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: airvpn
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets:
    - AIRVPN_PRIVATE_KEY
    - AIRVPN_PRESHARED_KEY
    - AIRVPN_ADDRESSES
    - AIRVPN_SERVER_COUNTRIES
  processors:
    AIRVPN_PRIVATE_KEY: {asName: private-key, type: plain}
    AIRVPN_PRESHARED_KEY: {asName: preshared-key, type: plain}
    AIRVPN_ADDRESSES: {asName: addresses, type: plain}
    AIRVPN_SERVER_COUNTRIES: {asName: server-countries, type: plain}
  managedSecret:
    name: airvpn
    namespace: downloads
    type: Opaque
  resyncSeconds: 60
---
# The CrowdSec bouncer key, needed identically in two namespaces: CrowdSec
# registers a bouncer under it, Traefik presents it. Both read the same Doppler
# value, so they cannot drift apart, and it is never committed to git.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: crowdsec-bouncer-key-lapi
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [CROWDSEC_BOUNCER_KEY]
  processors:
    CROWDSEC_BOUNCER_KEY: {asName: bouncer-key, type: plain}
  managedSecret:
    name: crowdsec-bouncer-key
    namespace: crowdsec
    type: Opaque
  resyncSeconds: 300
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: crowdsec-bouncer-key-traefik
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [CROWDSEC_BOUNCER_KEY]
  processors:
    CROWDSEC_BOUNCER_KEY: {asName: bouncer-key, type: plain}
  managedSecret:
    name: crowdsec-bouncer-key
    namespace: kube-system
    type: Opaque
  resyncSeconds: 300
