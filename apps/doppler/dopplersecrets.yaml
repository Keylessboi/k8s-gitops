    SLSKD_USERNAME: {asName: username, type: plain}
    SLSKD_PASSWORD: {asName: password, type: plain}
    SLSKD_API_KEY: {asName: api-key, type: plain}
  managedSecret:
    name: slskd
    namespace: downloads
    type: Opaque
  resyncSeconds: 300
---
# The MyAnonaMouse session seed for the seedboxapi sidecar in the qBittorrent
# pod, which re-points MAM's dynamic seedbox at the VPN's egress IP.
#
# This is a SEED, not a standing credential. seedboxapi uses it only when its
# cookie jar (the seedboxapi-config PVC) has no session in it; after the first
# successful call it lives off the refreshed cookie MAM returns. So editing
# this value alone often changes nothing - a real re-seed also means deleting
# /config/MAM.cookies so the sidecar takes the seed path again.
#
# The session behind it is not an ordinary mam_id. MAM's dynamic seedbox
# endpoint requires a session created on Preferences -> Security that is BOTH
# ASN-locked AND has "allow session to set dynamic seedbox IP" ticked, and it
# must be locked to the ASN the call actually arrives from - which for this
# sidecar is the AirVPN exit, NOT the home connection the session is generated
# from. A session that is merely valid returns
# {"Success":false,"msg":"Invalid session - Other", "ASN":<caller's ASN>}, and
# that ASN field in the reply is the thing to check when re-seeding.
#
# Known, accepted limitation: gluetun deliberately leaves SERVER_COUNTRIES
# unset, so AirVPN can land on a different country - and therefore a different
# ASN - on any pod roll. An ASN-locked session survives IP changes within its
# ASN, which is exactly what dynamic seedbox is for, but not a move to another
# ASN. Pinning gluetun to one exit would make this stable and was explicitly
# declined ("I don't want to set a fixed VPN exit, it will update the IP and
# that's fine"), so expect this session to need re-seeding whenever the exit
# lands in a new ASN. Do NOT quietly set SERVER_COUNTRIES to fix it.
#
# Not shared with Prowlarr's MyAnonamouse indexer: Prowlarr is not behind the
# tunnel and egresses from the home WAN, a different ASN entirely, so it needs
# its own separately-generated session - see mam-prowlarr below.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: mam
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [MAM_ID]
  processors:
    MAM_ID: {asName: mam-id, type: plain}
  managedSecret:
    name: mam
    namespace: downloads
    type: Opaque
  resyncSeconds: 300
---
# The SECOND MyAnonaMouse session, for Prowlarr's MyAnonamouse indexer.
#
# Deliberately a different session from `mam` above, not a copy. MAM scopes a
# session to the network it is used from, and these two are used from opposite
# sides of the VPN: seedboxapi calls MAM from inside gluetun's namespace (the
# AirVPN exit), while Prowlarr is an ordinary pod that egresses over the house
# WAN. One session cannot satisfy both, and pointing Prowlarr at the seedbox
# session would present it from an ASN it is not locked to - failed searches at
# best, and needless rejected auth against MAM at worst.
#
# Unusual in one respect worth stating plainly, so nobody "fixes" it later:
# NOTHING MOUNTS THIS SECRET. Prowlarr keeps indexer settings in its Postgres
# database, not in env or a config file, so the value reaches Prowlarr through
# its REST API rather than through the Deployment. This DopplerSecret exists so
# the credential has a declared home and survives a cluster rebuild - it is the
# source of record, and re-applying it after a restore is an API call, not a
# pod restart. That is also why there is no matching env entry in
# apps/prowlarr/deployment.yaml.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: mam-prowlarr
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [MAM_ID_PROWLARR]
  processors:
    MAM_ID_PROWLARR: {asName: mam-id, type: plain}
  managedSecret:
    name: mam-prowlarr
    namespace: prowlarr
    type: Opaque
  resyncSeconds: 300
