    SMTP_PORT: {asName: port, type: plain}
    SMTP_USERNAME: {asName: username, type: plain}
    SMTP_PASSWORD: {asName: password, type: plain}
    SMTP_FROM: {asName: from, type: plain}
    BITWARDEN_INSTALLATION_ID: {asName: push-installation-id, type: plain}
    BITWARDEN_INSTALLATION_KEY: {asName: push-installation-key, type: plain}
