---
# Authentik OIDC client for qui's native login. Bound to its own `qui-oidc`
# application slug: the `qui` slug is already taken by the forward-auth proxy
# provider, and the discovery URL is derived from the slug, so sharing it would
# have served the wrong provider's metadata.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: qui-oidc
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [QUI_OIDC_CLIENT_ID, QUI_OIDC_CLIENT_SECRET]
  processors:
    QUI_OIDC_CLIENT_ID: {asName: client-id, type: plain}
    QUI_OIDC_CLIENT_SECRET: {asName: client-secret, type: plain}
  managedSecret:
    name: qui-oidc
    namespace: downloads
    type: Opaque
  resyncSeconds: 300
---
# Hermes' LLM provider key. The Doppler secret is OPENROUTER_KEY, but it is
# renamed on the way in: the Hermes Deployment consumes this secret with
# envFrom, so each KEY becomes an environment variable name directly, and
# Hermes looks for OPENROUTER_API_KEY.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: hermes-llm
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [OPENROUTER_KEY]
  processors:
    OPENROUTER_KEY: {asName: OPENROUTER_API_KEY, type: plain}
  managedSecret:
    name: hermes-llm
    namespace: hermes
    type: Opaque
  resyncSeconds: 300

