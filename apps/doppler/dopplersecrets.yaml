---
# Vaultwarden's admin panel token.
#
# Without it /admin is inaccessible, and with SIGNUPS_ALLOWED=false that panel
# is the only way to invite a user - so the instance had no route to add anyone.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: vaultwarden-admin
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [VAULTWARDEN_ADMIN_TOKEN]
  processors:
    VAULTWARDEN_ADMIN_TOKEN: {asName: admin-token, type: plain}
  managedSecret:
    name: vaultwarden-admin
    namespace: vaultwarden
    type: Opaque
  resyncSeconds: 300

