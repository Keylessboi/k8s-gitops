    namespace: image-updater
    type: Opaque
  resyncSeconds: 300
---
# Forgejo's Postgres role, in the shape CNPG's managed-roles reconciler wants.
# Note this is a departure worth keeping: every other *-db-credentials secret in
# this cluster was created by hand and exists nowhere but the cluster, so a
# rebuild would lose them. This one comes from Doppler like everything else.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: forgejo-db-credentials
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [FORGEJO_DB_USER, FORGEJO_DB_PASSWORD]
  processors:
    FORGEJO_DB_USER: {asName: username, type: plain}
    FORGEJO_DB_PASSWORD: {asName: password, type: plain}
  managedSecret:
    name: forgejo-db-credentials
    namespace: databases
    type: kubernetes.io/basic-auth
  resyncSeconds: 300
---
# The same database password again, plus the instance secret key, this time in
# Forgejo's own namespace.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: forgejo-app
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [FORGEJO_DB_USER, FORGEJO_DB_PASSWORD, FORGEJO_SECRET_KEY]
  processors:
    FORGEJO_DB_USER: {asName: db-user, type: plain}
    FORGEJO_DB_PASSWORD: {asName: db-password, type: plain}
    FORGEJO_SECRET_KEY: {asName: secret-key, type: plain}
  managedSecret:
    name: forgejo-app
    namespace: forgejo
    type: Opaque
  resyncSeconds: 300
---
# Authentik OIDC client for Forgejo's `authentik` auth source.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: forgejo-oidc
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [FORGEJO_OIDC_CLIENT_ID, FORGEJO_OIDC_CLIENT_SECRET]
  processors:
    FORGEJO_OIDC_CLIENT_ID: {asName: client-id, type: plain}
    FORGEJO_OIDC_CLIENT_SECRET: {asName: client-secret, type: plain}
  managedSecret:
    name: forgejo-oidc
    namespace: forgejo
    type: Opaque
  resyncSeconds: 300
