# Remux's initial admin account password, consumed once by the first-run
# startup wizard (POST /startup/user - Remux's Jellyfin-style setup flow, run
# headlessly via kubectl exec; see docs/remux.md). After the wizard completes
# the endpoint locks itself, but the value stays here as the source of record
# for the account, like JELLYFIN_AKADMIN_PASSWORD next door.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: remux
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  # AUTHENTIK_API_TOKEN joins it for remux-user-sync, which reads authentik's
  # user list and creates the matching remux accounts. A Kubernetes Secret
  # cannot be read across namespaces, so this is a second managed copy of the
  # same source of record, exactly like the Lidarr API key below.
  secrets: [REMUX_ADMIN_PASSWORD, AUTHENTIK_API_TOKEN]
  processors:
    REMUX_ADMIN_PASSWORD: {asName: admin-password, type: plain}
    AUTHENTIK_API_TOKEN: {asName: authentik-api-token, type: plain}
  managedSecret:
    name: remux
    namespace: remux
    type: Opaque
  resyncSeconds: 300
---
# Lidarr's API key, a SECOND copy for the downloads namespace.
#
# The same Doppler value already syncs into the lidarr namespace for Lidarr's
# own jobs; this is not duplication for its own sake - a Kubernetes Secret
# cannot be read across namespaces, so a consumer in `downloads` needs its own
# managed copy of the same source of record.
#
# Octo's "heart to keep" hands an album to Lidarr, and its Lidarr__ApiKey env
# is marked `optional: true`. Without this the reference resolved to nothing
# and that half of Octo silently did not work - exactly how the Last.fm key
# failed below. `optional` turns a missing credential into a missing feature
# rather than an error, which is why both of these needed finding rather than
# waiting to be reported.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: lidarr-api-downloads
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [LIDARR_API_KEY]
  processors:
    LIDARR_API_KEY: {asName: api-key, type: plain}
  managedSecret:
    name: lidarr-api
    namespace: downloads
    type: Opaque
  resyncSeconds: 300
---
# Last.fm for Octo's discovery features - radio and similar-artist lookups.
#
# API KEY ONLY, no shared secret: those features are READ calls against the
# Last.fm API, which authenticates with the key alone. The shared secret signs
# WRITE calls (scrobbles), which Octo does not make - Navidrome does, and it
# gets both keys in the next block.
#
# Octo's env marks this `optional: true`, so before this DopplerSecret existed
# the reference silently resolved to nothing and the radio and similar-artist
# features were simply absent with no error anywhere. That is the failure mode
# `optional` buys, and it is why this block exists rather than the key being
# assumed present.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: octo
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  # NAVIDROME_USER/PASS are the account Octo presents to Navidrome for its own
  # library operations - chiefly triggering a rescan after "heart to keep"
  # pulls a FLAC, so a newly acquired track appears without waiting for the
  # scheduled scan. This is NOT how listeners authenticate: Subsonic clients
  # pass their own credentials and Octo proxies them straight through.
  #
  # The env names are Subsonic__AdminUsername/AdminPassword and both are
  # `optional: true`, so before these keys existed the reference resolved to
  # nothing and those operations silently did not happen - the same failure
  # shape as the Last.fm and Lidarr keys.
  secrets: [LASTFM_API_KEY, NAVIDROME_USER, NAVIDROME_PASS]
  processors:
    LASTFM_API_KEY: {asName: lastfm-api-key, type: plain}
    NAVIDROME_USER: {asName: navidrome-admin-username, type: plain}
    NAVIDROME_PASS: {asName: navidrome-admin-password, type: plain}
  managedSecret:
    name: octo
    namespace: downloads
    type: Opaque
  resyncSeconds: 300
---
# Last.fm for Navidrome scrobbling.
#
# BOTH keys here, unlike Octo above: scrobbling is a signed WRITE against the
# Last.fm API, and the signature is computed with the shared secret. An API key
# on its own authenticates reads and nothing else, so a scrobble configured
# with only the key fails at submission rather than at startup.
#
# Each listener still authorises Navidrome against their own Last.fm account
# from the web UI once; these two values only identify the application.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: navidrome-lastfm
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  secrets: [LASTFM_API_KEY, LASTFM_SHARED_SECRET]
  processors:
    LASTFM_API_KEY: {asName: apikey, type: plain}
    LASTFM_SHARED_SECRET: {asName: secret, type: plain}
  managedSecret:
    name: navidrome-lastfm
    namespace: navidrome
    type: Opaque
  resyncSeconds: 300
---
# CouchDB admin credentials for the Obsidian LiveSync server. CouchDB uses
# these to create the admin user on first boot and to authenticate all
# subsequent requests. The Obsidian plugin speaks CouchDB's replication
# protocol with these credentials - no browser SSO, no Authentik forward-auth.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: couchdb
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
