# AIOStreams' SECRET_KEY (64-char hex). It encrypts the stored addon
# configuration, and the manifest URL Gelato consumes is only decryptable with
# it, so it must be STABLE across pod rolls - generated once, kept here, never
# rotated (rotating it invalidates every existing manifest URL). Consumed by the
# aiostreams container via secretKeyRef.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: aiostreams
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubernetes
  config: prd
  # db-user/db-password ride here as well as in aiostreams-db-credentials
  # below: this side of the wire composes DATABASE_URI in the Deployment via
  # dependent env expansion, so the password never appears in git. The other
  # side is the shape CNPG's managed-roles reconciler wants. Same Doppler
  # values, two consumers, and a Secret cannot cross namespaces.
  secrets:
    - AIOSTREAMS_SECRET_KEY
    - AIOSTREAMS_DB_USER
    - AIOSTREAMS_DB_PASSWORD
  processors:
    AIOSTREAMS_SECRET_KEY: {asName: secret-key, type: plain}
    AIOSTREAMS_DB_USER: {asName: db-user, type: plain}
    AIOSTREAMS_DB_PASSWORD: {asName: db-password, type: plain}
  managedSecret:
    name: aiostreams
    namespace: remux
    type: Opaque
  resyncSeconds: 300
