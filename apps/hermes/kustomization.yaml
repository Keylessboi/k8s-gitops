---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: hermes
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd

namespace: hermes

# `labels` with includeSelectors:false, NOT `commonLabels` - commonLabels
# rewrites Deployment selectors, which are immutable.
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: agent
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - deployment.yaml
