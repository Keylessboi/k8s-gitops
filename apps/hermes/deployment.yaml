---
# Hermes Agent, the agent half of the Lidarr maintenance loop.
#
# The maintenance CronJob (apps/lidarr/maintenance-cronjob.yaml) does the
# mechanical queue cleanup and deliberately refuses to judge borderline cases,
# printing them as [AGENT_OVERSIGHT_NEEDED]. This is what looks at those.
#
# Everything - config, API keys, sessions, skills, memories, cron jobs - lives in
# /opt/data on the volume. The image itself is stateless, so a version bump keeps
# all of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  # Recreate, not RollingUpdate: /opt/data is a single agent state directory
  # (sessions, cron job store, SQLite-backed memory). Two gateways writing it
  # at once during a rollover is not something the agent expects.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      nodeSelector:
        homelab/node-class: compute
      securityContext:
        # s6-overlay remaps its internal hermes user to these before dropping
        # privileges. 1000:1000 matches the NFS export's anonuid/anongid, so
        # files it creates on /opt/data stay owned correctly.
        fsGroup: 1000
        # Without this the pod runs seccomp Unconfined: this node's kubelet has
        # seccompDefault=false, so nothing applies a profile unless a manifest
        # asks. RuntimeDefault blocks the syscalls the container runtime
        # considers dangerous (mount, unshare, kexec, bpf, keyctl, ...).
        # s6-overlay only needs setuid/setgid to drop privileges, which the
        # default profile allows.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.19
          # `gateway run` is supervised by s6 inside the official image: the CMD
          # process is a heartbeat and s6 restarts the real gateway if it dies.
          # That is what makes it safe to deploy before any API key exists - the
          # pod stays Running and `kubectl exec` works, rather than crash-looping
          # out of reach of the setup wizard.
          args: ["gateway", "run"]
          # Hardening, cut to exactly what s6-overlay can survive.
          #
          # runAsNonRoot is deliberately NOT set. s6-svscan is PID 1 and must
          # start as root: /etc/cont-init.d/01-hermes-setup remaps the image's
          # hermes user to HERMES_UID/HERMES_GID and chowns /opt/data before
          # s6-setuidgid drops each supervised service to it. That is also why
          # the namespace enforces `baseline` rather than `restricted`.
          #
          # `drop: [ALL]` alone was verified to break the container outright -
          # it exits with `s6-applyuidgid: fatal: unable to set supplementary
          # group list: Operation not permitted` and `chown /opt/data failed`
          # before the gateway ever starts. These five are the privilege-drop
          # and ownership-fixing capabilities that init actually uses; NET_RAW,
          # SYS_ADMIN, MKNOD and the rest stay dropped. All five are inside the
          # PSA baseline default set, so the namespace policy is unaffected.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            # Dashboard on, bound to container loopback. A non-loopback bind
            # fails closed at startup unless an auth provider is configured -
            # deliberately, after unauthenticated dashboards were used to plant
            # backdoors in June 2026. Reach it with `kubectl port-forward`
            # until it is put behind Authentik OIDC (see docs/RUNDOWN.md).
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 127.0.0.1
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            # So the agent can drive Lidarr without being told where it is.
            - name: LIDARR_URL
              value: http://lidarr.lidarr.svc.cluster.local:8686
            - name: LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-lidarr
                  key: api-key
                  optional: true
          # Every provider key the setup wizard would otherwise prompt for.
          # optional: true so the gateway still starts before the secret exists.
          envFrom:
            - secretRef:
                name: hermes-llm
                optional: true
          # exec, not httpGet. Everything this container listens on is bound to
          # container loopback - the dashboard on 127.0.0.1:9119 by the env vars
          # above, and the gateway's own HTTP server on 127.0.0.1:8642 - so a
          # kubelet probe, which dials the pod IP, can never reach either. An
          # exec probe runs inside the container's network namespace, where
          # loopback is exactly what is wanted.
          #
          # 8642/health is the gateway itself, not the dashboard: it answers
          # {"status": "ok", "platform": "hermes-agent", ...}. 9119 only ever
          # returns the dashboard SPA shell, including for /health, so it would
          # report healthy while the gateway was down. Measured at 0.5ms.
          #
          # Generous timings on purpose. An over-tight probe on Lidarr in this
          # cluster emptied a Service's endpoints and cost hours of
          # misdiagnosis. Nothing selects these pods - hermes has no Service -
          # so readiness here is a signal, not a traffic gate, and it should
          # never flap on a slow moment during an agent run.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS --max-time 10 -o /dev/null http://127.0.0.1:8642/health
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
