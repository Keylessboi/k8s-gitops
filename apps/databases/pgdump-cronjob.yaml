---
# Logical backups of every application database to MinIO, every 6 hours.
#
# This is the plan's stated backup design ("pg_dump CronJob every 6h to
# MinIO"), and it is the one that actually protects the Vaultwarden vault -
# passwords, logins, notes and TOTP seeds all live in PostgreSQL.
#
# It exists alongside barman WAL archiving rather than replacing it, because
# barman BASE backups are currently failing: the CNPG operator cannot POST to
# the pods/exec subresource ("dial tcp 10.43.0.1:443: connect: connection
# refused") even though plain connectivity to the apiserver from that
# namespace tests fine. WAL segments ship correctly, but WALs alone cannot
# restore anything without a base backup - so trusting barman today would mean
# believing in a backup that cannot actually be restored.
#
# pg_dump depends on nothing but PostgreSQL and the S3 endpoint.
#
# Two stages, because no single image carries both pg_dump and restic:
#   initContainer  postgres image -> dumps into a shared emptyDir
#   container      restic image   -> snapshots that directory into MinIO
# An init container also guarantees ordering; two ordinary containers would
# race.
#
# restic provides deduplication across snapshots, encryption independent of
# the storage layer, and real retention - so keeping 28 runs costs far less
# than 28 full copies.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pgdump-backup
  namespace: databases
spec:
  schedule: "40 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              # Same image as the cluster, so pg_dump matches the server
              # version exactly.
              image: ghcr.io/tensorchord/cloudnative-vectorchord:16-0.4.1
              env:
                - name: PGHOST
                  value: app-databases-rw.databases.svc.cluster.local
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: app-databases-superuser
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: app-databases-superuser
                      key: password
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  echo "$STAMP" > /work/STAMP
                  # Every non-template database, so a new app's database is
                  # picked up automatically rather than silently missed by a
                  # hardcoded list.
                  DBS=$(psql -tAc "SELECT datname FROM pg_database WHERE datistemplate = false AND datname <> 'postgres';")
                  echo "databases: $DBS"
                  for db in $DBS; do
                    echo "dumping $db"
                    pg_dump --format=custom --compress=9 --file="/work/${db}.dump" "$db"
                  done
                  # Roles and their passwords. Without globals a restore comes
                  # back with no login roles and every app fails to connect.
                  pg_dumpall --globals-only --file=/work/globals.sql
                  ls -la /work
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          containers:
            - name: restic
              # restic gives what plain `mc cp` cannot: deduplication across
              # snapshots, encryption independent of the storage layer, and
              # real retention. Consecutive dumps of the same database differ
              # only slightly, so dedup means 28 retained runs cost far less
              # than 28 full copies.
              #
              # It also removes a bug in the previous mc-based upload: the mc
              # image has no awk, so the pruning step failed silently with
              # "awk: command not found" while the upload itself succeeded -
              # backups would have accumulated forever.
              image: restic/restic:0.17.3
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:http://192.168.1.67:9000/cnpg-backups/restic
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: pgdump-s3
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: pgdump-s3
                      key: secret-key
                # Encrypts the repository. Losing this password makes every
                # snapshot unreadable, so it lives in Doppler.
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pgdump-s3
                      key: restic-password
              command:
                - sh
                - -c
                - |
                  set -eu
                  rm -f /work/STAMP
                  # init is a no-op once the repo exists.
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic backup /work --tag pgdump --host app-databases
                  # Retention: dense recently, thinning with age.
                  restic forget --tag pgdump \
                    --keep-last 8 --keep-daily 7 --keep-weekly 4 --keep-monthly 6 \
                    --prune
                  echo "--- repository ---"
                  restic snapshots --tag pgdump --compact | tail -12
                  restic stats --mode raw-data | tail -5
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: work
              emptyDir: {}
