---
# Installs the PostgreSQL extensions Immich needs.
#
# Immich runs CREATE EXTENSION itself during migration, but that requires
# superuser and its role deliberately is not one — a compromised Immich must
# not be able to read the Vaultwarden database. So it failed with:
#   permission denied to create extension "vector"
#
# The CNPG Database CRD in this version has no `extensions` field, so the
# extensions are created here instead, as superuser, once per sync. The SQL is
# idempotent (IF NOT EXISTS), and Immich's own CREATE EXTENSION IF NOT EXISTS
# then finds them already present and proceeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-extensions
  namespace: databases
  annotations:
    # Runs after the Cluster and Database resources exist.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: ghcr.io/tensorchord/cloudnative-vectorchord:16.15-1.1.1
          env:
            - name: PGHOST
              value: app-databases-rw.databases.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: app-databases-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-databases-superuser
                  key: password
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -q; do
                echo "waiting for postgres..."; sleep 3
              done
              # vchord depends on vector; both ship in this image.
              psql -d immich -v ON_ERROR_STOP=1 <<'SQL'
              CREATE EXTENSION IF NOT EXISTS "vector";
              CREATE EXTENSION IF NOT EXISTS "vchord";
              CREATE EXTENSION IF NOT EXISTS "cube";
              CREATE EXTENSION IF NOT EXISTS "earthdistance";
              CREATE EXTENSION IF NOT EXISTS "pg_trgm";
              CREATE EXTENSION IF NOT EXISTS "unaccent";
              SQL
              # Bring the extensions up to the version this image ships, as
              # superuser. Immich tries this itself at startup, but the
              # extensions are owned by postgres (PostgreSQL has no ALTER
              # EXTENSION ... OWNER; the two `OWNER TO immich` lines that were
              # here always failed behind `|| true`), so Immich's attempt fails
              # and it refuses to start: "Please run 'ALTER EXTENSION vchord
              # UPDATE' manually as a superuser".
              #
              # When Immich updates vchord itself it then rebuilds both vector
              # indexes; doing the update here means it never sees a version
              # change, so the rebuild is done here too - only when the vchord
              # version actually moved, never on an ordinary sync. The indexes
              # are small (tens of MB); REINDEX takes seconds.
              psql -d immich -v ON_ERROR_STOP=1 <<'SQL'
              ALTER EXTENSION "vector" UPDATE;
              DO $$
              DECLARE
                before text;
                after text;
              BEGIN
                SELECT extversion INTO before FROM pg_extension WHERE extname = 'vchord';
                ALTER EXTENSION vchord UPDATE;
                SELECT extversion INTO after FROM pg_extension WHERE extname = 'vchord';
                IF before IS DISTINCT FROM after THEN
                  RAISE NOTICE 'vchord % -> %: rebuilding vector indexes', before, after;
                  IF to_regclass('public.clip_index') IS NOT NULL THEN
                    REINDEX INDEX public.clip_index;
                  END IF;
                  IF to_regclass('public.face_index') IS NOT NULL THEN
                    REINDEX INDEX public.face_index;
                  END IF;
                END IF;
              END $$;
              SQL
              psql -d immich -At -c "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname IN ('vector', 'vchord')"
              echo "immich extensions ready"
