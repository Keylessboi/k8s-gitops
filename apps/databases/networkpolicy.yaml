---
# The databases namespace had no NetworkPolicy at all, so the cluster holding
# every application's data was reachable from any pod in the cluster. The plan
# requires a per-app policy in every application namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the namespaces that actually own a database here.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vaultwarden
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: books
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lidarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pelican
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bitmagnet
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: invidious
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: memos
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remux
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - {port: 5432, protocol: TCP}
    # The CNPG operator manages instances and scrapes their status endpoint.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
        - {port: 9187, protocol: TCP}
    # Prometheus scrapes metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {port: 9187, protocol: TCP}
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {port: 443, protocol: TCP}
    # k3s DNATs 10.43.0.1:443 to the node's own address before NetworkPolicy
    # egress is evaluated, so the Service rule above matches nothing for a new
    # connection and the API call fails. This is the defect that broke CNPG's
    # base backups and, here, kept the Doppler operator from ever winning leader
    # election - i.e. from ever syncing a secret.
    - to:
      - ipBlock:
          cidr: 192.168.1.0/24
      ports:
      - port: 6443
        protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Replication between instances.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
    # MinIO, for WAL archiving and base backups.
    - to:
        - ipBlock:
            cidr: 192.168.1.67/32
      ports:
        - {port: 9000, protocol: TCP}
