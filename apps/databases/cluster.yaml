---
# THE Postgres cluster. One CNPG cluster serves every app that needs SQL —
# there are no per-app clusters. Each app gets its own role and its own
# database, so a compromised app cannot read another app's data (a shared
# app_user would have let any app read the Vaultwarden database).
#
# The VectorChord image is required for Immich's vector search.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-databases
  namespace: databases
  labels:
    app.kubernetes.io/name: app-databases
    app.kubernetes.io/part-of: homelab
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-0.4.1
  # Creates the app-databases-superuser secret. Needed because installing
  # extensions requires superuser, and the per-app roles deliberately are not.
  enableSuperuserAccess: true
  storage:
    size: 20Gi
    # CNPG's field is `storageClass`, not the `storageClassName` used by a
    # plain PVC. Was unset, which silently fell through to the local-path
    # default; made explicit so it is a decision rather than an accident.
    storageClass: local-path
  postgresql:
    # REQUIRED by the VectorChord image; without it Immich's migrations
    # crash-loop on startup. This fix was applied live in an earlier session
    # and never committed, so selfHeal kept reverting it.
    #
    # It belongs here, NOT under postgresql.parameters — CNPG treats
    # shared_preload_libraries as a fixed parameter and its webhook rejects the
    # whole Cluster with "Can't set fixed configuration parameter".
    shared_preload_libraries:
      - vchord.so
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # One login role per app. Passwords come from Doppler-managed secrets;
  # nothing is inlined here.
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        passwordSecret:
          name: immich-db-credentials
      - name: nextcloud
        ensure: present
        login: true
        passwordSecret:
          name: nextcloud-db-credentials
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: authentik-db-credentials
      - name: vaultwarden
        ensure: present
        login: true
        passwordSecret:
          name: vaultwarden-db-credentials
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: forgejo-db-credentials
  # Backups to MinIO on the NAS.
  #
  # This block previously authenticated with a `minio-creds` secret whose
  # ACCESS_KEY_ID and SECRET_ACCESS_KEY were both the literal string
  # "MANAGED_BY_DOPPLER" - so every base backup and every WAL archive failed
  # while the configuration looked complete. It is now a real MinIO service
  # account (`cnpg-backup`), scoped to this bucket rather than root
  # credentials, verified able to write and delete before being wired up.
  #
  # The bucket lives on the `tank` pool, which is aes-256-gcm encrypted, so
  # backups are encrypted at rest without MinIO-side SSE.
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/app-databases
      endpointURL: http://192.168.1.67:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: minio-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
