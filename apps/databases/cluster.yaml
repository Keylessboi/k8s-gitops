---
# Central CNPG cluster for all application databases.
# Replaces per-app clusters in vaultwarden, immich, nextcloud namespaces.
# VectorChord image required for Immich vector search.
# WAL files and base backups go to MinIO over S3.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-databases
  namespace: databases
  labels:
    app.kubernetes.io/name: app-databases
    app.kubernetes.io/part-of: homelab
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-0.4.1
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  nodeSelector:
    homelab/node-class: compute
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/app-databases
      endpointURL: http://192.168.1.67:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: minio-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
