---
# Pelican Panel's single database. Laravel keeps everything (users, nodes,
# servers, sessions/queue overflow) in one schema; no separate log db.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pelican
  namespace: databases
spec:
  name: pelican
  owner: pelican
  cluster:
    name: app-databases

---
# bitmagnet's single database. The DHT crawler, web UI, Torznab endpoint and
# job queue all share one schema; no separate log db.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bitmagnet
  namespace: databases
spec:
  name: bitmagnet
  owner: bitmagnet
  cluster:
    name: app-databases

---
# Memos, the notes app that replaced the Obsidian CouchDB endpoint.
apiVersion: postgresql.cnpg.io/v1
