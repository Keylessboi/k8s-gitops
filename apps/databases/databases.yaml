---
# One database per app, each owned by that app's role.
# Declarative via the CNPG Database CRD, which replaces the plan's
# scripts/11-cnpg-databases.sh (that script was never written, which is why no
# app database ever existed — the cluster only ever had the default `app` db).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: databases
spec:
  name: immich
  owner: immich
  cluster:
    name: app-databases
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nextcloud
  namespace: databases
spec:
  name: nextcloud
  owner: nextcloud
  cluster:
    name: app-databases
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik
  namespace: databases
spec:
  name: authentik
  owner: authentik
  cluster:
    name: app-databases
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: vaultwarden
  namespace: databases
spec:
  name: vaultwarden
  owner: vaultwarden
  cluster:
    name: app-databases
---
# JuiceFS metadata engine. JuiceFS stores file *data* as chunks in S3 (MinIO)
# and the POSIX metadata - inodes, directory tree, permissions - here.
#
# This is what lets apps that cannot speak S3 natively (Immich, Vaultwarden,
# Kiwix, Navidrome) still be backed by object storage, per the plan's
# "S3 primary storage" with NFS reserved for media streaming.
#
# Losing this database loses the filesystem even though the chunks survive in
# S3, so it is covered by the same CNPG backups as everything else.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: juicefs
  namespace: databases
spec:
  name: juicefs
  owner: juicefs
  cluster:
    name: app-databases
