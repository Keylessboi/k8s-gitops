---
# Central CNPG cluster for all application databases.
# Deploys after the CNPG operator (wave 0) and before app databases are created.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: databases
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: databases
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: databases

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: databases
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: database
      app.kubernetes.io/managed-by: argocd
      homelab/tier: platform
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - cluster.yaml
  # One Database CR per app, replacing the never-written
  # scripts/11-cnpg-databases.sh.
  - databases.yaml
  # Creates Immich's extensions as superuser; its own role cannot.
  - extensions-job.yaml
  # Logical backups: the ones that actually protect the vault.
  - pgdump-cronjob.yaml
  # Monthly proof that those dumps can actually be restored. A backup nobody
  # has restored is a hypothesis, and this chain has already failed silently
  # once (MinIO, ~20h with zero drives online).
  - restore-drill-cronjob.yaml
  # Daily: does the restic repository actually contain a recent, complete
  # snapshot? Nothing else watches the logical backup chain - BackupTooOld
  # reads barman, not restic.
  - backup-freshness-cronjob.yaml
  # Physical backups: barman base backup daily, which is what makes the
  # continuously archived WALs restorable.
  - scheduledbackup.yaml
