---
# One project for every app in this repo. Keeps scope small:
# only this repo, only the listed namespaces, no blanket cluster writes.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
  labels:
    app.kubernetes.io/name: homelab
    app.kubernetes.io/part-of: homelab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Homelab apps on the mixed ARM/x86 cluster.
  sourceRepos:
    - https://github.com/Keylessboi/k8s-gitops.git
    # Helm repos used by app kustomizations.
    - https://cloudnative-pg.github.io/charts
    - https://helm.doppler.com
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://metallb.github.io/metallb
    - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    - https://charts.goauthentik.io
    - https://immich-app.github.io/immich-charts
    - https://charts.bitnami.com/bitnami
    - https://nextcloud.github.io/helm/
    # Replaces the dead *.xbjnx.dev repos (lidarr, prowlarr, navidrome, flaresolverr).
    - https://bjw-s-labs.github.io/helm-charts/
    # Front door: ingress controller + TLS.
    - https://charts.jetstack.io
    - https://traefik.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  # Apps need some cluster-wide objects: namespaces, StorageClasses, CRDs.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # cert-manager ClusterIssuer is cluster-scoped; without this it is rejected.
    - group: cert-manager.io
      kind: "*"
    - group: traefik.io
      kind: "*"
    # tor-controller (phase 3) ships cluster-scoped RBAC + CRDs.
    - group: apiextensions.k8s.io
      kind: "*"
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: policy
      kind: "*"
    - group: argoproj.io
      kind: "*"
    - group: monitoring.coreos.com
      kind: "*"
    - group: storage.k8s.io
      kind: "*"
    - group: postgresql.cnpg.io
      kind: "*"
    - group: helm.toolkit.fluxcd.io
      kind: "*"
    - group: source.toolkit.fluxcd.io
      kind: "*"
    - group: kustomize.toolkit.fluxcd.io
      kind: "*"
    - group: secrets.doppler.com
      kind: "*"
    # IPAddressPool and L2Advertisement are NAMESPACED, not cluster-scoped.
    - group: metallb.io
      kind: "*"
    - group: cert-manager.io
      kind: "*"
    - group: traefik.io
      kind: "*"
    - group: tor.k8s.torproject.org
      kind: "*"
  orphanedResources:
    warn: true
  roles:
    - name: ci
      description: CI pipeline role
      policies:
        - p, proj:homelab:ci, applications, sync, homelab/*, allow
        - p, proj:homelab:ci, applications, get, homelab/*, allow
      groups:
        - ci-robots
