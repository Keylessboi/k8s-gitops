---
# One project for every app in this repo. Keeps scope small:
# only this repo, only the listed namespaces, no blanket cluster writes.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
  labels:
    app.kubernetes.io/name: homelab
    app.kubernetes.io/part-of: homelab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Homelab apps on the mixed ARM/x86 cluster.
  sourceRepos:
    - https://github.com/Keylessboi/k8s-gitops.git
    # Helm repos used by app kustomizations.
    - https://cloudnative-pg.github.io/charts
    - https://helm.doppler.com
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://metallb.github.io/metallb
    - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    - https://charts.goauthentik.io
    - https://immich-app.github.io/immich-charts
    - https://charts.bitnami.com/bitnami
    - https://nextcloud.github.io/helm/
    # Replaces the dead *.xbjnx.dev repos (lidarr, prowlarr, navidrome, flaresolverr).
    - https://bjw-s-labs.github.io/helm-charts/
    # Front door: ingress controller + TLS.
    - https://charts.jetstack.io
    - https://traefik.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  # Resource whitelists are deliberately permissive.
  #
  # Enumerating allowed kinds here was pure whack-a-mole: every upstream chart
  # ships its own Roles, RoleBindings, CSIDrivers, webhooks and CRDs, and each
  # omission surfaced only as an opaque "one or more synchronization tasks are
  # not valid" at sync time, with the real reason buried in the sync result.
  # metallb, for one, was rejected solely for namespaced Role/RoleBinding.
  #
  # The control that actually matters for a single-tenant homelab is
  # `sourceRepos` above: ArgoCD will only ever apply manifests originating from
  # this repo and the pinned chart repos. Restricting kinds on top of that
  # bought no meaningful security while reliably breaking deploys.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  roles:
    - name: ci
      description: CI pipeline role
      policies:
        - p, proj:homelab:ci, applications, sync, homelab/*, allow
        - p, proj:homelab:ci, applications, get, homelab/*, allow
      groups:
        - ci-robots
