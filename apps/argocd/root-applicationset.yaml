---
# Root ApplicationSet. Scans apps/* and creates one Application per directory.
# Apply this once manually. It owns every app from then on.
# Exclude argocd itself to avoid ArgoCD managing itself.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: cluster-apps
    app.kubernetes.io/part-of: homelab
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        # Change to your fork of this repo.
        repoURL: https://github.com/Keylessboi/k8s-gitops.git
        revision: HEAD
        directories:
          - path: apps/*
          # Do not turn the bootstrap manifests into an Application.
          # That would make ArgoCD manage itself and fight drift.
          - path: apps/argocd
            exclude: true
  template:
    metadata:
      name: "{{.path.basename}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: "{{.path.basename}}"
        app.kubernetes.io/part-of: homelab
        homelab/tier: "{{.path.basename}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: homelab
      source:
        repoURL: https://github.com/Keylessboi/k8s-gitops.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        # The child manifests set their own namespaces.
        # This value is only a fallback.
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
      # cert-manager's cainjector writes the CA bundle into webhook configs and
      # CRD conversion webhooks at runtime. The chart ships those fields empty,
      # so selfHeal kept reverting the injected value and the apiserver then
      # rejected every cert-manager API call with
      # "x509: certificate signed by unknown authority".
      # Ignore the injected fields; they are runtime state, not desired state.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.webhook.clientConfig.caBundle
      # Let GPU and PV claims outlive short flaps.
      revisionHistoryLimit: 10
