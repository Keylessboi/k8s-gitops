---
# ArgoCD notifications.
#
# The notifications controller has been running since day one with an EMPTY
# configuration, which means it has been doing nothing at all. That matters
# more here than in most clusters: this repo auto-syncs main with prune and
# selfHeal on, so a push IS a deploy. A push that fails to apply, or that
# applies and leaves an app unhealthy, currently produces no signal anywhere
# except the ArgoCD UI - which nobody is looking at, because the whole reason
# for GitOps is not to have to.
#
# WHAT IS SUBSCRIBED, AND WHY NOT MORE. Two triggers, both failures:
#   on-sync-failed       - the push did not apply
#   on-health-degraded   - it applied and broke something
# on-sync-succeeded and on-deployed are deliberately absent. They would fire
# on every push, several times a day, and a topic that mostly carries "yes,
# that worked" is a topic that gets muted - taking the two above with it.
#
# Both go to the ntfy relay on the Proxmox host (docs/ntfy.md). Two webhook
# services rather than one because ArgoCD only supports headers per SERVICE,
# not per template, and the two deserve different titles and priorities.
#
# BOOTSTRAP FILE: apps/argocd is excluded from the ApplicationSet, so this is
# applied by hand like the rest of this directory:
#   kubectl apply -f apps/argocd/argocd-notifications-cm.yaml
#   kubectl rollout restart deploy/argocd-notifications-controller -n argocd
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-cm
    app.kubernetes.io/part-of: argocd
data:
  service.webhook.ntfy-sync-failed: |
    url: http://192.168.1.153:9098/homelab-alerts
    headers:
      - name: Content-Type
        value: text/plain
      - name: Title
        value: "ArgoCD sync failed"
      - name: Priority
        value: high
      - name: Tags
        value: warning

  service.webhook.ntfy-degraded: |
    url: http://192.168.1.153:9098/homelab-alerts
    headers:
      - name: Content-Type
        value: text/plain
      - name: Title
        value: "App degraded"
      - name: Priority
        value: high
      - name: Tags
        value: warning

  template.sync-failed: |
    webhook:
      ntfy-sync-failed:
        method: POST
        body: |
          {{.app.metadata.name}} failed to sync.

          Revision: {{.app.status.sync.revision}}
          Phase:    {{.app.status.operationState.phase}}
          {{.app.status.operationState.message}}

  template.health-degraded: |
    webhook:
      ntfy-degraded:
        method: POST
        body: |
          {{.app.metadata.name}} is Degraded.

          {{.app.status.health.message}}

  # Both triggers use oncePer so a single incident is a single notification
  # rather than one per reconcile loop - the controller reconciles every few
  # minutes and a degraded app stays degraded until someone fixes it.
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      oncePer: app.status.operationState.syncResult.revision
      send: [sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      oncePer: app.status.sync.revision
      send: [health-degraded]

  # Applies to every Application in the argocd namespace without needing an
  # annotation on each one - there are ~35 and they are generated by an
  # ApplicationSet, so per-app annotations would have to live in the generator.
  subscriptions: |
    - recipients:
        - ntfy-sync-failed
      triggers:
        - on-sync-failed
    - recipients:
        - ntfy-degraded
      triggers:
        - on-health-degraded
