---
# Remux, routed through the shared VPN gateway (apps/vpn).
#
# Stream source fetches, TMDB metadata and the AIOStreams addon calls go
# through the AirVPN tunnel via the gateway's HTTP proxy
# (HTTP_PROXY/HTTPS_PROXY env vars). Owner access (web UI) rides the normal
# Traefik edge, VPN-free.
#
# The killswitch is enforced by the remux NetworkPolicy: egress to the
# vpn-proxy port is allowed; direct internet egress is DENIED.
# If the VPN gateway goes down, Remux cannot reach the internet at all -
# only cluster-internal services (DNS, AIOStreams addon).
#
# CAVEAT: Remux's built-in torrent client (librqbit) makes raw TCP
# connections to trackers and peers - these bypass the HTTP proxy entirely.
# Torrent traffic therefore egresses from the node's WAN, not the VPN tunnel.
# This is acceptable because Remux's docs state the peer port "does not need
# to be forwarded/open for outbound-only operation".
#
# The NFS library is a node-level mount bind-mounted into the container,
# so library reads never traverse this pod's network namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remux
  namespace: remux
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: gluetun holds a single WireGuard session and
    # /data is a single-writer SQLite database. Two pods briefly overlapping
    # would double-connect the tunnel and contend on the DB.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: remux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remux
    spec:
      securityContext:
        # fsGroup so the remux-config PVC is group-writable by uid 1000.
        # OnRootMismatch, never the default Always: fsGroup makes the kubelet
        # recursively chown every mounted volume, and over NFS that walk is
        # O(files). OnRootMismatch skips the read-only media mount (already
        # GID 1000) and only touches the tiny config volume on first mount.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # This node's kubelet has seccompDefault=false, so without this the
        # whole pod runs seccomp Unconfined. RuntimeDefault was MEASURED safe
        # for gluetun on this exact image in apps/downloads/qbittorrent.yaml
        # (tunnel setup is ioctl(TUNSETIFF)+netlink, both allowed); Remux is a
        # plain Rust HTTP server plus ffmpeg - nothing it does needs the denied
        # set (mount/unshare/bpf/keyctl). seccomp is orthogonal to the
        # NET_ADMIN capability below.
        seccompProfile:
          type: RuntimeDefault
      containers:
        # --- Remux. Jellyfin-compatible API on 3000; /data is its state. ---
        - name: remux
          # Latest stable release at deploy time (GitHub releases: v0.27.0,
          # 2026-08-27; :latest and :nightly also exist but are unpinned
          # moving tags). The ghcr tag drops the "v" prefix. Index digest at
          # pin time:
          #   sha256:f2de64aa9f5601c4bbe94ae2bdf15d49bd99bbb2aed0503d60ac29f33d56622a
          image: ghcr.io/lostb1t/remux:0.27.0
          securityContext:
            # The image has no USER directive (defaults to root); run it as the
            # same arbitrary non-root uid the Jellyfin container uses. It only
            # writes under /data (db.sqlite, logs/, torrents/), which fsGroup
            # 1000 makes group-writable on the config PVC.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            # Everything else the image needs is baked in as ENV in the
            # Dockerfile: DATA_DIR=/data, PORT=3000,
            # DATABASE_URL=sqlite:///data/db.sqlite, LOG_FILE=/data/logs,
            # TORRENT_DATA_DIR=/data/torrents, FFMPEG_PATH (jellyfin-ffmpeg7).
            - name: TZ
              value: UTC
            # NO PROXY ENV. This pod now carries its own gluetun sidecar
            # (below), and containers in a pod share one network namespace, so
            # remux's traffic leaves through gluetun's tun0 directly. The
            # HTTP_PROXY/HTTPS_PROXY/ALL_PROXY vars that used to be here are
            # gone deliberately - routing through a proxy that is itself inside
            # the tunnel would just add a hop.
            #
            # WHAT THIS FIXED. A SOCKS5 proxy is TCP-only, so with it:
            #   - DHT never worked. It is UDP, so every lookup failed; the log
            #     said "no successful lookups" every ~30s, permanently.
            #   - No peer could ever connect IN, so the swarm was only ever
            #     peers we dialled out to, through an extra hop.
            # Cold-starting a stream took about a minute. This is the same
            # diagnosis, and the same fix, as commit 95397f6 for qBittorrent -
            # "run gluetun in the pod so BitTorrent actually works" - which
            # remux never received.
            #
            # The old comment here claimed librqbit's raw TCP "bypasses the
            # HTTP proxy entirely" and so "egresses from the node's WAN, not
            # the VPN tunnel". That was wrong in a way worth recording: the
            # NetworkPolicy denied direct egress outright, so that traffic was
            # not leaking to the WAN, it was being dropped.
            #
            # Pins librqbit's listen port to the one AirVPN forwards for this
            # device. librqbit opens a RANGE of ten from here
            # (crates/remux-server/src/torrent.rs: `p..p + 10`), so the
            # forwarded port must be the FIRST in that range - 50071..50080.
            - name: TORRENT_PEER_PORT
              value: "50071"
          ports:
            - name: http
              containerPort: 3000
          resources:
            # Direct-play media server + built-in torrent streaming. The node
            # is memory-tight and shared, so the limit is modest - same class
            # as the Jellyfin container next door.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            # /health is the image's own healthcheck endpoint (served
            # unauthenticated, first boot). Deliberately generous: an
            # over-aggressive probe here would mark the pod NotReady and empty
            # the Service's endpoints, which has cut media apps off in this
            # cluster before.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /data
            # The shared library, read-only, narrowed to the media subdirectory
            # (music now; movies/tv once a video *arr populates them). Mounted
            # INSIDE /data so Remux's local-file sources see /data/media/music
            # - the same path shape the Jellyfin pod uses - while its own
            # state (db, logs, torrents) stays on the private config PVC.
            - name: media
              mountPath: /data/media
              subPath: media
              readOnly: true
        # The tunnel. Mirrors the qBittorrent pod's sidecar, with one critical
        # difference: it authenticates as a SEPARATE AirVPN DEVICE.
        #
        # AirVPN WireGuard is one session per key pair. The airvpn Secret in
        # this namespace used to carry the same key as the downloads pod, and
        # apps/doppler/dopplersecrets.yaml said so out loud - "credentials are
        # reused". Two gluetuns presenting one key fight over one session and
        # both tunnels flap, which would take qBittorrent, slskd and the
        # seedbox API down with remux. It now reads AIRVPN_REMUX_*, a second
        # device with its own key pair and its own forwarded port, 50071.
        - name: gluetun
          # Pinned to match the downloads pod exactly. v3.40.0 aborts at
          # startup on this LXC's IPv6 link-local address; v3.41.3 does not.
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn
            - name: VPN_TYPE
              value: wireguard
            # SERVER_NAMES deliberately unset, unlike the downloads pod. That
            # one pins Aquila so its IP and ASN stay stable for the MAM
            # seedbox session; remux has no such constraint, and leaving the
            # exit free means a dead server does not take streaming down.
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: private-key
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: preshared-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: addresses
            # THE KILLSWITCH BOUNDARY. Only these bypass the tunnel:
            #   10.42.0.0/16 pod CIDR     - so Traefik reaches the UI and the
            #                               kubelet's probe gets a reply.
            #   10.43.0.0/16 service CIDR - so CoreDNS, Postgres and the
            #                               AIOStreams addon resolve and work.
            # Everything else - trackers, peers, DHT, TMDB - is forced through
            # WireGuard and dropped if it is down. The killswitch moves out of
            # the NetworkPolicy and into gluetun, which is stricter.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            # Inbound on eth0, from inside the cluster. Without this gluetun's
            # INPUT policy drops the Service traffic and the readiness probe,
            # and the pod never goes Ready.
            - name: FIREWALL_INPUT_PORTS
              value: "3000"
            # Inbound through the TUNNEL: the AirVPN forwarded port for this
            # device. This is what lets peers connect to us rather than only
            # the other way round, and it is most of the cold-start win.
            - name: FIREWALL_VPN_INPUT_PORTS
              value: "50071"
            # Keep kube-dns so *.svc.cluster.local still resolves; otherwise
            # gluetun rewrites resolv.conf to a public resolver and every
            # in-cluster name (aiostreams, postgres, prowlarr) fails.
            - name: DNS_KEEP_NAMESERVER
              value: "on"
            - name: DOT
              value: "off"
            - name: HTTPPROXY
              value: "off"
            - name: SHADOWSOCKS
              value: "off"
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          livenessProbe:
            # A timeout here RESTARTS gluetun, which drops the tunnel and takes
            # streaming down with it. Tolerate a slow check rather than tear it
            # down - the downloads pod learned the same thing.
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            # WireGuard needs a TUN device and Kubernetes exposes none by
            # default. NET_ADMIN alone is NOT enough - the device node itself
            # must be passed in, or gluetun dies with "operation not
            # permitted". This is why the namespace has to be privileged: a
            # hostPath device mount is forbidden under baseline just as
            # NET_ADMIN is.
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: config
          # remux-config-local, NOT remux-config: this volume holds a SQLite
          # database and SQLite on NFS made the UI unusable - single-row
          # primary-key lookups taking 17-21s while the pod used 1m of CPU.
          # See apps/remux/pvc-config-local.yaml for the measurements and why
          # Postgres is not the alternative. The nfs-csi PVC is still declared
          # in pvc-config.yaml and still holds the pre-migration copy, so this
          # is a one-line rollback.
          persistentVolumeClaim:
            claimName: remux-config-local
        - name: media
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: remux
  namespace: remux
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: remux
  ports:
    - name: http
      port: 3000
      targetPort: http
