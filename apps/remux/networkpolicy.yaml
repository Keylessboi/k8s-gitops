---
# Killswitch NetworkPolicy for the migrated remux pod.
#
# With the gluetun sidecar removed, the pod has its own network interface
# and COULD reach the internet directly. This policy is the killswitch:
# egress is locked to cluster-internal services and the VPN gateway's
# HTTP proxy port ONLY. Direct internet egress (0.0.0.0/0) is DENIED.
#
# NOTE: Remux's built-in torrent client (librqbit) makes raw TCP
# connections to trackers and peers that bypass the HTTP proxy. These
# connections egress from the node's WAN. This is acceptable because
# Remux's docs state the peer port "does not need to be forwarded/open
# for outbound-only operation".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: remux
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The account provisioner (apps/accounts) creates remux users with a real
    # password, so one credential works here too. Matching egress rule is in
    # apps/accounts/networkpolicy.yaml.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: accounts
      ports:
        - port: 3000
          protocol: TCP
    # Traefik (kube-system) -> Remux dashboard/API on 3000, plus the
    # cert-manager HTTP-01 solver on 8089.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 3000, protocol: TCP}
        - {port: 8089, protocol: TCP}
    # Authentik's embedded outpost runs in proxy mode: it authenticates the
    # request, then dials remux:3000 to forward it. Without this rule the
    # outpost's connections are rejected → "Bad Gateway" at the ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - {port: 3000, protocol: TCP}
    # This namespace talking to itself: remux <-> aiostreams, both on 3000.
    #
    # Added 2026-09-03 after the same omission cost immich all of its machine
    # learning. Measured here before and after: `aiostreams -> remux:3000` was
    # REJECTed outright while `remux -> aiostreams:3000` succeeded, an asymmetry
    # the policy text does not explain and which is not worth relying on either
    # way. A default-deny ingress policy denies pod-to-pod inside its own
    # namespace, and every rule above is about traffic arriving from elsewhere.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remux
      ports:
        - {port: 3000, protocol: TCP}
  egress:
    # remux-user-sync reads authentik's user list. Declared on both sides, as
    # the note below insists: the matching ingress rule is in
    # apps/authentik/networkpolicy.yaml. Missing this half reads as a bare
    # "connection refused" that says nothing about policy.
    #
    # 9000, NOT 80. The authentik-server Service is 80 -> targetPort 9000, and
    # kube-proxy DNATs before NetworkPolicy is evaluated, so the port this rule
    # must name is the POD's. Writing the Service port here is the mistake that
    # produced octo's "Bad Gateway" last session and is worth a line every time.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 9000
          protocol: TCP
    # The ntfy relay on the Proxmox host - remux-user-sync reports the accounts
    # it creates. See docs/ntfy.md.
    - to:
        - ipBlock:
            cidr: 192.168.1.153/32
      ports:
        - port: 9098
          protocol: TCP
    # remux itself, for remux-user-sync. The ingress half already admitted
    # this namespace on 3000; the egress half did not exist, because until now
    # nothing in this namespace called remux - aiostreams is called BY it, and
    # that is the rule two below.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: remux
      ports:
        - port: 3000
          protocol: TCP
    # AIOStreams' Postgres, on the shared CNPG cluster. Declared here AND as a
    # matching ingress rule in apps/databases/networkpolicy.yaml - a
    # cross-namespace flow needs both sides, and this repo has been bitten four
    # times by declaring only one.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - {port: 5432, protocol: TCP}
    # DNS. CoreDNS resolves addon and API hostnames; namespace-qualified.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The AIOStreams addon endpoint, co-located in this namespace since Jellyfin
    # was decommissioned. The standalone aiostreams Deployment publishes its own
    # Service (aiostreams.remux.svc:3000); this egress lets the remux pod reach
    # the aiostreams pod directly (same-namespace podSelector).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aiostreams
      ports:
        - {port: 3000, protocol: TCP}
    # k3s apiserver, reachable only by ipBlock.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - {port: 6443, protocol: TCP}
    # The shared VPN gateway's HTTP proxy. Stream source fetches, TMDB
    # metadata and the AIOStreams addon calls go through here via
    # HTTP_PROXY/HTTPS_PROXY env vars. This is the only path to the
    # public internet - the killswitch.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: downloads
      ports:
        - {port: 8888, protocol: TCP}
        # 1080 = the plain SOCKS5 sidecar, now in the qBittorrent pod.
        # This is the path BitTorrent peer traffic has to take: an HTTP CONNECT
        # proxy on 8888 cannot carry peer or DHT connections, which is why
        # qBittorrent routes through 8388 with UseProxyForPeerConnections=true
        # rather than through 8888. Remux's built-in torrent streaming needs the
        # same road, and without this rule its only egress is HTTP - so it can
        # fetch an addon's stream list and then reach none of the peers on it.
        # 8388 is Shadowsocks and unusable by a plain SOCKS5 client; kept
        # only so this rule reads as the full set of gateway ports.
        - {port: 1080, protocol: TCP}
        # 1080: the plain SOCKS5 sidecar. This is the port the torrent engine
        # actually needs.
        - {port: 1080, protocol: TCP}
