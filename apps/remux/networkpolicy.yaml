---
# Killswitch NetworkPolicy for the migrated remux pod.
#
# With the gluetun sidecar removed, the pod has its own network interface
# and COULD reach the internet directly. This policy is the killswitch:
# egress is locked to cluster-internal services and the VPN gateway's
# HTTP proxy port ONLY. Direct internet egress (0.0.0.0/0) is DENIED.
#
# NOTE: Remux's built-in torrent client (librqbit) makes raw TCP
# connections to trackers and peers that bypass the HTTP proxy. These
# connections egress from the node's WAN. This is acceptable because
# Remux's docs state the peer port "does not need to be forwarded/open
# for outbound-only operation".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: remux
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik (kube-system) -> Remux dashboard/API on 3000, plus the
    # cert-manager HTTP-01 solver on 8089.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 3000, protocol: TCP}
        - {port: 8089, protocol: TCP}
    # Authentik's embedded outpost runs in proxy mode: it authenticates the
    # request, then dials remux:3000 to forward it. Without this rule the
    # outpost's connections are rejected → "Bad Gateway" at the ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - {port: 3000, protocol: TCP}
  egress:
    # DNS. CoreDNS resolves addon and API hostnames; namespace-qualified.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The AIOStreams addon endpoint: the aiostreams Service in the jellyfin
    # namespace (see apps/jellyfin/deployment.yaml for why that Service
    # exists).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jellyfin
      ports:
        - {port: 3000, protocol: TCP}
    # k3s apiserver, reachable only by ipBlock.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - {port: 6443, protocol: TCP}
    # The shared VPN gateway's HTTP proxy. Stream source fetches, TMDB
    # metadata and the AIOStreams addon calls go through here via
    # HTTP_PROXY/HTTPS_PROXY env vars. This is the only path to the
    # public internet - the killswitch.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vpn
      ports:
        - {port: 8888, protocol: TCP}
