---
# Standalone AIOStreams, moved out of the decommissioned jellyfin pod.
#
# AIOStreams (self-hosted; adds torrentio/debrid search into Remux/Gelato)
# previously ran as a sidecar container in the jellyfin pod. Jellyfin is being
# decommissioned, but the remux app consumes this addon, so AIOStreams now
# lives on its own in the remux namespace. It cannot be a sidecar inside the
# remux pod: remux binds its HTTP server on 3000 and AIOStreams also binds
# 3000, so in a shared pod netns they would collide. It is therefore a
# standalone Deployment with its own Service (aiostreams.remux.svc:3000).
#
# Stream queries exit our AirVPN tunnel through the shared VPN gateway's HTTP
# proxy (HTTP_PROXY/HTTPS_PROXY below) - the same path the addon used inside
# the jellyfin pod. The remux NetworkPolicy (podSelector: {} -> all pods in
# this namespace) is the killswitch for both pods; egress to the proxy port is
# allowed, direct internet egress is denied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiostreams
  namespace: remux
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: the config DB is single-writer SQLite.
    # Two pods briefly overlapping would contend on the DB.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aiostreams
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiostreams
    spec:
      securityContext:
        # fsGroup so the aiostreams-data PVC is group-writable by uid 1000.
        # OnRootMismatch, never the default Always (avoids O(files) NFS walks).
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # RuntimeDefault, for the same reasons documented in
        # apps/jellyfin/deployment.yaml. AIOStreams is a plain Node process.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiostreams
          # Self-hosted rather than a public instance so the stream queries exit
          # OUR AirVPN tunnel, and so we control the quality filters that keep
          # everything direct-playable. Pinned.
          #
          # v2.33.2, not v1.x: Gelato resolves search through search-capable
          # CATALOGS in the addon manifest, and the v1.x manifest hardcodes
          # `catalogs: []`. v2 aggregates catalogs from the tmdb preset.
          image: ghcr.io/viren070/aiostreams:v2.33.2
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            # Reached only over the cluster-internal Service by remux, and by
            # the owner via `kubectl port-forward` to configure it; it is not
            # exposed through Traefik (its config UI holds debrid keys and must
            # not be public). The base URL stays loopback - AIOStreams serves
            # its own configure UI on localhost within this pod.
            - name: BASE_URL
              value: http://localhost:3000
            - name: PORT
              value: "3000"
            # Encrypts the stored addon configuration; the manifest URL Gelato
            # consumes is only decryptable with this key, so it MUST be stable
            # across restarts - hence Doppler (see the aiostreams DopplerSecret,
            # now synced into this namespace).
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aiostreams
                  key: secret-key
            # SQLite on the persistent claim; holds the encrypted addon config.
            # Postgres, not SQLite, under CONTRIBUTING.md rule 1. AIOStreams
            # is the only one of this cluster's four SQLite apps that supports
            # it (`DATABASE_URI` accepts postgres://); ghost, remux and convertx
            # cannot and are exempt.
            #
            # Composed by dependent env expansion so the password never appears
            # in git. The Doppler value is deliberately alphanumeric: a '@' or
            # '/' inside the password would silently corrupt this DSN.
            #
            # NOTE: AIOStreams does NOT migrate its existing SQLite content, so
            # the addon Remux consumes has to be re-created after this lands.
            # The old file stays on the PVC as a fallback until that is done.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: aiostreams
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiostreams
                  key: db-password
            - name: DATABASE_URI
              value: postgres://$(DB_USER):$(DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/aiostreams
            - name: HTTP_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: HTTPS_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            # KNOWN LIMITATION, 2026-09-03. These proxy variables are honoured
            # by the stream-query path but NOT by the anime-database fetcher,
            # which logs
            #   ECONNREFUSED 140.82.114.3:443  (github.com)
            # in a loop. 140.82.114.3 is GitHub, and the connection is DIRECT -
            # the killswitch in networkpolicy.yaml correctly denies it, because
            # the only permitted egress is the VPN gateway.
            #
            # So this is the app bypassing its own proxy configuration, not a
            # policy gap, and it is deliberately NOT "fixed" by allowing direct
            # egress to GitHub: that would punch a hole in the VPN killswitch
            # for an optional anime-metadata refresh. Stream queries - the
            # reason this runs at all - are unaffected.
            #
            # If it ever matters, the fix belongs upstream (make the fetcher use
            # the proxy) or in a sidecar that mirrors the database locally.
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16"
            - name: TZ
              value: UTC
          # No readinessProbe on purpose: all containers' readiness is ANDed
          # into pod readiness and this Deployment has no readiness gate of its
          # own; a flapping probe here would only delay traffic to the Service
          # endpoints. If AIOStreams is unhealthy, search degrades; the kubelet
          # still restarts a crashed container. Same lesson as the seedboxapi
          # sidecar in the downloads pod.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: aiostreams-data
              mountPath: /app/data
      volumes:
        - name: aiostreams-data
          persistentVolumeClaim:
            claimName: aiostreams-data
