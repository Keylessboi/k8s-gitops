---
# Remux - Jellyfin-compatible media server, deployed in parallel with the
# existing Jellyfin stack while the owner validates it. See deployment.yaml
# for the tunnel/killswitch design and ingress.yaml for the forward-auth
# trade-off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: remux
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: remux
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd

namespace: remux

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: media
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - media-data-pv.yaml
  - pvc-config.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - ingress.yaml
  - authentik-outpost.yaml
