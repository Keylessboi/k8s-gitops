---
# Remux - Jellyfin-compatible media server.
#
# No longer privileged: the gluetun sidecar has been removed and replaced
# with the shared VPN gateway (apps/vpn). The pod no longer needs NET_ADMIN
# or /dev/net/tun. Baseline PodSecurity is sufficient for the remux
# container, which pins a hardened securityContext (runAsUser 1000,
# seccomp RuntimeDefault).
apiVersion: v1
kind: Namespace
metadata:
  name: remux
  labels:
    app.kubernetes.io/name: remux
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
