---
# Shared VPN gateway: ONE gluetun container serving the entire cluster.
#
# Replaces the four per-app gluetun sidecars with a single WireGuard tunnel
# that consumer apps reach through built-in HTTP and Shadowsocks proxies.
# See deployment.yaml for the full layout rationale.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vpn
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: vpn
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd

namespace: vpn

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: infrastructure
      homelab/tier: infrastructure
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - deployment.yaml
