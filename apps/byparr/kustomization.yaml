---
# Byparr: FlareSolverr-compatible challenge solver (nodriver/real browser) that
# beats DDoS-Guard, which FlareSolverr cannot. Used ONLY by Shelfmark
# (book-downloader) for Anna's Archive direct-download search. FlareSolverr is
# left untouched for Prowlarr's indexers. Headless browser workload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: byparr
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: byparr
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: byparr

# `labels` with includeSelectors:false, NOT `commonLabels`. commonLabels
# rewrites every selector it finds - Deployment/Service selectors and
# NetworkPolicy podSelectors alike. Deployment selectors are immutable, so
# changing these made ArgoCD fail 'spec.selector: field is immutable', and it
# silently broke NetworkPolicy podSelectors by adding labels the pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: byparr
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: utility
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - deployment.yaml
