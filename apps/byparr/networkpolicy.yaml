apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: byparr
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # This cluster evaluates NetworkPolicy at BOTH ends. book-downloader
  # (namespace books) is the only caller of Byparr; its own namespace allows
  # egress to byparr:8191, but that only covers one direction, so this ingress
  # rule is what stops the bypass request arriving as "connection refused" from
  # a healthy pod - the exact trap that bit FlareSolverr's book-downloader rule.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: books
    ports:
    - port: 8191
      protocol: TCP
  # Same namespace, for completeness (probes, future sidecars).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: byparr
  egress:
  # DNS. CoreDNS resolves both in-cluster names and the external Anna's Archive
  # mirror hostnames.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # The internet. Byparr must reach Anna's Archive and its DDoS-Guard/challenge
  # assets, plus the DoH resolvers it may use. Port 80 as well as 443 because
  # driving a real browser through a challenge pulls assets that are not all on
  # 443. Private ranges are excluded so this cannot become in-cluster lateral
  # access.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 172.16.0.0/12
    ports:
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
