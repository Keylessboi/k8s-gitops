---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/part-of: homelab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # OnRootMismatch, not the default Always. fsGroup makes the kubelet
        # recursively chown every mounted volume before the container starts.
        # Over NFS that walk is O(files) and shows up as the pod sitting in
        # ContainerCreating with only a 'context deadline exceeded' to go on.
        # The volume roots already carry the right ownership, so this skips the
        # walk; if a root ever genuinely mismatches, the full chown still runs.
        fsGroupChangePolicy: OnRootMismatch
        # Without this the pod runs seccomp Unconfined: this node's kubelet has
        # seccompDefault=false, so nothing applies a profile unless a manifest
        # asks. RuntimeDefault blocks the syscalls the container runtime
        # considers dangerous (mount, unshare, kexec, bpf, keyctl, ...). This
        # is the pod holding every password in the house, so it gets the
        # narrowest kernel surface the runtime offers; oidcwarden is a Rust
        # HTTP server and uses none of the denied calls.
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        homelab/node-class: compute
      containers:
        - name: vaultwarden
          # The SSO-capable fork, NOT dani-garcia/vaultwarden.
          #
          # Upstream Vaultwarden has never supported SSO and silently ignores
          # every SSO_* variable: with the official image these settings were
          # present, looked configured, and did nothing. /api/config advertised
          # no SSO fields and the logs never parsed them.
          #
          # Forward-auth is not an alternative here the way it is for Lidarr -
          # the Bitwarden browser extension and mobile apps talk to the API
          # directly and cannot complete an Authentik login flow, so fronting
          # this with the outpost would break every client except the web vault.
          #
          # OIDCWarden, which is what timshel/vaultwarden was renamed to. The
          # old repo is stalled - its image tags stop at 1.33.x and its `main`
          # still lacks `POST /accounts/prelogin/password`, a route newer
          # Bitwarden clients call before a password login. Missing it returned
          # 404, which every client reports as "an unexpected error has
          # occurred" - so password login was impossible while SSO worked fine,
          # because SSO never touches that endpoint.
          #
          # Migration is one added column (`organizations.external_id`) plus a
          # few extra rows in `__diesel_schema_migrations`, applied on startup.
          # Upstream documents Vaultwarden running directly on an OIDCWarden
          # database, so this is reversible.
          #
          # Trade-off accepted knowingly: a community fork of a password
          # manager. It tracks upstream closely and is actively maintained.
          image: ghcr.io/timshel/oidcwarden:v2026.8.0-1-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            # Password for the `vaultwarden` role on the central cluster.
            # Synced from Doppler; the per-app CNPG cluster is gone.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-credentials
                  key: password
            # $(DB_PASSWORD) expands because env vars resolve in order.
            - name: DATABASE_URL
              value: postgresql://vaultwarden:$(DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/vaultwarden
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: DOMAIN
              value: https://vaultwarden.sandstorm.chat
            # Public signups are closed: this vault is reachable from the
            # internet and anyone could otherwise create an account.
            # SMTP, so invites and verification mails actually send.
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef: {name: smtp, key: host}
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef: {name: smtp, key: port}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef: {name: smtp, key: username}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: smtp, key: password}
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef: {name: smtp, key: from}
            - name: SMTP_FROM_NAME
              value: Vaultwarden
            # starttls on 587; "force_tls" would be port 465.
            - name: SMTP_SECURITY
              value: starttls
            # Bitwarden push notifications (mobile/web clients via Bitwarden's
            # push relay). The installation id/key come from bitwarden.com/host
            # and are synced from Doppler; the identity/relay endpoints default
            # to bitwarden.com, which is correct here. They live in the `smtp`
            # Secret because that is the managed Secret of the vaultwarden
            # DopplerSecret entry (see apps/doppler/dopplersecrets.yaml).
            # PUSH_ENABLED must be explicit: it defaults to false even when the
            # installation id/key are set, and push then stays silently off.
            - name: PUSH_ENABLED
              value: "true"
            - name: PUSH_INSTALLATION_ID
              valueFrom:
                secretKeyRef: {name: smtp, key: push-installation-id}
            - name: PUSH_INSTALLATION_KEY
              valueFrom:
                secretKeyRef: {name: smtp, key: push-installation-key}
            - name: SIGNUPS_ALLOWED
              value: "false"
            # /admin is disabled outright rather than left on a token. It is
            # the highest-value endpoint on a public vault.
            # ADMIN_TOKEN deliberately unset, so /admin stays disabled and is
            # not an attack surface. Everyone authenticates through Authentik,
            # and the existing accounts are already associated.
            #
            # That earlier claim - "a brand-new user cannot self-register
            # while SIGNUPS_ALLOWED is false, because upstream treats SSO login
            # as a signup" - was WRONG for this fork, and is corrected below at
            # SSO_SIGNUPS_ALLOWED. The two gates are entirely separate.
            - name: DISABLE_ADMIN_TOKEN
              value: "false"
            # SSO via Authentik. These are only honoured by the fork above;
            # on the official image they are inert.
            #
            # SSO_ONLY stays false deliberately: local login remains available
            # so an Authentik outage cannot lock you out of your own vault.
            # That is the no-lockout rule the plan calls out, and it matters
            # more here than anywhere else in the cluster.
            # NEW ACCOUNTS COME IN THROUGH AUTHENTIK, AND ONLY THROUGH IT.
            #
            # OIDCWarden gates SSO signup on its own setting, not the one
            # above. From src/config.rs:
            #
            #   pub fn is_sso_signup_allowed(&self, email: &str) -> bool {
            #       if self.signups_domains_whitelist().is_empty() {
            #           self.sso_signups_allowed()      // <- NOT signups_allowed
            #
            # So SIGNUPS_ALLOWED=false closes the public registration form
            # while SSO_SIGNUPS_ALLOWED=true lets anyone Authentik vouches for
            # get a vault on first login. Default is already true; set
            # explicitly because the whole access model for this app turns on
            # it, and because a default that changes upstream would close
            # signups silently.
            #
            # DO NOT set SIGNUPS_DOMAINS_WHITELIST as a "safety net": per the
            # code above, a non-empty whitelist OVERRIDES both flags, which
            # would REOPEN the public form to that domain. Empty is stricter.
            - name: SSO_SIGNUPS_ALLOWED
              value: "true"
            # AND THE THING THAT ACTUALLY BLOCKED IT. OIDCWarden refuses to
            # create an account when the provider reports the address as
            # unverified:
            #
            #   Some(false) => err!("You need to verify your email with your
            #                        provider before you can log in")
            #
            # authentik's BUILT-IN email scope mapping hardcodes
            # "email_verified": False. So signup would have failed on that
            # line regardless of any setting here.
            #
            # Fixed in authentik, not here: a separate unmanaged scope mapping
            # ("OAuth Mapping: email (verified)") is attached to the
            # Vaultwarden provider in place of the built-in one. Separate
            # rather than edited, because the built-in is blueprint-managed and
            # an upgrade would silently revert it. See docs/accounts.md.
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false"
            # Matches users by verified email so an existing local account and
            # its Authentik identity resolve to one user rather than two.
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSO_SCOPES
              value: "email profile openid offline_access"
            - name: SSO_AUTHORITY
              value: https://authentik.sandstorm.chat/application/o/vaultwarden/
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc
                  key: client_id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc
                  key: client_secret
          ports:
            - name: http
              containerPort: 80
          # No readiness probe at all meant a dead container still read 1/1 Running.
          # For a password manager that is the worst possible place to have no signal.
          # /alive verified returning 200 from inside the pod.
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
