---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/part-of: homelab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        homelab/node-class: compute
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.34.3-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            # Password for the `vaultwarden` role on the central cluster.
            # Synced from Doppler; the per-app CNPG cluster is gone.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-credentials
                  key: password
            # $(DB_PASSWORD) expands because env vars resolve in order.
            - name: DATABASE_URL
              value: postgresql://vaultwarden:$(DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/vaultwarden
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: DOMAIN
              value: https://vaultwarden.sandstorm.chat
            # Public signups are closed: this vault is reachable from the
            # internet and anyone could otherwise create an account.
            - name: SIGNUPS_ALLOWED
              value: "false"
            # /admin is disabled outright rather than left on a token. It is
            # the highest-value endpoint on a public vault.
            - name: DISABLE_ADMIN_TOKEN
              value: "false"
            # SSO via Authentik. Local admin login still works as the
            # emergency path if Authentik is unavailable.
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false"
            - name: SSO_AUTHORITY
              value: https://authentik.sandstorm.chat/application/o/vaultwarden/
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc
                  key: client_id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc
                  key: client_secret
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
