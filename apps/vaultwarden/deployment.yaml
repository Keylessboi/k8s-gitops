---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/part-of: homelab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        homelab/node-class: compute
      containers:
        - name: vaultwarden
          # The SSO-capable fork, NOT dani-garcia/vaultwarden.
          #
          # Upstream Vaultwarden has never supported SSO and silently ignores
          # every SSO_* variable: with the official image these settings were
          # present, looked configured, and did nothing. /api/config advertised
          # no SSO fields and the logs never parsed them.
          #
          # Forward-auth is not an alternative here the way it is for Lidarr -
          # the Bitwarden browser extension and mobile apps talk to the API
          # directly and cannot complete an Authentik login flow, so fronting
          # this with the outpost would break every client except the web vault.
          #
          # Trade-off accepted knowingly: a community fork of a password
          # manager, currently one patch behind upstream (1.34.1 vs 1.34.3).
          # It tracks upstream closely and is actively maintained. The database
          # schema is identical, so the Postgres data carries over untouched.
          image: ghcr.io/timshel/vaultwarden:1.34.1-1-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            # Password for the `vaultwarden` role on the central cluster.
            # Synced from Doppler; the per-app CNPG cluster is gone.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-credentials
                  key: password
            # $(DB_PASSWORD) expands because env vars resolve in order.
            - name: DATABASE_URL
              value: postgresql://vaultwarden:$(DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/vaultwarden
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: DOMAIN
              value: https://vaultwarden.sandstorm.chat
            # Public signups are closed: this vault is reachable from the
            # internet and anyone could otherwise create an account.
            # SMTP, so invites and verification mails actually send.
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef: {name: smtp, key: host}
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef: {name: smtp, key: port}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef: {name: smtp, key: username}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: smtp, key: password}
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef: {name: smtp, key: from}
            - name: SMTP_FROM_NAME
              value: Vaultwarden
            # starttls on 587; "force_tls" would be port 465.
            - name: SMTP_SECURITY
              value: starttls
            - name: SIGNUPS_ALLOWED
              value: "false"
            # /admin is disabled outright rather than left on a token. It is
            # the highest-value endpoint on a public vault.
            # ADMIN_TOKEN deliberately unset, so /admin stays disabled and is
            # not an attack surface. Everyone authenticates through Authentik,
            # and the existing accounts are already associated.
            #
            # Trade-off: a brand-new user cannot self-register while
            # SIGNUPS_ALLOWED is false - upstream treats SSO login as a signup
            # for someone with no prior account. Adding one later means briefly
            # restoring this token, or flipping SIGNUPS_ALLOWED, via a commit.
            - name: DISABLE_ADMIN_TOKEN
              value: "false"
            # SSO via Authentik. These are only honoured by the fork above;
            # on the official image they are inert.
            #
            # SSO_ONLY stays false deliberately: local login remains available
            # so an Authentik outage cannot lock you out of your own vault.
            # That is the no-lockout rule the plan calls out, and it matters
            # more here than anywhere else in the cluster.
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false"
            # Matches users by verified email so an existing local account and
            # its Authentik identity resolve to one user rather than two.
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            - name: SSO_SCOPES
              value: "email profile openid offline_access"
            - name: SSO_AUTHORITY
              value: https://authentik.sandstorm.chat/application/o/vaultwarden/
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc
                  key: client_id
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-oidc
                  key: client_secret
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
