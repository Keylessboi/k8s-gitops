---
# Vaultwarden: Bitwarden-compatible password manager.
# CNPG Cluster holds the account data. WAL ships to MinIO for backup.
# Vault attachments live on an NFS claim.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: vaultwarden

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: secrets-management
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml
  - ingress.yaml
