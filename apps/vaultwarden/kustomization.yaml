---
# Vaultwarden: Bitwarden-compatible password manager.
# CNPG Cluster holds the account data. WAL ships to MinIO for backup.
# Vault attachments live on an NFS claim.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: vaultwarden

commonLabels:
  app.kubernetes.io/name: vaultwarden
  app.kubernetes.io/part-of: homelab
  app.kubernetes.io/component: secrets-management
  app.kubernetes.io/managed-by: argocd
  homelab/tier: apps

resources:
  - namespace.yaml
  - cluster.yaml
  - secret-minio.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
