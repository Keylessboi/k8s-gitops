---
# DEPRECATED: Will be replaced by central app-databases cluster in databases namespace
# Database for Vaultwarden. One instance is enough for a homelab.
# WAL files and base backups go to a MinIO bucket over S3.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-db
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: homelab
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector:
    homelab/node-class: compute
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      # Point at your MinIO. Create the bucket once by hand.
      destinationPath: s3://cnpg-backups/vaultwarden
      endpointURL: http://192.168.1.67:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: minio-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
