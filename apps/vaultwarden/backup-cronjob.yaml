---
# Backs up Vaultwarden's data VOLUME to MinIO (with rclone).
#
# The vault itself - passwords, logins, notes, TOTP seeds - lives in
# PostgreSQL and is already covered by CNPG base backups and WAL archiving.
# This covers the part that is NOT in the database:
#
#   rsa_key.pem   signs every JWT. Losing it invalidates all sessions and
#                 logs every client out until they re-authenticate.
#   attachments/  real user data, gone for good if the volume is lost.
#   sends/        Bitwarden Send payloads.
#
# Without this a single lost PVC meant losing attachments outright, which is
# exactly the failure worth guarding against on a password manager.
#
# Versioning is enabled on the bucket, so an accidental delete or a corrupted
# sync can be rolled back rather than propagated.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-data-backup
  namespace: vaultwarden
spec:
  # Every 6 hours, matching the etcd snapshot cadence.
  schedule: "20 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          # Never, not OnFailure - so a failed attempt LEAVES A POD BEHIND.
          #
          # This backup failed three consecutive scheduled runs (2026-09-09,
          # 14h/8h/3h before this change) and the cause is now unknowable:
          # with OnFailure the container restarts in place, and when the
          # backoff limit is hit the job controller DELETES the pod. By the
          # time anyone looks there are no logs, and Kubernetes events have
          # already expired at one hour. Every diagnosis attempt returned
          # "You must provide one or more resources by argument".
          #
          # With Never, each attempt is a separate pod and failed pods are
          # retained rather than deleted, so the next failure can actually be
          # read. failedJobsHistoryLimit: 3 above bounds how many are kept.
          #
          # This matters more than it looks: the runs died in ~20 SECONDS,
          # which is shorter than the 60s sleep in the retry loop below - so
          # whatever killed them, it was not `mc mirror` returning non-zero,
          # and the retry loop this file already carries never even engaged.
          # That rules out the failure mode the comment below describes and
          # leaves no candidate, which is precisely why the evidence has to
          # survive the next one.
          restartPolicy: Never
          containers:
            - name: backup
              # rclone, not mc. MinIO stopped publishing images: minio/mc and
              # minio/minio are 404 on Docker Hub and quay.io/minio/* refuses
              # anonymous pulls (checked 2026-09-30). The pinned
              # minio/mc:RELEASE.2025-04-16T18-13-26Z only kept working from
              # the node's image cache, and kubelet image GC evicted it during
              # disk pressure on 2026-09-30, so the next run could not have
              # started. rclone/rclone is an official, maintained image.
              #
              # The secret is unchanged: mc-host is still the mc alias URL
              # (scheme://KEY:SECRET@host:port), split below into rclone's
              # env-var remote config. Same bucket, same object keys as the old
              # `mc mirror`, so the existing versioned backup continues.
              image: rclone/rclone:1.75.1
              env:
                - name: MC_HOST_backup
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-backup-s3
                      key: mc-host
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Nothing below prints a credential.
                  case "${MC_HOST_backup:-}" in
                    http://*@*|https://*@*) ;;
                    *) echo "mc-host is not an http(s)://KEY:SECRET@host URL"; exit 1 ;;
                  esac
                  scheme="${MC_HOST_backup%%://*}"
                  rest="${MC_HOST_backup#*://}"
                  creds="${rest%@*}"
                  export RCLONE_CONFIG_BACKUP_TYPE=s3
                  export RCLONE_CONFIG_BACKUP_PROVIDER=Minio
                  export RCLONE_CONFIG_BACKUP_ENDPOINT="${scheme}://${rest##*@}"
                  export RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID="${creds%%:*}"
                  export RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY="${creds#*:}"
                  export RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET=true
                  unset rest creds
                  case "$RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY$RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID" in
                    *%*) echo "mc-host credentials are percent-encoded; rclone needs them decoded"; exit 1 ;;
                  esac

                  echo "backing up /data -> app-data-backups/vaultwarden"
                  # `copy`, not `sync`: sync would let a local wipe erase the
                  # backup too (the old mirror ran without --remove for the
                  # same reason). Changed files overwrite; bucket versioning
                  # keeps the previous copy.
                  #
                  # Retry, because MinIO on the NAS intermittently REFUSES connections
                  # under load - not because it is down. Verified 2026-09-09:
                  # `mc ls backup/` succeeded and `mc mirror` failed seconds later with
                  #   dial tcp 192.168.1.67:9000: connect: connection refused
                  # while minio itself had 0 restarts, no errors and 355 MB RSS, on a NAS
                  # at load average 14 with 11 nfsd threads blocked on I/O. A healthy
                  # listener with a full accept queue refuses connections exactly like a
                  # dead one.
                  #
                  # Three runs failed back-to-back on this, so the password manager went
                  # 38 hours with no backup and nothing said so.
                  n=0
                  until rclone copy /data backup:app-data-backups/vaultwarden; do
                    n=$((n+1))
                    [ "$n" -ge 5 ] && { echo "rclone copy failed $n times, giving up"; exit 1; }
                    echo "rclone copy failed (attempt $n); retrying in 60s"
                    sleep 60
                  done
                  # THE COPY IS THE BACKUP. What follows is a log line, and a
                  # log line must never fail the job: on 2026-09-10 `mc du`
                  # exiting 1 after a successful mirror failed three runs in a
                  # row and fired KubeJobFailed each time. Best-effort only.
                  echo "backup complete:"
                  rclone size backup:app-data-backups/vaultwarden || \
                    echo "  (size report unavailable - the copy above is what matters)"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vaultwarden-data
