---
# Backs up Vaultwarden's data VOLUME to MinIO.
#
# The vault itself - passwords, logins, notes, TOTP seeds - lives in
# PostgreSQL and is already covered by CNPG base backups and WAL archiving.
# This covers the part that is NOT in the database:
#
#   rsa_key.pem   signs every JWT. Losing it invalidates all sessions and
#                 logs every client out until they re-authenticate.
#   attachments/  real user data, gone for good if the volume is lost.
#   sends/        Bitwarden Send payloads.
#
# Without this a single lost PVC meant losing attachments outright, which is
# exactly the failure worth guarding against on a password manager.
#
# Versioning is enabled on the bucket, so an accidental delete or a corrupted
# sync can be rolled back rather than propagated.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-data-backup
  namespace: vaultwarden
spec:
  # Every 6 hours, matching the etcd snapshot cadence.
  schedule: "20 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: minio/mc:RELEASE.2025-04-16T18-13-26Z
              env:
                - name: MC_HOST_backup
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-backup-s3
                      key: mc-host
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "backing up /data -> app-data-backups/vaultwarden"
                  # --overwrite keeps the mirror current; --remove would let a
                  # local wipe erase the backup too, so it is deliberately off.
                  # Retry, because MinIO on the NAS intermittently REFUSES connections
                  # under load - not because it is down. Verified 2026-09-09:
                  # `mc ls backup/` succeeded and `mc mirror` failed seconds later with
                  #   dial tcp 192.168.1.67:9000: connect: connection refused
                  # while minio itself had 0 restarts, no errors and 355 MB RSS, on a NAS
                  # at load average 14 with 11 nfsd threads blocked on I/O. A healthy
                  # listener with a full accept queue refuses connections exactly like a
                  # dead one.
                  #
                  # Three runs failed back-to-back on this, so the password manager went
                  # 38 hours with no backup and nothing said so.
                  n=0
                  until mc mirror --overwrite /data "backup/app-data-backups/vaultwarden"; do
                    n=$((n+1))
                    [ "$n" -ge 5 ] && { echo "mc mirror failed $n times, giving up"; exit 1; }
                    echo "mc mirror failed (attempt $n); retrying in 60s"
                    sleep 60
                  done
                  echo "backup complete:"
                  mc du "backup/app-data-backups/vaultwarden"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vaultwarden-data
