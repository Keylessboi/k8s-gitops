---
# The four Notesnook application servers, one Deployment + Service each, mirroring
# upstream's docker-compose.yml. Every image is pinned by digest (upstream only
# publishes :latest). All run on the NAS node, next to their database.

---
# Accounts, login, 2FA and password reset (SMTP from Doppler).
apiVersion: v1
kind: Service
metadata:
  name: identity-server
  namespace: notesnook
spec:
  selector:
    app.kubernetes.io/name: identity-server
  ports:
    - name: http
      port: 8264
      targetPort: http
---
# identity-server's token-signing key (/app/keystore) and ASP.NET
# data-protection keys are generated on first start and were kept only in
# the container filesystem, so every restart minted a new signing key and
# invalidated every Notesnook session - found 2026-10-06 when a config
# rollout broke an in-progress 2FA login (doctor-log). Persisted here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-server-keys
  namespace: notesnook
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-server
  namespace: notesnook
spec:
  replicas: 0   # migration step 1: copying the keys to tank (migrate-keys.yaml)
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-server
  template:
    metadata:
      annotations:
        # notesnook-env is a plain ConfigMap read via envFrom, so editing it
        # does not restart anything. Bump this when a value identity-server
        # reads (DISABLE_SIGNUPS) changes, so the change actually applies.
        homelab/env-revision: "2026-10-06 signups closed"
      labels:
        app.kubernetes.io/name: identity-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # local-path volumes are created root-owned; the app runs as
        # dotnetuser (uid 1000). Not fsGroup: the kubelet does not apply it
        # to hostPath-backed local-path volumes.
        - name: keys-perms
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["sh", "-c", "mkdir -p /keys/keystore /keys/dataprotection && chown -R 1000:1000 /keys"]
          volumeMounts:
            - name: keys
              mountPath: /keys
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: identity-server
          image: streetwriters/identity:latest@sha256:e7f6cd9c23678722573617912412a968a66e7b6c8999f45834f15f66be66f6f1
          volumeMounts:
            - name: keys
              mountPath: /app/keystore
              subPath: keystore
            - name: keys
              mountPath: /app/.aspnet/DataProtection-Keys
              subPath: dataprotection
          envFrom:
            - configMapRef:
                name: notesnook-env
            - secretRef:
                name: notesnook
          env:
            - name: MONGODB_CONNECTION_STRING
              value: "mongodb://notesnook-db-0.notesnook-db.notesnook.svc.cluster.local:27017/identity?replicaSet=rs0"
            - name: MONGODB_DATABASE_NAME
              value: "identity"
          ports:
            - name: http
              containerPort: 8264
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: keys
          persistentVolumeClaim:
            claimName: identity-server-keys
---
# The sync API. S3_SERVICE_URL is the public attachments host, because presigned URLs it signs are used by clients directly; S3_INTERNAL_SERVICE_URL is how the server itself reaches MinIO.
apiVersion: v1
kind: Service
metadata:
  name: notesnook-server
  namespace: notesnook
spec:
  selector:
    app.kubernetes.io/name: notesnook-server
  ports:
    - name: http
      port: 5264
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesnook-server
  namespace: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notesnook-server
          image: streetwriters/notesnook-sync:latest@sha256:da8e45256dd2a1e2930f0ff347b637bc05b28136b3f2d2b050ffd9dc5e319db4
          envFrom:
            - configMapRef:
                name: notesnook-env
            - secretRef:
                name: notesnook
          env:
            - name: MONGODB_CONNECTION_STRING
              value: "mongodb://notesnook-db-0.notesnook-db.notesnook.svc.cluster.local:27017/?replicaSet=rs0"
            - name: MONGODB_DATABASE_NAME
              value: "notesnook"
            - name: S3_INTERNAL_SERVICE_URL
              value: "http://notesnook-garage:3900"
            - name: S3_INTERNAL_BUCKET_NAME
              value: "attachments"
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: notesnook, key: NOTESNOOK_GARAGE_ACCESS_KEY}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: notesnook, key: NOTESNOOK_GARAGE_SECRET_KEY}}
            - name: S3_SERVICE_URL
              value: "https://notesnook-files.sandstorm.chat"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_BUCKET_NAME
              value: "attachments"
          ports:
            - name: http
              containerPort: 5264
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
# Server-sent events: pushes 'something changed, sync now' to connected clients.
apiVersion: v1
kind: Service
metadata:
  name: sse-server
  namespace: notesnook
spec:
  selector:
    app.kubernetes.io/name: sse-server
  ports:
    - name: http
      port: 7264
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse-server
  namespace: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sse-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sse-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sse-server
          image: streetwriters/sse:latest@sha256:6e1b52f220107dead2b139503a86366cefb0003a76a975c7c032164b5434d5a4
          envFrom:
            - configMapRef:
                name: notesnook-env
            - secretRef:
                name: notesnook
          ports:
            - name: http
              containerPort: 7264
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
# Monographs: notes published to a public link.
apiVersion: v1
kind: Service
metadata:
  name: monograph-server
  namespace: notesnook
spec:
  selector:
    app.kubernetes.io/name: monograph-server
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monograph-server
  namespace: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monograph-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monograph-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monograph-server
          image: streetwriters/monograph:latest@sha256:1b7fcf885c8d3cb33ba74354ee32970430f7a6e992de96b61de2e8a310330a66
          envFrom:
            - configMapRef:
                name: notesnook-env
            - secretRef:
                name: notesnook
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: API_HOST
              value: "https://notesnook-api.sandstorm.chat"
            - name: PUBLIC_URL
              value: "https://notesnook-mono.sandstorm.chat"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
