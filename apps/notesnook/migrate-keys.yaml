---
# STEP 1 of moving identity-server-keys (token-signing key, data-protection
# keys) from the NAS NVMe (unencrypted ext4) to the encrypted `tank` pool.
# identity-server is scaled to 0 in servers.yaml while this copies. Step 2 (a
# later PR) points the Deployment at identity-server-keys-tank and removes this
# file. The old claim stays declared for rollback.
#
# Safe to re-run: the marker file stops a later sync from copying old keys over
# a volume identity-server has been using since.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-server-keys-tank
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  namespace: notesnook
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-server-keys-migrate
  namespace: notesnook
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        homelab/no-wait-init: "copies between two volumes; makes no network call"
      labels:
        app.kubernetes.io/name: identity-server
        app.kubernetes.io/component: data-migrate
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: copy
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -e /new/.migrated ]; then echo "already migrated"; exit 0; fi
              cp -a /old/. /new/
              diff -r /old /new
              touch /new/.migrated
              echo "copied and verified: $(find /new -type f | wc -l) files"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: old, mountPath: /old, readOnly: true}
            - {name: new, mountPath: /new}
      volumes:
        - name: old
          persistentVolumeClaim: {claimName: identity-server-keys}
        - name: new
          persistentVolumeClaim: {claimName: identity-server-keys-tank}
