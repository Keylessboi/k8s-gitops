---
# Five public hosts, one per server. Native apps talk to them directly, so no
# Authentik forward-auth (same as Vaultwarden); CrowdSec and rate limiting apply
# to all of them.
#
# Sign-ups are CLOSED (DISABLE_SIGNUPS "true" in config.yaml) since the owner's
# account was created on 2026-10-06, so the auth host needs no IP restriction:
# phones on mobile data log in and refresh tokens like any other client.
#
# History: it carried lan-only while sign-ups were open, but lan-only never
# matched anyone - clients resolve notesnook-auth.sandstorm.chat to the public
# IP and hairpin back in, so Traefik sees the public address and returned 403
# even at home. The account was created through a temporary allow-list of the
# owner's public IP (#82). To open sign-ups again, restrict this host first.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notesnook-api
  namespace: notesnook
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - notesnook-api.sandstorm.chat
      secretName: notesnook-api-tls
  rules:
    - host: notesnook-api.sandstorm.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notesnook-server
                port:
                  number: 5264
---
