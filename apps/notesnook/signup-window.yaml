---
# TEMPORARY (2026-10-06): lets the owner create the first Notesnook account.
#
# notesnook-auth was `lan-only`, but nobody's client ever arrives from the LAN:
# devices resolve notesnook-auth.sandstorm.chat to the public IP and hairpin
# back in, so Traefik (externalTrafficPolicy: Local) sees the public address
# 74.101.53.75 and lan-only answered 403 to everything - sign-up, login and
# token refresh alike.
#
# This allows the owner's public IP plus the LAN/tailnet/pod ranges while
# DISABLE_SIGNUPS is still false, so no one else can register. Once the
# account exists, the follow-up PR sets DISABLE_SIGNUPS=true and removes this
# middleware from notesnook-auth (crowdsec + rate-limit stay), so the apps
# can log in and refresh from anywhere. Delete this file in that PR.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: signup-window
  namespace: notesnook
spec:
  ipAllowList:
    sourceRange:
      - 74.101.53.75/32
      - 192.168.1.0/24
      - 100.64.0.0/10
      - 10.42.0.0/16
      - 10.43.0.0/16
