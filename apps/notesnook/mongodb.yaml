---
# MongoDB 7, single-node replica set - Notesnook requires a replica set (it uses
# change streams / transactions), exactly as upstream runs it.
#
# On the NAS node with local-path on its NVMe: a database belongs on local disk,
# never on the HDD pool (docs/adr/0009).
apiVersion: v1
kind: Service
metadata:
  name: notesnook-db
  namespace: notesnook
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: notesnook-db
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notesnook-db
  namespace: notesnook
spec:
  serviceName: notesnook-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: mongo:7.0.12@sha256:ae1cf99fa7bfb007db8416ad4f3980c46054d949fa55d28e6d301a813fee6c06
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - name: mongo
              containerPort: 27017
          # Upstream's healthcheck doubles as the replica-set initialiser: try
          # rs.status(), and if the set does not exist yet, rs.initiate() it. It is
          # idempotent, so it is safe as a probe. The member host is the pod's stable
          # headless-Service name, because clients connect with replicaSet=rs0 and
          # then dial whatever host the set advertises.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - >-
                  try { rs.status().ok } catch (e) {
                  rs.initiate({_id: "rs0", members: [{_id: 0,
                  host: "notesnook-db-0.notesnook-db.notesnook.svc.cluster.local:27017"}]}).ok }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
