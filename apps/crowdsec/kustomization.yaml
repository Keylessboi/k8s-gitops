---
# CrowdSec: behavioural detection and blocking at the edge.
#
# It reads Traefik's access logs, recognises attack patterns (credential
# stuffing, path scanning, exploit probing), and publishes decisions that the
# Traefik bouncer plugin enforces on the next request. It also pulls the
# community blocklist, so addresses already caught attacking other people are
# blocked here before they try anything.
#
# This replaces what Pangolin would have provided, but declaratively and in
# git, rather than as rules living in another application's database.
#
# NOTE: geo-blocking is deliberately NOT enabled - explicitly not wanted.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: crowdsec
  annotations:
    # Before the apps it protects, after Traefik exists.
    argocd.argoproj.io/sync-wave: "-4"

namespace: crowdsec

resources:
  - namespace.yaml
  - networkpolicy.yaml

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: crowdsec
    includeCRDs: true
    valuesInline:
      # The Local API: holds decisions and answers the bouncer.
      lapi:
        persistentVolume:
          data:
            enabled: true
            storageClassName: nfs-csi
            size: 2Gi
          config:
            enabled: true
            storageClassName: nfs-csi
            size: 1Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Pull the community blocklist: addresses seen attacking other
        # CrowdSec users get blocked here pre-emptively.
        env:
          - name: DISABLE_ONLINE_API
            value: "false"
          # Registers a bouncer named `traefik` under this key on startup.
          # The same value reaches Traefik through its own DopplerSecret, so
          # the two ends cannot drift apart.
          - name: BOUNCER_KEY_traefik
            valueFrom:
              secretKeyRef:
                name: crowdsec-bouncer-key
                key: bouncer-key
      # The agent parses Traefik's logs from the node.
      agent:
        acquisition:
          - namespace: kube-system
            podName: traefik-*
            program: traefik
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Collections define what patterns to look for.
        env:
          - name: COLLECTIONS
            value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors"
          # Remove the stock generic-bf hub scenario (it defines all three of
          # http-generic-bf / -401-bf / -403-bf at capacity 5, i.e. a ban after
          # only ~5 auth failures). A capacity-75 copy is shipped below under
          # config.scenarios. Owner's call: real brute force is not 5 attempts.
          - name: DISABLE_SCENARIOS
            value: "crowdsecurity/http-generic-bf"
      # Whitelist the owner's own public IP at parser stage, so their own
      # authentication retries - e.g. a Kindle hitting CWA OPDS with a wrong
      # password - can never fill the http-generic-403-bf bucket and ban the
      # IP across every service. A parser-stage whitelist means no alert or
      # decision is ever created for this source in the first place. If the
      # public IP changes (dynamic ISP), update it here.
      #
      # 2026-08-29: the immich bulk restore (immich-go, hours of sustained
      # ~25 MB/s upload plus retry bursts) tripped the http scenarios into
      # ban storms against this IP - thousands of 403s in bursts, hitting
      # even unauthenticated /api/server/ping, recovering when each ban
      # expired. Bulk photo restores are legitimate traffic. The bouncer
      # additionally trusts this IP at enforcement time (see
      # apps/traefik/crowdsec-middleware.yaml), which also covers
      # community-blocklist decisions and any decision created before this
      # whitelist - parser whitelists do neither.
      config:
        parsers:
          s02-enrich:
            owner-ip-whitelist.yaml: |
              name: custom/owner-ip-whitelist
              description: "Never ban the owner's own public IP"
              whitelist:
                reason: "owner public IP"
                ip:
                  # The household ISP flaps between two WAN addresses - both
                  # observed live in the Traefik access logs on 2026-08-29
                  # (74.x browsing, 144.x bulk uploads). Keep both.
                  - "74.101.53.75"
                  - "144.62.224.77"
        # Capacity-75 replacements for the three generic HTTP brute-force
        # scenarios (the hub versions, capacity 5, are removed via
        # DISABLE_SCENARIOS above). Same filters/names/remediation - only the
        # capacity is raised, so a source must produce ~75 auth failures within
        # the leak window before it is banned, instead of ~5. leakspeed 10s and
        # everything else are unchanged.
        scenarios:
          http-generic-bf-loose.yaml: |
            type: leaky
            name: crowdsecurity/http-generic-bf
            description: "Detect generic http brute force"
            filter: "evt.Meta.service == 'http' && evt.Meta.sub_type == 'auth_fail'"
            groupby: evt.Meta.source_ip
            capacity: 75
            leakspeed: "10s"
            blackhole: 1m
            labels:
              confidence: 3
              spoofable: 0
              classification:
                - attack.T1110
              behavior: "http:bruteforce"
              label: "HTTP Bruteforce"
              service: http
              remediation: true
            ---
            type: leaky
            name: LePresidente/http-generic-401-bf
            description: "Detect generic 401 Authorization error brute force"
            filter: "evt.Meta.log_type == 'http_access-log' && evt.Parsed.verb == 'POST' && evt.Meta.http_status == '401'"
            groupby: evt.Meta.source_ip
            capacity: 75
            leakspeed: "10s"
            blackhole: 1m
            labels:
              confidence: 3
              spoofable: 0
              classification:
                - attack.T1110
              behavior: "http:bruteforce"
              label: "HTTP Bruteforce"
              service: http
              remediation: true
            ---
            type: leaky
            name: LePresidente/http-generic-403-bf
            description: "Detect generic 403 Forbidden (Authorization) error brute force"
            filter: "evt.Meta.log_type == 'http_access-log' && evt.Parsed.verb == 'POST' && evt.Meta.http_status == '403'"
            groupby: evt.Meta.source_ip
            capacity: 75
            leakspeed: "10s"
            blackhole: 1m
            labels:
              confidence: 3
              spoofable: 0
              classification:
                - attack.T1110
              behavior: "http:bruteforce"
              label: "HTTP Bruteforce"
              service: http
              remediation: true
