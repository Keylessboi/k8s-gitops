---
# The bouncer API key, synced from Doppler.
#
# The same key has to exist on both ends: CrowdSec registers a bouncer under
# it, and Traefik presents it when asking for decisions. Both sides read this
# one Doppler value, so they can never drift apart - and it is never written
# to git.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: crowdsec-bouncer-key
  namespace: crowdsec
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: kubernetes
  config: prd
  secrets:
    - CROWDSEC_BOUNCER_KEY
  processors:
    CROWDSEC_BOUNCER_KEY:
      asName: bouncer-key
      type: plain
  managedSecret:
    name: crowdsec-bouncer-key
    namespace: crowdsec
    type: Opaque
  resyncSeconds: 300
