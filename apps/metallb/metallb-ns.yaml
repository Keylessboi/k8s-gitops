---
# The metallb 0.16.x chart renders its RBAC subjects referencing a
# namespace named after the release (`metallb`) instead of the release
# namespace (`metallb-system`) - the first 0.16.1 sync failed
# rbacReconcile with 'namespaces "metallb" not found' (see
# docs/doctor-log.md). This empty namespace satisfies that reconcile;
# the workloads themselves stay in metallb-system.
apiVersion: v1
kind: Namespace
metadata:
  name: metallb
