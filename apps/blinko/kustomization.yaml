---
# Blinko - notes. Migrated off a docker-compose stack on the NAS whose database
# container had been deleted; see the header of deployment.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: blinko
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: blinko
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: blinko

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: notes
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
