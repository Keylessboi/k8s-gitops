---
# blinko.sandstorm.chat - the hostname it already had on the NAS, so existing
# links and any mobile client keep working.
#
# Behind authentik-forward-auth. Blinko has its own local accounts and no OIDC,
# so - exactly like Navidrome and Invidious - the middleware is the real gate
# and its own login is the second factor rather than the only one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blinko
  namespace: blinko
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd,kube-system-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - blinko.sandstorm.chat
      secretName: blinko-tls
  rules:
    - host: blinko.sandstorm.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blinko
                port:
                  number: 80
