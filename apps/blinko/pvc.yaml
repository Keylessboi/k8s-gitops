---
# Attachments and uploads only - the notes themselves are in Postgres.
#
# This is the shape ADR-0008 asks for: the POD is disposable, and everything
# that survives it is either in the shared CNPG cluster or on NAS-backed NFS.
# Nothing lives on the node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blinko-data
  namespace: blinko
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 10Gi
