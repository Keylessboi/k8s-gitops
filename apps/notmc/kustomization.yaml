# notmc: the browser client for the Pumpkin games server, at notmc.sandstorm.chat.
# nginx serves the client files; WebSocket upgrades go on to notmc-bridge, which
# binds the player's name to their Authentik account and forwards to Pumpkin.
# Design and state: docs/notmc-browser-client.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: notmc
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: notmc
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: notmc

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: games
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps

resources:
  - namespace.yaml
  - client.yaml
  - bridge.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - authentik-outpost.yaml

components:
  - ../../components/protect-state
