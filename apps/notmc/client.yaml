# The client files, served by nginx from a volume that is filled by hand.
#
# The files are Minecraft-derived (built from the owner's own copy of the game by
# Incari's `./incari build --only rust`), so they are NOT in git, not in an
# image and not on any public host: they sit on this PVC and are served only
# behind Authentik. To load or replace them, copy the build's dist/web into the
# PVC's directory on the nas node (see docs/notmc-browser-client.md).
#
# One Ingress path serves the page; a WebSocket upgrade on the same host is
# handed to the bridge by nginx, so the Authentik login cookie covers both.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notmc-client
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 6Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notmc-nginx
data:
  default.conf: |
    map $http_upgrade $is_websocket {
      default 0;
      ~*^websocket$ 1;
    }
    server {
      listen 8080;
      server_tokens off;
      root /srv/client;
      index index.html;

      # Horizon's threads need a cross-origin isolated page.
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;

      gzip on;
      gzip_types application/wasm application/javascript text/css application/json text/plain;
      gzip_min_length 1024;

      error_page 418 = @bridge;

      location / {
        if ($is_websocket) { return 418; }
        try_files $uri $uri/ =404;
      }

      location @bridge {
        proxy_pass http://notmc-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notmc-client
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notmc-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notmc-client
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # The volume is local-path on the nas node.
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: nginx
          # nginxinc/nginx-unprivileged:stable-alpine
          image: docker.io/nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: client, mountPath: /srv/client, readOnly: true}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: client
          persistentVolumeClaim:
            claimName: notmc-client
        - name: nginx-conf
          configMap:
            name: notmc-nginx
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: notmc-client
spec:
  selector:
    app.kubernetes.io/name: notmc-client
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
