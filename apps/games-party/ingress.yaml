apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-party
  namespace: games-party
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - party.sandstorm.chat
    secretName: games-party-tls
  rules:
  - host: party.sandstorm.chat
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: games-party
            port:
              number: 5000
