apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-party
  namespace: games-party
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: games-party
  template:
    metadata:
      labels:
        app.kubernetes.io/name: games-party
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
        homelab/node-class: compute
      containers:
        - name: games-party
          image: ghcr.io/codyburker/clonenames@sha256:b68f71e25066b46961d03509df51891cc4591a83818845869f0de5375068cc9d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
              name: http
          env:
            - {name: HOME, value: /tmp}
            - {name: UV_CACHE_DIR, value: /tmp/uv}
            - {name: UV_PROJECT_ENVIRONMENT, value: /app/.venv}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
