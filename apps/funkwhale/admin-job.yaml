---
# First admin account. Funkwhale has no first-run web wizard - the docker
# install docs create the superuser from the CLI ("funkwhale-manage fw users
# create --superuser"), so without this Job the owner would have no way in
# through the UI at all.
#
# Runs as an ArgoCD PostSync hook so it fires AFTER the Deployment is healthy,
# i.e. after the migrate init container has created the schema. Idempotent:
# the create is retried on transient DB errors and an "already exists"
# collision is treated as success, so selfHeal re-runs are harmless. The
# password is read from Doppler via secretKeyRef - never inlined.
#
# The email is the owner's, matching the pelican admin-job convention, so a
# future Authentik OIDC link-by-email lands on this account rather than
# creating a second, unprivileged one.
apiVersion: batch/v1
kind: Job
metadata:
  name: funkwhale-admin
  namespace: funkwhale
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: funkwhale
        app.kubernetes.io/component: admin-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-admin
          image: funkwhale/api:2.0.10@sha256:cedb8f691302952ff41eb84e30087333aa62d9e5a276cb8afa34f5b40af9f2d9
          # Override the image entrypoint's default dispatch; this pod only
          # needs the one management command against the already-migrated DB.
          command:
            - /bin/sh
            - -c
            - |
              set -u
              # Wait for the CNPG primary to accept TCP before touching
              # Django. On a cold cluster rebuild CNPG can still be electing
              # a primary when this hook fires, and its -rw Service briefly
              # has no endpoints - which surfaces as "connection refused",
              # not a timeout (observed on the pelican first deploy).
              i=0
              until nc -z -w5 app-databases-rw.databases.svc.cluster.local 5432; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "database never became reachable"
                  exit 1
                fi
                echo "waiting for database... ($i)"
                sleep 3
              done
              # Non-interactive create (all flags supplied, no prompts), with
              # the same retry/already-exists handling as the pelican
              # admin-job. `fw users create` is the click CLI group wrapped
              # as a management command - the exact form the docker install
              # docs use. Migrations are guaranteed applied already: this is
              # a PostSync hook and the Deployment's init container runs them
              # before the api goes Ready.
              n=0
              while [ "$n" -lt 6 ]; do
                OUT=$(funkwhale-manage fw users create \
                  --username="$ADMIN_USERNAME" \
                  --password="$ADMIN_PASSWORD" \
                  --email="$ADMIN_EMAIL" \
                  --superuser 2>&1) && RC=0 || RC=$?
                echo "$OUT"
                if [ "$RC" -eq 0 ]; then
                  echo "admin created."
                  exit 0
                fi
                if echo "$OUT" | grep -qiE "already exists|already taken|unique|duplicate"; then
                  echo "admin already exists - treating as success."
                  exit 0
                fi
                if echo "$OUT" | grep -qiE "connection refused|could not connect|SQLSTATE\[08"; then
                  n=$((n + 1))
                  echo "database not ready, retry $n"
                  sleep 5
                  continue
                fi
                exit "$RC"
              done
              echo "gave up after transient DB errors"
              exit 1
          env:
            - name: ADMIN_USERNAME
              value: travis
            - name: ADMIN_EMAIL
              value: travis.fiorito@tuta.com
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: admin-password
            # Django needs its identity + DB access, same values as the
            # Deployment.
            - name: FUNKWHALE_HOSTNAME
              value: funkwhale.sandstorm.chat
            - name: FUNKWHALE_PROTOCOL
              value: https
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: secret-key
            - name: FUNKWHALE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-user
            - name: FUNKWHALE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-password
            - name: DATABASE_URL
              value: postgresql://$(FUNKWHALE_DB_USER):$(FUNKWHALE_DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/funkwhale
            - name: MEDIA_ROOT
              value: /srv/funkwhale/data/media
            - name: STATIC_ROOT
              value: /srv/funkwhale/data/static
