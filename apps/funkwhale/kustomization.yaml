---
# Funkwhale - federated music server, in the gluetun split-networking shape
# from issue #2: federation egress airtight behind AirVPN, owner access
# VPN-free over the Traefik edge.
#
# One pod (gluetun + api + celery worker + celery beat + front nginx), one
# Service (front :80), Postgres on the shared CNPG cluster, redis on the
# shared redis-master (logical DBs 2/3), media on a dynamic nfs-csi claim.
# See deployment.yaml for the full layout rationale.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: funkwhale
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: funkwhale
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd

namespace: funkwhale

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: media
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - ingress.yaml
  - admin-job.yaml
