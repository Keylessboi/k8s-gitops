---
# Funkwhale - federated music server (ActivityPub).
#
# No longer privileged: the gluetun sidecar has been removed and replaced
# with the shared VPN gateway (apps/vpn). The pod no longer needs NET_ADMIN
# or /dev/net/tun. Baseline PodSecurity is sufficient for the remaining
# containers (api/worker/beat/front), which all pin hardened securityContexts.
apiVersion: v1
kind: Namespace
metadata:
  name: funkwhale
  labels:
    app.kubernetes.io/name: funkwhale
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
