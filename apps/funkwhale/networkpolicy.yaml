---
# Killswitch NetworkPolicy for the migrated funkwhale pod.
#
# With the gluetun sidecar removed, the pod has its own network interface
# and COULD reach the internet directly. This policy is the killswitch:
# egress is locked to cluster-internal services and the VPN gateway's
# HTTP proxy port ONLY. Direct internet egress (0.0.0.0/0) is DENIED.
#
# If the VPN gateway goes down, funkwhale can still reach DB, redis, and
# DNS but cannot federate - which is the correct failure mode (no traffic
# without the tunnel, rather than traffic without the tunnel).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: funkwhale
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik, for the web UI, streaming and inbound federation deliveries
    # (remote instances POST activities to our public inbox URL, which lands
    # at the same edge route as the owner's browser).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 80
          protocol: TCP
  egress:
    # k3s apiserver, reachable only by ipBlock.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    # k3s DNATs 10.43.0.1:443 to the node's own address before NetworkPolicy
    # egress is evaluated, so the Service rule above matches nothing for a new
    # connection and the API call fails. This is the defect that broke CNPG's
    # base backups and, here, kept the Doppler operator from ever winning leader
    # election - i.e. from ever syncing a secret.
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - port: 6443
          protocol: TCP
    # DNS. CoreDNS resolves funkwhale.sandstorm.chat and cluster hostnames.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL: the funkwhale database on the shared CNPG cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - port: 5432
          protocol: TCP
    # Redis: the shared redis-master, logical DBs 2 (cache) and 3 (broker).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis
      ports:
        - port: 6379
          protocol: TCP
    # The shared VPN gateway's HTTP proxy. All outbound federation
    # (ActivityPub GET/POST) goes through here via HTTP_PROXY/HTTPS_PROXY
    # env vars on the api, worker and beat containers. This is the only
    # path to the public internet - the killswitch.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vpn
      ports:
        - port: 8888
          protocol: TCP
