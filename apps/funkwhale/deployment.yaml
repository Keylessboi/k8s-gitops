---
# Funkwhale, routed through the shared VPN gateway (apps/vpn).
#
# Federation egress goes through the AirVPN tunnel via the gateway's HTTP
# proxy (HTTP_PROXY/HTTPS_PROXY env vars on api/worker/beat). Owner access
# (web UI, streaming) rides the normal Traefik edge, VPN-free. Inbound
# federation deliveries arrive through the same edge.
#
# The killswitch is enforced by the funkwhale NetworkPolicy: egress to the
# vpn-gateway proxy port is allowed; direct internet egress is DENIED.
# If the VPN gateway goes down, funkwhale cannot reach the internet at all -
# only cluster-internal services (DB, redis, DNS).
#
# FOUR containers remain (down from five): api, celery worker, celery beat,
# and front nginx. The gluetun sidecar is gone - its job is now the shared
# gateway. The data PVC is a shared NFS tree the migrate init container
# and the api both write.
#
# The container layout mirrors the upstream compose file exactly (verified
# against dev.funkwhale.audio/funkwhale/funkwhale deploy/docker-compose.yml at
# 2.0.10): one funkwhale/api image running three processes (gunicorn, celery
# worker, celery beat) and a separate funkwhale/front nginx image. The old
# mono-container funkwhale/funkwhale image was deprecated in 1.3.0 and Docker
# Hub's funkwhale/funkwhale stopped at 1.2.10 - the multi-container
# funkwhale/api + funkwhale/front images are the supported path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkwhale
  namespace: funkwhale
spec:
  # Was paused at the owner's request, and because the ~1.5G image pull rode
  # the node's eviction threshold (issue #11). Un-paused after the fix: the
  # CT disk grew 63G -> 83G (thin pool +12G, offline resize) and
  # k3s-image-prune guards the floor.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: gluetun holds a single WireGuard session,
    # the data PVC is a shared NFS tree the migrate init container and the api
    # both write, and two pods briefly overlapping would double-connect the
    # tunnel and race collectstatic. Same reasoning as jellyfin/qbittorrent.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: funkwhale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: funkwhale
    spec:
      # Pod-level, so it covers the init container and all five containers.
      # This node's kubelet has seccompDefault=false, so nothing applies a
      # profile unless a manifest asks. RuntimeDefault was MEASURED safe for
      # gluetun on this exact image in apps/downloads/qbittorrent.yaml (tunnel
      # setup is ioctl(TUNSETIFF)+netlink, both allowed; the denied set is
      # mount/unshare/bpf/keyctl, none of which any container here uses).
      # seccomp is orthogonal to the NET_ADMIN capability below.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Django migrations + collectstatic. The upstream docker docs run both
        # by hand between compose commands ("docker compose run --rm api
        # funkwhale-manage migrate"); in GitOps there is no by-hand, so the
        # init container is where they live. Both are idempotent - Django
        # tracks applied migrations and collectstatic skips unchanged files -
        # so every pod start re-running them is safe and is what makes image
        # upgrades a plain rollout.
        #
        # This runs BEFORE gluetun raises the tunnel, and that is fine: it
        # talks only to Postgres and the local disk. The namespace
        # NetworkPolicy is the second layer here - during this window egress
        # is limited to DNS, Postgres and redis anyway, so nothing can leak
        # even in principle.
        - name: migrate
          image: funkwhale/api:2.0.10@sha256:cedb8f691302952ff41eb84e30087333aa62d9e5a276cb8afa34f5b40af9f2d9
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # The initial library path structure. Funkwhale creates
              # subdirectories on demand, but the in-place import root
              # (MUSIC_DIRECTORY_PATH) and the media/static roots are cheap to
              # create up front and make the first-boot UI less confusing.
              mkdir -p /srv/funkwhale/data/media \
                       /srv/funkwhale/data/static \
                       /srv/funkwhale/data/music
              /entrypoint.sh migrate
              /entrypoint.sh collectstatic
          env:
            - name: FUNKWHALE_HOSTNAME
              value: funkwhale.sandstorm.chat
            - name: FUNKWHALE_PROTOCOL
              value: https
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: secret-key
            # Dependent env expansion: $(VAR) resolves against vars defined
            # EARLIER in this list, which is why the credential vars come
            # first. Keeps the password out of git and out of the rendered
            # manifest - only the Secret holds it.
            - name: FUNKWHALE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-user
            - name: FUNKWHALE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-password
            - name: DATABASE_URL
              value: postgresql://$(FUNKWHALE_DB_USER):$(FUNKWHALE_DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/funkwhale
            - name: MEDIA_ROOT
              value: /srv/funkwhale/data/media
            - name: STATIC_ROOT
              value: /srv/funkwhale/data/static
          volumeMounts:
            - name: data
              mountPath: /srv/funkwhale/data
      containers:
        # --- The Django API. Federation actor, REST API, streaming auth. ---
        - name: api
          # Pinned to tag AND index digest, like every image in this repo.
          # 2.0.10 is current stable (docs.funkwhale.audio, 2026-08).
          image: funkwhale/api:2.0.10@sha256:cedb8f691302952ff41eb84e30087333aa62d9e5a276cb8afa34f5b40af9f2d9
          # Kubernetes 'command' REPLACES the image ENTRYPOINT - it is not a
          # CMD handed to it (Docker mental-model trap). The first deploy set
          # command: ["gunicorn"], which ran gunicorn BARE with no WSGI
          # module: 'Error: No application module specified.' in a crash
          # loop. Invoke the image's own entrypoint explicitly instead:
          # /entrypoint.sh dispatches on $1 and its gunicorn case execs
          # gunicorn config.asgi:application --worker-class
          # uvicorn.workers.UvicornWorker --bind 0.0.0.0:${FUNKWHALE_API_PORT}
          # (verified by cat-ing /entrypoint.sh out of the live worker
          # container, which runs the same image digest).
          command: ["/entrypoint.sh", "gunicorn"]
          # The image has no USER directive and runs as root; funkwhale's own
          # compose does the same. Nothing here needs capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # The federation identity. FUNKWHALE_HOSTNAME is what goes into
            # actor URLs, webfinger and nodeinfo - it MUST be the public
            # domain or every remote instance would address us wrong.
            - name: FUNKWHALE_HOSTNAME
              value: funkwhale.sandstorm.chat
            - name: FUNKWHALE_PROTOCOL
              value: https
            # The entrypoint binds to this; the .env sample default is 5000,
            # set explicitly because an empty value makes gunicorn's --bind
            # argument malformed and the container dies at startup.
            - name: FUNKWHALE_API_PORT
              value: "5000"
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            # Behind Traefik, which terminates TLS and sets X-Forwarded-*.
            - name: REVERSE_PROXY_TYPE
              value: nginx
            - name: LOGLEVEL
              value: info
            - name: TZ
              value: UTC
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: secret-key
            # Dependent env expansion: $(VAR) resolves against vars defined
            # EARLIER in this list, which is why the credential vars come
            # first. Keeps the passwords out of git and out of the rendered
            # manifest - only the Secret holds them.
            - name: FUNKWHALE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-user
            - name: FUNKWHALE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: redis-password
            - name: DATABASE_URL
              value: postgresql://$(FUNKWHALE_DB_USER):$(FUNKWHALE_DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/funkwhale
            # The ONE shared redis-master (the deployment comment there
            # already anticipated "and later Funkwhale"). Funkwhale selects
            # the redis logical DB inside the URL, which is the documented
            # CACHE_URL/CELERY_BROKER_URL form (redis://host:port/db), so no
            # dedicated redis is needed. db2 = cache, db3 = celery broker:
            # db0 is the other tenants' (immich/authentik/nextcloud/pelican
            # queue), db1 is pelican's cache/sessions, and 2/3 were verified
            # empty (redis-cli info keyspace showed only db0 populated).
            - name: CACHE_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/2
            # Defaults to CACHE_URL if unset; set explicitly so the broker
            # gets its own logical DB and a cache flush can never eat queued
            # federation tasks.
            - name: CELERY_BROKER_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/3
            - name: MEDIA_ROOT
              value: /srv/funkwhale/data/media
            - name: STATIC_ROOT
              value: /srv/funkwhale/data/static
            # In-place imports: files dropped into this directory (over NFS,
            # from the owner's workstation) can be imported by reference
            # instead of uploaded. Same tree the front serves /_protected/music
            # from, which is why MUSIC_DIRECTORY_SERVE_PATH matches.
            - name: MUSIC_DIRECTORY_PATH
              value: /srv/funkwhale/data/music
            - name: MUSIC_DIRECTORY_SERVE_PATH
              value: /srv/funkwhale/data/music
            # Route outbound HTTP(S) through the shared VPN gateway's HTTP
            # proxy. Django/requests honours these env vars natively - every
            # federation fetch (ActivityPub GET/POST) exits through the
            # AirVPN tunnel. NO_PROXY keeps cluster-internal traffic (DB,
            # redis, DNS) direct - those go through the pod network, not
            # the proxy.
            - name: HTTP_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: HTTPS_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,app-databases-rw.databases.svc.cluster.local,redis-master.redis.svc.cluster.local"
          ports:
            - name: api
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            # Public, unauthenticated, and hits the database - so it is green
            # exactly when the api can actually serve. Deliberately generous:
            # an over-aggressive probe would mark the pod NotReady and empty
            # the Service's endpoints, which has cut apps off in this cluster
            # before.
            httpGet:
              path: /api/v1/instance/settings/
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/instance/settings/
              port: api
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /srv/funkwhale/data
        # --- Celery worker. Federation delivery, imports, transcoding. ---
        - name: worker
          image: funkwhale/api:2.0.10@sha256:cedb8f691302952ff41eb84e30087333aa62d9e5a276cb8afa34f5b40af9f2d9
          # command replaces the image ENTRYPOINT (k8s semantics - see the
          # api container), which is fine here: celery needs no entrypoint
          # dispatch, so this is the compose file's worker command verbatim.
          # Concurrency is
          # pinned to 1 rather than the compose default (0 = one process per
          # CPU): every worker process is a full python fork holding the
          # funkwhale app, and this node is memory-tight with documented
          # overcommit. One process handles this instance's federation and
          # import load fine; raise it if imports lag.
          command:
            - celery
            - --app=funkwhale_api.taskapp
            - worker
            - --loglevel=INFO
            - --concurrency=1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Celery refuses to start as root without this ("running as root is
          # not permitted"), and the image has no non-root user. The compose
          # file sets the same variable for the same reason.
          env:
            - name: C_FORCE_ROOT
              value: "true"
            - name: FUNKWHALE_HOSTNAME
              value: funkwhale.sandstorm.chat
            - name: FUNKWHALE_PROTOCOL
              value: https
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: LOGLEVEL
              value: info
            - name: TZ
              value: UTC
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: secret-key
            - name: FUNKWHALE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-user
            - name: FUNKWHALE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: redis-password
            - name: DATABASE_URL
              value: postgresql://$(FUNKWHALE_DB_USER):$(FUNKWHALE_DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/funkwhale
            - name: CACHE_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/2
            - name: CELERY_BROKER_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/3
            - name: MEDIA_ROOT
              value: /srv/funkwhale/data/media
            - name: STATIC_ROOT
              value: /srv/funkwhale/data/static
            - name: MUSIC_DIRECTORY_PATH
              value: /srv/funkwhale/data/music
            - name: MUSIC_DIRECTORY_SERVE_PATH
              value: /srv/funkwhale/data/music
            - name: HTTP_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: HTTPS_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,app-databases-rw.databases.svc.cluster.local,redis-master.redis.svc.cluster.local"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          # No probes, on purpose - the seedboxapi lesson from the downloads
          # pod: all containers' readiness is ANDed into pod readiness and the
          # funkwhale Service selects this pod, so a probe that flapped here
          # would empty the Service and cut off the web UI even though the api
          # was fine. A crashed worker is restarted by the kubelet; that is
          # the whole failure surface it needs.
          volumeMounts:
            - name: data
              mountPath: /srv/funkwhale/data
        # --- Celery beat. The periodic-task scheduler. ---
        - name: beat
          image: funkwhale/api:2.0.10@sha256:cedb8f691302952ff41eb84e30087333aa62d9e5a276cb8afa34f5b40af9f2d9
          # Compose file's beat command verbatim (the entrypoint execs it).
          # Beat only enqueues scheduled tasks into the broker - it never
          # touches the internet, so it rides in the tunnelled pod for
          # simplicity, not out of necessity.
          command:
            - celery
            - --app=funkwhale_api.taskapp
            - beat
            - --loglevel=INFO
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FUNKWHALE_HOSTNAME
              value: funkwhale.sandstorm.chat
            - name: FUNKWHALE_PROTOCOL
              value: https
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: LOGLEVEL
              value: info
            - name: TZ
              value: UTC
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: secret-key
            - name: FUNKWHALE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-user
            - name: FUNKWHALE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funkwhale-app
                  key: redis-password
            - name: DATABASE_URL
              value: postgresql://$(FUNKWHALE_DB_USER):$(FUNKWHALE_DB_PASSWORD)@app-databases-rw.databases.svc.cluster.local:5432/funkwhale
            - name: CACHE_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/2
            - name: CELERY_BROKER_URL
              value: redis://:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/3
            - name: MEDIA_ROOT
              value: /srv/funkwhale/data/media
            - name: STATIC_ROOT
              value: /srv/funkwhale/data/static
            - name: HTTP_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: HTTPS_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,app-databases-rw.databases.svc.cluster.local,redis-master.redis.svc.cluster.local"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # No probes, same reasoning as the worker: beat has no HTTP surface,
          # and a flapping probe here would empty the Service for nothing.
        # --- The front. nginx serving the SPA, proxying to the api. ---
        - name: front
          image: funkwhale/front:2.0.10@sha256:c537961245d849fac942beb4c14aa14e7d30f6f2c7270eb2712efbebeaac96d7
          # The image's nginx config is an envsubst template
          # (/etc/nginx/templates/default.conf.template) rendered at startup
          # from these variables - every ${VAR} in the template must be
          # defined here or it lands in the config as literal text and nginx
          # refuses to start. FUNKWHALE_API_HOST=localhost because the front
          # proxies to the api over the shared pod netns; the api port is
          # therefore unreachable from outside this pod, matching the compose
          # reference where only front's :80 is ever published.
          env:
            - name: FUNKWHALE_API_HOST
              value: localhost
            - name: FUNKWHALE_API_PORT
              value: "5000"
            - name: FUNKWHALE_HOSTNAME
              value: funkwhale.sandstorm.chat
            - name: FUNKWHALE_PROTOCOL
              value: https
            - name: MEDIA_ROOT
              value: /srv/funkwhale/data/media
            - name: MUSIC_DIRECTORY_PATH
              value: /srv/funkwhale/data/music
            # Upload size cap at the first proxy that receives the body. The
            # compose default is 100M; raise here AND in the api if large
            # uploads ever get cut off.
            - name: NGINX_MAX_BODY_SIZE
              value: 100M
          # The image runs nginx's default root-master/nginx-workers layout
          # (it binds :80, which needs NET_BIND_SERVICE, so no capability
          # drop here - the image is built around this).
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            # The SPA index - served from first boot, no auth, no api call.
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # Read-only: the front only serves media aliases
            # (/media/__sized__/, /media/attachments/, ...) and the
            # /_protected/music X-Accel-Redirect tree from disk.
            - name: data
              mountPath: /srv/funkwhale/data
              readOnly: true
            # Django's collectstatic output, at the path the compose file
            # mounts it (/usr/share/nginx/html/staticfiles) so /staticfiles/*
            # URLs resolve against the nginx docroot.
            - name: data
              mountPath: /usr/share/nginx/html/staticfiles
              subPath: static
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: funkwhale-data
---
# The ONLY published port, exactly like the compose reference: front's :80.
# The api's :5000 stays inside the pod - the front proxies /api, /federation,
# /.well-known/ and /rest/ to it over localhost.
apiVersion: v1
kind: Service
metadata:
  name: funkwhale
  namespace: funkwhale
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: funkwhale
  ports:
    - name: http
      port: 80
      targetPort: http
