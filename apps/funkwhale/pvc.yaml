---
# Funkwhale's own state on the NAS: uploaded media (the library the owner
# populates through the UI), collectstatic output, and the in-place import
# directory. One dynamic nfs-csi claim with the three paths as subdirectories
# of a single mount - the compose reference does exactly this with one
# /srv/funkwhale/data tree, and one mount keeps the api, worker and front
# containers' views byte-identical.
#
# Dynamic provisioning (not a static PV like the shared media library) is
# correct here: this tree is private to Funkwhale, so a per-claim private
# subdirectory is exactly what is wanted. The existing Navidrome library is a
# separate concern and is deliberately NOT mounted - the owner uploads through
# the UI; wiring an in-place import of the old library is a later decision.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: funkwhale-data
  namespace: funkwhale
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 50Gi
