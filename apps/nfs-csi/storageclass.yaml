---
# Every app uses this class for shared NAS storage.
# The archive parameter moves deleted claims to a backup folder.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi
  labels:
    app.kubernetes.io/name: nfs-csi
    app.kubernetes.io/part-of: homelab
provisioner: nfs.csi.k8s.io
parameters:
  # Set to your NAS IP.
  server: 192.168.1.67
  # Set to the export path on the NAS.
  share: /extra/nfs-csi
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  onDelete: archive
reclaimPolicy: Retain
volumeBindingMode: Immediate
# nconnect=8 (2026-11-21): every NFS mount on a node shares ONE TCP connection to the NAS, so a bulk
# client (2,000 torrents on qBittorrent, library scans) queued every other pod's tiny requests behind
# it: ~136 ms average queue wait per request, 3-9 s to create one file. NOTE the kernel honours
# nconnect only for the FIRST mount to a server on a node; later mounts join that connection set.
# So a change here needs every NFS mount on the node gone (a node restart) before it takes effect,
# and mountOptions on a StorageClass is immutable: delete the object, Argo recreates it.
mountOptions:
  - nfsvers=4.1
  - nconnect=8
  - hard
