---
# NFS CSI driver. Volumes mount from the NAS. Runs on every node, Pi included.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: nfs-csi
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: nfs-csi
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: nfs-csi

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: nfs-csi
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: storage
      app.kubernetes.io/managed-by: argocd
      homelab/tier: infrastructure
    includeSelectors: false

resources:
  - namespace.yaml
  - storageclass.yaml
  - networkpolicy.yaml

helmCharts:
  - name: csi-driver-nfs
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    version: 4.13.4
    releaseName: nfs-csi
    namespace: nfs-csi
    valuesInline:
      controller:
        # Controller does the provisioning. Keep it off the Pi.
        nodeSelector:
          homelab/node-class: compute
        # The csi-snapshotter sidecar is deployed by default and has NEVER
        # worked here: the VolumeSnapshot CRDs are not installed, so
        # `kubectl get volumesnapshot` reports the resource type does not
        # exist. The sidecar therefore logs
        #   failed to list *v1.VolumeSnapshotContent: the server could not
        #   find the requested resource
        # in a loop, forever, and is one of the three containers contributing
        # to this pod's 135 restarts.
        #
        # Nothing here uses volume snapshots and nothing is planned to: point
        # -in-time recovery comes from CNPG WAL archiving, file history from
        # sanoid on the NAS, and off-site from restic and borgmatic. Installing
        # the CRDs plus a snapshot-controller to satisfy a sidecar nobody uses
        # would add moving parts to a cluster that ADR-0007 froze.
        enableSnapshotter: false
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
          requests:
            cpu: 10m
            memory: 50Mi
      node:
        # Node plugin is a DaemonSet. It mounts on Pis as well.
        tolerations:
          - operator: Exists
        resources:
          limits:
            cpu: 150m
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 50Mi
