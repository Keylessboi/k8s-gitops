---
# NFS CSI driver. Volumes mount from the NAS. Runs on every node, Pi included.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: nfs-csi
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/name: nfs-csi
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: nfs-csi

commonLabels:
  app.kubernetes.io/name: nfs-csi
  app.kubernetes.io/part-of: homelab
  app.kubernetes.io/component: storage
  app.kubernetes.io/managed-by: argocd
  homelab/tier: infrastructure

resources:
  - namespace.yaml
  - storageclass.yaml

helmCharts:
  - name: csi-driver-nfs
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    version: v4.9.0
    releaseName: nfs-csi
    namespace: nfs-csi
    valuesInline:
      controller:
        # Controller does the provisioning. Keep it off the Pi.
        nodeSelector:
          homelab/node-class: compute
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
          requests:
            cpu: 10m
            memory: 50Mi
      node:
        # Node plugin is a DaemonSet. It mounts on Pis as well.
        tolerations:
          - operator: Exists
        resources:
          limits:
            cpu: 150m
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 50Mi
