apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: nfs-csi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  egress:
  # k3s apiserver. Reachable ONLY via ipBlock: a namespaceSelector for the
  # "default" namespace matches PODS in it, never the 10.43.0.1 service IP, so
  # the old rule was a no-op. Every NetworkPolicy in this repo was missing real
  # API access, which hard-broke the API clients (nfs-csi provisioner, doppler
  # operator, cnpg operator, prometheus) and cascaded to every PVC and secret.
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - ipBlock:
        cidr: 192.168.1.67/32
    ports: [{protocol: TCP, port: 2049}]
