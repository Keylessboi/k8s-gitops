apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-hub
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [mc.sandstorm.chat, games.sandstorm.chat]
    secretName: games-hub-tls
  rules:
  - host: mc.sandstorm.chat
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 8080}}}}
  - host: games.sandstorm.chat
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 8080}}}}
