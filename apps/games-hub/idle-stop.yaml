apiVersion: v1
kind: ServiceAccount
metadata:
  name: game-stopper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: game-stopper
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["minecraft"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: game-stopper
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: game-stopper}
subjects:
  - {kind: ServiceAccount, name: game-stopper}
---
# Nightly stop so a forgotten game does not hold 1.5 GiB of a tight cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: game-nightly-stop
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: game-stopper
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: wait-for-dns
              image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              command: ["/bin/sh", "-c", "for i in $(seq 1 30); do nc -z kubernetes.default.svc.cluster.local 443 && exit 0; sleep 2; done; exit 1"]
          containers:
            - name: kubectl
              image: rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              command: ["kubectl", "-n", "games-hub", "scale", "deploy/minecraft", "--replicas=0"]
