apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
spec:
  # spec.replicas is deliberately NOT set. ArgoCD applies with server-side
  # apply, so a field absent from git is not owned by ArgoCD and selfHeal never
  # reverts a manual scale (the same arrangement an HPA relies on). The server
  # is meant to be OFF unless someone is playing:
  #   wake: kubectl -n games-hub scale deploy/minecraft --replicas=1   (~2 min)
  #   stop: --replicas=0, or the nightly idle-stop CronJob does it.
  # A fresh Deployment starts at 1 replica; scale it to 0 after the first sync.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: games-hub
      app.kubernetes.io/instance: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: games-hub
        app.kubernetes.io/instance: minecraft
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Runs on the NAS node: k3s-server sits at ~81% memory with limits
      # already well over-committed, and this pod can use ~2.3Gi while a game
      # is on. The NAS has ~17Gi allocatable at ~19% use. It carries a
      # storage=true:NoSchedule taint, hence the toleration (same as Lidarr).
      # The local-path PVC binds on first use, so it lands on the NAS too.
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      initContainers:
        - name: wait-for-dns
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                nslookup github.com >/dev/null 2>&1 && exit 0
                sleep 2
              done
              exit 1
        # EaglerXServer v1.1.1 from the maintainer's GitHub release, pinned by sha256,
        # plus the lobby and minigame plugins (all 1.8.8-capable, all sha256 pinned;
        # versions, licences and why these ones: docs/games-minigames.md).
        - name: fetch-plugin
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              curl -fsSL --retry 5 --retry-delay 5 -o /plugins/EaglerXServer.jar \
                https://github.com/lax1dude/eaglerxserver/releases/download/v1.1.1/EaglerXServer.jar
              echo "468cb07eb7ca466b21b439be75156d3d01579327f4c6dae5b67d471137a64208  /plugins/EaglerXServer.jar" | sha256sum -c -
              # Lobby: DeluxeHub 3.5.2 (GPL-3.0). Menu, join items, world protection.
              curl -fsSL --retry 5 --retry-delay 5 -o /plugins/DeluxeHub.jar \
                https://github.com/ItsLewizzz/DeluxeHub/releases/download/release/DeluxeHub-3.5.2.jar
              echo "db7d125b577ec12e8d96885cec12d3f5b9536b48bec3d1d1da0c1d335a95dcaa  /plugins/DeluxeHub.jar" | sha256sum -c -
              # TNT Run: TNTRun_reloaded 6.8.9, the legacy 1.8-1.12.2 line (GPL-3.0). Needs WorldEdit.
              curl -fsSL --retry 5 --retry-delay 5 -o /plugins/TNTRun_reloaded.jar \
                https://github.com/steve4744/TNTRun/releases/download/v6.8.9/TNTRun_reloaded-6.8.9.jar
              echo "b854e9c6b704a3bf0a65c76f4a1211d7d948bc174b4e86ae2179e8674e7c0654  /plugins/TNTRun_reloaded.jar" | sha256sum -c -
              curl -fsSL --retry 5 --retry-delay 5 -o /plugins/WorldEdit.jar \
                https://dev.bukkit.org/projects/worldedit/files/2597538/download
              echo "5a7b88f6f75b4a0b6efd47ae03e9c26a2036ecd122b03a45ca635dde386d6186  /plugins/WorldEdit.jar" | sha256sum -c -
              # Mob Arena: MobArena 0.106, the build published as MobArena-1.8.jar (GPL-3.0).
              curl -fsSL --retry 5 --retry-delay 5 -o /plugins/MobArena.jar \
                https://github.com/garbagemule/MobArena/releases/download/0.106/MobArena-1.8.jar
              echo "ed2788f45326e4ce78dcdd2d64a14694da075103ca0f81ce0d737fd7fcde486a  /plugins/MobArena.jar" | sha256sum -c -
          volumeMounts:
            - {name: plugins, mountPath: /plugins}
        # Moves the world spawn to 0,64,0 (once; level.dat is backed up as
        # level.dat.pre-games). The lobby and arenas are built with /fill from the
        # console, and the console can only touch chunks that are loaded, which in
        # 1.8.8 means roughly 190 blocks around the world spawn. Without this the
        # build depends on wherever the world's random spawn happened to land.
        - name: pin-world-spawn
          image: itzg/minecraft-server:java17@sha256:a08cd9ced3e1c3f46a318af1fa393de21698afbf8746681f115dc923ba847ba5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          command: ["python3", "/scripts/patch-spawn.py"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: games-scripts, mountPath: /scripts, readOnly: true}
        # Copies the plugin configs from the ConfigMap over /data/plugins on every
        # start (overwrite, so git stays the source of truth). itzg's own /config
        # sync cannot do this: a ConfigMap mount makes /config/plugins a symlink,
        # and copying that onto the real, non-empty /data/plugins fails with
        # DirectoryNotEmptyException. cp -L follows the symlinks.
        - name: copy-plugin-configs
          image: itzg/minecraft-server:java17@sha256:a08cd9ced3e1c3f46a318af1fa393de21698afbf8746681f115dc923ba847ba5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          command: ["sh", "-c", "mkdir -p /data/plugins && cp -rL /config/plugins/. /data/plugins/"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: games-config, mountPath: /config, readOnly: true}
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java17@sha256:a08cd9ced3e1c3f46a318af1fa393de21698afbf8746681f115dc923ba847ba5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - {name: EULA, value: "TRUE"}
            - {name: TYPE, value: PAPER}
            - {name: VERSION, value: "1.8.8"}
            # Eaglercraft clients cannot do Mojang auth.
            - {name: ONLINE_MODE, value: "FALSE"}
            # Paper 1.8.8's bundled Netty epoll transport cannot read direct
            # buffers on Java 17 ("Unable to access address of buffer", thrown in
            # a loop on every connection, add-opens flags do not help). Native
            # transport off makes it fall back to plain NIO, which works.
            - {name: USE_NATIVE_TRANSPORT, value: "FALSE"}
            - {name: MEMORY, value: 1536M}
            - {name: VIEW_DISTANCE, value: "6"}
            - {name: MOTD, value: "sandstorm Eaglercraft"}
            - {name: MAX_PLAYERS, value: "6"}
            # Plugin configs are copied into /data/plugins by the copy-plugin-configs
            # init container; /config is deliberately not mounted here, so itzg's
            # own /config sync does not run.
            # Builds the lobby (y 229-236) and the two arenas high in the sky above the
            # spawn, so the existing terrain is untouched. /fill is idempotent. The
            # startup list can lose a race with RCON coming up, so the same list also
            # runs when the first player connects; DeluxeHub's join message is off so
            # the "joined the game" line that triggers that hook stays in the log.
            - name: RCON_CMDS_STARTUP
              value: &buildcmds |-
                fill -11 229 -11 11 236 11 glass 0 hollow
                fill -10 229 -10 10 229 10 quartz_block
                fill -9 229 0 9 229 0 sea_lantern
                fill 0 229 -9 0 229 9 sea_lantern
                fill 40 199 -10 60 199 10 tnt
                fill 40 200 -10 60 200 10 sand
                fill 40 191 -10 60 191 10 tnt
                fill 40 192 -10 60 192 10 sand
                fill -61 200 -11 -39 216 11 stonebrick 0 hollow
                fill -60 215 -5 -40 215 -5 sea_lantern
                fill -60 215 0 -40 215 0 sea_lantern
                fill -60 215 5 -40 215 5 sea_lantern
                fill -61 200 19 -39 208 31 stonebrick 0 hollow
                fill -60 207 25 -40 207 25 sea_lantern
            - name: RCON_CMDS_FIRST_CONNECT
              value: *buildcmds
          ports:
            # EaglerXServer on the Bukkit platform injects into the Java port:
            # the websocket and the Java protocol both listen on 25565. (It also
            # needs Java 17; the java8 image fails with UnsupportedClassVersion.)
            - {containerPort: 25565, name: java}
          readinessProbe:
            tcpSocket: {port: java}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 15
          livenessProbe:
            tcpSocket: {port: java}
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests: {cpu: 200m, memory: 1280Mi}
            limits: {cpu: "2", memory: 2304Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: plugins, mountPath: /plugins, readOnly: true}
      volumes:
        # One ConfigMap, two views: the plugin configs (key -> path under /config)
        # and the spawn-pinning script for the init container.
        - name: games-config
          configMap:
            name: games-config
            items:
              - {key: deluxehub-config.yml, path: plugins/DeluxeHub/config.yml}
              - {key: deluxehub-commands.yml, path: plugins/DeluxeHub/commands.yml}
              - {key: deluxehub-menu-serverselector.yml, path: plugins/DeluxeHub/menus/serverselector.yml}
              - {key: deluxehub-data.yml, path: plugins/DeluxeHub/data.yml}
              - {key: mobarena-config.yml, path: plugins/MobArena/config.yml}
              - {key: tntrun-arena1.yml, path: plugins/TNTRun_reloaded/arenas/Arena1.yml}
        - name: games-scripts
          configMap:
            name: games-config
            items:
              - {key: patch-spawn.py, path: patch-spawn.py}
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: plugins
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
spec:
  selector:
    app.kubernetes.io/name: games-hub
    app.kubernetes.io/instance: minecraft
  ports:
    # nginx talks to 8081; the pod listens on 25565 (see above).
    - {name: eagler, port: 8081, targetPort: java, protocol: TCP}
