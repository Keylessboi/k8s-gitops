# Games hub: self-hosted Eaglercraft (browser Minecraft 1.8.8) plus a landing page.
# Public to friends, no identity provider. See security/registers/publication.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: games-hub
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: games-hub
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: games-hub

labels:
  - pairs:
      app.kubernetes.io/name: games-hub
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: games
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: true

resources:
  - namespace.yaml
  - web-config.yaml
  - web.yaml
  - minecraft.yaml
  - networkpolicy.yaml
  - ingress.yaml

components:
  - ../../components/protect-state
