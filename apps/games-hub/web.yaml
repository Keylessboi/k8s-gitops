apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: games-hub
      app.kubernetes.io/instance: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: games-hub
        app.kubernetes.io/instance: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
        homelab/node-class: compute
      initContainers:
        - name: wait-for-dns
          image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                nslookup cdn.eaglercraft.net >/dev/null 2>&1 && exit 0
                sleep 2
              done
              exit 1
        # Official EaglercraftX 1.8.8 offline-download build from eaglercraft.com's
        # download page (cdn.eaglercraft.net), pinned by sha256.
        - name: fetch-client
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cd /srv/client
              curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ec.zip \
                https://cdn.eaglercraft.net/objects/dl/1.8.8/eaglercraft1-8-62da5f39.zip
              echo "c769f8331f83c89febdf3e3cc2eabbab6a4bbb00da4eefd0e3a59746a4882779  /tmp/ec.zip" | sha256sum -c -
              unzip -o /tmp/ec.zip -d /tmp/ec
              mv /tmp/ec/eaglercraft1-8.html /srv/client/index.html
          volumeMounts:
            - {name: client, mountPath: /srv/client}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: client, mountPath: /srv/client, readOnly: true}
            - {name: cfg, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: cfg, mountPath: /etc/nginx/conf.d/proxy.conf, subPath: proxy.conf}
            - {name: cfg, mountPath: /srv/landing/index.html, subPath: index.html}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: client
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cfg
          configMap:
            name: web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: games-hub
    app.kubernetes.io/instance: web
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
