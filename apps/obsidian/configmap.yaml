---
# CouchDB livesync.ini configuration for the Obsidian LiveSync server.
# CORS origins, size limits, and Basic auth challenge header.
# This ConfigMap is mounted into /opt/couchdb/etc/local.d/livesync.ini.
apiVersion: v1
kind: ConfigMap
metadata:
  name: livesync-config
  namespace: obsidian
  labels:
    app.kubernetes.io/name: obsidian
    app.kubernetes.io/part-of: homelab
data:
  livesync.ini: |
    [couchdb]
    max_document_size = 50000000
    # Without this CouchDB 3.x never creates _users, _replicator and
    # _global_changes, and a node missing _users cannot authenticate a
    # non-admin. This server ran with only the vault database present.
    single_node = true

    [chttpd]
    bind_address = 0.0.0.0
    port = 5984
    require_valid_user = true
    max_http_request_size = 4294967296
    # The [cors] block below is inert without this. default.ini moved
    # enable_cors from [httpd] to [chttpd] in 3.x, and [httpd] here only
    # governs the legacy 127.0.0.1:5986 interface - not the 5984 port
    # Obsidian actually talks to. Missing this, every request from the
    # app://obsidian.md origin is refused by the browser/webview.
    enable_cors = true

    [chttpd_auth]
    require_valid_user = true

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"

    [cors]
    credentials = true
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    # CouchDB's default method list stops at GET/HEAD/POST; LiveSync
    # replication also issues PUT and DELETE, and its preflight sends
    # authorization and content-type.
    headers = accept, authorization, content-type, origin, referer
    methods = GET, PUT, POST, HEAD, DELETE

    [log]
    level = warning
