---
# Obsidian LiveSync: CouchDB-backed sync server for Obsidian vaults.
# Clients (desktop + mobile) connect over HTTPS via the Traefik edge.
# CouchDB is the canonical backend; the Obsidian plugin speaks CouchDB's
# replication protocol. No forward-auth: LiveSync clients cannot perform
# browser SSO flows (see ingress.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: obsidian
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: obsidian
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: obsidian

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: obsidian
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: sync
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - ingress.yaml
