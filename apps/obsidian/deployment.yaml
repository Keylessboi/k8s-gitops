---
# Obsidian LiveSync server: CouchDB configured for the Obsidian plugin's
# replication protocol. Single pod, stateful-on-PVC (Recreate strategy).
#
# Architecture:
#   1. couchdb-init (one-shot, runs as root): waits for CouchDB to be
#      healthy, then configures single-node cluster, auth, CORS, size
#      limits, and creates the vault database. Exits 0 on success.
#   2. couchdb (main, uid 5984): CouchDB itself with livesync.ini mounted
#      into /opt/couchdb/etc/local.d/ for CORS and size defaults. A
#      postStart hook applies require_valid_user after first boot so
#      unauthenticated requests get 401 (the expected proof-of-life).
#
# The couchdb-init container uses shareProcessNamespace to reach CouchDB
# on localhost:5984 while the main container starts in parallel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian
  namespace: obsidian
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: CouchDB keeps all vault data
  # on the PVC, and two pods writing one data directory concurrently is
  # corruption, not a migration.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsidian
        app.kubernetes.io/part-of: homelab
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        # --- CouchDB: the sync server ---
        - name: couchdb
          # Pinned: CouchDB 3.4.3 (current stable 3.4.x release, verified
          # against Docker Hub). 3.5.x exists but 3.4 is the tested line
          # for the Obsidian LiveSync plugin. Digest pinned for immutability.
          #
          # sha256:76f91b552e3d1e193950bfd64f30c709d6d2fa5b89f612670be06641fcc63068
          image: couchdb:3.4.3@sha256:76f91b552e3d1e193950bfd64f30c709d6d2fa5b89f612670be06641fcc63068
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb
                  key: username
                  optional: true
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 5984
          # /_up returns {"status":"ok"} without authentication. Verified
          # from inside the pod with curl before these timings were committed.
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            # livesync.ini sets CORS origins for Obsidian (app://obsidian.md,
            # capacitor://localhost, http://localhost), increases max document
            # size to 50MB and max request to 4GB, and sets the Basic auth
            # challenge header. Mounted into local.d/ (NOT local.ini) per the
            # upstream docker-compose convention.
            - name: livesync-config
              mountPath: /opt/couchdb/etc/local.d/livesync.ini
              subPath: livesync.ini
          # postStart applies require_valid_user after CouchDB starts. The
          # hook runs in parallel with the main process, so it waits for
          # CouchDB to be ready before applying config. Without this,
          # unauthenticated requests would succeed (the opposite of the
          # expected 401 proof-of-life).
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      curl -sf http://localhost:5984/_up >/dev/null 2>&1 && break
                      sleep 2
                    done
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/chttpd/require_valid_user \
                      -H "Content-Type: application/json" -d '"true"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/chttpd_auth/require_valid_user \
                      -H "Content-Type: application/json" -d '"true"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/httpd/enable_cors \
                      -H "Content-Type: application/json" -d '"true"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/chttpd/enable_cors \
                      -H "Content-Type: application/json" -d '"true"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/cors/credentials \
                      -H "Content-Type: application/json" -d '"true"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/cors/origins \
                      -H "Content-Type: application/json" \
                      -d '"app://obsidian.md,capacitor://localhost,http://localhost"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/chttpd/max_http_request_size \
                      -H "Content-Type: application/json" -d '"4294967296"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    curl -sf -X PUT http://localhost:5984/_node/_local/_config/couchdb/max_document_size \
                      -H "Content-Type: application/json" -d '"50000000"' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" || true
                    # Create the vault database if it does not exist.
                    curl -sf -o /dev/null -w '' \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" \
                      http://localhost:5984/obsidiannotes 2>/dev/null || \
                    curl -sf -X PUT \
                      -u "${COUCHDB_USER}:${COUCHDB_PASSWORD}" \
                      http://localhost:5984/obsidiannotes || true
                    echo "LiveSync init complete"
          volumeMounts:
            - name: livesync-config
              mountPath: /opt/couchdb/etc/local.d/livesync.ini
              subPath: livesync.ini
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-data
        - name: livesync-config
          configMap:
            name: livesync-config
