---
# Obsidian LiveSync server: CouchDB configured for the Obsidian plugin's
# replication protocol. Single pod, stateful-on-PVC (Recreate strategy).
#
# Architecture: CouchDB 3.4.3 with livesync.ini mounted into
# /opt/couchdb/etc/local.d/ for CORS, require_valid_user, and size limits.
# Admin credentials come from Doppler via secretKeyRef (optional: true per
# repo convention). TCP probes because require_valid_user blocks HTTP probes
# without auth headers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian
  namespace: obsidian
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: CouchDB keeps all vault data
  # on the PVC, and two pods writing one data directory concurrently is
  # corruption, not a migration.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsidian
        app.kubernetes.io/part-of: homelab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        # --- CouchDB: the sync server ---
        - name: couchdb
          # Pinned: CouchDB 3.4.3 (current stable 3.4.x release, verified
          # against Docker Hub). 3.5.x exists but 3.4 is the tested line
          # for the Obsidian LiveSync plugin. Digest pinned for immutability.
          #
          # sha256:76f91b552e3d1e193950bfd64f30c709d6d2fa5b89f612670be06641fcc63068
          image: couchdb:3.4.3@sha256:76f91b552e3d1e193950bfd64f30c709d6d2fa5b89f612670be06641fcc63068
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb
                  key: username
                  optional: true
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 5984
          # /_up requires auth when require_valid_user is set in livesync.ini.
          # Use a TCP socket check instead: if CouchDB is listening, it is ready.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            # livesync.ini sets CORS origins for Obsidian (app://obsidian.md,
            # capacitor://localhost, http://localhost), increases max document
            # size to 50MB and max request to 4GB, and sets the Basic auth
            # challenge header. Mounted into local.d/ (NOT local.ini) per the
            # upstream docker-compose convention.
            - name: livesync-config
              mountPath: /opt/couchdb/etc/local.d/livesync.ini
              subPath: livesync.ini
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-data
        - name: livesync-config
          configMap:
            name: livesync-config
