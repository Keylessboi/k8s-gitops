---
# Obsidian LiveSync CouchDB endpoint at obsidian.sandstorm.chat.
#
# NO AUTHENTIK FORWARD-AUTH - a deliberate decision, matching how the owner
# runs it. Obsidian LiveSync clients (desktop and mobile) speak CouchDB's
# replication protocol directly. They cannot perform a browser SSO flow:
# pointing them at an Authentik redirect would break every sync client.
# The server's own CouchDB credentials (COUCHDB_USER / COUCHDB_PASSWORD
# from Doppler) are the auth. CrowdSec and the rate limiter still apply
# to every request.
#
# SO: THE BASIC-AUTH PROMPT IN A BROWSER IS CORRECT, NOT A MISCONFIGURATION.
# This host is a sync endpoint, not an app. Obsidian has no web version -
# it ships desktop and mobile only - so there is no note-taking UI to put
# here and nothing missing.
#
# There IS a web UI, though it is CouchDB's rather than Obsidian's:
# https://obsidian.sandstorm.chat/_utils/ is Fauxton, the database admin
# console. Same credentials. Verified 200.
#
# Plugin settings (Settings -> Self-hosted LiveSync -> Remote Database):
#   URI       https://obsidian.sandstorm.chat
#   Username  obsidian
#   Password  Doppler COUCHDB_PASSWORD
#   Database  obsidiannotes
#
# Server-side tuning LiveSync requires is already applied and was verified
# against the live config on 2026-09-04:
#   chttpd/require_valid_user      true
#   chttpd/enable_cors             true
#   chttpd/max_http_request_size   4294967296
#   chttpd_auth/require_valid_user true
#   cors/credentials               true
#   cors/origins   app://obsidian.md,capacitor://localhost,http://localhost
# (`httpd/enable_cors` reads as unset and should: it is the CouchDB 2.x
# spelling, superseded by the chttpd one above in 3.x.)
#
# As of 2026-09-04 `obsidiannotes` holds ZERO documents - the server is
# configured and waiting, but no client has ever completed a sync.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsidian
  namespace: obsidian
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - obsidian.sandstorm.chat
      secretName: obsidian-tls
  rules:
    - host: obsidian.sandstorm.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: obsidian
                port:
                  number: 5984
