# octo-sonic: Octo's audio-analysis sidecar.
#
# It reads every song in the library once and keeps two things: how the song
# SOUNDS (a bliss feature vector, for "Sounds alike" radio and nearest-song
# search) and its TRANSITION PROFILE (for the Octo apps' blends). Octo calls it
# over HTTP (/health, /analyse) and stores the results in its own
# sonic-features.json and transition-profiles.json under /app/config. The
# sidecar itself keeps no state.
#
# Octo finds it at http://octo-sonic:8080 (RadioSources__SonicUrl defaults to
# that), which is exactly this Service's name in the downloads namespace, so
# octo.yaml needs no change. Until this existed, the Octo admin panel reported
# octo-sonic as not set up and Sounds alike radio did nothing.
#
# VERSION: pinned to the same release as the Octo image in octo.yaml
# (2026.10.28). Octo checks the feature version the sidecar writes and treats
# an octo-sonic from a different generation as unusable ("off"), so bump the
# two together, never one alone.
#
# READ-ONLY on the music: the library mount is readOnly, the root filesystem
# is read-only (only /tmp is writable), and the pod runs as 1000:1000 like
# every other reader of this volume. Each file is decoded by a child process,
# so a damaged file costs only itself. The first pass over a large library is
# slow by design (ANALYSE_CONCURRENCY=1, one CPU) and runs in the background;
# Octo works without it and waits for it on its own.
#
# WHY IT RUNS ON THE NAS WITH A LOCAL VOLUME, NOT THE media-data NFS PVC:
# its /health does read_dir(/music) and Octo gives up on a health answer after
# 5 s. Listing the music root (1303 entries) took 3-5 s every time over the
# nfs-csi mount, so the sidecar looked down to Octo about as often as up;
# Lidarr lists the same directory in 4 ms through a node-local PV. So it
# mounts the same directory the way Lidarr and Navidrome do (a `local` PV on
# /extra/nfs-csi/data, below) and is pinned to the nas node. Analysis also
# reads the whole library, which is far cheaper without the network hop.
#
# fsGroup is deliberately NOT set, for the same reason as octo.yaml: the media
# volume is the whole library over NFS and fsGroup makes the kubelet walk it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octo-sonic
  namespace: downloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: octo-sonic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octo-sonic
    spec:
      automountServiceAccountToken: false
      # A local PV only exists on the nas, which is tainted for storage work.
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sonic
          image: ghcr.io/winters27/octo-sonic:2026.10.28@sha256:2ef5cf3c3f091e90fe4c43420be8c4de582328fb0368f823322218e064ece2d3
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MUSIC_ROOT
              value: /music
            # One file at a time: bliss uses about six threads a song, and the
            # node is already overcommitted on CPU.
            - name: ANALYSE_CONCURRENCY
              value: "1"
            # false would keep transition profiles but stop working out how
            # songs sound (Sounds alike radio).
            - name: SONIC_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          # TCP, not HTTP: /health answers 503 while the sidecar is warming
          # up or off, and a probe that kills a working pod for that is worse
          # than none (see the octo probes).
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          # A long file is decoded whole in memory, so the limit is the real
          # setting here (upstream's compose uses 2g). The request is what the
          # scheduler reserves; usage is low between files.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /music
              subPath: media/music
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-data-nas
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: octo-sonic
  namespace: downloads
spec:
  selector:
    app.kubernetes.io/name: octo-sonic
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# The music library as a node-local volume on the nas: the same directory the
# nfs-csi PV serves (/extra/nfs-csi/data), so paths inside the pod are
# unchanged. Same pattern as apps/lidarr/nas-volumes.yaml and
# apps/navidrome/nas-volumes.yaml; k3s-agent on the nas is ordered after
# zfs-mount, so the dataset is there before a pod can start.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-downloads-nas
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /extra/nfs-csi/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [nas]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-nas
  namespace: downloads
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: media-data-downloads-nas
  resources:
    requests:
      storage: 500Gi
