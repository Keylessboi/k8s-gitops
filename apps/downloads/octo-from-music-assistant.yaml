# Other end of homeassistant/app-isolation's egress rule: Music Assistant reads
# Octo's Subsonic API (container port 8080, Service port 5274). Octo's admin UI
# shares that port, so Octo's own login is what protects it; only this one
# namespace is admitted, and only to the Octo pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octo-from-music-assistant
  namespace: downloads
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: octo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homeassistant
          podSelector:
            matchLabels:
              app.kubernetes.io/name: music-assistant
      ports:
        - {port: 8080, protocol: TCP}
