---
# Download stack: qBittorrent tunnelled through gluetun, managed by qui.
#
# qBittorrent shares a pod (and therefore a network namespace) with gluetun,
# so it has no route to the internet except the VPN tunnel. If the tunnel
# drops, gluetun's firewall drops the traffic rather than falling back to the
# LAN. qui sits outside that pod because it is a management UI, not a peer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: downloads
  annotations:
    argocd.argoproj.io/sync-wave: "20"

namespace: downloads

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: downloads
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - vpn-proxy-service.yaml
  - media-data-pv.yaml
  - pvc.yaml
  - qbit-upload-config.yaml
  - networkpolicy.yaml
  - qbittorrent.yaml
  - qui.yaml
  - slskd-service.yaml
  # Octo lives here rather than with Navidrome so its outbound calls inherit
  # this namespace's killswitch - see the header of octo.yaml.
  - octo.yaml
  # Published so Subsonic clients can reach it; /rest is carved out of
  # forward-auth the same way Navidrome's is.
  - octo-ingress.yaml
  # The yt-dlp shim Octo's YouTube source needs; locally built image.
  - octo-yt-dlp-shim.yaml
  # Hearting a track adds the whole artist to Lidarr. Octo has no artist-level
  # setting of any kind, so this derives the behaviour from Navidrome's starred
  # list and Lidarr's library - see the header of the file.
  - octo-artist-on-heart.yaml
  - ingress.yaml
  - authentik-outpost.yaml
