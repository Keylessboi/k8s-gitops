---
# qui: autobrr's qBittorrent web UI, replacing the stock one.
#
# It runs OUTSIDE gluetun's pod on purpose. It is a management interface, not
# a peer: it only talks to qBittorrent's WebUI over the cluster network, so
# routing it through the VPN would add nothing and would make it unreachable
# whenever the tunnel is down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qui
  namespace: downloads
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qui
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Without this the pod runs seccomp Unconfined: this node's kubelet has
        # seccompDefault=false, so nothing applies a profile unless a manifest
        # asks. RuntimeDefault blocks the syscalls the container runtime
        # considers dangerous (mount, unshare, kexec, bpf, keyctl, ...). qui is
        # an ordinary Go web service and touches none of them.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:v1.26.0
          env:
            - name: QUI__HOST
              value: 0.0.0.0
            - name: QUI__PORT
              value: "7476"
            - name: QUI__DATA_DIR
              value: /config
            - name: QUI__BASE_URL
              value: /
            - name: TZ
              value: UTC
            # Native OIDC on top of the forward-auth middleware. Without it
            # qui only has its own local account and the edge login tells it
            # nothing about who arrived.
            - name: QUI__OIDC_ENABLED
              value: "true"
            - name: QUI__OIDC_ISSUER
              value: https://authentik.sandstorm.chat/application/o/qui-oidc/
            - name: QUI__OIDC_REDIRECT_URL
              value: https://qui.sandstorm.chat/api/auth/oidc/callback
            - name: QUI__OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: qui-oidc, key: client-id}
            - name: QUI__OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: qui-oidc, key: client-secret}
          ports:
            - name: http
              containerPort: 7476
          # Verified 200. /api/healthz is a 404 on this build.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qui-config
---
apiVersion: v1
kind: Service
metadata:
  name: qui
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qui
  ports:
    - name: http
      port: 7476
      targetPort: http
