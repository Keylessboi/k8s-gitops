---
# qui: autobrr's qBittorrent web UI, replacing the stock one.
#
# It runs OUTSIDE gluetun's pod on purpose. It is a management interface, not
# a peer: it only talks to qBittorrent's WebUI over the cluster network, so
# routing it through the VPN would add nothing and would make it unreachable
# whenever the tunnel is down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qui
  namespace: downloads
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qui
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:v1.26.0
          env:
            - name: QUI__HOST
              value: 0.0.0.0
            - name: QUI__PORT
              value: "7476"
            - name: QUI__DATA_DIR
              value: /config
            - name: QUI__BASE_URL
              value: /
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 7476
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qui-config
---
apiVersion: v1
kind: Service
metadata:
  name: qui
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qui
  ports:
    - name: http
      port: 7476
      targetPort: http
