---
# qBittorrent's own state: settings, resume data, torrent files.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: downloads
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---

# qui keeps a small local database of the qBittorrent instances it manages.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qui-config
  namespace: downloads
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
# slskd's own state (its database, config and share cache).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
# The MAM dynamic-seedbox cookie jar. One file, a few hundred bytes - but it
# has to survive pod rolls, which is the whole reason this is a PVC and not an
# emptyDir.
#
# MAM returns a refreshed session cookie on its responses, and wrapper.sh
# saves it here with `curl -c`. The jar - not MAM_ID - is the authoritative
# credential after the first successful call: wrapper.sh only falls back to
# the MAM_ID seed when this file has no mam_id line in it.
#
# Sources disagree on how often MAM rotates the value (per-request vs
# periodically), so this does not depend on knowing: treating the jar as
# authoritative is correct either way, and an emptyDir would throw it away on
# every pod roll and force a re-seed from a MAM_ID that may since have been
# superseded.
#
# 100Mi is nominal: nfs-csi provisions a directory and does not enforce the
# request, and the real content is a single Netscape cookie file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seedboxapi-config
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 100Mi
