---
# qBittorrent's own state: settings, resume data, torrent files.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: downloads
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
# Where torrents actually land.
#
# The plan puts torrents on the `extra` pool: "Torrents (2.4T measured) |
# extra | None | Re-downloadable; excluded from borg". The JuiceFS bucket
# lives on tank, so this is sized conservatively rather than provisioning
# multiple terabytes of object storage for data that is by definition
# disposable. Point it at a dedicated extra-pool export if it needs to grow.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads
  namespace: downloads
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 200Gi
---
# qui keeps a small local database of the qBittorrent instances it manages.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qui-config
  namespace: downloads
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
# slskd's own state (its database, config and share cache).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
# The MAM dynamic-seedbox cookie jar. One file, a few hundred bytes - but it
# has to survive pod rolls, which is the whole reason this is a PVC and not an
# emptyDir.
#
# MyAnonaMouse rotates mam_id on EVERY request and invalidates the previous
# value. The MAM_ID in Doppler is therefore a one-shot seed: seedboxapi spends
# it on its first call, saves the rotated cookie to /config/MAM.cookies, and
# authenticates from that jar forever after. On an emptyDir the jar would be
# lost on every restart and the container would re-present the already-spent
# seed, which MAM rejects - the pod would need a hand-generated new MAM_ID
# after every roll. Persisting the jar is what makes this survivable.
#
# 100Mi is nominal: nfs-csi provisions a directory and does not enforce the
# request, and the real content is a single Netscape cookie file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seedboxapi-config
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 100Mi
