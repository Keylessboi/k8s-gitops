---
# qBittorrent, with ALL of its traffic forced through gluetun.
#
# gluetun and qBittorrent share one pod, so they share a network namespace.
# qBittorrent has no network interface of its own beyond gluetun's tunnel: if
# the VPN drops, gluetun's firewall drops the traffic rather than leaking to
# the LAN. That containment is the entire point of putting them in one pod
# rather than running qBittorrent standalone.
#
# Credentials are now present, so this runs. If they are ever cleared, gluetun
# fails to build a tunnel and the whole pod stays down - which is the correct
# failure mode: no tunnel means no traffic, rather than traffic in the clear.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      # Pod-level, so it covers the init container and all three containers.
      # Without it the pod runs seccomp Unconfined: this node's kubelet has
      # seccompDefault=false, so nothing applies a profile unless a manifest
      # asks.
      #
      # This is the pod where RuntimeDefault most plausibly breaks something -
      # gluetun holds NET_ADMIN and a passed-in /dev/net/tun - so it was
      # measured rather than assumed. Two throwaway pods ran the same probe on
      # the qmcgaw/gluetun:v3.41.3 image, one Unconfined and one
      # RuntimeDefault, and produced byte-identical results: `ip tuntap add`,
      # link up, address, route, `iptables -L`, a nat MASQUERADE rule and
      # `ip6tables -L` all succeeded under both. Nothing gluetun does needs a
      # denied syscall: the denied set is namespace and kernel-management calls
      # (mount, unshare, setns, pivot_root, kexec, bpf, keyctl), while tunnel
      # setup is ioctl(TUNSETIFF) plus netlink, both allowed.
      #
      # seccomp is orthogonal to capabilities: NET_ADMIN on the gluetun
      # container below is unaffected by this.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # slskd's API key cannot be set by environment variable. Its documented
        # mapping (SLSKD_WEB_AUTHENTICATION_API_KEYS_<NAME>_KEY) is silently
        # ignored for this nested path, so every Lidarr request came back 401.
        # Rendering the key into slskd.yml at startup is the only reliable way -
        # and doing it here keeps the secret in a Kubernetes Secret rather than
        # committed to git.
        - name: slskd-config-render
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cat > /app/slskd.yml <<EOF
              web:
                port: 5030
                authentication:
                  api_keys:
                    lidarr:
                      key: "$SLSKD_API_KEY"
                      role: readwrite
                      cidr: 10.42.0.0/16,10.43.0.0/16,127.0.0.1/32
              shares:
                directories:
                  - /data/media/music
                # Lidarr imports into the library continuously and the share
                # cache is in-memory, so new music stays unshared until a
                # rescan. A full-library scan takes ~2h, so the rescan
                # interval is weekly - anything shorter would have slskd
                # scanning nearly continuously. A pod restart rescans
                # immediately, and a scan can be forced from the web UI or
                # API when the library has grown a lot.
                cache:
                  retention: 10080
              # Owner's connection timeouts from their pre-k8s slskd.yml.
              # inactivity: 150000 is 10x the default 15000 - keeps slow peers
              # and dnet parent connections from being dropped early.
              # connect: 10000 equals the default, kept explicit for parity.
              # connection.timeout.transfer from the old setup has no
              # equivalent in slskd 0.23.2 (the only 'transfer' under
              # soulseek.connection is a buffer size, not a timeout), so it is
              # intentionally not carried over. The owner's startup flags
              # (no_logo/no_start/no_config_watch/no_connect/no_share_scan/
              # force_share_scan) are all explicitly false, which equals this
              # version's defaults - no env overrides needed.
              soulseek:
                connection:
                  timeout:
                    connect: 10000
                    inactivity: 150000
              EOF
              chown 1000:1000 /app/slskd.yml
              chmod 600 /app/slskd.yml
              # slskd runs as uid 1000 (container securityContext below), so it
              # must own its config PVC to write app.db and logs, and the
              # Soulseek download tree so Lidarr - also uid 1000 - can import
              # what it fetches. Before this, slskd ran as root and left 0644
              # root-owned files that uid 1000 could neither hardlink
              # (fs.protected_hardlinks=1) nor move, so every Soulseek grab
              # failed to import with a permissions error.
              chown -R 1000:1000 /app
              mkdir -p /data/torrents/soulseek/incomplete
              # Recursively chown the Soulseek tree only. busybox 1.36 find has
              # no -uid predicate (it errors), so a conditional "repair only
              # mis-owned" find silently does nothing - a plain chown -R is what
              # actually works here. This is scoped to the Soulseek subtree, not
              # all of /data, so it stays cheap and never becomes the full-tree
              # NFS chown that fsGroup would cause (which is why fsGroup is
              # deliberately NOT set on this pod - its /data mount is the whole
              # media library).
              chown -R 1000:1000 /data/torrents/soulseek
              echo "slskd.yml rendered and ownership repaired"
          env:
            - name: SLSKD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slskd
                  key: api-key
          volumeMounts:
            - name: slskd-config
              mountPath: /app
            - name: data
              mountPath: /data
      containers:
        - name: gluetun
          # v3.40.0 aborted at startup the moment it detected the pod's
          # IPv6 link-local address: "for ip6tables: failed cleaning up test
          # rule ... Bad rule", immediately followed by shutdown. Nothing in
          # the cluster was wrong - ip6tables works fine inside the LXC and the
          # kernel modules are loaded - it is gluetun's own ip6tables probe.
          image: qmcgaw/gluetun:v3.41.3
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: private-key
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: preshared-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: addresses
            # SERVER_COUNTRIES deliberately unset. gluetun filters its AirVPN
            # server list by literal country name, so a placeholder like
            # "Earth" matches nothing and startup fails with no server found.
            # Omitting it entirely is how you say "anywhere", which is what is
            # wanted here. The value is still kept in Doppler for the day a
            # real country is wanted.
            # Let the pod's own subnet through so the qui UI and Prowlarr can
            # still reach qBittorrent's WebUI while everything else is tunnelled.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            # The ports AirVPN forwards for this account: 6877 for
            # qBittorrent, 6874 for slskd. AirVPN forwards nothing by default -
            # without a reservation the tunnel is outbound-only, so peers can
            # never connect in and both swarm speed and seeding suffer. These
            # must match what the clients actually listen on.
            - name: FIREWALL_VPN_INPUT_PORTS
              value: "6877,6874"
            - name: DOT
              value: "off"
            - name: TZ
              value: UTC
          ports:
            - name: qbit-http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            # A liveness timeout here RESTARTS gluetun, which drops the VPN and takes
            # qBittorrent and slskd down with it - they share its network namespace.
            # Far better to tolerate a slow check than to tear the tunnel down.
            timeoutSeconds: 10
            failureThreshold: 6
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            # WireGuard needs a TUN device, and Kubernetes does not expose one
            # by default: gluetun fails with "opening TUN device file:
            # operation not permitted". NET_ADMIN alone is not enough - the
            # device node itself has to be passed in.
            - name: tun
              mountPath: /dev/net/tun
        # slskd (Soulseek), in the SAME pod for the same reason qBittorrent is:
        # sharing gluetun's network namespace means its only route out is the
        # tunnel. Soulseek is peer-to-peer, so running it outside the tunnel
        # would expose the connection just as a bare torrent client would.
        - name: slskd
          image: slskd/slskd:0.23.2
          # slskd/slskd is NOT a linuxserver image, so PUID/PGID do nothing here
          # (that is why qBittorrent uses them and slskd cannot). Run the process
          # as 1000:1000 directly so every file it writes is owned by the same
          # uid Lidarr imports as. The init container above repairs the config
          # PVC and existing downloads to match.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: SLSKD_SLSK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: slskd
                  key: username
            - name: SLSKD_SLSK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slskd
                  key: password
            - name: SLSKD_HTTP_PORT
              value: "5030"
            # The AirVPN-forwarded port for incoming Soulseek connections.
            - name: SLSKD_SLSK_LISTEN_PORT
              value: "6874"
            # Downloads land inside the shared volume so Lidarr can import
            # them without copying across filesystems.
            - name: SLSKD_DOWNLOADS_DIR
              value: /data/torrents/soulseek
            - name: SLSKD_INCOMPLETE_DIR
              value: /data/torrents/soulseek/incomplete
            - name: SLSKD_SHARED_DIR
              value: /data/media/music
            - name: SLSKD_NO_AUTH
              value: "false"
            - name: TZ
              value: UTC
          ports:
            - name: slskd
              containerPort: 5030
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: slskd-config
              mountPath: /app
            - name: data
              mountPath: /data
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.1.2
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6877"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            # /data, not /downloads - TRaSH is explicit that a bare
            # /downloads mount makes the download and media directories look
            # like separate filesystems to the arr apps and loses hardlinks.
            - name: data
              mountPath: /data
        # MyAnonaMouse dynamic-seedbox IP updater, in this pod for the same
        # reason everything else here is: it MUST reach MAM from the VPN's
        # egress IP.
        #
        # MAM pins a session cookie to one IP. When AirVPN hands out a
        # different address the session breaks until dynamicSeedbox.php is
        # called to re-point it - and MAM records whatever source IP that call
        # arrives from. A separate Deployment would get its own network
        # namespace, call MAM from the node's WAN address, and cheerfully
        # register the wrong IP: the session would still "work" from MAM's
        # point of view while qBittorrent, announcing from the tunnel, stayed
        # locked out. Sharing gluetun's namespace is the only correct place
        # for this.
        - name: seedboxapi
          # MAM's own image, and the same one that ran in the old compose
          # stack. It is alpine + curl + a 100-line wrapper.sh (7MB), so there
          # is very little to trust beyond the tracker itself, which already
          # holds the credential.
          #
          # Pinned to the dated tag rather than :latest, which the compose
          # stack used. 20250413-0519 is the newest published tag and is the
          # identical digest :latest currently points at, so this pins today's
          # behaviour without changing it.
          image: myanonamouse/seedboxapi:20250413-0519
          # Supervise the image's own entrypoint instead of running it directly,
          # because wrapper.sh calls `exit 1` on any MAM refusal - an invalid
          # session, an unreachable tracker - and an exiting container here is
          # not a contained failure.
          #
          # This was measured, not theorised: the first deploy of this sidecar
          # took torrenting OFF THE AIR. A container in CrashLoopBackOff is
          # never Ready, a pod is Ready only when ALL of its containers are, and
          # an unready pod is removed from its Services' endpoints - so both
          # `qbittorrent` and `slskd` Services went to zero endpoints and
          # Prowlarr, Lidarr, Readarr and qui all lost their download client,
          # while qBittorrent itself was serving happily on localhost:8080. A
          # cookie refresher must not be able to do that, which is the same
          # reason there is no readinessProbe below.
          #
          # Keeping the process alive across failures is what decouples them.
          # It also throttles the retry: a crashlooping container retries on
          # kubelet's backoff (capped at 5 minutes, so ~12 rejected calls an
          # hour at the exact endpoint MAM asks you not to hammer), whereas this
          # retries hourly.
          #
          # Correct under both of wrapper.sh's modes, which is why it is written
          # as a plain retry loop rather than something cleverer. wrapper.sh
          # guards its polling loop with `while [ $PPID -ne 1 ]`, so:
          #   - if it keeps that loop, it never returns and this wrapper simply
          #     never iterates - its own interval=60 change detection is in
          #     charge;
          #   - if PPID is 1 and it skips the loop, it still performs the
          #     startup session refresh, then returns here and is re-run in an
          #     hour - which is MAM's documented once-an-hour cadence anyway.
          # The trade-off: failures no longer show up as a restart count, so
          # `kubectl logs -c seedboxapi` is the place to look.
          #
          # The seed is read from the mounted file on EVERY iteration rather
          # than injected once as an env var, which breaks an otherwise fatal
          # catch-22. MAM binds the session to the IP it is created against, so
          # re-seeding means "put the new mam_id somewhere this container will
          # read it" - and if that place is an env var, the only way to reload
          # it is to recreate the container, which recreates the pod, which
          # reconnects gluetun, which lands on a DIFFERENT AirVPN exit and
          # invalidates the session that was just minted for the old one. Every
          # re-seed would destroy the thing it was seeding. Reading the file
          # each pass means a new MAM_ID in Doppler propagates
          # (operator -> Secret -> kubelet refreshes this volume) and is picked
          # up by the next hourly pass with the tunnel, and therefore the
          # egress IP, left completely undisturbed.
          #
          # To apply a re-seed immediately instead of waiting up to an hour,
          # end the sleep rather than restarting anything:
          #   kubectl exec -n downloads <pod> -c seedboxapi -- pkill sleep
          # That makes the loop iterate at once and re-read the file. Do NOT
          # delete the pod to hurry it along - that changes the exit IP and is
          # precisely the failure above.
          # Backticks, not $(...), for the substitution below: Kubernetes runs
          # its own $(VAR) expansion over args before the shell ever sees them.
          # It happens to pass an unresolvable name through untouched, so
          # $(cat ...) would work by luck rather than by rule - and would break
          # the day something defines a matching env var. Backticks are outside
          # that syntax entirely, and are what wrapper.sh itself uses.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                mam_id=`cat /run/secrets/mam/mam-id 2>/dev/null` /wrapper.sh \
                  || echo "seedboxapi exited $? - retrying in 1h"
                sleep 3600
              done
          securityContext:
            # A curl loop needs no capabilities at all. Runs as root only
            # because /config below is an NFS volume and this pod deliberately
            # sets no fsGroup (see the init container), so there is no uid to
            # hand it that would own the mount.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # No mam_id env var by design - the command above supplies it from
          # the mounted secret per iteration. wrapper.sh reads the lowercase
          # $mam_id, which is why the command spells it that way, and it is a
          # SEED: wrapper.sh consults it only while /config/MAM.cookies holds
          # no session, and works from the jar afterwards.
          #
          # If the log says "mam_id passed on command line is invalid", the
          # session is being refused and the plumbing is fine. MAM answers
          # {"Success":false,"msg":"Invalid session - Other","ASN":<caller ASN>}
          # when the session was not created against the network the call
          # arrives from - and that is the ASN to compare against. Note the
          # distinct reply "Incorrect session type", which is what a session
          # missing the dynamic-seedbox permission returns; the two failures
          # are worth telling apart before regenerating anything. See the `mam`
          # DopplerSecret for the re-seed procedure.
          env:
            - name: interval
              # Minutes between IP checks - NOT between MAM calls. Each tick
              # only fetches the current egress IP from ip4.me and compares its
              # hash to the cached one; MAM is contacted solely when that
              # changes.
              #
              # 60 rather than the 1 the compose stack ran, because of a retry
              # path in wrapper.sh: a MAM reply of "Last change too recent"
              # leaves the IP cache un-updated, so the next tick tries again.
              # At interval=1 a rate-limited update becomes 60 requests an hour
              # against the exact endpoint MAM asks you not to hammer - MAM
              # documents one call per hour and returns "Last change too
              # recent" past that, and flagging the account is a real outcome.
              # At 60 even the pathological retry loop stays at one call per
              # hour.
              #
              # The latency this appears to cost is mostly illusory: wrapper.sh
              # calls dynamicSeedbox.php once at startup to validate the
              # session, which itself re-registers the IP. Since the tunnel's
              # address only changes when gluetun reconnects, and a gluetun
              # restart restarts this container's pod too, the common case is
              # already covered at t=0. The hourly poll is the backstop for an
              # IP that moves underneath a live tunnel.
              value: "60"
            # DEBUG is deliberately NOT set, though the compose stack had
            # DEBUG=1. wrapper.sh implements DEBUG as `set -x`, and the very
            # first traced command is
            # `curl -s -b mam_id=${mam_id} -c ${COOKIEFILE} ...` - so enabling
            # it prints the full MAM_ID into the pod log, where anyone with
            # `kubectl logs` on this namespace can read it. The undebugged
            # output ("Session is valid", "No IP change detected", "New IP
            # detected") is enough to tell whether it is working.
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # No readinessProbe, and not merely because a sidecar loop has no
          # endpoint to probe - adding one would be actively harmful, and this
          # is not hypothetical. Container readiness is ANDed into pod
          # readiness and the qbittorrent and slskd Services select this pod,
          # so anything that marks this container unready empties those
          # Services' endpoints and cuts off Prowlarr, Lidarr, Readarr and qui.
          # The crashloop described above did exactly that. A readinessProbe
          # would reproduce it on any MAM outage or rate-limit reply.
          # Failure is surfaced in the container log instead.
          volumeMounts:
            # Holds MAM.cookies, the rotated session. See the PVC comment in
            # pvc.yaml for why this cannot be an emptyDir.
            - name: seedboxapi-config
              mountPath: /config
            # The seed, as a file rather than an env var so it can be replaced
            # without recreating the pod. kubelet refreshes secret volumes in
            # place, so a new MAM_ID in Doppler reaches this path on its own.
            - name: mam-seed
              mountPath: /run/secrets/mam
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: seedboxapi-config
          persistentVolumeClaim:
            claimName: seedboxapi-config
        # Mounted rather than injected as env so the MAM seed can be rotated
        # without a pod roll - see the seedboxapi container for why a roll is
        # self-defeating here.
        - name: mam-seed
          secret:
            secretName: mam
        - name: slskd-config
          persistentVolumeClaim:
            claimName: slskd-config
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: qbit-http
