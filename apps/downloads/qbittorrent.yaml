---
# qBittorrent + slskd + seedboxapi, routed through the shared VPN gateway.
#
# The gluetun sidecar has been removed. All three network-speaking containers
# route through the VPN gateway's plain SOCKS5 sidecar (port 1080) for
# outbound traffic: qBittorrent's tracker/peer TCP connections, slskd's
# Soulseek connections, and seedboxapi's MAM API calls. Port 8388 on the same
# gateway is Shadowsocks - an encrypted protocol none of these three clients
# speak - and every one of them was pointed at it until 2026-09-05.
#
# The killswitch is enforced by the downloads NetworkPolicy: egress is locked
# to DB, redis, DNS, the VPN gateway proxy, and the kube-system OIDC
# endpoints. Direct internet egress is DENIED.
#
# CAVEAT: qBittorrent's SOCKS5 proxy only carries TCP traffic. UDP-based
# DHT and UDP tracker announces egress from the node's WAN. This is
# acceptable for the MAM use case (MAM trackers are TCP-only).
#
# CAVEAT: AirVPN's forwarded ports (6877 for qBittorrent, 6874 for slskd)
# are forwarded through the VPN tunnel and terminate at gluetun's pod IP.
# With gluetun removed, incoming peer connections on these ports will not
# reach the pod. Outbound-only operation is unaffected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: downloads
  annotations:
    # ServerSideApply off for THIS resource only. With it on, argocd-controller
    # re-applied the Deployment about once a minute - generation climbed from 59
    # to 294 in a few hours - and every apply recreated the pod. qBittorrent
    # needs ~3 minutes to load 2,228 torrents, so it was being killed before it
    # ever finished starting, and Baldur's Gate re-checked on every restart.
    #
    # A field-manager loop: SSA drops a field the apiserver then re-defaults,
    # so the object never settles. Same family as the ServerSideDiff failure on
    # the accounts app (see docs/doctor-log.md).
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      # Pod-level, so it covers the init container and all three containers.
      # Without it the pod runs seccomp Unconfined: this node's kubelet has
      # seccompDefault=false, so nothing applies a profile unless a manifest
      # asks.
      #
      # This is the pod where RuntimeDefault most plausibly breaks something -
      # gluetun holds NET_ADMIN and a passed-in /dev/net/tun - so it was
      # measured rather than assumed. Two throwaway pods ran the same probe on
      # the qmcgaw/gluetun:v3.41.3 image, one Unconfined and one
      # RuntimeDefault, and produced byte-identical results: `ip tuntap add`,
      # link up, address, route, `iptables -L`, a nat MASQUERADE rule and
      # `ip6tables -L` all succeeded under both. Nothing gluetun does needs a
      # denied syscall: the denied set is namespace and kernel-management calls
      # (mount, unshare, setns, pivot_root, kexec, bpf, keyctl), while tunnel
      # setup is ioctl(TUNSETIFF) plus netlink, both allowed.
      #
      # seccomp is orthogonal to capabilities: NET_ADMIN on the gluetun
      # container below is unaffected by this.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # slskd's API key cannot be set by environment variable. Its documented
        # mapping (SLSKD_WEB_AUTHENTICATION_API_KEYS_<NAME>_KEY) is silently
        # ignored for this nested path, so every Lidarr request came back 401.
        # Rendering the key into slskd.yml at startup is the only reliable way -
        # and doing it here keeps the secret in a Kubernetes Secret rather than
        # committed to git.
        - name: slskd-config-render
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cat > /app/slskd.yml <<EOF
              web:
                port: 5030
                authentication:
                  api_keys:
                    lidarr:
                      key: "$SLSKD_API_KEY"
                      role: readwrite
                      cidr: 10.42.0.0/16,10.43.0.0/16,127.0.0.1/32
              shares:
                directories:
                  - /data/media/music
                # Lidarr imports into the library continuously and the share
                # cache is in-memory, so new music stays unshared until a
                # rescan. A full-library scan takes ~2h, so the rescan
                # interval is weekly - anything shorter would have slskd
                # scanning nearly continuously. A pod restart rescans
                # immediately, and a scan can be forced from the web UI or
                # API when the library has grown a lot.
                cache:
                  retention: 10080
              # Owner's connection timeouts from their pre-k8s slskd.yml.
              # inactivity: 150000 is 10x the default 15000 - keeps slow peers
              # and dnet parent connections from being dropped early.
              # connect: 10000 equals the default, kept explicit for parity.
              # connection.timeout.transfer from the old setup has no
              # equivalent in slskd 0.23.2 (the only 'transfer' under
              # soulseek.connection is a buffer size, not a timeout), so it is
              # intentionally not carried over. The owner's startup flags
              # (no_logo/no_start/no_config_watch/no_connect/no_share_scan/
              # force_share_scan) are all explicitly false, which equals this
              # version's defaults - no env overrides needed.
              soulseek:
                connection:
                  timeout:
                    connect: 10000
                    inactivity: 150000
                  # The Soulseek connection MUST go through the gateway's plain
                  # SOCKS5 sidecar. This lives here rather than in env vars for
                  # the same reason the API key above does: slskd silently
                  # ignores the environment mapping for these nested paths.
                  # SLSKD_SLSK_PROXY* was set for weeks and did nothing - the
                  # log said "Failed to connect to 208.76.170.59:2271:
                  # Connection refused", which is the DESTINATION address, so
                  # slskd was dialling it directly and the namespace policy was
                  # rejecting it. kube-router REJECTs rather than drops, which
                  # is why a policy denial reads as "connection refused".
                  #
                  # 1080, not 8388: 8388 is Shadowsocks, which does not answer
                  # a SOCKS5 greeting.
                  proxy:
                    enabled: false
              EOF
              chown 1000:1000 /app/slskd.yml
              chmod 600 /app/slskd.yml
              # slskd runs as uid 1000 (container securityContext below), so it
              # must own its config PVC to write app.db and logs, and the
              # Soulseek download tree so Lidarr - also uid 1000 - can import
              # what it fetches. Before this, slskd ran as root and left 0644
              # root-owned files that uid 1000 could neither hardlink
              # (fs.protected_hardlinks=1) nor move, so every Soulseek grab
              # failed to import with a permissions error.
              chown -R 1000:1000 /app
              mkdir -p /data/torrents/soulseek/incomplete
              # Repair ownership of the Soulseek tree ONLY WHEN THE ROOT IS
              # WRONG - the same rule fsGroupChangePolicy: OnRootMismatch
              # applies, and for the same reason.
              #
              # This was an unconditional `chown -R` and it made the pod
              # effectively un-restartable. Measured 2026-09-04: 43,147 files
              # and 752 GB under that tree, on NFS. The chown sat in
              # uninterruptible sleep (state D) for over 20 minutes across two
              # pod recreations, holding the whole Deployment at Init:0/2 -
              # qBittorrent, slskd and the gluetun-less network path all down
              # with it. It gets worse every time the library grows, which is
              # the property that makes it a trap rather than a slow step: it
              # was fine when it was written.
              #
              # The previous comment concluded a conditional repair was
              # impossible because busybox find has no -uid predicate. True,
              # but the test does not need find: stat the directory itself.
              # If the root is already uid 1000 the tree was chowned on a
              # previous start and nothing has changed it, so the walk is
              # skipped entirely and startup is instant. If ownership really
              # did change, the full repair still runs exactly as before.
              if [ "$(stat -c %u /data/torrents/soulseek)" = "1000" ]; then
                echo "soulseek tree already owned by 1000, skipping chown -R"
              else
                echo "soulseek tree root mis-owned, repairing (this walks 40k+ files over NFS)"
                chown -R 1000:1000 /data/torrents/soulseek
              fi
              echo "slskd.yml rendered and ownership repaired"
          env:
            - name: SLSKD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slskd
                  key: api-key
          volumeMounts:
            - name: slskd-config
              mountPath: /app
            - name: data
              mountPath: /data
        # Configure qBittorrent's SOCKS5 proxy to route tracker/peer TCP
        # traffic through the shared VPN gateway's Shadowsocks proxy.
        - name: qbit-proxy-config
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              CONF=/config/qBittorrent
              mkdir -p "$CONF"
              F="$CONF/qBittorrent.conf"
              touch "$F"
              # Strip previously-injected blocks first: older runs appended
              # unconditionally, stacking N AutoRun sections across N rollouts
              # (qBittorrent's rewrite on exit glued them into garbage like
              # `Program=... "[LegalNotice]`). Strip-then-append is idempotent.
              awk '
                /^\[LegalNotice\]$/ || /^\[Proxy\]$/ || /^\[AutoRun\]$/ { skip=1; next }
                /^\[/ { skip=0 }
                { if (!skip) print }
              ' "$F" > "$F.tmp"
              mv "$F.tmp" "$F"
              printf '[LegalNotice]\nAccepted=true\n[Proxy]\nEnabled=false\n[AutoRun]\nEnabled=true\nProgram=/bin/sh /scripts/qbit-upload.sh "%%L" "%%F"\n' >> "$F"
              # Seed the category the AutoRun hook keys on. qbit-upload.sh exits
              # 0 unless %L matches, so without this category the hook is wired
              # up correctly and still never fires - which is exactly how it
              # looked: enabled, mounted, and silent. Categories are runtime
              # state in qBittorrent's own config, so a deploy alone never
              # creates one; seed it here, idempotently, before qBittorrent
              # starts and caches the file in memory.
              CATS="$CONF/categories.json"
              if ! grep -q '"nextcloud"' "$CATS" 2>/dev/null; then
                NC='    "nextcloud": {\n        "save_path": "/data/torrents/nextcloud"\n    }'
                if [ -s "$CATS" ] && grep -q '"' "$CATS"; then
                  # Existing categories: splice ours in after the opening brace.
                  awk -v nc="$NC" 'NR==1 && $0 ~ /^\{/ { print "{"; printf "%s,\n", nc; next } { print }' \
                    "$CATS" > "$CATS.tmp" && mv "$CATS.tmp" "$CATS"
                else
                  printf '{\n%b\n}\n' "$NC" > "$CATS"
                fi
                echo "seeded nextcloud category"
              fi
              echo "qBittorrent SOCKS5 proxy + AutoRun configured"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        # gluetun runs HERE, in this pod, rather than in its own Deployment.
        #
        # Containers in a pod share a network namespace, so qBittorrent, slskd
        # and seedboxapi now use tun0 directly instead of dialling a SOCKS5
        # proxy. That is the whole point: a SOCKS5 proxy carries TCP only, so
        # UDP trackers and DHT were structurally impossible, and there was no
        # inbound path at all - qBittorrent reported connection status
        # "firewalled" with all 2,228 torrents stalled and zero bytes moving.
        # Through tun0 both work, and AirVPN's forwarded ports (6877/6874,
        # below) give real inbound peer connections.
        #
        # It cannot run in both places: all three airvpn Secrets mirror the same
        # Doppler keys, so it is ONE WireGuard device key. A second tunnel on it
        # would fight the first. apps/vpn was removed in the same commit.
        #
        # The killswitch moves with it - from the NetworkPolicy (which had to
        # start allowing internet egress so the WireGuard handshake can happen)
        # into gluetun's own firewall, which is stricter: it drops everything
        # not going through the tunnel except the subnets named below.
        - name: gluetun
          # v3.41.3 pinned: v3.40.0 aborts at startup on this LXC's IPv6
          # link-local address ("for ip6tables: failed cleaning up test
          # rule"). v3.41.3 does not.
          image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn
            - name: VPN_TYPE
              value: wireguard
            # Pinned exit (owner decision 2026-08-29): a roaming AirVPN exit
            # changes ASN across providers, which killed the MAM seedbox
            # session on every restart. SERVER_NAMES pins the exit to one
            # server so IP+ASN stay stable and one re-seed is the last.
            # Trade-off: if Aquila dies, the tunnel stays down until the pin
            # is changed.
            - name: SERVER_NAMES
              value: Aquila
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: private-key
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: preshared-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: addresses
            # SERVER_COUNTRIES deliberately unset. gluetun filters its AirVPN
            # server list by literal country name, so a placeholder like
            # "Earth" matches nothing and startup fails with no server found.
            # Omitting it entirely is how you say "anywhere", which is what is
            # wanted here.
            #
            # THE KILLSWITCH BOUNDARY. Only these subnets bypass the tunnel:
            #   10.42.0.0/16 pod CIDR     - so consumer apps can reach this
            #                               service, and replies get back.
            #   10.43.0.0/16 service CIDR - so DNS (CoreDNS) works.
            # Everything else (all public internet) is forced through
            # WireGuard, and dropped if it is down.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            # AirVPN forwarded ports for this account: 6877 for qBittorrent,
            # 6874 for slskd. These are forwarded through the VPN tunnel, so
            # peer connections arrive through the Aquila exit.
            # Inbound on eth0. Distinct from FIREWALL_VPN_INPUT_PORTS below,
            # which only opens the tunnel side. Without this gluetun's INPUT
            # policy drops connections from the rest of the cluster, so the
            # WebUI answered on localhost and nowhere else - qui, Prowlarr,
            # Lidarr and Readarr all drive qBittorrent's API over this port.
            #   8080 qBittorrent WebUI, 5030 slskd, 1080/8888 the proxies
            #   remux, navidrome and octo still use.
            - name: FIREWALL_INPUT_PORTS
              value: "8080,5030,1080,8888"
            - name: FIREWALL_VPN_INPUT_PORTS
              value: "6877,6874"
            # HTTP proxy: remux points HTTP_PROXY/HTTPS_PROXY at
            # vpn-proxy.downloads.svc.cluster.local:8888.
            - name: HTTPPROXY
              value: "on"
            # Shadowsocks proxy: consumer apps point their SOCKS5 client at
            # vpn-proxy.downloads.svc.cluster.local:8388. This carries
            # qBittorrent's tracker/peer TCP traffic and slskd's Soulseek
            # connections. The password is in Doppler (VPN_SHADOWSOCKS_PASSWORD).
            - name: SHADOWSOCKS
              value: "off"
            # Keep the original kube-dns nameserver so cluster-internal DNS
            # (*.svc.cluster.local) keeps working. Without this, gluetun
            # rewrites resolv.conf to its upstream resolver (e.g. 1.1.1.1)
            # which cannot resolve cluster names.
            - name: DNS_KEEP_NAMESERVER
              value: "on"
            - name: DOT
              value: "off"
            - name: TZ
              value: UTC
          ports:
            - name: http-proxy
              containerPort: 8888
            - name: shadowsocks
              containerPort: 8388
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            # A liveness timeout here RESTARTS gluetun, which drops the VPN.
            # Far better to tolerate a slow check than tear the tunnel down.
            timeoutSeconds: 10
            failureThreshold: 6
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            # WireGuard needs a TUN device; Kubernetes does not expose one by
            # default. NET_ADMIN alone is not enough - the device node itself
            # must be passed in or gluetun fails with "operation not permitted".
            - name: tun
              mountPath: /dev/net/tun
        # ---------------------------------------------------------------
        # Plain SOCKS5, in the SAME POD as gluetun.
        #
        # WHY HERE AND NOT A SECOND VPN CONTAINER. Containers in a pod share
        # one network namespace, so this egresses through gluetun's WireGuard
        # tunnel automatically - exactly how the old qBittorrent+gluetun
        # sidecar worked. One tunnel, one AirVPN session, ~2 MB. Giving remux
        # its own gluetun would have meant a second tunnel and a second
        # session to do a job this pod already does, which is the per-app
        # duplication CONTRIBUTING rule 4 exists to stop.
        #
        # WHY IT IS NEEDED AT ALL. Neither existing port can carry BitTorrent:
        #   8888 is an HTTP proxy - CONNECT cannot carry peer or DHT traffic.
        #   8388 is SHADOWSOCKS, an encrypted protocol, NOT plain SOCKS5. A
        #   SOCKS5 client cannot speak it; verified by `curl
        #   --socks5-hostname` timing out against 8388 from both remux and
        #   qBittorrent. That also means qbittorrent.yaml's
        #   `[Proxy] Type=5 Port=8388` with no credentials is very likely
        #   inert and should be repointed here.
        #
        # No authentication: this listens on a ClusterIP reachable only from
        # namespaces the NetworkPolicy names, and a credential would have to
        # live in every consumer's config for no threat this faces.
        - name: socks5
          # Pinned by digest. A 2 MB static Go binary; entrypoint /socks5.
          image: serjs/go-socks5-proxy:latest@sha256:0af522996f402c03ecd985a87997158eabeb28935365e3a384df37eafcf740ea
          env:
            - name: PROXY_PORT
              value: "1080"
            # This image defaults REQUIRE_AUTH=true and EXITS at startup if no
            # PROXY_USER/PROXY_PASSWORD are set - it does not fall back to
            # open. Turned off deliberately: the listener is a ClusterIP
            # reachable only from the namespaces vpn/networkpolicy.yaml names,
            # and a credential would have to be duplicated into every
            # consumer's config for no threat this actually faces.
            - name: REQUIRE_AUTH
              value: "false"
          ports:
            - name: socks5
              containerPort: 1080
          # Every peer connection for every torrent is a socket held open in
          # this one process. With ~2,200 torrents in the session, 64Mi was not
          # a ceiling it approached occasionally - it was OOMKilled 13 times,
          # and each kill drops every peer connection at once. The result looks
          # exactly like "the VPN is down": 0 B/s, while a single curl through
          # the same proxy succeeds because one connection costs nothing.
          #
          # The request stays small; only the ceiling moves, so this reserves
          # nothing extra on an already-tight node.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
        # --- slskd (Soulseek), SOCKS5-routed through the VPN gateway. ---
        - name: slskd
          image: slskd/slskd:0.23.2
          # slskd/slskd is NOT a linuxserver image, so PUID/PGID do nothing here
          # (that is why qBittorrent uses them and slskd cannot). Run the process
          # as 1000:1000 directly so every file it writes is owned by the same
          # uid Lidarr imports as. The init container above repairs the config
          # PVC and existing downloads to match.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: SLSKD_SLSK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: slskd
                  key: username
            - name: SLSKD_SLSK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slskd
                  key: password
            - name: SLSKD_HTTP_PORT
              value: "5030"
            # The AirVPN-forwarded port for incoming Soulseek connections.
            - name: SLSKD_SLSK_LISTEN_PORT
              value: "6874"
            # Downloads land inside the shared volume so Lidarr can import
            # them without copying across filesystems.
            - name: SLSKD_DOWNLOADS_DIR
              value: /data/torrents/soulseek
            - name: SLSKD_INCOMPLETE_DIR
              value: /data/torrents/soulseek/incomplete
            - name: SLSKD_SHARED_DIR
              value: /data/media/music
            - name: SLSKD_NO_AUTH
              value: "false"
            - name: TZ
              value: UTC
            # NOTE: the Soulseek proxy is configured in slskd.yml above, not
            # here. SLSKD_SLSK_PROXY / _ADDRESS / _PORT used to be set at this
            # point and were silently ignored - see the comment on the proxy
            # block in the rendered config.
          ports:
            - name: slskd
              containerPort: 5030
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: slskd-config
              mountPath: /app
            - name: data
              mountPath: /data
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.1.2
          # The Service's targetPort references this named port. When the
          # gluetun sidecar was removed (4ad7387), the qbit-http port
          # declaration was removed with it, leaving the qbittorrent
          # container with no ports — the endpoints controller could not
          # match the Service's targetPort, producing empty Endpoints.
          ports:
            - name: qbit-http
              containerPort: 8080
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6877"
            # Nextcloud WebDAV upload (qbit-upload-config): qBittorrent's AutoRun
            # hook pushes finished torrents to Nextcloud over WebDAV. Values come
            # from the nextcloud-webdav DopplerSecret (kubernetes/prd). Env-gated
            # in the script, so leaving any of these unset (Phase A) just no-ops.
            - name: NEXTCLOUD_WEBDAV_URL
              valueFrom:
                secretKeyRef:
                  name: nextcloud-webdav
                  key: url
            - name: NEXTCLOUD_WEBDAV_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-webdav
                  key: user
            - name: NEXTCLOUD_WEBDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-webdav
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            # /data, not /downloads - TRaSH is explicit that a bare
            # /downloads mount makes the download and media directories look
            # like separate filesystems to the arr apps and loses hardlinks.
            - name: data
              mountPath: /data
            # AutoRun hook (qbit-upload-config): qBittorrent invokes it via the
            # [AutoRun] Program line written by qbit-proxy-config. Env-gated -
            # without NEXTCLOUD_WEBDAV_* it no-ops, so Phase A (no secret yet)
            # is safe.
            - name: qbit-upload-script
              mountPath: /scripts
        # MyAnonaMouse dynamic-seedbox IP updater, in this pod for the same
        # reason everything else here is: it MUST reach MAM from the VPN's
        # egress IP.
        #
        # MAM pins a session cookie to one IP. When AirVPN hands out a
        # different address the session breaks until dynamicSeedbox.php is
        # called to re-point it - and MAM records whatever source IP that call
        # arrives from. A separate Deployment would get its own network
        # namespace, call MAM from the node's WAN address, and cheerfully
        # register the wrong IP: the session would still "work" from MAM's
        # point of view while qBittorrent, announcing from the tunnel, stayed
        # locked out. Sharing gluetun's namespace is the only correct place
        # for this.
        - name: seedboxapi
          # MAM's own image, and the same one that ran in the old compose
          # stack. It is alpine + curl + a 100-line wrapper.sh (7MB), so there
          # is very little to trust beyond the tracker itself, which already
          # holds the credential.
          #
          # Pinned to the dated tag rather than :latest, which the compose
          # stack used. 20250413-0519 is the newest published tag and is the
          # identical digest :latest currently points at, so this pins today's
          # behaviour without changing it.
          image: myanonamouse/seedboxapi:20250413-0519
          # Supervise the image's own entrypoint instead of running it directly,
          # because wrapper.sh calls `exit 1` on any MAM refusal - an invalid
          # session, an unreachable tracker - and an exiting container here is
          # not a contained failure.
          #
          # This was measured, not theorised: the first deploy of this sidecar
          # took torrenting OFF THE AIR. A container in CrashLoopBackOff is
          # never Ready, a pod is Ready only when ALL of its containers are, and
          # an unready pod is removed from its Services' endpoints - so both
          # `qbittorrent` and `slskd` Services went to zero endpoints and
          # Prowlarr, Lidarr, Readarr and qui all lost their download client,
          # while qBittorrent itself was serving happily on localhost:8080. A
          # cookie refresher must not be able to do that, which is the same
          # reason there is no readinessProbe below.
          #
          # Keeping the process alive across failures is what decouples them.
          # It also throttles the retry: a crashlooping container retries on
          # kubelet's backoff (capped at 5 minutes, so ~12 rejected calls an
          # hour at the exact endpoint MAM asks you not to hammer), whereas this
          # retries hourly.
          #
          # Correct under both of wrapper.sh's modes, which is why it is written
          # as a plain retry loop rather than something cleverer. wrapper.sh
          # guards its polling loop with `while [ $PPID -ne 1 ]`, so:
          #   - if it keeps that loop, it never returns and this wrapper simply
          #     never iterates - its own interval=60 change detection is in
          #     charge;
          #   - if PPID is 1 and it skips the loop, it still performs the
          #     startup session refresh, then returns here and is re-run in an
          #     hour - which is MAM's documented once-an-hour cadence anyway.
          # The trade-off: failures no longer show up as a restart count, so
          # `kubectl logs -c seedboxapi` is the place to look.
          #
          # The seed is read from the mounted file on EVERY iteration rather
          # than injected once as an env var, which breaks an otherwise fatal
          # catch-22. MAM binds the session to the IP it is created against, so
          # re-seeding means "put the new mam_id somewhere this container will
          # read it" - and if that place is an env var, the only way to reload
          # it is to recreate the container, which recreates the pod, which
          # reconnects gluetun, which lands on a DIFFERENT AirVPN exit and
          # invalidates the session that was just minted for the old one. Every
          # re-seed would destroy the thing it was seeding. Reading the file
          # each pass means a new MAM_ID in Doppler propagates
          # (operator -> Secret -> kubelet refreshes this volume) and is picked
          # up by the next hourly pass with the tunnel, and therefore the
          # egress IP, left completely undisturbed.
          #
          # To apply a re-seed immediately instead of waiting up to an hour,
          # end the sleep rather than restarting anything:
          #   kubectl exec -n downloads <pod> -c seedboxapi -- pkill sleep
          # That makes the loop iterate at once and re-read the file. Do NOT
          # delete the pod to hurry it along - that changes the exit IP and is
          # precisely the failure above.
          # Backticks, not $(...), for the substitution below: Kubernetes runs
          # its own $(VAR) expansion over args before the shell ever sees them.
          # It happens to pass an unresolvable name through untouched, so
          # $(cat ...) would work by luck rather than by rule - and would break
          # the day something defines a matching env var. Backticks are outside
          # that syntax entirely, and are what wrapper.sh itself uses.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                mam_id=`cat /run/secrets/mam/mam-id 2>/dev/null` /wrapper.sh \
                  || echo "seedboxapi exited $? - retrying in 1h"
                sleep 3600
              done
          securityContext:
            # A curl loop needs no capabilities at all. Runs as root only
            # because /config below is an NFS volume and this pod deliberately
            # sets no fsGroup (see the init container), so there is no uid to
            # hand it that would own the mount.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # No mam_id env var by design - the command above supplies it from
          # the mounted secret per iteration. wrapper.sh reads the lowercase
          # $mam_id, which is why the command spells it that way, and it is a
          # SEED: wrapper.sh consults it only while /config/MAM.cookies holds
          # no session, and works from the jar afterwards.
          #
          # If the log says "mam_id passed on command line is invalid", the
          # session is being refused and the plumbing is fine. MAM answers
          # {"Success":false,"msg":"Invalid session - Other","ASN":<caller ASN>}
          # when the session was not created against the network the call
          # arrives from - and that is the ASN to compare against. Note the
          # distinct reply "Incorrect session type", which is what a session
          # missing the dynamic-seedbox permission returns; the two failures
          # are worth telling apart before regenerating anything. See the `mam`
          # DopplerSecret for the re-seed procedure.
          env:
            - name: interval
              # Minutes between IP checks - NOT between MAM calls. Each tick
              # only fetches the current egress IP from ip4.me and compares its
              # hash to the cached one; MAM is contacted solely when that
              # changes.
              #
              # 60 rather than the 1 the compose stack ran, because of a retry
              # path in wrapper.sh: a MAM reply of "Last change too recent"
              # leaves the IP cache un-updated, so the next tick tries again.
              # At interval=1 a rate-limited update becomes 60 requests an hour
              # against the exact endpoint MAM asks you not to hammer - MAM
              # documents one call per hour and returns "Last change too
              # recent" past that, and flagging the account is a real outcome.
              # At 60 even the pathological retry loop stays at one call per
              # hour.
              #
              # The latency this appears to cost is mostly illusory: wrapper.sh
              # calls dynamicSeedbox.php once at startup to validate the
              # session, which itself re-registers the IP. Since the tunnel's
              # address only changes when gluetun reconnects, and a gluetun
              # restart restarts this container's pod too, the common case is
              # already covered at t=0. The hourly poll is the backstop for an
              # IP that moves underneath a live tunnel.
              value: "60"
            # DEBUG is deliberately NOT set, though the compose stack had
            # DEBUG=1. wrapper.sh implements DEBUG as `set -x`, and the very
            # first traced command is
            # `curl -s -b mam_id=${mam_id} -c ${COOKIEFILE} ...` - so enabling
            # it prints the full MAM_ID into the pod log, where anyone with
            # `kubectl logs` on this namespace can read it. The undebugged
            # output ("Session is valid", "No IP change detected", "New IP
            # detected") is enough to tell whether it is working.
            # socks5h:// needs a real SOCKS5 listener. 8388 is Shadowsocks,
            # which curl cannot speak - so the MAM session/IP update has been
            # failing the same way slskd was. 1080 is the plain SOCKS5 sidecar.
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # No readinessProbe, and not merely because a sidecar loop has no
          # endpoint to probe - adding one would be actively harmful, and this
          # is not hypothetical. Container readiness is ANDed into pod
          # readiness and the qbittorrent and slskd Services select this pod,
          # so anything that marks this container unready empties those
          # Services' endpoints and cuts off Prowlarr, Lidarr, Readarr and qui.
          # The crashloop described above did exactly that. A readinessProbe
          # would reproduce it on any MAM outage or rate-limit reply.
          # Failure is surfaced in the container log instead.
          volumeMounts:
            # Holds MAM.cookies, the rotated session. See the PVC comment in
            # pvc.yaml for why this cannot be an emptyDir.
            - name: seedboxapi-config
              mountPath: /config
            # The seed, as a file rather than an env var so it can be replaced
            # without recreating the pod. kubelet refreshes secret volumes in
            # place, so a new MAM_ID in Doppler reaches this path on its own.
            - name: mam-seed
              mountPath: /run/secrets/mam
              readOnly: true
      volumes:
        # gluetun needs the TUN device to bring WireGuard up. Its container
        # block mounts this; without the volume the whole Deployment is
        # rejected as invalid, which is exactly what happened on the first
        # attempt at this migration.
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: seedboxapi-config
          persistentVolumeClaim:
            claimName: seedboxapi-config
        # Mounted rather than injected as env so the MAM seed can be rotated
        # without a pod roll - see the seedboxapi container for why a roll is
        # self-defeating here.
        - name: mam-seed
          secret:
            secretName: mam
        - name: slskd-config
          persistentVolumeClaim:
            claimName: slskd-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: qbit-upload-script
          configMap:
            name: qbit-upload-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: qbit-http
