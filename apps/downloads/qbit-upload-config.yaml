---
# Completed-torrent upload from a qBittorrent category to Nextcloud via WebDAV.
#
# Invoked by qBittorrent's AutoRun hook ("Run external program on torrent
# completion") with %L (category) and %F (file/folder). A network PUT, not a
# copy: the torrent stays on /data for seeding, and because the upload goes
# through Nextcloud's WebDAV layer it is indexed by Nextcloud properly (a raw
# write into Nextcloud's S3 objectstore would NOT surface in the UI - files
# are registered in the oc_filecache/Postgres by the DAV layer).
#
# The destination credentials come from env vars injected from the
# `nextcloud-webdav` secret (dedicated bot user, NOT the owner's account, so
# the credential that lives in this untrusted torrent pod is revocable).
#
# AutoRun is a completion hook, not a readiness-coupled sidecar: a failed
# upload is logged here and never empties the qbittorrent/slskd Service
# endpoints. (The same lesson that made seedboxapi a supervised loop.)
#
# EVERY LINE BELOW IS UNTESTED-IN-ANGER CODE UNTIL 2026-09-07. The AutoRun key
# that invokes it was written with the wrong letter case (see
# qbittorrent.yaml), so this script had never executed once - which is how it
# accumulated three independent bugs that a single real run would have caught:
# it never created its own base collection, it stripped each torrent's folder
# name and flattened everything together, and it issued MKCOL for nested paths
# whose parents did not exist yet. Treat a hook that has never fired as
# unwritten code, not as working code.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbit-upload-config
  namespace: downloads
data:
  qbit-upload.sh: |
    #!/bin/sh
    # Upload a completed torrent to Nextcloud WebDAV.
    # Usage: qbit-upload.sh "<category>" "<path>"   (qBittorrent AutoRun args)
    set -u
    CATEGORY="${NEXTCLOUD_CATEGORY:-nextcloud}"

    # qBittorrent passes ONE argument, not two.
    #
    # The AutoRun line is written `... "%L|%F"` and qBittorrent substitutes
    # into it, handing us a single string `<category>|<path>`. This is not a
    # preference - `"%L" "%F"` as two quoted placeholders arrives CONCATENATED
    # WITH NO SEPARATOR AT ALL:
    #
    #   invoked argc=1 category='music/data/torrents/music/Grateful Dead - ...'
    #
    # so $1 was "music/data/torrents/..." and never equalled a category name,
    # and the hook exited 0 on every single completion. That is the third
    # distinct way this one hook has managed to be configured, mounted,
    # executable and silent.
    #
    # It went unnoticed because a manual run - the backfill - passes two real
    # arguments and works perfectly. Verifying the script by calling it
    # yourself proves nothing about how qBittorrent calls it.
    #
    # Both forms are accepted: two arguments when a human or the backfill
    # invokes it, one `cat|path` string when qBittorrent does. The fallback
    # splits on the first `/` for the un-delimited form, so an old AutoRun
    # line left in a config file still does the right thing.
    if [ "$#" -ge 2 ] && [ -n "${2:-}" ]; then
      WANT="$1"; PATH_ARG="$2"
    else
      _raw="${1:-}"
      case "$_raw" in
        *"|"*) WANT="${_raw%%|*}"; PATH_ARG="${_raw#*|}" ;;
        */*)   WANT="${_raw%%/*}"; PATH_ARG="/${_raw#*/}" ;;
        *)     WANT="$_raw"; PATH_ARG="" ;;
      esac
    fi

    # qBittorrent spawns this detached, so stdout goes nowhere `kubectl logs`
    # can see - which is half of why the hook's failure was invisible for as
    # long as it was. Log to the config PVC instead:
    #   kubectl exec -n downloads <pod> -c qbittorrent -- tail -f /config/qbit-upload.log
    LOG=/config/qbit-upload.log
    # The find|while loop below runs in a SUBSHELL, so counters incremented
    # inside it do not survive. Results go to a file instead, and the summary
    # is computed after the loop from that file.
    RESULTS="/tmp/qbit-upload-results.$$"
    : > "$RESULTS"
    log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*" >> "$LOG" 2>/dev/null; }

    # Logged BEFORE the category gate, unconditionally, one line per completed
    # torrent. This is the line that answers "did the hook fire at all?" -
    # the question that was unanswerable for as long as it was broken, because
    # a hook that is never invoked leaves no trace anywhere by construction.
    # It also pins down argument passing: qBittorrent renders the substituted
    # command in its own log without re-quoting, so `"%L" "%F"` prints as
    # `music/data/torrents/music/...` and looks like one mashed-together
    # argument even when it is two.
    log "invoked argc=$# category='${1:-}' path='${2:-}'"
    [ "$WANT" = "$CATEGORY" ] || exit 0
    [ -n "$PATH_ARG" ] && [ -e "$PATH_ARG" ] || { log "nothing at '$PATH_ARG'"; exit 1; }
    URL="${NEXTCLOUD_WEBDAV_URL:-}"
    USER="${NEXTCLOUD_WEBDAV_USER:-}"
    PASS="${NEXTCLOUD_WEBDAV_PASSWORD:-}"
    [ -n "$URL" ] && [ -n "$USER" ] && [ -n "$PASS" ] || { log "webdav env not set"; exit 1; }
    BASEURL="$URL/remote.php/dav/files/$USER/qbittorrent"

    UPLOADS="$URL/remote.php/dav/uploads/$USER"
    log "start category=$WANT path=$PATH_ARG"

    # 256 MiB. The ceiling is Apache's LimitRequestBody, which the Nextcloud image
    # sets to APACHE_BODY_LIMIT=1073741824 (1 GiB) - that is what answered the
    # first real upload with a bare 413 after 0 bytes sent. Staying well under it
    # means the cap never has to be raised on a public-facing service.
    CHUNK_MB=256
    CHUNK_BYTES=$((CHUNK_MB * 1024 * 1024))
    # Prefer ONE PUT for anything up to 60 GiB, under PHP's 64G post_max_size,
    # and chunk only above that. In practice nothing in this category reaches
    # that, so the chunked path below is now a fallback that should never run.
    #
    # 60 GiB is only safe because Nextcloud's PHP scratch dir now lives on the
    # NAS (apps/nextcloud/pvc-scratch.yaml). PHP buffers the whole PUT body to
    # a temp file first, so this number is a claim about the SIZE OF THAT
    # BUFFER, not just about what the server will accept. It was briefly 64 GiB
    # while the buffer was still on the cluster's root disk, and a 50 GB upload
    # took Nextcloud down 40 minutes in. Never raise this without checking
    # where sys_temp_dir points and how much room is actually there.
    #
    # This inverts the earlier assumption. Chunking was introduced because
    # Apache capped a request at 1 GiB; with APACHE_BODY_LIMIT=0 that cap is
    # gone, and chunking turns out to be the FRAGILE path here, not the safe
    # one. Its final MOVE reassembles the file by reading every chunk back out
    # of S3 on the server, and that read fails on this hardware: chunks all
    # verified byte-correct and summing exactly, MOVE returns 201, Nextcloud
    # logs "Stream from assembly node shorter than expected", no file appears.
    # Reproduced at 256 MiB and again at 64 MiB, so it is not chunk size.
    # A single PUT streams straight into the object store and never does that
    # read - and it halves the traffic across the NAS, which serves both the
    # NFS source and the MinIO destination.
    SIMPLE_MAX=${NEXTCLOUD_SIMPLE_MAX:-64424509440}
    TMPD="/tmp/qbit-upload.$$"

    # Percent-encode what torrent names reliably contain and URLs reliably
    # mishandle. Path separators are deliberately left alone - here they are
    # structure, not data - so this is only applied to a whole relative path.
    urlenc() {
      printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/ /%20/g' \
        -e 's/#/%23/g' -e 's/?/%3F/g' -e 's/&/%26/g' -e 's/+/%2B/g' \
        -e 's/\[/%5B/g' -e 's/\]/%5D/g'
    }

    # MKCOL creates exactly ONE collection and fails when its parent is missing,
    # so a nested path has to be walked a component at a time. A PUT into a
    # collection that does not exist answers 409 Conflict, so getting this wrong
    # does not slow the upload down, it stops it completely.
    #
    # No -f: 405 Method Not Allowed is what an existing collection returns, and is
    # the expected answer on every run after the first.
    mkcol_one() {
      curl -g -s -o /dev/null --max-time 30 -u "$USER:$PASS" \
        -X MKCOL "$BASEURL${1:+/$(urlenc "$1")}" || true
    }
    # Walk "a/b/c" as a, a/b, a/b/c. Called with "" it creates only the base.
    mkcol_p() {
      _acc=""
      _rest="$1"
      mkcol_one ""
      while [ -n "$_rest" ]; do
        _seg="${_rest%%/*}"
        if [ "$_seg" = "$_rest" ]; then _rest=""; else _rest="${_rest#*/}"; fi
        [ -n "$_seg" ] || continue
        _acc="${_acc:+$_acc/}$_seg"
        mkcol_one "$_acc"
      done
    }

    # -g (--globoff) on EVERY curl call below, including the ones whose URL is
    # already percent-encoded. curl applies its own glob expansion - {a,b} and
    # [1-3] ranges - to the UPLOAD FILE NAME as well as the URL, so `-T` on a
    # path like "Red Dead Redemption [DODI Repack]/Setup.exe" dies with
    # "bad range in URL" before a byte is sent. Scene release names contain
    # brackets constantly, so this is the common case, not the edge case.
    #
    # What Nextcloud says this file's size is, or empty if it does not exist.
    # Used both to skip work and - more importantly - to check it afterwards.
    remote_size() {
      curl -g -sI --max-time 60 -u "$USER:$PASS" "$1" 2>/dev/null \
        | tr -d "\r" | awk 'tolower($1) == "content-length:" {print $2}'
    }

    # One plain PUT. Only used for files under CHUNK_BYTES.
    put_simple() {
      curl -g -fsS --max-time 14400 --retry 3 -u "$USER:$PASS" -T "$1" "$2" >/dev/null 2>&1
    }

    # Nextcloud chunked upload (the v2 /remote.php/dav/uploads flow the desktop
    # client uses). MANDATORY here, not an optimisation: the largest file in this
    # category is 95 GB, and a single PUT cannot carry it at any Apache setting -
    # PHP's post_max_size is 16G, so 16 GiB is the hard ceiling on one request.
    # Chunking also means one failed 256 MiB PUT costs 256 MiB, not 95 GB.
    #
    # Each chunk is staged to a temp file rather than piped from dd, so every
    # request carries a real Content-Length. Piping would make curl fall back to
    # Transfer-Encoding: chunked, which is a second thing to be right about
    # against Apache's body limit for no benefit.
    put_chunked() {
      _src="$1"; _dst="$2"; _size="$3"
      _uid="qbit-$(date +%s)-$$-$4"
      # The Destination header on MKCOL is what lets Nextcloud stream the chunks
      # straight into an S3 multipart upload instead of assembling them on disk
      # first - this instance's primary storage is MinIO on the NAS.
      curl -g -s -o /dev/null --max-time 60 -u "$USER:$PASS" \
        -X MKCOL -H "Destination: $_dst" "$UPLOADS/$_uid" || true
      mkdir -p "$TMPD"
      _n=0; _off=0
      while [ "$_off" -lt "$_size" ]; do
        _n=$((_n + 1))
        # How many bytes this chunk must contain. The last one is short by
        # design; every other one is exactly CHUNK_BYTES.
        _want=$((_size - _off))
        [ "$_want" -gt "$CHUNK_BYTES" ] && _want=$CHUNK_BYTES
        # iflag=fullblock, AND a size check afterwards.
        #
        # Without fullblock, dd counts a SHORT read as a whole block: a read()
        # that returns less than bs still consumes one of `count`. Over NFS
        # under concurrent load that is routine, and the result is a chunk
        # that is quietly too small. This is not hypothetical - it is what
        # actually happened, and the damage was done three layers away:
        # every chunk PUT returned 2xx, the MOVE returned 2xx, the log said
        # `ok (7377 MiB chunked)`, and the file was absent, because Nextcloud
        # rejected the assembly with "Stream from assembly node shorter than
        # expected, got 213364620 bytes, expected 268435456" into its own log
        # and answered the client as if nothing were wrong.
        #
        # The explicit size check stays even with fullblock set. dd's
        # short-read behaviour is the known cause; a truncated chunk is the
        # thing that must never be uploaded, and those are different claims.
        _try=0
        while [ "$_try" -lt 3 ]; do
          _try=$((_try + 1))
          dd if="$_src" of="$TMPD/chunk" bs=1048576 \
             skip=$((_off / 1048576)) count="$CHUNK_MB" iflag=fullblock 2>/dev/null
          _have=$(stat -c %s "$TMPD/chunk" 2>/dev/null || echo 0)
          [ "$_have" = "$_want" ] && break
          log "short read on chunk $_n (got $_have, want $_want) - retry $_try"
        done
        if [ "$_have" != "$_want" ]; then
          log "CHUNK SHORT after $_try tries, aborting $_src"
          rm -rf "$TMPD"
          curl -g -s -o /dev/null --max-time 60 -u "$USER:$PASS" -X DELETE "$UPLOADS/$_uid" || true
          return 1
        fi
        if ! curl -g -fsS --max-time 1800 --retry 3 -u "$USER:$PASS" \
             -T "$TMPD/chunk" "$UPLOADS/$_uid/$(printf '%010d' "$_n")" >/dev/null 2>&1; then
          log "CHUNK FAILED $_n of $_src"
          rm -rf "$TMPD"
          curl -g -s -o /dev/null --max-time 60 -u "$USER:$PASS" -X DELETE "$UPLOADS/$_uid" || true
          return 1
        fi
        _off=$((_off + CHUNK_BYTES))
      done
      rm -rf "$TMPD"
      # OC-Total-Length lets Nextcloud verify the assembled size; a mismatch is
      # rejected here rather than surfacing as a quietly truncated file.
      curl -g -fsS --max-time 3600 -u "$USER:$PASS" \
        -X MOVE -H "Destination: $_dst" -H "OC-Total-Length: $_size" \
        "$UPLOADS/$_uid/.file" >/dev/null 2>&1
    }

    SEQ=0
    upload() {
      _f="$1"; _url="$2"
      _sz=$(stat -c %s "$_f" 2>/dev/null || echo 0)
      SEQ=$((SEQ + 1))
      # Skip what is already there at the right size. This is what makes a
      # re-run cheap and therefore what makes the whole thing resumable: a
      # 113 GB backfill interrupted by a pod restart picks up where it
      # stopped instead of starting again, and re-firing the hook on a
      # torrent costs one HEAD per file.
      if [ "$(remote_size "$_url")" = "$_sz" ]; then
        log "skip (already there, $_sz B) $_url"
        echo "skip $_sz" >> "$RESULTS"
        return
      fi
      if [ "$_sz" -le "$SIMPLE_MAX" ]; then
        put_simple "$_f" "$_url" || true
      else
        # Do NOT fall back to chunking. It does not work here - the MOVE
        # returns 201 and writes nothing - so attempting it burns an hour and
        # ends in the same place, except louder. Skip loudly instead, so the
        # file is visibly outstanding rather than quietly retried forever.
        log "TOO LARGE ($_sz B > $SIMPLE_MAX) - needs more scratch disk on the Nextcloud host: $_f"
        echo "toobig $_sz" >> "$RESULTS"
        return
      fi
      # ASK THE SERVER, DO NOT BELIEVE THE EXIT CODE. A 7.2 GB chunked upload
      # reported success - every chunk PUT returned 2xx and the final MOVE
      # exited 0 - and the file was simply not there afterwards: a HEAD on it
      # answered 404 while the log line above it said "ok". An upload that
      # reports success and delivers nothing is worse than one that fails,
      # because the retry never happens. The only trustworthy statement about
      # whether a file is in Nextcloud comes from Nextcloud.
      _got=$(remote_size "$_url")
      if [ "$_got" = "$_sz" ]; then
        log "ok ($((_sz / 1048576)) MiB) $_url"
        echo "ok $_sz" >> "$RESULTS"
      else
        log "VERIFY FAILED (sent $_sz B, server reports '${_got:-absent}') $_url"
        echo "fail $_sz" >> "$RESULTS"
      fi
    }

    # A completed, fully verified torrent gets its remote folder renamed to
    # "<name> [FINISHED]" so it is obvious at a glance which games are safe to
    # pull down. The marker means "every file uploaded AND verified against
    # the server", not "the upload script ran".
    #
    # THE TRAP THIS AVOIDS: once renamed, a later sweep looking for "<name>"
    # finds nothing and cheerfully re-uploads 50 GB. So the destination folder
    # is resolved BEFORE anything is uploaded - if the [FINISHED] folder
    # already exists, that is where we look and the skip-if-present checks hit
    # it correctly.
    FIN_SUFFIX="${NEXTCLOUD_FINISHED_SUFFIX:- [FINISHED]}"
    TNAME=$(basename "$PATH_ARG")
    FINNAME="${TNAME}${FIN_SUFFIX}"
    REMOTE_DIR="$TNAME"
    if [ "$(curl -g -s -o /dev/null -w "%{http_code}" --max-time 60 -u "$USER:$PASS" \
            -X PROPFIND -H "Depth: 0" "$BASEURL/$(urlenc "$FINNAME")/")" = "207" ]; then
      REMOTE_DIR="$FINNAME"
      ALREADY_FINISHED=1
    else
      ALREADY_FINISHED=0
    fi

    if [ -d "$PATH_ARG" ]; then
      # rel is relative to the PARENT, so the torrent's own folder name is part of
      # the destination path. Made relative to $PATH_ARG itself - as this was -
      # every torrent's files land side by side in /qbittorrent, and two repacks
      # that both ship a `setup.exe` overwrite each other.
      LASTDIR=""
      # -name '*.!qB' excluded: that suffix marks a file qBittorrent has not
      # finished writing. AutoRun only fires on completion so it should never
      # match here, but the same script is what backfills already-finished
      # torrents by hand, and there it matters - it is how an unfinished torrent
      # gets noticed instead of half-uploaded.
      find "$PATH_ARG" -type f ! -name '*.!qB' | while read -r f; do
        # Relative to the torrent folder, then re-rooted at REMOTE_DIR, so the
        # same tree lands under either "<name>" or "<name> [FINISHED]".
        rel="$REMOTE_DIR/${f#"$PATH_ARG"/}"
        dir="${rel%/*}"
        [ "$dir" = "$rel" ] && dir=""
        # One MKCOL walk per directory, not per file.
        if [ "$dir" != "$LASTDIR" ]; then
          mkcol_p "$dir"
          LASTDIR="$dir"
        fi
        upload "$f" "$BASEURL/$(urlenc "$rel")"
      done
    else
      mkcol_p ""
      upload "$PATH_ARG" "$BASEURL/$(urlenc "$(basename "$PATH_ARG")")"
    fi
    log "done $PATH_ARG"

    # Tell somebody. Until now the only way to know a game had finished
    # uploading - or silently failed - was to read a log file inside a pod,
    # which is exactly how a broken hook stayed broken for days.
    #
    # Goes to the ntfy relay on the Proxmox host (docs/ntfy.md); the downloads
    # NetworkPolicy already allows 192.168.1.153:9098. Best-effort by design:
    # a notification that cannot be delivered must never fail an upload that
    # succeeded, hence the || true and the short timeout.
    NTFY="${NTFY_URL:-http://192.168.1.153:9098/homelab-media}"
    NAME=$(basename "$PATH_ARG")
    # `|| true`, NOT `|| echo 0`. grep -c PRINTS "0" and EXITS 1 when it
    # matches nothing, so `|| echo 0` appends a second zero and the variable
    # becomes the two-line string "0\n0". Every `[ "$n_fail" = "0" ]` test then
    # silently fails, which is what stopped the [FINISHED] rename from ever
    # firing and would have put "0\n0" in the notification counts.
    count() { c=$(grep -c "^$1 " "$RESULTS" 2>/dev/null || true); echo "${c:-0}"; }
    n_ok=$(count ok)
    n_fail=$(count fail)
    n_skip=$(count skip)
    n_big=$(count toobig)
    gb=$(awk '$1=="ok"{s+=$2} END {printf "%.1f", s/1073741824}' "$RESULTS" 2>/dev/null)
    rm -f "$RESULTS"

    # Nothing actually moved and nothing broke: a re-run over a torrent that
    # was already complete. Staying quiet is the point - otherwise every sweep
    # notifies about every finished game and the alerts stop being read.
    if [ "$n_ok" = "0" ] && [ "$n_fail" = "0" ] && [ "$n_big" = "0" ]; then
      exit 0
    fi

    # Mark it finished ONLY if nothing failed and nothing was skipped for being
    # too large - i.e. every file is on the server at the right size, which the
    # per-file verify already established.
    if [ "$n_fail" = "0" ] && [ "$n_big" = "0" ] && [ "$ALREADY_FINISHED" = "0" ]; then
      if curl -g -fsS --max-time 120 -u "$USER:$PASS" -X MOVE \
           -H "Destination: $BASEURL/$(urlenc "$FINNAME")" \
           -H "Overwrite: F" \
           "$BASEURL/$(urlenc "$TNAME")" >/dev/null 2>&1; then
        log "marked finished: $FINNAME"
        REMOTE_DIR="$FINNAME"
      else
        log "could not rename to '$FINNAME' (upload itself is fine)"
      fi
    fi

    if [ "$n_fail" != "0" ] || [ "$n_big" != "0" ]; then
      title="Upload INCOMPLETE: $NAME"
      prio="high"
      tags="warning"
      body="$n_ok uploaded (${gb} GB), $n_fail failed, $n_big too large, $n_skip already present"
    else
      title="Upload complete: $NAME"
      prio="default"
      tags="white_check_mark"
      body="$n_ok files, ${gb} GB uploaded to Nextcloud ($n_skip already present)"
    fi
    curl -g -fsS --max-time 20 \
      -H "Title: $title" -H "Priority: $prio" -H "Tags: $tags" \
      -d "$body" "$NTFY" >/dev/null 2>&1 || log "ntfy notify failed (upload result unaffected)"
