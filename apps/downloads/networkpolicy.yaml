---
# Killswitch NetworkPolicy for the migrated downloads pod.
#
# With the gluetun sidecar removed, the pod has its own network interface
# and COULD reach the internet directly. This policy is the killswitch:
# egress is locked to cluster-internal services and the VPN gateway's
# Shadowsocks proxy ONLY. Direct internet egress (0.0.0.0/0) is DENIED.
#
# If the VPN gateway goes down, the download stack can still reach DB,
# redis, DNS, and the kube-system OIDC endpoints, but cannot reach the
# internet - which is the correct failure mode (no traffic without the
# tunnel, rather than traffic without the tunnel).
#
# CAVEAT: qBittorrent's SOCKS5 proxy only carries TCP traffic. UDP-based
# DHT and UDP tracker announces would need to be disabled or proxied
# separately. MAM trackers are TCP-only, so this is acceptable for the
# MAM use case.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: downloads
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik, for the qui UI.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 7476
          protocol: TCP
        - port: 8089
          protocol: TCP
    # qui and Prowlarr reach qBittorrent's WebUI.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: downloads
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
      ports:
        - port: 8080
          protocol: TCP
    # Lidarr drives slskd through its API, and both Lidarr and Readarr drive
    # qBittorrent's WebUI.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lidarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: books
      ports:
        - port: 5030
          protocol: TCP
        - port: 8080
          protocol: TCP
    # Octo's Subsonic/admin port. There is deliberately no Ingress for it
    # (see the header of octo.yaml), so today this only admits the kubelet's
    # `kubectl port-forward`, which is how it is reached and verified. It is
    # also the rule a Traefik route would need if the owner ever decides on an
    # edge design - which requires a /rest carve-out and a header-strip
    # middleware, not just an Ingress object.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 5274
          protocol: TCP
  egress:
    # k3s apiserver, reachable only by ipBlock.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
      - ipBlock:
          cidr: 192.168.1.0/24
      ports:
      - port: 6443
        protocol: TCP
    # DNS. CoreDNS resolves hostnames; namespace-qualified.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-namespace: qui -> qBittorrent.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: downloads
    # qui -> Prowlarr.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
      ports:
        - port: 9696
          protocol: TCP
    # OIDC discovery via the Traefik LoadBalancer.
    - to:
      - ipBlock:
          cidr: 192.168.1.240/32
      ports:
      - port: 443
        protocol: TCP
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - port: 8443
        protocol: TCP
      - port: 8000
        protocol: TCP
    # The shared VPN gateway. qBittorrent's SOCKS5 tracker/peer traffic,
    # slskd's Soulseek connections, and seedboxapi's MAM API calls go through
    # Shadowsocks (8388); Octo's Last.fm and metadata calls go through
    # gluetun's HTTP proxy (8888), because .NET's HttpClient speaks HTTP
    # CONNECT natively and has no SOCKS support worth relying on. This is the
    # only path to the public internet - the killswitch.
    #
    # 8888 was missing until Octo needed it, and its absence was silent in the
    # usual way: the vpn namespace's own policy has always admitted 8888 from
    # here, so the ingress half looked correct while every proxied request
    # died on this side with a bare connection refused. Both ends, always.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vpn
      ports:
        - {port: 8388, protocol: TCP}
        - {port: 8388, protocol: UDP}
        - {port: 8888, protocol: TCP}
        # 1080: the plain SOCKS5 sidecar in the gateway pod. 8388 is
        # Shadowsocks - an encrypted protocol a SOCKS5 client cannot speak -
        # so qBittorrent's [Proxy] Type=5 block pointed at 8388 could never
        # have worked. Verified: curl --socks5-hostname timed out against 8388
        # from this namespace and succeeded against 1080 from remux.
        - {port: 1080, protocol: TCP}
    # Octo proxies everything it does not answer itself through to Navidrome,
    # and calls it again to trigger a rescan once a track lands. The matching
    # ingress rule is in apps/navidrome/networkpolicy.yaml.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: navidrome
      ports:
        - port: 4533
          protocol: TCP
    # Octo's fallback acquisition path: hand an album to Lidarr instead of
    # fetching it from Soulseek. Matching ingress in
    # apps/lidarr/networkpolicy.yaml. Open ahead of the credential - the API
    # key is not yet synced into this namespace - so that enabling Lidarr is a
    # Secret change and not a policy change on two sides.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lidarr
      ports:
        - port: 8686
          protocol: TCP
    # MinIO on the NAS, for JuiceFS-backed volumes.
    - to:
        - ipBlock:
            cidr: 192.168.1.67/32
      ports:
        - port: 9000
          protocol: TCP
    # Nextcloud's internal DAV endpoint, for the qBittorrent AutoRun upload
    # hook (category "nextcloud" -> WebDAV PUT into the bot's files area).
    # Goes to the cluster-internal Service (nextcloud.nextcloud.svc.cluster.local),
    # not the public Traefik host, so the upload is not rate-limited. Nextcloud's
    # own NetworkPolicy must allow this ingress - see apps/nextcloud/networkpolicy.yaml.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
      ports:
        - port: 8080
          protocol: TCP
