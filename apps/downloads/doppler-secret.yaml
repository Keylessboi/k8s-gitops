---
# AirVPN credentials, synced from Doppler.
#
# This is the ONLY step needed to bring the torrent stack online: set the four
# AIRVPN_* values in Doppler (kubernetes / prd) and the operator writes them
# into the `airvpn` Secret here within resyncSeconds. Nothing is committed to
# git, and no kubectl is needed - which is the whole point.
#
# `secrets:` restricts the sync to exactly these four keys. Without it the
# operator would mirror the ENTIRE Doppler config into this namespace, handing
# every unrelated credential in the project to a torrent client that runs
# untrusted peer traffic. `processors.asName` renames them to the kebab-case
# keys gluetun's env references expect.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: airvpn
  namespace: downloads
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: kubernetes
  config: prd
  secrets:
    - AIRVPN_PRIVATE_KEY
    - AIRVPN_PRESHARED_KEY
    - AIRVPN_ADDRESSES
    - AIRVPN_SERVER_COUNTRIES
  processors:
    AIRVPN_PRIVATE_KEY:
      asName: private-key
      type: plain
    AIRVPN_PRESHARED_KEY:
      asName: preshared-key
      type: plain
    AIRVPN_ADDRESSES:
      asName: addresses
      type: plain
    AIRVPN_SERVER_COUNTRIES:
      asName: server-countries
      type: plain
  managedSecret:
    name: airvpn
    namespace: downloads
    type: Opaque
  resyncSeconds: 60
