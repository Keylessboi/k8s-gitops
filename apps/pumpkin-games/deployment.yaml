apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pumpkin-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pumpkin
spec:
  # Always on: idle it uses ~60 MiB, so unlike the Paper server there is no
  # wake/stop dance and no nightly stop job.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pumpkin-games
      app.kubernetes.io/instance: pumpkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pumpkin-games
        app.kubernetes.io/instance: pumpkin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Storage node, like the Paper server it replaces (and like Lidarr): the
      # local-path volume binds there on first use. It carries the
      # storage=true:NoSchedule taint.
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      initContainers:
        # Pumpkin rewrites pumpkin.toml with every default on start, so the
        # file is copied over from git each time (git stays the source of
        # truth), and the plugin comes from the image so it always matches the
        # server build it was compiled against.
        - name: install-config-and-plugins
          image: ghcr.io/keylessboi/sandstorm-pumpkin@sha256:e60502d593e8a40fd3f997168f8b1344547586fb1cec8f9bc32268022278cbb0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /cfg/pumpkin.toml /data/pumpkin.toml
              mkdir -p /data/plugins
              cp /opt/pumpkin/plugins/*.wasm /data/plugins/
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /cfg, readOnly: true}
      containers:
        - name: pumpkin
          image: ghcr.io/keylessboi/sandstorm-pumpkin@sha256:e60502d593e8a40fd3f997168f8b1344547586fb1cec8f9bc32268022278cbb0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: RUST_BACKTRACE, value: "1"}
          ports:
            - {containerPort: 25565, name: java}
          readinessProbe:
            tcpSocket: {port: java}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: java}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "6", memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pumpkin-data
        - name: config
          configMap:
            name: pumpkin-config
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
# ClusterIP only. Pumpkin runs in offline mode, so anything that can open this
# port can join under any name: the only way in is apps/notmc's bridge, which
# binds each player to their Authentik account, and the NetworkPolicy admits
# nothing else. (It used to be a MetalLB LoadBalancer on 25565 for Java clients.)
apiVersion: v1
kind: Service
metadata:
  name: pumpkin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pumpkin-games
    app.kubernetes.io/instance: pumpkin
  ports:
    - {name: java, port: 25565, targetPort: java, protocol: TCP}
