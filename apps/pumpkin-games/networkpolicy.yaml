# Default deny both ways, then one flow in (the game port) and DNS out. The
# server needs nothing else from the network: telemetry is off in
# pumpkin.toml and offline mode makes no Mojang session calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Players. Who can actually reach this address is decided by the router
    # and Tailscale, not here.
    - from:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 25565}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
