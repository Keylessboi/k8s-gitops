# Default deny both ways, then one flow in (the game port, from the notmc
# bridge only) and DNS out. The
# server needs nothing else from the network: telemetry is off in
# pumpkin.toml and offline mode makes no Mojang session calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # The browser bridge, and nothing else: offline mode makes this port a way
    # in under any name. apps/notmc/networkpolicy.yaml is the other end.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: notmc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: notmc-bridge
      ports:
        - {protocol: TCP, port: 25565}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
