# Default deny both ways, then one flow in (the game port, from the notmc
# bridge only) and DNS out. The
# server needs nothing else from the network: telemetry is off in
# pumpkin.toml and offline mode makes no Mojang session calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # The notmc namespace, which holds the browser bridge. Offline mode makes
    # this port a way in under any name, so nothing else may reach it. The
    # selector stops at the namespace on purpose: this app's kustomization adds
    # its own labels to every pod selector, including ones naming another app.
    # apps/notmc/networkpolicy.yaml lets only the bridge pod egress here.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: notmc
      ports:
        - {protocol: TCP, port: 25565}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
