# Pumpkin games: a Rust Minecraft server (Pumpkin) with the sandstorm-games
# plugin (lobby, TNT Run, Mob Arena). Java Edition 26.3 clients, no browser.
# Replaced apps/games-hub (Paper + Eaglercraft), retired from git on
# 2026-11-02. See docs/pumpkin-games.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: pumpkin-games
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: pumpkin-games
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: pumpkin-games

labels:
  - pairs:
      app.kubernetes.io/name: pumpkin-games
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: games
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: true

resources:
  - namespace.yaml
  - deployment.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: pumpkin-config
    files:
      - pumpkin.toml

components:
  - ../../components/protect-state
