---
# Nextcloud application code, config and tmp on the NVMe-backed encrypted pool
# `fast` on the NAS (aes-256-gcm, key in /etc/zfs/keys on the host, same custody
# as tank), instead of the HDD mirror `tank`.
#
# WHY. tank is 93% full and 49% fragmented; every PHP request stats thousands of
# files over NFS and every pod start made kubelet chown -R the whole tree, which
# held Nextcloud at Init for an hour on 2026-11-01. This tree is ~32k small files
# and a few GB - exactly what an SSD is for. User files are in MinIO, not here.
#
# The pool is a single file vdev on the NAS NVMe: NO REDUNDANCY. That is
# acceptable for restorable app code/config; do not put databases here. The old
# claim nextcloud-config-tank stays declared for rollback. Register entry D-11.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-config-fast
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nextcloud-config-fast
    volumeAttributes:
      server: 192.168.1.67
      share: /fast
      subDir: nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config-fast
  namespace: nextcloud
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: nextcloud-config-fast
  resources:
    requests:
      storage: 5Gi
---
# Same data, mounted as a LOCAL volume on the NAS node (no NFS in the path).
#
# 2026-11-01: Nextcloud on k3s-server read this tree over NFS and the CT's NFS
# client took ~1 s per new-file create on /fast (20 creates: 22 s) while pve's own
# client did 50 in 0.3 s. Root cause of the CT client's slowness was not found.
# The NAS is a cluster node, /fast is local disk there, and lidarr, navidrome and
# music already use this exact pattern - so run Nextcloud on the NAS node.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-config-fast-local
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /fast/nextcloud
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [nas]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config-fast-local
  namespace: nextcloud
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: nextcloud-config-fast-local
  resources:
    requests:
      storage: 5Gi
