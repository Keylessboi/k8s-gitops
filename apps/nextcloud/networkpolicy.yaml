apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: allow-traefik-ingress
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    # The chart's service is 8080, not 80. The old value silently blocked all
    # ingress traffic to the app.
    - port: 8080
      protocol: TCP
    - port: 80
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
