apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: allow-traefik-ingress
spec:
  ingress:
  # cert-manager creates HTTP-01 solver pods in this namespace on demand and
  # Traefik must reach them on 8089. Without this the ACME challenge 502s and
  # no certificate is ever issued for this host.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8089
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    # The chart's service is 8080, not 80. The old value silently blocked all
    # ingress traffic to the app.
    - port: 8080
      protocol: TCP
    - port: 80
      protocol: TCP
  # qBittorrent's AutoRun hook pushes completed torrents to a bot WebDAV
  # account over the cluster-internal DAV endpoint. This is the ingress side
  # of that handshake; the egress side lives in apps/downloads/networkpolicy.yaml.
  #
  # 80, for exactly the reason the kube-system rule above already carries both
  # numbers: the port matched here is this pod's containerPort, not the
  # Service port in front of it. Written as 8080 alone, this rule admitted
  # traffic to a port nothing in the pod listens on and silently rejected
  # every WebDAV PUT.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: downloads
    ports:
    - port: 80
      protocol: TCP
    - port: 8080
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
