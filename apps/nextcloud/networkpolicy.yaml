apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: allow-traefik-ingress
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 80
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
