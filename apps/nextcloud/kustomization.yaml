---
# Nextcloud: self-hosted cloud storage and office suite.
# Database lives in the shared PostgreSQL; user files live in MinIO S3 as
# Nextcloud's primary object store, so the only volume is application code.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: nextcloud

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: productivity
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc-config.yaml
  - pvc-scratch.yaml
  - networkpolicy.yaml
  - ingress.yaml

helmCharts:
  - name: nextcloud
    repo: https://nextcloud.github.io/helm/
    version: 6.6.10
    releaseName: nextcloud
    namespace: nextcloud
    valuesInline:
      image:
        repository: nextcloud
        # `stable-fpm` is FastCGI on :9000 and needs a separate nginx sidecar
        # that was never enabled, so nothing ever served HTTP. `stable` is
        # apache-based and serves directly.
        tag: stable
      nextcloud:
        host: nextcloud.sandstorm.chat
        # TLS terminates at Traefik, so Nextcloud only ever sees plain HTTP and
        # was redirecting to http:// URLs. These make it aware it is behind a
        # TLS proxy; without them login redirects downgrade to HTTP.
        extraEnv:
          # Apache's LimitRequestBody, which this image defaults to 1 GiB.
          # That default is what answered the first real upload from the
          # qBittorrent hook with a bare 413 after 0 bytes sent.
          #
          # 0 means "no Apache limit" - NOT unlimited. PHP's post_max_size and
          # upload_max_filesize (16G, in phpConfigs below) remain the real
          # ceiling, so this hands the decision to the one place it is already
          # configured rather than having two limits disagree.
          #
          # The point is not merely to allow bigger PUTs. It is to make single
          # PUTs possible for multi-GB files so they DO NOT take the chunked
          # /remote.php/dav/uploads path, whose final MOVE reassembles the file
          # by reading every chunk back out of S3. That read is what fails here:
          # with the chunks all verified byte-correct on the server and their
          # sizes summing exactly, the MOVE still returns 201 while Nextcloud
          # logs "Stream from assembly node shorter than expected" and no file
          # appears. Reproduced at both 256 MiB and 64 MiB chunk sizes.
          - name: APACHE_BODY_LIMIT
            value: "0"
          - name: OVERWRITEPROTOCOL
            value: https
          - name: OVERWRITEHOST
            value: nextcloud.sandstorm.chat
          - name: OVERWRITECLIURL
            value: https://nextcloud.sandstorm.chat
          # Traefik's pod CIDR - required before Nextcloud will honour
          # X-Forwarded-* headers at all.
          - name: TRUSTED_PROXIES
            value: 10.42.0.0/16
          # SMTP, from the Doppler-synced `smtp` secret in this namespace.
          # Nextcloud's image reads these directly into config.php on startup,
          # so mail works without touching the admin UI - share notices,
          # password resets and activity digests all need a working sender.
          # MAIL_FROM_ADDRESS and MAIL_DOMAIN are the two halves of the from
          # address: Nextcloud joins them as <MAIL_FROM_ADDRESS>@<MAIL_DOMAIN>,
          # so the full address is NOT taken from the secret's `from` key.
          - name: MAIL_FROM_ADDRESS
            value: nextcloud
          - name: MAIL_DOMAIN
            value: sandstorm.chat
          - name: SMTP_SECURE
            value: tls
          - name: SMTP_AUTHTYPE
            value: LOGIN
          - name: SMTP_HOST
            valueFrom:
              secretKeyRef: {name: smtp, key: host}
          - name: SMTP_PORT
            valueFrom:
              secretKeyRef: {name: smtp, key: port}
          - name: SMTP_NAME
            valueFrom:
              secretKeyRef: {name: smtp, key: username}
          - name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef: {name: smtp, key: password}
        configs:
          # Nextcloud refuses outbound HTTP to private addresses by default, and
          # CoreDNS now resolves authentik.sandstorm.chat to the load balancer
          # (see apps/coredns). OIDC discovery therefore failed with
          # "Host 192.168.1.240 ... violates local access rules" and the
          # "Log in with authentik" button 404'd. The Authentik integration docs
          # call for exactly this setting when the IdP is reachable locally.
          local-servers.config.php: |
            <?php
            $CONFIG = array (
              'allow_local_remote_servers' => true,
            );
        # S3 as PRIMARY storage, which is what the plan asks for: MinIO
        # primary, NFS only as a media-streaming fallback. Nextcloud speaks S3
        # natively, so this needs no filesystem gateway - which is what sank
        # the JuiceFS approach.
        #
        # Credentials come from the existing nextcloud-s3 secret by reference;
        # host and bucket are not secret and stay readable here.
        #
        # autoCreate is false deliberately: the bucket is provisioned on the
        # NAS, and letting an app create its own bucket hides a misconfigured
        # endpoint until data has already been written somewhere unintended.
        objectStore:
          s3:
            enabled: true
            existingSecret: nextcloud-s3
            secretKeys:
              accessKey: access-key
              secretKey: secret-key
            host: 192.168.1.67
            port: "9000"
            ssl: false
            # MinIO serves buckets by path, not by DNS subdomain.
            usePathStyle: true
            region: us-east-1
            bucket: nextcloud-data
            autoCreate: false
        existingSecret:
          enabled: true
          secretName: nextcloud-admin
          usernameKey: admin-user
          passwordKey: admin-password
        phpConfigs:
          # 10G, and here is why it is not larger.
          #
          # PHP buffers the ENTIRE PUT body to a temp file in the container's
          # /tmp before Nextcloud writes it to S3. That /tmp is the LXC's root
          # disk - the same disk k3s runs on - with ~31 GB free. So
          # post_max_size is not just a policy limit, it is a promise about how
          # much local scratch a single request may consume, and 64G was a
          # promise this host cannot keep.
          #
          # Measured, not assumed: a 50 GB single PUT was observed writing a
          # steadily growing php* temp file (2.4 GB -> 2.8 GB while watched,
          # and still growing after the client was killed), and Nextcloud died
          # exactly 40 minutes into that upload - about 29 GB at the ~12 MB/s
          # this hardware sustains, which is precisely where the free space
          # ran out. Liveness probe 500, container exit 255, and every
          # in-flight upload failing in the same second.
          #
          # 10G leaves ~21 GB of headroom and still covers every file in the
          # torrent category except one 50 GB repack, which cannot be uploaded
          # by any path available here: the chunked route's server-side
          # reassembly is broken (see doctor-log), and the single-PUT route is
          # bounded by this disk. Fixing that needs either more disk on CT 200
          # or PHP's temp dir moved onto the NAS.
          #
          # This is the ganesha-log lesson again: the thing that fills the
          # cluster's root disk does not announce itself as a disk problem.
          #
          # These are what actually bound a single PUT now that Apache's
          # LimitRequestBody is out of the way (APACHE_BODY_LIMIT=0 above), and
          # a single PUT is the ONLY path that works here for large files -
          # the chunked upload's server-side reassembly reads every chunk back
          # out of S3 and fails, returning 201 while writing nothing. Verified:
          # a 7.7 GB file that failed three times as 29x256 MiB chunks and
          # again as 116x64 MiB chunks uploaded first try as one PUT, 636s at
          # 12.1 MB/s, HEAD confirming 7735833460 bytes.
          #
          # 64G covers the largest file in the torrent category (a 50 GB
          # repack) with headroom. At the ~12 MB/s this hardware sustains that
          # is a ~70 minute request, which is why max_execution_time is 0
          # rather than the old 3600 - a one-hour cap would kill the upload at
          # roughly the 50 GB mark, and the failure would look like a network
          # problem rather than a limit.
          uploadlimit.ini: |
            upload_max_filesize = 64G
            post_max_size = 64G
            max_input_time = -1
            max_execution_time = 0
            ; Both of these, not just one. upload_tmp_dir covers multipart form
            ; uploads; sys_temp_dir is what php://temp spills to, and THAT is
            ; the one a WebDAV PUT actually uses. Setting only the obvious one
            ; would leave the 50 GB buffer exactly where it was.
            upload_tmp_dir = /scratch
            sys_temp_dir = /scratch
      internalDatabase:
        enabled: false
      externalDatabase:
        enabled: true
        type: postgresql
        # Central Postgres, not a per-app cluster.
        host: app-databases-rw.databases.svc.cluster.local
        database: nextcloud
        existingSecret:
          enabled: true
          # Doppler-managed. The old value pointed at a `nextcloud-db` secret
          # with keys db-username/db-password that nothing ever created, while
          # CNPG emits username/password — so auth could never have worked.
          secretName: nextcloud-db-credentials
          usernameKey: username
          passwordKey: password
      # User files go to S3 directly, not to a volume. Nextcloud supports
      # object storage as its primary store, so it needs no gateway - this is
      # the "S3 primary storage" the plan calls for, in its purest form.
      # Credentials come from a Doppler-managed secret.
      objectStore:
        s3:
          enabled: true
          host: 192.168.1.67
          port: 9000
          ssl: false
          usePathStyle: true
          bucket: nextcloud-data
          autoCreate: false
          existingSecret: nextcloud-s3
          secretKeys:
            accessKey: access-key
            secretKey: secret-key
      persistence:
        # Application code only. User data is in S3 above, so nextcloud-data
        # is no longer mounted.
        enabled: true
        existingClaim: nextcloud-config
      nodeSelector:
        kubernetes.io/os: linux
        homelab/node-class: compute
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      # Use the ONE shared Redis instead of standing up a second one here.
      redis:
        enabled: false
      externalRedis:
        enabled: true
        host: redis-master.redis.svc.cluster.local
        port: 6379
        existingSecret: redis-auth
        existingSecretPasswordKey: redis-password
      service:
        main:
          ports:
            http:
              port: 8080

# Mount the scratch PVC and make it writable, as a strategic-merge patch on the
# Deployment rather than through chart values.
#
# Deliberate choice: this chart's extraVolumes/extraVolumeMounts keys would be
# quicker, but a mistyped or renamed chart value fails SILENTLY - it renders
# nothing and the pod comes up looking healthy with the buffer still on the root
# disk. That is the exact failure mode that cost this repo two outages and three
# broken hooks. A patch that does not match its target makes kustomize fail
# loudly instead.
#
# The initContainer exists because the NFS CSI driver creates the subdirectory
# root-owned 0755 and Nextcloud runs as www-data (33); without it every upload
# fails with permission denied on the temp file.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nextcloud
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nextcloud
      spec:
        template:
          spec:
            initContainers:
              - name: scratch-perms
                image: busybox:1.36
                command: ["sh", "-c", "chmod 1777 /scratch && echo scratch ready"]
                volumeMounts:
                  - name: nextcloud-scratch
                    mountPath: /scratch
            containers:
              - name: nextcloud
                volumeMounts:
                  - name: nextcloud-scratch
                    mountPath: /scratch
            volumes:
              - name: nextcloud-scratch
                persistentVolumeClaim:
                  claimName: nextcloud-scratch
