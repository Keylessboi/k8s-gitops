---
# Nextcloud: self-hosted cloud storage and office suite.
# Database lives in the shared PostgreSQL; user files live in MinIO S3 as
# Nextcloud's primary object store, so the only volume is application code.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: nextcloud

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: productivity
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc-config.yaml
  - networkpolicy.yaml
  - ingress.yaml

helmCharts:
  - name: nextcloud
    repo: https://nextcloud.github.io/helm/
    version: 6.6.10
    releaseName: nextcloud
    namespace: nextcloud
    valuesInline:
      image:
        repository: nextcloud
        # `stable-fpm` is FastCGI on :9000 and needs a separate nginx sidecar
        # that was never enabled, so nothing ever served HTTP. `stable` is
        # apache-based and serves directly.
        tag: stable
      nextcloud:
        host: nextcloud.sandstorm.chat
        # TLS terminates at Traefik, so Nextcloud only ever sees plain HTTP and
        # was redirecting to http:// URLs. These make it aware it is behind a
        # TLS proxy; without them login redirects downgrade to HTTP.
        extraEnv:
          - name: OVERWRITEPROTOCOL
            value: https
          - name: OVERWRITEHOST
            value: nextcloud.sandstorm.chat
          - name: OVERWRITECLIURL
            value: https://nextcloud.sandstorm.chat
          # Traefik's pod CIDR - required before Nextcloud will honour
          # X-Forwarded-* headers at all.
          - name: TRUSTED_PROXIES
            value: 10.42.0.0/16
        configs:
          # Nextcloud refuses outbound HTTP to private addresses by default, and
          # CoreDNS now resolves authentik.sandstorm.chat to the load balancer
          # (see apps/coredns). OIDC discovery therefore failed with
          # "Host 192.168.1.240 ... violates local access rules" and the
          # "Log in with authentik" button 404'd. The Authentik integration docs
          # call for exactly this setting when the IdP is reachable locally.
          local-servers.config.php: |
            <?php
            $CONFIG = array (
              'allow_local_remote_servers' => true,
            );
        # S3 as PRIMARY storage, which is what the plan asks for: MinIO
        # primary, NFS only as a media-streaming fallback. Nextcloud speaks S3
        # natively, so this needs no filesystem gateway - which is what sank
        # the JuiceFS approach.
        #
        # Credentials come from the existing nextcloud-s3 secret by reference;
        # host and bucket are not secret and stay readable here.
        #
        # autoCreate is false deliberately: the bucket is provisioned on the
        # NAS, and letting an app create its own bucket hides a misconfigured
        # endpoint until data has already been written somewhere unintended.
        objectStore:
          s3:
            enabled: true
            existingSecret: nextcloud-s3
            secretKeys:
              accessKey: access-key
              secretKey: secret-key
            host: 192.168.1.67
            port: "9000"
            ssl: false
            # MinIO serves buckets by path, not by DNS subdomain.
            usePathStyle: true
            region: us-east-1
            bucket: nextcloud-data
            autoCreate: false
        existingSecret:
          enabled: true
          secretName: nextcloud-admin
          usernameKey: admin-user
          passwordKey: admin-password
        phpConfigs:
          uploadlimit.ini: |
            upload_max_filesize = 16G
            post_max_size = 16G
            max_input_time = 3600
            max_execution_time = 3600
      internalDatabase:
        enabled: false
      externalDatabase:
        enabled: true
        type: postgresql
        # Central Postgres, not a per-app cluster.
        host: app-databases-rw.databases.svc.cluster.local
        database: nextcloud
        existingSecret:
          enabled: true
          # Doppler-managed. The old value pointed at a `nextcloud-db` secret
          # with keys db-username/db-password that nothing ever created, while
          # CNPG emits username/password — so auth could never have worked.
          secretName: nextcloud-db-credentials
          usernameKey: username
          passwordKey: password
      # User files go to S3 directly, not to a volume. Nextcloud supports
      # object storage as its primary store, so it needs no gateway - this is
      # the "S3 primary storage" the plan calls for, in its purest form.
      # Credentials come from a Doppler-managed secret.
      objectStore:
        s3:
          enabled: true
          host: 192.168.1.67
          port: 9000
          ssl: false
          usePathStyle: true
          bucket: nextcloud-data
          autoCreate: false
          existingSecret: nextcloud-s3
          secretKeys:
            accessKey: access-key
            secretKey: secret-key
      persistence:
        # Application code only. User data is in S3 above, so nextcloud-data
        # is no longer mounted.
        enabled: true
        existingClaim: nextcloud-config
      nodeSelector:
        kubernetes.io/os: linux
        homelab/node-class: compute
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      # Use the ONE shared Redis instead of standing up a second one here.
      redis:
        enabled: false
      externalRedis:
        enabled: true
        host: redis-master.redis.svc.cluster.local
        port: 6379
        existingSecret: redis-auth
        existingSecretPasswordKey: redis-password
      service:
        main:
          ports:
            http:
              port: 8080
