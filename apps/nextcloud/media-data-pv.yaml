---
# Read-only view of the shared media volume, so Nextcloud can SHOW the games
# instead of holding a second copy of them.
#
# WHY THIS EXISTS. Every game uploaded through the qBittorrent hook is stored
# twice on the same ZFS pool: once as the torrent being seeded under
# /extra/nfs-csi/data/torrents, and again as objects inside MinIO, because
# MinIO is Nextcloud's S3 primary storage. That is ~84 GB of pure duplication
# and growing, plus hours of upload time per game.
#
# Reflinks cannot fix that, which is worth writing down because it is the
# obvious idea: block cloning IS enabled on this pool (zfs 2.4.99), but MinIO
# does not store objects as plain files - it writes its own xl.meta/part layout
# and the bytes arrive over HTTP through the S3 API, so there is no file for
# the filesystem to clone. ZFS block cloning also does not work across
# datasets, and these are tank/extra vs tank.
#
# The only way to not store it twice is to not copy it: mount the real
# directory and let Nextcloud index it in place.
#
# ReadOnlyMany, and readOnly on the mount: Nextcloud must never be able to
# delete or alter a file that qBittorrent is actively seeding.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-nextcloud
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - ro
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: media-data-nextcloud
    volumeAttributes:
      server: 192.168.1.67
      share: /extra/nfs-csi
      subDir: data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: nextcloud
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: media-data-nextcloud
  resources:
    requests:
      storage: 500Gi
---
# Keep the /Games external mount indexed.
#
# files_external does NOT populate Nextcloud's file cache on its own. A new
# game appears on disk instantly, but the web UI shows only what has already
# been scanned - which is why /Games listed 2 of 11 games right after it was
# created, and every game added later would have had the same problem.
#
# `files:scan` on just that path is cheap (19 folders / 46 files in ~1s) and
# has no upload to do, because the files are read in place.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: games-mount-scan
  namespace: nextcloud
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: scan
              # alpine/k8s, NOT bitnami/kubectl. Bitnami withdrew their public
              # Docker Hub tags, so `bitnami/kubectl:1.31.5` now 404s on the
              # registry - verified directly, and `bitnamilegacy/kubectl` does
              # not carry that tag either. This CronJob sat in
              # ImagePullBackOff for over two days, long enough to start
              # logging TooManyMissedTimes, and nothing alerted.
              #
              # NOT rancher/kubectl, which was tried first and fails at a
              # different layer: it is DISTROLESS, so `command: ["/bin/sh"]`
              # dies with `stat /bin/sh: no such file or directory` and exit
              # 128 before the args ever run. The tag resolving 200 proves
              # nothing about whether the container can start - this args block
              # needs a shell, so the image must ship one.
              #
              # alpine/k8s carries kubectl on top of Alpine, so /bin/sh exists.
              # Pinned by digest: a withdrawn or re-pushed tag is exactly how
              # this broke, and it broke silently.
              image: alpine/k8s:1.31.5@sha256:0c132d5bc912d29c8baea41c83da1963bd8227c2c1bab489cb0ce88c3a3a4c35
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  POD=$(kubectl get pods -n nextcloud -l app.kubernetes.io/name=nextcloud \
                        --field-selector=status.phase=Running \
                        -o jsonpath='{.items[0].metadata.name}')
                  echo "scanning /Games on $POD"
                  kubectl exec -n nextcloud "$POD" -c nextcloud -- \
                    php occ files:scan --path="93bf5393-663d-4d7d-956b-7339595dc4af/files/Games"
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
          serviceAccountName: games-mount-scan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: games-mount-scan
  namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: games-mount-scan
  namespace: nextcloud
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: games-mount-scan
  namespace: nextcloud
subjects:
  - kind: ServiceAccount
    name: games-mount-scan
    namespace: nextcloud
roleRef:
  kind: Role
  name: games-mount-scan
  apiGroup: rbac.authorization.k8s.io
