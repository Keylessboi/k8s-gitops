apiVersion: v1
kind: Namespace
metadata:
  name: image-updater
  labels:
    homelab/data-class: c4
    homelab/criticality: tier-1
    app.kubernetes.io/name: image-updater
    app.kubernetes.io/part-of: homelab
    # The controller runs as non-root with a read-only root filesystem and no
    # added capabilities, so it clears `restricted` rather than just `baseline`.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
