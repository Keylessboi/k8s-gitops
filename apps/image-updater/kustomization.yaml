---
# ArgoCD Image Updater. Watches the registries behind our images and commits
# tag bumps back to this repo, so an update is a reviewable commit rather than
# a manual edit someone remembers to make.
#
# Runs in its own namespace, not in argocd. ArgoCD applies cluster-scoped RBAC
# with `kubectl auth reconcile`, which requires the Application's destination
# namespace to exist - and the root ApplicationSet derives that from the
# directory name. Targeting the argocd namespace therefore left the ClusterRole
# and ClusterRoleBinding permanently SyncFailed on `namespaces "image-updater"
# not found`, and without them the controller could not even list its own CRs.
#
# The ImageUpdater CR itself stays in the argocd namespace, because the
# controller derives the namespace it searches for Applications from the CR's
# own namespace - not from `argocd.namespace`, which it ignored entirely
# ("Listing all applications in target namespace: image-updater ... found 0").
# `watch.namespaces` is what tells the controller to look there for CRs.
#
# That split is also why there is no `namespace:` transformer below: it would
# rewrite the CR's namespace along with everything else. Each resource states
# its own instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: image-updater
  annotations:
    # After argocd itself is up, before the apps it will be updating.
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: image-updater
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd


# `labels` with includeSelectors:false, NOT `commonLabels` - commonLabels
# rewrites Deployment selectors, which are immutable.
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: gitops
      homelab/tier: platform
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - imageupdaters.yaml

helmCharts:
  - name: argocd-image-updater
    repo: https://argoproj.github.io/argo-helm
    version: 1.3.1
    releaseName: image-updater
    namespace: image-updater
    includeCRDs: true
    valuesInline:
      config:
        # Where the Argo CD Applications live.
        argocd.namespace: argocd
        # ...and where to look for ImageUpdater CRs. Without this the controller
        # watches only its own namespace, where there are no Applications to
        # match, and every cycle ends "considering 0 application(s)".
        watch.namespaces: argocd
        # Attribution for the commits it makes, so `git log` shows who bumped a
        # tag without anyone having to guess.
        git.user: argocd-image-updater
        git.email: argocd-image-updater@sandstorm.chat
        log.level: info
      nodeSelector:
        homelab/node-class: compute
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
