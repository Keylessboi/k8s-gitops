---
# What Image Updater is allowed to bump, and how far.
#
# Declared as ImageUpdater CRs rather than annotations on each Application.
# Applications here are generated by one ApplicationSet template, so annotating
# them individually would mean a conditional per app inside a template that is
# already dense - this keeps the policy readable and in one file.
#
# Every image is constrained by an allowTags regex that pins the major version
# (and the minor, for 0.x images, where semver permits breaking changes in a
# minor bump). The updater picks the highest tag matching the pattern, so an
# update can never silently cross a major version.
#
# Write-back is git, not the default `argocd` method. The `argocd` method patches
# the live Application, which this cluster's ApplicationSet would overwrite on its
# next regeneration - the update would silently vanish. Committing to the repo is
# also the only form that respects "changes go through git".
#
# Deliberately NOT managed here:
#   lidarr        pinned to ghcr.io/hotio/lidarr:pr-plugins on purpose
#   books         readarr is on the nightly channel; calibre tags are V-prefixed
#   prowlarr      tags are 2.5.2.5491-ls156 - four components plus a build suffix,
#                 not semver, so no constraint can be expressed safely
#   vaultwarden   tags are 1.34.1-1-alpine, same problem
#   helm-based apps (authentik, nextcloud, immich, traefik, cert-manager, metallb,
#                 cnpg, crowdsec, doppler, nfs-csi, monitoring) - the chart version
#                 pins the image, and moving one without the other mismatches the
#                 templates the chart renders
#   databases, redis - data services, pinned on purpose
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homelab
  namespace: argocd
spec:
  writeBackConfig:
    # `git:secret:<ns>/<name>` rather than plain `git`: plain git makes the
    # controller look for an ArgoCD *repository* secret, which has to carry the
    # argocd.argoproj.io/secret-type label - and the Doppler operator's managed
    # secrets cannot be given extra labels. This form points at an ordinary
    # secret instead, which Doppler can produce directly.
    method: git:secret:image-updater/image-updater-git
    gitConfig:
      # SSH, not the https URL the Applications use: the deploy key is the only
      # write credential, and GitHub deploy keys are SSH-only.
      repository: git@github.com:Keylessboi/k8s-gitops.git
      branch: main
  commonUpdateSettings:
    updateStrategy: semver
  applicationRefs:
    - namePattern: downloads
      writeBackConfig:
        gitConfig:
          writeBackTarget: kustomization:/apps/downloads
      images:
        - alias: qbittorrent
          imageName: lscr.io/linuxserver/qbittorrent:5.1.2
          commonUpdateSettings:
            allowTags: '^5\.\d+\.\d+$'
          manifestTargets:
            kustomize:
              name: lscr.io/linuxserver/qbittorrent
        - alias: gluetun
          imageName: qmcgaw/gluetun:v3.41.3
          commonUpdateSettings:
            allowTags: '^v3\.\d+\.\d+$'
          manifestTargets:
            kustomize:
              name: qmcgaw/gluetun
        - alias: slskd
          # 0.x: minor bumps may break, so this is pinned to the patch stream.
          imageName: slskd/slskd:0.23.2
          commonUpdateSettings:
            allowTags: '^0\.23\.\d+$'
          manifestTargets:
            kustomize:
              name: slskd/slskd
        - alias: qui
          imageName: ghcr.io/autobrr/qui:v1.26.0
          commonUpdateSettings:
            allowTags: '^v1\.\d+\.\d+$'
          manifestTargets:
            kustomize:
              name: ghcr.io/autobrr/qui

    - namePattern: navidrome
      writeBackConfig:
        gitConfig:
          writeBackTarget: kustomization:/apps/navidrome
      images:
        - alias: navidrome
          imageName: deluan/navidrome:0.58.0
          commonUpdateSettings:
            allowTags: '^0\.\d+\.\d+$'
          manifestTargets:
            kustomize:
              name: deluan/navidrome

    - namePattern: flaresolverr
      writeBackConfig:
        gitConfig:
          writeBackTarget: kustomization:/apps/flaresolverr
      images:
        - alias: flaresolverr
          imageName: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          commonUpdateSettings:
            allowTags: '^v3\.\d+\.\d+$'
          manifestTargets:
            kustomize:
              name: ghcr.io/flaresolverr/flaresolverr

    - namePattern: kiwix
      writeBackConfig:
        gitConfig:
          writeBackTarget: kustomization:/apps/kiwix
      images:
        - alias: kiwix-serve
          imageName: ghcr.io/kiwix/kiwix-serve:3.7.0
          commonUpdateSettings:
            allowTags: '^3\.\d+\.\d+$'
          manifestTargets:
            kustomize:
              name: ghcr.io/kiwix/kiwix-serve

    - namePattern: music
      writeBackConfig:
        gitConfig:
          writeBackTarget: kustomization:/apps/music
      images:
        - alias: beets
          imageName: lscr.io/linuxserver/beets:2.2.0
          commonUpdateSettings:
            allowTags: '^2\.\d+\.\d+$'
          manifestTargets:
            kustomize:
              name: lscr.io/linuxserver/beets
