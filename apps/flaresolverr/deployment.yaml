---
# Plain manifests: the bjw-s app-template chart ships an empty values.yaml,
# which kustomize's helmCharts generator cannot inflate.
#
# FlareSolverr is INTERNAL ONLY — no Ingress. It is a Cloudflare challenge
# solver used by Prowlarr and must never be publicly reachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          env:
            - name: TZ
              value: UTC
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8191
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            # FlareSolverr drives a headless Chromium; a check can easily exceed one
            # second while it is solving a challenge. Going NotReady empties its
            # Service endpoints, which is what makes callers see 'connection
            # refused' against a process that is working fine.
            timeoutSeconds: 15
            failureThreshold: 6
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flaresolverr
  ports:
    - name: http
      port: 8191
      targetPort: http
