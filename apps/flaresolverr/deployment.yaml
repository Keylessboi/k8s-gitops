---
# Plain manifests: the bjw-s app-template chart ships an empty values.yaml,
# which kustomize's helmCharts generator cannot inflate.
#
# FlareSolverr is INTERNAL ONLY — no Ingress. It is a Cloudflare challenge
# solver used by Prowlarr and must never be publicly reachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
    spec:
      # Pod-level, so it also covers anything added later. Without it the pod
      # runs seccomp Unconfined: this node's kubelet has seccompDefault=false,
      # so nothing applies a profile unless a manifest asks.
      #
      # A headless-Chromium workload is the ONE place RuntimeDefault normally
      # breaks things: Chromium's namespace sandbox calls clone() with
      # CLONE_NEWUSER|CLONE_NEWPID|CLONE_NEWNET, and the runtime's default
      # profile denies clone() with any namespace flag set. It is safe here
      # only because FlareSolverr already launches Chromium with --no-sandbox
      # and --disable-setuid-sandbox, so no namespace is ever created.
      # Verified against the running pod: every chromium process (browser, gpu,
      # renderer, utility) carries --no-sandbox. If FlareSolverr ever stops
      # passing that flag, this line has to come back out.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          env:
            - name: TZ
              value: UTC
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8191
          # Chromium is not a 1-CPU workload. Observed pegged at 940m CPU and
          # 1014Mi against exactly these limits - throttled and one allocation
          # away from an OOM kill - while every Prowlarr search and every
          # Anna's Archive lookup queued behind it. It then failed even a
          # 15-second readiness probe, lost its Service endpoints, and callers
          # saw "connection refused" from a process that was merely overloaded.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 3Gi
          readinessProbe:
            # FlareSolverr drives a headless Chromium; a check can easily exceed one
            # second while it is solving a challenge. Going NotReady empties its
            # Service endpoints, which is what makes callers see 'connection
            # refused' against a process that is working fine.
            timeoutSeconds: 15
            failureThreshold: 6
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flaresolverr
  ports:
    - name: http
      port: 8191
      targetPort: http
