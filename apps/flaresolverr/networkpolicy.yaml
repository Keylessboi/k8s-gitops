apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Lidarr, Prowlarr and book-downloader call FlareSolverr to solve Cloudflare
  # challenges. book-downloader was missing: its own namespace already allows
  # egress to flaresolverr:8191, but that only covers one direction, and this
  # ingress rule listed only the two *arrs - so every bypass attempt came back
  # as "Connection refused" from a service whose pod was healthy the whole time.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lidarr
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prowlarr
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: books
    ports:
    - port: 8191
      protocol: TCP
  # cert-manager creates HTTP-01 solver pods in this namespace on demand and
  # Traefik must reach them on 8089. Without this the ACME challenge 502s and
  # no certificate is ever issued for this host.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8089
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: flaresolverr
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8191
  egress:
  # k3s apiserver. Reachable ONLY via ipBlock: a namespaceSelector for the
  # "default" namespace matches PODS in it, never the 10.43.0.1 service IP, so
  # the old rule was a no-op. Every NetworkPolicy in this repo was missing real
  # API access, which hard-broke the API clients (nfs-csi provisioner, doppler
  # operator, cnpg operator, prometheus) and cascaded to every PVC and secret.
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  # k3s DNATs 10.43.0.1:443 to the node's own address before NetworkPolicy
  # egress is evaluated, so the Service rule above matches nothing for a new
  # connection and the API call fails. This is the defect that broke CNPG's
  # base backups and, here, kept the Doppler operator from ever winning leader
  # election - i.e. from ever syncing a secret.
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - port: 6443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
  # The internet. FlareSolverr had NO rule for this at all - its only 443 rule
  # targeted the "default" namespace, which matches pods in that namespace and
  # never an external address, so it was a no-op. FlareSolverr therefore could
  # not reach Cloudflare at all, and every solve ended as
  # "Error solving the challenge. Timeout after 60.0 seconds" - indistinguishable
  # from Cloudflare simply refusing.
  #
  # Port 80 as well as 443: driving a real browser through a challenge pulls
  # scripts and assets that are not all on 443.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 172.16.0.0/12
    ports:
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP

