---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: music
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 8337, protocol: TCP}
        - {port: 3000, protocol: TCP}
        - {port: 8089, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: music
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: music
    # NFS for the shared music library, and MinIO for JuiceFS volumes.
    - to:
        - ipBlock:
            cidr: 192.168.1.67/32
      ports:
        - {port: 2049, protocol: TCP}
        - {port: 9000, protocol: TCP}
    # MusicBrainz, Discogs and friends for tagging.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 80}
