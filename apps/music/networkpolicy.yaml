---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: music
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 8337, protocol: TCP}
        - {port: 3000, protocol: TCP}
        - {port: 8089, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: music
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {port: 443, protocol: TCP}
    # k3s DNATs 10.43.0.1:443 to the node's own address before NetworkPolicy
    # egress is evaluated, so the Service rule above matches nothing for a new
    # connection and the API call fails. This is the defect that broke CNPG's
    # base backups and, here, kept the Doppler operator from ever winning leader
    # election - i.e. from ever syncing a secret.
    - to:
      - ipBlock:
          cidr: 192.168.1.0/24
      ports:
      - port: 6443
        protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: music
    # NFS for the shared music library, and MinIO for JuiceFS volumes.
    - to:
        - ipBlock:
            cidr: 192.168.1.67/32
      ports:
        - {port: 2049, protocol: TCP}
        - {port: 9000, protocol: TCP}
    # MusicBrainz, Discogs and friends for tagging.
    # Reach our own services through the load balancer.
    # CoreDNS resolves *.sandstorm.chat to 192.168.1.240 in-cluster (see
    # apps/coredns), and the 0.0.0.0/0 rule below deliberately excludes
    # 192.168.0.0/16 - so without this rule that lookup succeeds and the connection
    # is then dropped. Needed by anything doing OIDC discovery against Authentik.
    - to:
      - ipBlock:
          cidr: 192.168.1.240/32
      ports:
      - port: 443
        protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 80}
