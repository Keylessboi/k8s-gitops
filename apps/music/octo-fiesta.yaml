---
# Octo-Fiesta: a Subsonic-API proxy, so a Subsonic client (Symfonium and
# friends) can browse an external catalogue alongside the local library.
#
# It is stateless - purely a protocol shim - so it gets no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octo-fiesta
  namespace: music
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: octo-fiesta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octo-fiesta
    spec:
      containers:
        - name: octo-fiesta
          image: ghcr.io/v1ck3s/octo-fiesta:latest
          env:
            - name: TZ
              value: UTC
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: octo-fiesta
  namespace: music
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: octo-fiesta
  ports:
    - name: http
      port: 3000
      targetPort: http
