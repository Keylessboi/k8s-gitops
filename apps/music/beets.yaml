---
# Beets: metadata enrichment and library organisation.
#
# It mounts the same NFS music share Navidrome reads, so anything it tags and
# files is immediately visible in Navidrome. That share is the one thing the
# plan keeps on NFS ("NFS fallback for media streaming only"), so Beets is the
# one app here that touches both tiers: JuiceFS for its own state, NFS for the
# library it curates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beets
  namespace: music
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beets
    spec:
      containers:
        - name: beets
          image: lscr.io/linuxserver/beets:2.2.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8337
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: inbox
              mountPath: /downloads
            - name: music
              mountPath: /music
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: beets-config
        - name: inbox
          persistentVolumeClaim:
            claimName: beets-inbox
        - name: music
          persistentVolumeClaim:
            claimName: music-library
---
apiVersion: v1
kind: Service
metadata:
  name: beets
  namespace: music
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beets
  ports:
    - name: http
      port: 8337
      targetPort: http
