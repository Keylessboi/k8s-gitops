---
# Beets: metadata enrichment and library organisation.
#
# It mounts the same NFS music share Navidrome reads, so anything it tags and
# files is immediately visible in Navidrome. That share is the one thing the
# plan keeps on NFS ("NFS fallback for media streaming only"), so Beets is the
# one app here that touches both tiers: JuiceFS for its own state, NFS for the
# library it curates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beets
  namespace: music
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beets
    spec:
      # Pod-level, so it also covers anything added later. Without it the pod
      # runs seccomp Unconfined: this node's kubelet has seccompDefault=false,
      # so nothing applies a profile unless a manifest asks. RuntimeDefault
      # blocks the syscalls the container runtime considers dangerous (mount,
      # unshare, kexec, bpf, keyctl, ...). Deliberately NOT paired with
      # runAsUser - this is a linuxserver.io image whose s6-overlay init starts
      # as root and drops to PUID/PGID itself, which needs only setuid/setgid.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beets
          image: lscr.io/linuxserver/beets:2.2.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8337
          # Raised from 500m/512Mi. This pod normally just serves the web
          # UI, but `kubectl exec ... beet import` is the obvious way to run
          # an ad-hoc import and 500m on an 11-core node throttled that to
          # half a core. beets' pipeline is a handful of stages, so it
          # cannot use more than a few cores no matter what; 4 is burst
          # headroom, not a reservation, and leaves qBittorrent (3500m),
          # flaresolverr (3000m) and Lidarr (2000m) their own.
          #
          # Memory stays modest on purpose: the node has 13824Mi total with
          # 10462Mi already in use. 1Gi covers beets plus an ImageMagick
          # resize of a full-resolution Cover Art Archive scan.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 1Gi
          # The container previously ran with no probe at all, so a wedged
          # `beet web` would have kept receiving traffic.
          #
          # Generous on purpose. An over-tight probe on Lidarr in this
          # cluster emptied a Service's endpoints and cost hours of
          # misdiagnosis, and this pod may be busy importing. GET / is the
          # web plugin's static UI - measured at 5ms in-container - not a
          # database query, but 10s and six failures means it takes two
          # minutes of genuine unresponsiveness to pull the endpoint.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
            # Mounted OVER the copy LSIO drops into the PVC. subPath, so
            # only this one file is replaced and /config stays writable for
            # state.pickle, musiclibrary.blb and beet.log.
            - name: config-file
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config-file
              mountPath: /config/chroma.yaml
              subPath: chroma.yaml
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: beets-config
        - name: config-file
          configMap:
            name: beets-config-file
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: beets
  namespace: music
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beets
  ports:
    - name: http
      port: 8337
      targetPort: http
