---
# A second claim on the SAME music library Navidrome serves.
#
# PVCs cannot cross namespaces, and a dynamically provisioned nfs-csi claim
# would get its own private subdirectory - Beets would tag files into a
# directory Navidrome never reads. This is a static PV pinned to the exact
# NFS path behind navidrome/navidrome-music, so both mount the same bytes.
#
# It stays on NFS deliberately: this is the music library itself, which is the
# media-streaming case the plan reserves NFS for.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-library-shared
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
  csi:
    driver: nfs.csi.k8s.io
    # Must be unique per PV and stable; it is not a generated name.
    volumeHandle: music-library-shared
    volumeAttributes:
      server: 192.168.1.67
      share: /extra/nfs-csi
      subDir: navidrome/navidrome-music
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-library
  namespace: music
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: music-library-shared
  resources:
    requests:
      storage: 100Gi
