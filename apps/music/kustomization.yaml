---
# Phase 3, scoped to what this single node can actually hold and what upstream
# still maintains.
#
#   Beets       - metadata enrichment; curates the library Navidrome serves.
#                 Its configuration lives in beets-config.yaml rather than in
#                 the PVC, and beets-import-cronjob.yaml is what actually runs
#                 `beet import` - the image itself only ever serves the web UI.
#
# Deliberately NOT included:
#   Funkwhale     - deployed 2026-09-01 and REMOVED 2026-09-03: it served
#                   zero tracks, cost 798 MiB across four containers, and its
#                   federation network is almost entirely Creative Commons
#                   and netlabel material rather than the catalogue this
#                   library is being built from. See docs/doctor-log.md.
#   ListenBrainz  - self-hosting needs Postgres + Redis + TimescaleDB +
#                   Couchbase + RabbitMQ, which is larger than everything
#                   already running on this node.
#   Tor / slskd   - excluded at the user's request.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: music
  annotations:
    argocd.argoproj.io/sync-wave: "20"

namespace: music

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: music
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - media-data-pv.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - beets-config.yaml
  - beets.yaml
  - beets-import-cronjob.yaml
