---
# Phase 3, scoped to what this single node can actually hold and what upstream
# still maintains.
#
#   Beets       - metadata enrichment; curates the library Navidrome serves.
#   Octo-Fiesta - Subsonic proxy for an external catalogue.
#
# Deliberately NOT included:
#   Funkwhale     - its Docker Hub images stopped at 1.2.10 in April 2023;
#                   current releases ship only via their GitLab registry.
#   ListenBrainz  - self-hosting needs Postgres + Redis + TimescaleDB +
#                   Couchbase + RabbitMQ, which is larger than everything
#                   already running on this node.
#   Tor / slskd   - excluded at the user's request.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: music
  annotations:
    argocd.argoproj.io/sync-wave: "20"

namespace: music

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: music
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - music-library-pv.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - beets.yaml
  - octo-fiesta.yaml
