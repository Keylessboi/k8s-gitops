# The iMessage bridge namespace. This app currently holds only the namespace and its network
# policy; the workloads (imessage-server and the XMPP bridge) are added here separately.
# The XMPP side is apps/ejabberd; design and wiring in docs/ejabberd.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: imessage
  annotations:
    argocd.argoproj.io/sync-wave: "20"
namespace: imessage
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: messaging
      homelab/tier: apps
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - phone-only-config.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Prune/Delete protection for PVCs, PVs, Namespaces and CNPG Clusters, so a
# manifest dropped from git never deletes live data. See ADR-0012.
components:
  - ../../components/protect-state
