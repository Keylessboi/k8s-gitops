---
# The Calibre library itself: the books, plus Calibre's metadata.db.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-library
  namespace: books
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 100Gi
---
# Calibre-Web-Automated's own settings and app database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cwa-config
  namespace: books
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
