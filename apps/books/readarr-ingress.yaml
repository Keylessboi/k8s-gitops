---
# Readarr, published behind Authentik.
#
# ingress.yaml says Readarr is deliberately NOT published because it is admin
# tooling with no meaningful auth of its own - the Lidarr exposure lesson.
# Publishing it BEHIND forward-auth is what answers that: Authentik supplies
# the authentication Readarr lacks, exactly as bookdl is handled next door.
# It is never reachable without an Authentik session.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readarr
  namespace: books
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd,kube-system-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - readarr.sandstorm.chat
      secretName: readarr-tls
  rules:
    - host: readarr.sandstorm.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: readarr
                port:
                  number: 8787
---
# The outpost callback for this host. Separate Ingress so forward-auth is not
# applied to the callback itself, which would loop.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: readarr-outpost
  namespace: books
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - readarr.sandstorm.chat
      secretName: readarr-tls
  rules:
    - host: readarr.sandstorm.chat
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 9000
