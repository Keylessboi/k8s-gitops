---
# The P2P acquisition path: Readarr driving Prowlarr indexers and the
# qBittorrent instance that sits behind gluetun.
#
# CAVEAT, stated plainly: upstream archived Readarr in 2025 and linuxserver's
# builds stop at 2025-06-27. This is pinned to that last build rather than to
# `nightly`, so it cannot silently change. It works, but it receives no fixes.
# The community forks (Librarr, janholtzhausen/readarr) are early and publish
# no reliable images yet; swap the tag here if one matures.
#
# The non-P2P path (book-downloader -> Anna's Archive) is unaffected by any of
# this and needs no VPN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: readarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readarr
    spec:
      containers:
        - name: readarr
          image: lscr.io/linuxserver/readarr:0.4.19-nightly
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
            # External Postgres instead of local SQLite. The *arr apps read
            # these as PostgresOptions and create their schema on first start.
            #
            # Postgres starts EMPTY - the app does not migrate its own data - so
            # the existing config is loaded separately once the schema exists.
            # Cutting over without that step silently presents an empty install.
            - name: READARR__POSTGRES__HOST
              value: app-databases-rw.databases.svc.cluster.local
            - name: READARR__POSTGRES__PORT
              value: "5432"
            - name: READARR__POSTGRES__MAINDB
              value: readarr_main
            - name: READARR__POSTGRES__LOGDB
              value: readarr_log
            # Readarr also opens a third database for its metadata cache.
            # Unset, it defaults to "readarr-cache" and aborts at startup with
            # 3D000 if that database does not exist.
            - name: READARR__POSTGRES__CACHEDB
              value: readarr_cache
            - name: READARR__POSTGRES__USER
              valueFrom:
                secretKeyRef: {name: readarr-db, key: user}
            - name: READARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef: {name: readarr-db, key: password}
          ports:
            - name: http
              containerPort: 8787
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            # Readarr files completed books into the same ingest volume CWA
            # watches, so both acquisition paths converge on one library.
            # The whole shared volume: /data/torrents/books (downloads) and
            # /data/ingest/books (Readarr's root folder) must be in one mount
            # for imports to hardlink.
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: readarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: readarr
  namespace: books
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: readarr
  ports:
    - name: http
      port: 8787
      targetPort: http
