---
# The NON-P2P acquisition path.
#
# Searches Anna's Archive and pulls books over plain HTTP straight into the
# shared ingest volume, where CWA picks them up. No torrents, no peers, no
# VPN dependency - which is why it does NOT live in the gluetun pod the way
# qBittorrent does.
#
# This is the path that keeps working when the VPN is down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-downloader
  namespace: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: book-downloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-downloader
    spec:
      containers:
        - name: downloader
          image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
          env:
            - name: FLASK_PORT
              value: "8084"
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: TZ
              value: UTC
            - name: INGEST_DIR
              value: /cwa-book-ingest
            # Anna's Archive sits behind Cloudflare; route challenges through
            # the FlareSolverr instance already running for the indexers.
            - name: USE_CF_BYPASS
              value: "true"
            - name: EXT_BYPASSER_URL
              value: http://flaresolverr.flaresolverr.svc.cluster.local:8191
          ports:
            - name: http
              containerPort: 8084
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: ingest
              mountPath: /cwa-book-ingest
      volumes:
        - name: ingest
          persistentVolumeClaim:
            claimName: book-ingest
---
apiVersion: v1
kind: Service
metadata:
  name: book-downloader
  namespace: books
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: book-downloader
  ports:
    - name: http
      port: 8084
      targetPort: http
