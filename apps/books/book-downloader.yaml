---
# The NON-P2P acquisition path.
#
# Searches Anna's Archive and pulls books over plain HTTP straight into the
# shared ingest volume, where CWA picks them up. No torrents, no peers, no
# VPN dependency - which is why it does NOT live in the gluetun pod the way
# qBittorrent does.
#
# This is the path that keeps working when the VPN is down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-downloader
  namespace: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: book-downloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-downloader
    spec:
      containers:
        - name: downloader
          image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
          env:
            - name: FLASK_PORT
              value: "8084"
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: TZ
              value: UTC
            # Same directory CWA watches, reached through the single /data
            # mount above rather than its own subPath mount.
            - name: INGEST_DIR
              value: /data/ingest/books
            # Anna's Archive sits behind Cloudflare; route challenges through
            # the FlareSolverr instance already running for the indexers.
            - name: USE_CF_BYPASS
              value: "true"
            # Hardcover, for metadata and want-to-read lists.
            - name: HARDCOVER_ENABLED
              value: "true"
            - name: HARDCOVER_API_KEY
              valueFrom:
                secretKeyRef: {name: bookdl-extras, key: hardcover-api-key}
            # qBittorrent, so torrent results can be grabbed rather than only
            # direct downloads. The category matches what Readarr already uses,
            # so completed books land in the same place under /data/torrents.
            - name: QBITTORRENT_URL
              value: http://qbittorrent.downloads.svc.cluster.local:8080
            - name: QBITTORRENT_USERNAME
              value: admin
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: bookdl-extras, key: qbittorrent-password}
            - name: QBITTORRENT_CATEGORY
              value: books
            - name: QBITTORRENT_CATEGORY_AUDIOBOOK
              value: books
            - name: QBITTORRENT_DOWNLOAD_DIR
              value: /data/torrents/books
            # THE key that makes every QBITTORRENT_* value above do anything.
            # Clients are not selected by "whichever one has a URL": every
            # client's is_configured() reads this selector and returns False
            # unless it names that client - QBittorrentClient.is_configured()
            # is literally `client == "qbittorrent" and bool(url)`. Left at its
            # default of "" the pod reported CONFIGURED_PROTOCOLS: [] and
            # get_client("torrent") -> None, so no torrent could be grabbed at
            # all and the settings above were inert.
            - name: PROWLARR_TORRENT_CLIENT
              value: qbittorrent
            # Both Readarr and this app push into the `books` category, so the
            # category alone cannot say who queued a torrent. The tag can.
            - name: QBITTORRENT_TAG
              value: shelfmark
            # Keep the torrent after import - removing it would delete the data
            # the hardlink below shares, and end seeding.
            - name: PROWLARR_TORRENT_ACTION
              value: keep
            # Hardlink rather than copy when moving a finished torrent into the
            # ingest folder - same filesystem, so the seed keeps its data and
            # the book is not stored twice. This is the TRaSH layout's whole
            # point and only works because both paths are on the one mount.
            - name: TORRENT_HARDLINK
              value: "true"
            # TORRENT_HARDLINK above is the pre-1.0 name and no longer reaches
            # the code that matters. should_hardlink() reads HARDLINK_TORRENTS
            # and only falls back to TORRENT_HARDLINK when that is None - but
            # HARDLINK_TORRENTS is a registered field, so it resolves to its
            # default of False rather than None and the fallback never fires.
            # The pod confirmed it: HARDLINK_TORRENTS=False, TORRENT_HARDLINK
            # =None. Everything above was copying, not hardlinking.
            - name: HARDLINK_TORRENTS
              value: "true"
            # Native OIDC, in addition to the forward-auth middleware on the
            # Ingress. Forward-auth alone authenticates at the edge and leaves
            # the app itself anonymous - every request arrives as the same
            # nobody, so its own user model and admin checks are inert. With
            # this the app knows who you are, and the Admin group maps through.
            # Both point at the same Authentik, so it is one login, not two.
            - name: AUTH_METHOD
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://authentik.sandstorm.chat/application/o/bookdl/.well-known/openid-configuration
            - name: OIDC_SCOPES
              value: openid email profile
            - name: OIDC_BUTTON_LABEL
              value: Authentik
            - name: OIDC_AUTO_PROVISION
              value: "true"
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: OIDC_GROUP_CLAIM
              value: groups
            - name: OIDC_USE_ADMIN_GROUP
              value: "true"
            - name: OIDC_ADMIN_GROUP
              value: Admin
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: bookdl-oidc, key: client-id}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: bookdl-oidc, key: client-secret}
            - name: EXT_BYPASSER_URL
              value: http://flaresolverr.flaresolverr.svc.cluster.local:8191
            # FlareSolverr is the bypasser, always. USE_CF_BYPASS above only
            # says "solve Cloudflare challenges"; it does not say who solves
            # them. Left at its default of false, the app instead drives its
            # own headless Chromium inside this pod - which will not fit in a
            # 512Mi limit. EXT_BYPASSER_URL above is deliberately the
            # fully-qualified service name: a bare `flaresolverr` host does not
            # resolve from another namespace.
            - name: USING_EXTERNAL_BYPASSER
              value: "true"
            # Default is 60000ms. A cold FlareSolverr working through an Anna's
            # Archive challenge on a box that is also serving the indexers
            # routinely needs longer than that. 120000 is inside the accepted
            # 10000-300000 range.
            - name: EXT_BYPASSER_TIMEOUT
              value: "120000"
            # Prowlarr, as a release source in its own right. The mirrors
            # below cover the open web; this covers everything Prowlarr already
            # authenticates against, so a book that only exists on a tracker is
            # reachable without a second search UI. Results are handed to
            # qBittorrent by the client selector above.
            - name: PROWLARR_ENABLED
              value: "true"
            # Fully-qualified, like every other cross-namespace URL here. A bare
            # `prowlarr` host resolves only inside the prowlarr namespace and is
            # the single mistake that has broken the most things in this cluster.
            - name: PROWLARR_URL
              value: http://prowlarr.prowlarr.svc.cluster.local:9696
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef: {name: bookdl-extras, key: prowlarr-api-key}
            # PROWLARR_INDEXERS is deliberately unset: empty means search every
            # indexer, which is what Prowlarr is for. Pinning a list here would
            # have to be re-edited every time an indexer is added or dies.
            #
            # Default is 90s. Several of these indexers sit behind the same
            # FlareSolverr this pod shares, and a cold challenge there routinely
            # outruns 90s - the symptom is an empty result set while the Prowlarr
            # log still shows the search running. Matches EXT_BYPASSER_TIMEOUT
            # above; max accepted is 300.
            - name: PROWLARR_INDEXER_TIMEOUT
              value: "120"
            # Book categories are inconsistently applied across trackers, so a
            # category-filtered search returning nothing is frequently wrong
            # rather than conclusive. Retry uncategorised before giving up.
            - name: PROWLARR_AUTO_EXPAND
              value: "true"
            # Honour each indexer's own seed ratio and seed time when handing a
            # torrent to qBittorrent. Private trackers enforce these; getting
            # them from Prowlarr means they are not maintained twice.
            - name: PROWLARR_USE_SEED_PREFERENCES
              value: "true"
            # NOT SET: PROWLARR_REMOTE_PATH_MAPPINGS. It carries
            # env_supported=False upstream, so it is UI-only and an env var for
            # it would be ignored outright. It is also unnecessary - a mapping
            # only rewrites a client-reported path, and qBittorrent reports
            # /data/torrents/books, which is the same absolute path this pod
            # sees through its own /data mount. With no mapping matched the code
            # uses the reported path unchanged, which is already correct.
            # Mirrors, so no single host is a single point of failure. Upstream
            # ships NO defaults at all (core/mirrors.py: DEFAULT_AA_MIRRORS and
            # friends are empty lists), so every direct-download source stays
            # locked out until these are set - which is why downloads have been
            # entirely dependent on whatever one host the app happened to try.
            # All four keys are comma-separated lists, not JSON.
            #
            # auto = try AA_MIRROR_URLS in order at startup and fail over on
            # error. Naming a specific mirror here would pin it and lose that.
            - name: AA_BASE_URL
              value: auto
            # Ordered deliberately: the .li/.pm/.gl/.pk domains all resolve
            # today, the canonical .org/.se are kept as trailing fallbacks.
            - name: AA_MIRROR_URLS
              value: https://annas-archive.li,https://annas-archive.pm,https://annas-archive.gl,https://annas-archive.pk,https://annas-archive.org,https://annas-archive.se
            # Tried in the order listed until one answers.
            - name: LIBGEN_MIRROR_URLS
              value: https://libgen.is,https://libgen.rs,https://libgen.st,https://libgen.la,https://libgen.vg,https://libgen.li
            # Z-Library and Welib use only the FIRST entry; the rest are here so
            # failing over is a one-line edit rather than research.
            - name: ZLIB_MIRROR_URLS
              value: https://z-lib.gd,https://z-lib.fm,https://z-library.sk
            - name: WELIB_MIRROR_URLS
              value: https://welib.org
            # The mirrors above are inert until the Direct Download source is
            # switched on - it is off by default, so this is what actually puts
            # AA/LibGen/Z-Lib/Welib in front of a search.
            - name: DIRECT_DOWNLOAD_ENABLED
              value: "true"
            # These two are JSON arrays, not comma lists (OrderableListField).
            # Fast sources first: LibGen needs no Cloudflare bypass at all, so
            # it is both the quickest path and the one that still works if
            # FlareSolverr is down - hence ahead of aa-fast, which self-disables
            # anyway because we have no donator key.
            - name: FAST_SOURCES_DISPLAY
              value: '[{"id": "libgen", "enabled": true}, {"id": "aa-fast", "enabled": true}]'
            # Slow sources, tried after those. aa-slow-wait is last on purpose:
            # it parks the download behind a countdown timer, so it should only
            # be reached once every mirror that fails fast has been tried.
            - name: SOURCE_PRIORITY
              value: '[{"id": "aa-slow-nowait", "enabled": true}, {"id": "zlib", "enabled": true}, {"id": "welib", "enabled": true}, {"id": "aa-slow-wait", "enabled": true}]'
            # Higher than the 10 / 5s defaults: each attempt now has several
            # mirrors to fall through, and challenge-solved requests are slow
            # enough that a 5s backoff just hammers a host that is rate-limiting.
            - name: MAX_RETRY
              value: "15"
            - name: DEFAULT_SLEEP
              value: "10"
            # Universal mode searches metadata first and then offers every
            # enabled release source (the mirrors above plus qBittorrent).
            # Direct mode would narrow searching back down to Anna's Archive.
            - name: SEARCH_MODE
              value: universal
            # Hardcover over the stock openlibrary: the API key is already wired
            # up above, and its series/edition data is the better of the two.
            - name: METADATA_PROVIDER
              value: hardcover
            # Comma-separated. Stock list omits PDF, which is the only format a
            # lot of technical books exist in.
            - name: SUPPORTED_FORMATS
              value: epub,mobi,azw3,pdf,fb2,djvu,cbz,cbr
            - name: BOOK_LANGUAGE
              value: en
            # Below the default of 3: one FlareSolverr instance is shared with
            # the Prowlarr indexers, and three concurrent challenge solves
            # starve it for everyone.
            - name: MAX_CONCURRENT_DOWNLOADS
              value: "2"
            # Cache metadata so repeat searches do not re-spend the Hardcover
            # API quota. 30min/1h, well inside the 604800s ceiling.
            - name: METADATA_CACHE_ENABLED
              value: "true"
            - name: METADATA_CACHE_SEARCH_TTL
              value: "1800"
            - name: METADATA_CACHE_BOOK_TTL
              value: "3600"
            # Covers cache under CONFIG_DIR (/config), which has no PVC behind
            # it - it is the container's writable layer. Keep it well under the
            # stock 500MB cap so a long-lived pod cannot quietly eat node disk.
            # TTL 0 means evict by size only, which is right for static artwork.
            - name: COVERS_CACHE_ENABLED
              value: "true"
            - name: COVERS_CACHE_MAX_SIZE_MB
              value: "200"
            - name: COVERS_CACHE_TTL
              value: "0"
            # Nav button through to the Calibre-Web library this app feeds,
            # so "did it actually land?" does not mean going and finding the
            # other tab.
            - name: CALIBRE_WEB_URL
              value: https://books.sandstorm.chat
            # There is no audiobook library in this cluster - no Audiobookshelf,
            # no audiobook ingest path - so the combined book+audiobook selector
            # only offers a way to drop an m4b into an ebook ingest folder that
            # CWA cannot import. Hidden rather than left to be clicked. For the
            # same reason DESTINATION_AUDIOBOOK, SUPPORTED_AUDIOBOOK_FORMATS and
            # the other audiobook keys are all left unset.
            - name: SHOW_COMBINED_SELECTOR
              value: "false"
            # Pinned rather than left to the default. "organize" builds author
            # and title folders, which upstream explicitly warns against for an
            # ingest folder - CWA watches for files, not trees. "rename" is
            # correct here and this makes an upstream default change unable to
            # quietly break the import.
            - name: FILE_ORGANIZATION
              value: rename
            # Default is 60s. This is the grace period for a completed torrent's
            # path to become visible to this pod, and /data is nfs-csi - the
            # directory entry qBittorrent just wrote is not necessarily visible
            # here the instant it says so. 180 costs nothing when the path is
            # already there and avoids a spurious import failure when it is not.
            - name: DOWNLOAD_CLIENT_COMPLETED_PATH_TIMEOUT
              value: "180"
            # Default 3600 drops a download off the queue view an hour after it
            # finishes, which is usually before anyone looks. 86400 is the
            # accepted maximum and makes the queue a day's worth of history.
            - name: STATUS_TIMEOUT
              value: "86400"
            # NOT SET: CUSTOM_SCRIPT (no post-import script exists to run, and
            # nothing is mounted that could hold one) and the EMAIL_* / SMTP
            # delivery keys (BOOKS_OUTPUT_MODE stays "folder" so files reach
            # CWA's ingest folder; email delivery would need SMTP credentials
            # that are not in Doppler).
            - name: LOG_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8084
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # ONE mount of the shared volume at /data, not two subPath mounts of
            # the same claim. Mounting a PVC twice in a single pod hangs the
            # nfs-csi driver: the pod sits in ContainerCreating indefinitely with
            # no FailedMount event to explain it. This also mirrors how
            # qBittorrent mounts the same claim, so the absolute paths agree
            # between the two containers, which is what lets the hardlink work.
            - name: data
              mountPath: /data
            # Persist /config. This is a DIFFERENT claim from the one above -
            # mounting the same claim twice is what hangs nfs-csi; two distinct
            # claims are fine.
            - name: config
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: config
          persistentVolumeClaim:
            claimName: bookdl-config
---
apiVersion: v1
kind: Service
metadata:
  name: book-downloader
  namespace: books
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: book-downloader
  ports:
    - name: http
      port: 8084
      targetPort: http
