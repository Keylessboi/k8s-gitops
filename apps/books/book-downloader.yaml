---
# The NON-P2P acquisition path.
#
# Searches Anna's Archive and pulls books over plain HTTP straight into the
# shared ingest volume, where CWA picks them up. No torrents, no peers, no
# VPN dependency - which is why it does NOT live in the gluetun pod the way
# qBittorrent does.
#
# This is the path that keeps working when the VPN is down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-downloader
  namespace: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: book-downloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: book-downloader
    spec:
      containers:
        - name: downloader
          image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
          env:
            - name: FLASK_PORT
              value: "8084"
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: TZ
              value: UTC
            # Same directory CWA watches, reached through the single /data
            # mount above rather than its own subPath mount.
            - name: INGEST_DIR
              value: /data/ingest/books
            # Anna's Archive sits behind Cloudflare; route challenges through
            # the FlareSolverr instance already running for the indexers.
            - name: USE_CF_BYPASS
              value: "true"
            # Hardcover, for metadata and want-to-read lists.
            - name: HARDCOVER_ENABLED
              value: "true"
            - name: HARDCOVER_API_KEY
              valueFrom:
                secretKeyRef: {name: bookdl-extras, key: hardcover-api-key}
            # qBittorrent, so torrent results can be grabbed rather than only
            # direct downloads. The category matches what Readarr already uses,
            # so completed books land in the same place under /data/torrents.
            - name: QBITTORRENT_URL
              value: http://qbittorrent.downloads.svc.cluster.local:8080
            - name: QBITTORRENT_USERNAME
              value: admin
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: bookdl-extras, key: qbittorrent-password}
            - name: QBITTORRENT_CATEGORY
              value: books
            - name: QBITTORRENT_CATEGORY_AUDIOBOOK
              value: books
            - name: QBITTORRENT_DOWNLOAD_DIR
              value: /data/torrents/books
            # Hardlink rather than copy when moving a finished torrent into the
            # ingest folder - same filesystem, so the seed keeps its data and
            # the book is not stored twice. This is the TRaSH layout's whole
            # point and only works because both paths are on the one mount.
            - name: TORRENT_HARDLINK
              value: "true"
            # Native OIDC, in addition to the forward-auth middleware on the
            # Ingress. Forward-auth alone authenticates at the edge and leaves
            # the app itself anonymous - every request arrives as the same
            # nobody, so its own user model and admin checks are inert. With
            # this the app knows who you are, and the Admin group maps through.
            # Both point at the same Authentik, so it is one login, not two.
            - name: AUTH_METHOD
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://authentik.sandstorm.chat/application/o/bookdl/.well-known/openid-configuration
            - name: OIDC_SCOPES
              value: openid email profile
            - name: OIDC_BUTTON_LABEL
              value: Authentik
            - name: OIDC_AUTO_PROVISION
              value: "true"
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: OIDC_GROUP_CLAIM
              value: groups
            - name: OIDC_USE_ADMIN_GROUP
              value: "true"
            - name: OIDC_ADMIN_GROUP
              value: Admin
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: bookdl-oidc, key: client-id}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: bookdl-oidc, key: client-secret}
            - name: EXT_BYPASSER_URL
              value: http://flaresolverr.flaresolverr.svc.cluster.local:8191
          ports:
            - name: http
              containerPort: 8084
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # ONE mount of the shared volume at /data, not two subPath mounts of
            # the same claim. Mounting a PVC twice in a single pod hangs the
            # nfs-csi driver: the pod sits in ContainerCreating indefinitely with
            # no FailedMount event to explain it. This also mirrors how
            # qBittorrent mounts the same claim, so the absolute paths agree
            # between the two containers, which is what lets the hardlink work.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: book-downloader
  namespace: books
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: book-downloader
  ports:
    - name: http
      port: 8084
      targetPort: http
