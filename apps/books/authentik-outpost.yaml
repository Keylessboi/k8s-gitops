---
# The Authentik outpost's own endpoints, routed under this app's hostname.
#
# Forward auth is only half the flow. After login, Authentik redirects the
# browser back to https://books.sandstorm.chat/outpost.goauthentik.io/callback,
# and that path has to reach the OUTPOST, not this application - otherwise the
# callback 404s and the login never completes. The Authentik docs require this
# route for every single-application forward-auth setup.
#
# Authentik's embedded outpost was creating an Ingress for this itself, but it
# claimed whole hostnames, attached none of our middlewares, and published
# Prowlarr - which has no Ingress in this repo at all. That was disabled;
# this is the same routing, declared here and scoped to one path.
#
# An Ingress cannot name a Service in another namespace, hence the ExternalName
# alias. Traefik is configured with allowExternalNameServices: true.
apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost
spec:
  type: ExternalName
  externalName: ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local
  ports:
    - name: http
      port: 9000
---
# A SEPARATE Ingress, deliberately: middleware annotations apply to every rule
# in an Ingress, so putting this path on the app's own Ingress would send the
# callback through forward auth as well - an endless redirect loop. Rate
# limiting and CrowdSec still apply; only the auth check is omitted.
#
# No cert-manager annotation here - it would race the app's own Ingress over
# the same secret. This just reuses the certificate that one obtains.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: books-outpost
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - books.sandstorm.chat
      secretName: books-tls
  rules:
    - host: books.sandstorm.chat
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 9000
