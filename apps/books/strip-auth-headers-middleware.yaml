---
# Removes identity headers that a client could send to the OPDS route, which has no
# forward-auth. Policy §9.7, HS-NET-07: blank every header that forward-auth passes on.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth-headers
  namespace: books
spec:
  headers:
    customRequestHeaders:
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-entitlements: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
      X-authentik-jwt: ""
      X-authentik-meta-jwks: ""
      X-authentik-meta-outpost: ""
      X-authentik-meta-provider: ""
      X-authentik-meta-app: ""
      X-authentik-meta-version: ""
