---
# Calibre-Web-Automated: the library UI, OPDS feed, format conversion and
# send-to-Kindle. It watches the ingest volume and files anything dropped
# there into the Calibre library automatically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web-automated
  namespace: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web-automated
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web-automated
    spec:
      containers:
        - name: cwa
          image: crocodilestick/calibre-web-automated:V3.1.4
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8083
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /calibre-library
            - name: ingest
              mountPath: /cwa-book-ingest
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cwa-config
        - name: library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: ingest
          persistentVolumeClaim:
            claimName: book-ingest
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web-automated
  namespace: books
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calibre-web-automated
  ports:
    - name: http
      port: 8083
      targetPort: http
