---
# Book stack with TWO acquisition paths that converge on one library:
#
#   non-P2P: book-downloader -> Anna's Archive over HTTP -> ingest volume
#   P2P:     REMOVED 2026-09-09. Readarr tracked 0 authors and 0 books after
#            weeks of running, is discontinued upstream by the Servarr team so
#            it will not get fixes, and cost 119 MB on a node that has been
#            down to ~107 MB free. book-downloader + Calibre-Web Automated is
#            the path that actually works, so having both was paying RAM for
#            nothing. Restore with `git revert` if the P2P route is ever
#            wanted back.
#            -> ingest volume
#
# Calibre-Web-Automated watches that shared ingest volume, converts formats as
# needed, files everything into the Calibre library, and serves it (web + OPDS
# + send-to-Kindle).
#
# The non-P2P path has no VPN dependency, so it keeps working when the tunnel
# is down.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: books
  annotations:
    argocd.argoproj.io/sync-wave: "20"

namespace: books

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: books
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - media-data-pv.yaml
  - pvc.yaml
  - pvc-bookdl-local.yaml
  - networkpolicy.yaml
  - calibre-web-automated.yaml
  - bookdl-settings-seed.yaml
  - book-downloader.yaml
  - ingress.yaml
  - authentik-outpost.yaml
  - book-downloader-ingress.yaml
  - opds-ingress.yaml
