---
# CoreDNS configuration. The Deployment, Service and RBAC are still the objects
# k3s created, but since 2026-09-14 k3s no longer manages them
# (coredns.yaml.skip on CT 200). The main Corefile is owned here, so upstream
# DNS goes to Quad9 over TLS - see coredns-corefile.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: coredns
  annotations:
    argocd.argoproj.io/sync-wave: "-5"

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: dns
      homelab/tier: platform
    includeSelectors: false

resources:
  - coredns-corefile.yaml
  - coredns-custom.yaml
