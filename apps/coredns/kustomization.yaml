---
# CoreDNS customisation. The CoreDNS deployment itself is k3s-managed and is
# deliberately not touched here; this only supplies the optional custom config
# it already imports.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: coredns
  annotations:
    argocd.argoproj.io/sync-wave: "-5"

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: dns
      homelab/tier: platform
    includeSelectors: false

resources:
  - coredns-custom.yaml
