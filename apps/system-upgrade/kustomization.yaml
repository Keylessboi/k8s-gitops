---
# system-upgrade-controller: upgrades k3s on both nodes from git (docs/host-updates.md,
# ADR-0014). The Plans in plans.yaml are the only thing to edit; Renovate bumps
# their `version:` (renovate.json, rule "k3s").
#
# The Namespace is declared inside system-upgrade-controller.yaml (upstream's
# layout), so there is no namespace.yaml and no `namespace:` transformer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: system-upgrade
  annotations:
    # CRDs and the controller must exist before the Plans that use them.
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: system-upgrade
    app.kubernetes.io/part-of: homelab

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: platform
      homelab/tier: platform
    includeSelectors: false

resources:
  - crd.yaml
  - system-upgrade-controller.yaml
  - networkpolicy.yaml
  - plans.yaml

# Prune/Delete protection for Namespaces (ADR-0012).
components:
  - ../../components/protect-state
