---
# Jellyfin media server + Gelato + AIOStreams.
#
# No longer privileged: the gluetun sidecar has been removed and replaced
# with the shared VPN gateway (apps/vpn). The pod no longer needs NET_ADMIN
# or /dev/net/tun. Baseline PodSecurity is sufficient for the remaining
# containers (jellyfin/aiostreams), which all pin hardened securityContexts.
#
# NOTE: This app is pending decommission per the owner.
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: homelab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
