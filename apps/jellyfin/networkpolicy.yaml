---
# Killswitch NetworkPolicy for the migrated jellyfin pod.
#
# With the gluetun sidecar removed, the pod has its own network interface
# and COULD reach the internet directly. This policy is the killswitch:
# egress is locked to cluster-internal services and the VPN gateway's
# HTTP proxy port ONLY. Direct internet egress (0.0.0.0/0) is DENIED.
#
# If the VPN gateway goes down, Jellyfin can still serve the local library
# (NFS is a node-level mount) but cannot fetch metadata or stream debrid
# sources - which is the correct failure mode.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: jellyfin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik (kube-system) -> Jellyfin WebUI/API on 8096, plus the cert-manager
    # HTTP-01 solver on 8089.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 8096, protocol: TCP}
        - {port: 8089, protocol: TCP}
    # The remux namespace, for the AIOStreams manifest fetch through the
    # aiostreams Service.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remux
      ports:
        - {port: 3000, protocol: TCP}
  egress:
    # DNS. CoreDNS resolves hostnames; namespace-qualified.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # OIDC, server-to-server: the SSO plugin fetches Authentik's token/userinfo
    # endpoints at authentik.sandstorm.chat, which CoreDNS answers as
    # 192.168.1.240 (the Traefik LoadBalancer). k3s DNATs 192.168.1.240:443 to
    # the Traefik pod at :8443 BEFORE this policy is evaluated.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 8443, protocol: TCP}
        - {port: 8000, protocol: TCP}
    # k3s apiserver, reachable only by ipBlock.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - {port: 443, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - {port: 6443, protocol: TCP}
    # The shared VPN gateway's HTTP proxy. AIOStreams' torrentio/debrid
    # queries and Jellyfin's metadata/plugin updates go through here.
    # This is the only path to the public internet - the killswitch.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vpn
      ports:
        - {port: 8888, protocol: TCP}
