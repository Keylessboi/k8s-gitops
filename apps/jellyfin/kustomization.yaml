---
# Jellyfin media server + Gelato (Stremio-addon search) + self-hosted AIOStreams,
# all inside one gluetun-tunnelled pod so every public stream fetch exits AirVPN
# with a killswitch. Local NFS library mounted read-only for direct-play.
#
# SSO is native OIDC via jellyfin-plugin-sso against Authentik (NOT forward-auth,
# which would break native mobile/TV clients - see ingress.yaml).
#
# The GitOps side here stands up the airtight infrastructure. The plugin
# installs, SSO provider config, Gelato wiring, playback policies and libraries
# are all pre-seeded server-side on the config PVC (see docs/jellyfin-gelato.md
# for what was automated and the shrunk owner click-list); only the real-client
# OIDC login test remains manual.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd

namespace: jellyfin

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: media
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - media-data-pv.yaml
  - pvc-config.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - ingress.yaml
