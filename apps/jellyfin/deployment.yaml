---
# Jellyfin + AIOStreams, with ALL public egress forced through gluetun.
#
# WHY they share one pod: Gelato (a Jellyfin plugin) proxies stream fetching
# THROUGH Jellyfin, and AIOStreams is what queries torrentio/debrid. So the
# process that pulls from public stream sources is Jellyfin's own egress. To be
# airtight behind AirVPN, Jellyfin AND AIOStreams therefore have to sit inside
# gluetun's network namespace: they get no interface of their own beyond the
# tunnel, and if the VPN drops gluetun's firewall drops the traffic instead of
# leaking the owner's real WAN IP to a tracker. This is the exact containment
# pattern proven in apps/downloads/qbittorrent.yaml, deliberately duplicated
# into its own pod rather than sharing the downloads pod (Jellyfin is heavy and
# a separate concern).
#
# The LOCAL library is unaffected by the tunnel: NFS is a node-level mount
# bind-mounted into the container, so library reads never traverse this pod's
# network namespace and keep working even with the tunnel down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: gluetun holds a single WireGuard session and
    # the config PVCs are RWX-but-single-writer SQLite. Two pods briefly
    # overlapping would double-connect the tunnel and contend on the DBs.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      securityContext:
        # fsGroup so the two small config PVCs (jellyfin-config, aiostreams-data)
        # and the /cache emptyDir are group-writable by uid 1000. OnRootMismatch,
        # never the default Always: fsGroup makes the kubelet recursively chown
        # every mounted volume, and over NFS that walk is O(files). The media
        # library root already carries GID 1000 (verified: /data/media is
        # 1000:1000) and is mounted read-only, so OnRootMismatch skips it and the
        # walk only ever touches the tiny config volumes.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # This node's kubelet has seccompDefault=false, so without this the whole
        # pod runs seccomp Unconfined. RuntimeDefault was MEASURED safe for
        # gluetun on this exact image in apps/downloads/qbittorrent.yaml (tunnel
        # setup is ioctl(TUNSETIFF)+netlink, both allowed; the denied set is
        # mount/unshare/bpf/keyctl, none of which gluetun, Jellyfin or AIOStreams
        # use). seccomp is orthogonal to the NET_ADMIN capability below.
        seccompProfile:
          type: RuntimeDefault
      containers:
        # --- The tunnel. Everything public exits through here. ---
        - name: gluetun
          # Pinned to the same build proven in the downloads pod. v3.40.0 aborts
          # at startup on this LXC's IPv6 link-local address ("for ip6tables:
          # failed cleaning up test rule"); v3.41.3 does not.
          image: qmcgaw/gluetun:v3.41.3
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: private-key
            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: preshared-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: airvpn
                  key: addresses
            # SERVER_COUNTRIES deliberately unset - gluetun filters AirVPN's
            # server list by literal country name, so any placeholder matches
            # nothing and startup fails. Omitting it means "anywhere", which is
            # what is wanted; the exit IP moves on reconnect and that is fine.
            #
            # THE KILLSWITCH BOUNDARY. Only these subnets bypass the tunnel:
            #   10.42.0.0/16 pod CIDR   - so Traefik can reach the WebUI and the
            #                             WebUI's replies get back to Traefik.
            #   10.43.0.0/16 service CIDR
            #   192.168.1.0/24 LAN      - so the SSO plugin can reach Authentik
            #                             via the 192.168.1.240 LoadBalancer.
            # Everything else (all public internet = torrentio/debrid/stream
            # sources) is forced through WireGuard, and dropped if it is down.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
            # No FIREWALL_VPN_INPUT_PORTS: unlike qBittorrent, Jellyfin/AIOStreams
            # never need an inbound port forwarded from the internet - they only
            # pull streams outbound. The WebUI's inbound path is from Traefik over
            # the LAN/pod bypass above, not through the tunnel.
            - name: DOT
              value: "off"
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            # A restart of gluetun drops the tunnel and takes Jellyfin + AIOStreams
            # down with it (shared netns), so tolerate a slow check rather than
            # tearing the tunnel down on a blip.
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            # WireGuard needs a TUN device; Kubernetes does not expose one by
            # default. NET_ADMIN alone is not enough - the device node itself
            # must be passed in or gluetun fails with "operation not permitted".
            - name: tun
              mountPath: /dev/net/tun
        # --- Jellyfin. Direct-play media server; no transcoding (CPU-only node). ---
        - name: jellyfin
          # Official image (not linuxserver): runs cleanly as an arbitrary
          # non-root uid, matching the hardened securityContext here, and Gelato
          # requires Jellyfin 10.11+. Pinned, like every image in this repo.
          image: jellyfin/jellyfin:10.11.11
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            # Absolute base URL for correct OIDC redirect links and remote-access
            # URLs. The SSO plugin builds its callback from what the browser sees.
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.sandstorm.chat
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8096
          resources:
            # Sized for DIRECT PLAY only. With transcoding disabled (owner
            # requirement; the node is CPU-only and would tank on a transcode)
            # Jellyfin is light - it muxes/streams bytes, it does not re-encode.
            # The node is memory-tight and shared, so the limit is modest.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            # /System/Info/Public is served from first boot (even before the
            # setup wizard is completed) and needs no auth, so it is the right
            # readiness signal. Verified by curl inside the pod before relying on
            # it. Deliberately generous: an over-aggressive probe here would mark
            # the pod NotReady and empty the Service's endpoints, which has
            # cut media apps off in this cluster before.
            httpGet:
              path: /System/Info/Public
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
            # Transcode temp + image cache on a node-local emptyDir, NOT on NFS:
            # even though transcoding is disabled, any incidental cache writes
            # stay off the NFS server. Bounded so a runaway cannot fill the node.
            - name: cache
              mountPath: /cache
            # The shared library, read-only, narrowed to the media subdirectory.
            # Inside the container the folders are /data/media/music,
            # /data/media/books and (once a video *arr populates them)
            # /data/media/movies, /data/media/tv - these are the paths the owner
            # adds in the setup wizard.
            - name: media
              mountPath: /data/media
              subPath: media
              readOnly: true
        # --- AIOStreams. Self-hosted; feeds torrentio results to Gelato. ---
        - name: aiostreams
          # Self-hosted rather than a public instance so the stream queries exit
          # OUR AirVPN tunnel (this pod's netns), and so we control the quality
          # filters that keep everything direct-playable. Pinned.
          image: ghcr.io/viren070/aiostreams:v1.22.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            # Reached only over localhost (by Gelato in this pod, and by the
            # owner via `kubectl port-forward` to configure it), so the base URL
            # is loopback. It is not exposed through Traefik - its config UI
            # holds debrid keys and must not be public.
            - name: BASE_URL
              value: http://localhost:3000
            - name: PORT
              value: "3000"
            # Encrypts the stored addon configuration; the manifest URL Gelato
            # consumes is only decryptable with this key, so it MUST be stable
            # across restarts - hence Doppler, not a generated-per-roll value.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aiostreams
                  key: secret-key
            # SQLite on the persistent claim; holds the encrypted addon config.
            - name: DATABASE_URI
              value: sqlite:///app/data/db.sqlite
            - name: TZ
              value: UTC
          # No readinessProbe on purpose: all containers' readiness is ANDed into
          # pod readiness and the jellyfin Service selects this pod, so a probe
          # that flapped here would empty the Service and cut off even local
          # library playback. If AIOStreams is unhealthy, search degrades; the
          # kubelet still restarts a crashed container. Same lesson as the
          # seedboxapi sidecar in the downloads pod.
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: aiostreams-data
              mountPath: /app/data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: aiostreams-data
          persistentVolumeClaim:
            claimName: aiostreams-data
        - name: cache
          emptyDir:
            sizeLimit: 4Gi
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: media
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
