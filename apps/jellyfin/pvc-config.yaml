---
# Jellyfin's own state: the SQLite library database, user accounts, plugin
# configs (Gelato + the SSO plugin's OIDC settings), metadata and image cache
# that must survive a pod roll. Dynamic nfs-csi is fine here - unlike the media
# library this is private to Jellyfin, so a per-claim private subdirectory is
# exactly what is wanted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 10Gi
---
# AIOStreams' SQLite database (sqlite://./data/db.sqlite -> /app/data). It holds
# the encrypted addon configuration that the manifest URL Gelato consumes points
# at, so it MUST persist across restarts or the manifest URL 404s and Jellyfin
# search goes dark until reconfigured. Small; a dynamic nfs-csi claim is fine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiostreams-data
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
