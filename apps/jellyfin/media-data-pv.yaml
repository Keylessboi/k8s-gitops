---
# The shared media library, mounted READ-ONLY for playback.
#
# Same static-PV-per-namespace pattern as apps/navidrome and apps/lidarr: PVCs
# cannot be shared across namespaces, and a dynamically provisioned nfs-csi
# claim would get its own private subdirectory - it would see none of the
# existing library. So this points a static PV at the exact same NFS directory
# the *arr stack and Navidrome use (192.168.1.67:/extra/nfs-csi/data), and the
# Deployment mounts only the `media` subdirectory, read-only.
#
# Jellyfin never writes here. It is a playback server; its own state
# (SQLite library DB, metadata, images) lives on the separate jellyfin-config
# PVC. Read-only at the mount is defence in depth on top of that.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-jellyfin
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
  csi:
    driver: nfs.csi.k8s.io
    # Unique per PV - navidrome/lidarr use media-data-<app>; two PVs may not
    # share a volumeHandle or the second bind silently reuses the first.
    volumeHandle: media-data-jellyfin
    volumeAttributes:
      server: 192.168.1.67
      share: /extra/nfs-csi
      subDir: data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: jellyfin
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: media-data-jellyfin
  resources:
    requests:
      storage: 500Gi
