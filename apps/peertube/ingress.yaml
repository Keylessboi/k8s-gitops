# peertube.sandstorm.chat, published, login through Authentik OIDC.
#
# The forward-auth gate this host started with is gone: it blocked ActivityPub
# federation, NewPipe and other clients pointed at the instance, and could not
# be combined with PeerTube's own login. Sign-in is now PeerTube's OpenID
# Connect plugin against Authentik (OAuth2 provider "PeerTube OIDC"), limited
# by the Authentik application's access binding. Local signup stays off and a
# local root account remains (accounts register). Mirrored channels should be
# imported unlisted or private so the content is not browsable by the world.
# The companion uses the in-cluster Service, so it is unaffected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: peertube
  namespace: peertube
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - peertube.sandstorm.chat
      secretName: peertube-tls
  rules:
    - host: peertube.sandstorm.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: peertube
                port:
                  number: 9000
