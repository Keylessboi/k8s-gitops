---
# cellarr's own database (SQLite) plus the one-off snapshot of lidarr.db it is
# migrated from. local-path on the NAS like Lidarr's (ADR-0009: SQLite never on
# nfs-csi). Sized for the snapshot (~3.9 GB, transient) plus cellarr's database
# (~0.5 GB at this library's size, measured in a full-scale rehearsal).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cellarr-shadow-data
  namespace: lidarr
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# Scratch for cellarr-shadow-diff-fresh: wiped at the start of every run, so it
# only ever holds one night's snapshot (~3.9 GB, deleted after the migrate) and
# the migrated database (~2.7 GB). local-path on the NAS like the shadow's.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cellarr-diff-scratch
  namespace: lidarr
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 12Gi
---
# The plugin sidecar's /config (cutover interim): lidarr.db, config.xml and
# /config/plugins (AppleMusicarr, Tubifarry). NEW and empty, never a copy of
# production Lidarr's lidarr-config-nas. local-path on the NAS because it holds
# SQLite (ADR-0009: never on nfs-csi). An empty Lidarr is tens of MB; 1Gi leaves
# room for Tubifarry's caches. protect-state keeps ArgoCD from pruning it, which
# is also what keeps it across a rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cellarr-sidecar-config
  namespace: lidarr
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
