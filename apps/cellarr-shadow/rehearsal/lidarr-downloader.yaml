---
# Step 4.8 of docs/runbooks/cellarr-cutover.md: rehearse the YouTube path with the
# yt-dlp app lidarr-downloader (the production one, apps/downloads/lidarr-downloader.yaml)
# against the REHEARSAL cellarr. Same image digest, same posture, no cookies, no PO token.
#
# Isolation: LIDARR_URL is the rehearsal cellarr (Service cellarr-rehearsal below), never
# lidarr.lidarr or cellarr-shadow. /music is the rehearsal library only (subPath
# torrents/cellarr-rehearsal/library), never media/music. /downloads is
# torrents/cellarr-rehearsal/youtube. The pod's own NetworkPolicy (apps/lidarr
# app-isolation) allows in-namespace egress on 8686 only, which is exactly what it needs,
# plus 443 to the internet for YouTube.
#
# The Service is for the downloader only; the cellarr-rehearsal Deployment is untouched.
apiVersion: v1
kind: Service
metadata:
  name: cellarr-rehearsal
  namespace: lidarr
  labels:
    homelab/rehearsal-part: workload
spec:
  selector: {app.kubernetes.io/name: cellarr-rehearsal}
  ports: [{name: http, port: 8686, targetPort: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-downloader-rehearsal-config
  namespace: lidarr
  labels:
    homelab/rehearsal-part: state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr-downloader-rehearsal
  namespace: lidarr
  labels:
    homelab/rehearsal-part: workload
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: lidarr-downloader-rehearsal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lidarr-downloader-rehearsal}
    spec:
      nodeSelector: {kubernetes.io/hostname: nas}
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # kube-router programs this pod's NetworkPolicy 1-2s after start; until then allowed
        # egress is REJECTed. Required by scripts/ci/check-invariants.py.
        - name: wait-for-upstreams
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                if nc -z cellarr-rehearsal.lidarr.svc.cluster.local 8686; then exit 0; fi
                sleep 2
              done
              echo "cellarr-rehearsal not reachable after 120s"; exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        # Ownership: the same way the cellarr rehearsal does it. The init container runs as
        # uid/gid 1000 and mkdirs the directory, so it is created owned by 1000 (no fsGroup,
        # no chown, no root).
        - name: prepare-dirs
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /data/torrents/cellarr-rehearsal/youtube
              ls -ld /data/torrents/cellarr-rehearsal/youtube
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: media, mountPath: /data/torrents, subPath: torrents}
      containers:
        - name: app
          # Same digest as apps/downloads/lidarr-downloader.yaml.
          image: angrido/lidarr-downloader@sha256:8cd0a8dda8d915383d05d1907700c66aca77e6f1fd70a8e1a08d1d4dcc4c0d6e
          env:
            - {name: UMASK, value: "002"}
            - {name: LIDARR_URL, value: "http://cellarr-rehearsal.lidarr.svc.cluster.local:8686"}
            - name: LIDARR_API_KEY
              valueFrom: {secretKeyRef: {name: cellarr-rehearsal, key: cellarr-api-key}}
            - {name: DOWNLOAD_PATH, value: /downloads}
            - {name: LIDARR_PATH, value: /music}
            - {name: YT_POT_PROVIDER_URL, value: ""}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: HOME, value: /tmp}
          ports: [{containerPort: 5000, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 20, periodSeconds: 20, failureThreshold: 6}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 60, periodSeconds: 30, failureThreshold: 6}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /music, subPath: torrents/cellarr-rehearsal/library}
            - {name: media, mountPath: /downloads, subPath: torrents/cellarr-rehearsal/youtube}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: lidarr-downloader-rehearsal-config}
        - name: media
          persistentVolumeClaim: {claimName: media-data-nas}
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
