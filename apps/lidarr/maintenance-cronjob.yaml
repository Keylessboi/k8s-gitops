---
# Nightly Lidarr queue maintenance.
#
# Runs the owner's script (Keylessboi/lidarr-maintenance-script): force-imports
# albums that failed auto-import but are still good, removes genuinely broken
# downloads and re-searches them, clears downloads stalled for days, and scans
# for albums repeatedly searched but never grabbed.
#
# The script is pure standard library, so a plain python image needs no build
# step and no requirements install - which is why this is a CronJob rather than
# a bespoke image to maintain.
#
# It is cloned fresh each run rather than baked in, which gives the same
# auto-deploy behaviour as the upstream run_maintenance.sh wrapper: push to
# main and the next run picks it up.
#
# Items the script cannot judge are printed as [AGENT_OVERSIGHT_NEEDED] and
# left alone. Upstream feeds those to a Hermes agent; here they surface in the
# job log until that agent exists in-cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lidarr-maintenance
  namespace: lidarr
spec:
  # 02:00 daily, matching the schedule the script was written for.
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # kube-router programs a new pod's egress iptables chains ~1-2s after
          # sandbox start. Until then, egress the NetworkPolicy *does* allow is
          # REJECTed (RST -> "connection refused"), and the maintenance script
          # connects on its first line of real work, so it lost that race every
          # night. This init container retries /ping until Lidarr answers; by
          # the time it exits, the policy window has long passed.
          #
          # Same python image on purpose: it is already cached on the node, and
          # urllib walks every getaddrinfo result - which is how this cluster
          # survives DNS that answers AAAA records with no IPv6 route (see the
          # main container's comment below).
          initContainers:
            - name: wait-for-lidarr
              image: python:3.12-slim
              command: ["python3", "-c"]
              args:
                - |
                  import sys, time, urllib.request
                  url = "http://lidarr.lidarr.svc.cluster.local:8686/ping"
                  for attempt in range(1, 31):
                      try:
                          with urllib.request.urlopen(url, timeout=5) as r:
                              if r.status == 200:
                                  print(f"Lidarr ready after {attempt} attempt(s)")
                                  sys.exit(0)
                      except Exception as e:
                          print(f"attempt {attempt}/30: {e}", flush=True)
                      time.sleep(2)
                  # Proceed anyway: 60s of failures means Lidarr itself is down,
                  # and the main container's own error output is the right place
                  # to show that rather than masking it here.
                  print("Lidarr not ready after 60s, proceeding anyway")
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          containers:
            - name: maintenance
              image: python:3.12-slim
              # Fetched with urllib rather than `git clone` on purpose: installing
              # git needs apt, and apt drags in a large dependency chain that
              # fails outright here because cluster DNS answers with AAAA
              # records this node has no IPv6 route for. urllib walks every
              # getaddrinfo result and falls back to IPv4, so it just works.
              command: ["python3", "-c"]
              args:
                - |
                  import io, os, sys, tarfile, urllib.request
                  url = "https://codeload.github.com/Keylessboi/lidarr-maintenance-script/tar.gz/refs/heads/main"
                  with urllib.request.urlopen(url, timeout=60) as r:
                      blob = r.read()
                  with tarfile.open(fileobj=io.BytesIO(blob)) as tf:
                      tf.extractall("/tmp")
                      root = os.path.join("/tmp", tf.getnames()[0].split("/")[0])
                  os.chdir(root)
                  sys.argv = ["lidarr_queue_maintenance.py"]
                  exec(open("lidarr_queue_maintenance.py").read(), {"__name__": "__main__", "__file__": "lidarr_queue_maintenance.py"})
              env:
                - name: LIDARR_URL
                  value: http://lidarr.lidarr.svc.cluster.local:8686
                - name: LIDARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lidarr-api
                      key: api-key
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
