---
# Lidarr: music library manager. Watches for new releases and organizes them.
# NFS mount at /music for the library. Keeps music data off the SD card.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: lidarr

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: lidarr
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: media
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - media-data-pv.yaml
  - pvc-music.yaml
  - pvc-config.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - bgutil-provider.yaml
  - ingress.yaml
  - authentik-outpost.yaml

