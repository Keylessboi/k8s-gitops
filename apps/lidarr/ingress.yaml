---
# Public again, but only behind Authentik.
#
# The previous Ingress published Lidarr to the internet with
# AuthenticationMethod=None, i.e. unauthenticated admin access. It was
# withdrawn. This one routes every request through the Authentik forward-auth
# middleware first, so an Authentik login is required before Lidarr is reached
# at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  namespace: lidarr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<name>@kubernetescrd is how a middleware in another
    # namespace is referenced.
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd,kube-system-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lidarr.sandstorm.chat
      secretName: lidarr-tls
  rules:
    - host: lidarr.sandstorm.chat
      http:
        paths:
          # Longest prefix wins in Traefik, so this beats the / rule below and never reaches
          # Lidarr. It is the Apple ID sign-in page for the FairPlay daemon - a small form that
          # drives the daemon's /login and /login/2fa, including the 2FA code step, which cannot
          # be expressed in Lidarr's declarative provider-settings schema at all.
          #
          # Deliberately on this hostname: it reuses the existing certificate and the existing
          # Authentik forward-auth middleware rather than standing up a second public name for
          # one form. The sidecar refuses its /v1 job API to anything arriving with this prefix,
          # so the published route cannot drive downloads.
          - path: /applemusic
            pathType: Prefix
            backend:
              service:
                name: applemusic-decryptor
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr
                port:
                  number: 8686
