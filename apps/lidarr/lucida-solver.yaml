---
# A shim that lets Lidarr's Lucida indexer work behind Cloudflare.
#
# THE PROBLEM. lucida.to sits behind a Cloudflare JS challenge. From inside the
# cluster it answers 403 "Just a moment...", so the Tubifarry Lucida indexer
# fails every search with "No services available from Lucida instance". A
# browser passes because it executes the challenge; Lidarr cannot.
#
# WHY NOT JUST POINT LIDARR AT FLARESOLVERR. FlareSolverr is an API you POST a
# URL to, not an HTTP proxy you can route traffic through - and this Lidarr
# (3.1.3) has no indexer-proxy support at all (its /api/v1/indexerproxy/schema
# is empty; that is a Prowlarr/Sonarr feature). The Lucida plugin exposes only
# baseUrl, countryCode, servicePriorities, requestTimeout and earlyReleaseLimit
# - no proxy hook. The one thing it DOES expose is baseUrl, so this shim
# impersonates a Lucida instance and does the solving on its behalf.
#
# Verified before building: FlareSolverr solves lucida.to (status ok,
# "Challenge solved!", HTTP 200, no challenge markers) and returns API JSON
# wrapped as <html>...<body><pre>{"success":...}</pre>, which is why the
# handler below unwraps <pre> and serves it back as application/json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucida-solver
  namespace: lidarr
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lucida-solver}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lucida-solver}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: solver
          image: python:3.12-alpine3.20
          command: ["python3", "/app/solver.py"]
          env:
            - name: FLARESOLVERR
              value: http://flaresolverr.flaresolverr.svc.cluster.local:8191/v1
            - name: UPSTREAM
              value: https://lucida.to
            - name: PORT
              value: "8080"
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap: {name: lucida-solver-script, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: lucida-solver
  namespace: lidarr
spec:
  selector: {app.kubernetes.io/name: lucida-solver}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lucida-solver-script
  namespace: lidarr
data:
  solver.py: |
    #!/usr/bin/env python3
    """Serve lucida.to through FlareSolverr so Lidarr's plugin can reach it."""
    import os, json, urllib.request, urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    FS   = os.environ.get("FLARESOLVERR", "http://flaresolverr.flaresolverr.svc.cluster.local:8191/v1")
    UP   = os.environ.get("UPSTREAM", "https://lucida.to").rstrip("/")
    PORT = int(os.environ.get("PORT", "8080"))

    def solve(url, timeout=90):
        body = json.dumps({"cmd": "request.get", "url": url,
                           "maxTimeout": timeout * 1000}).encode()
        req = urllib.request.Request(FS, body, {"Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=timeout + 30) as r:
            d = json.load(r)
        sol = d.get("solution") or {}
        return d.get("status"), sol.get("status", 502), sol.get("response", "") or ""

    def unwrap(text):
        """FlareSolverr renders in a browser, so JSON arrives inside <pre>."""
        low = text.lower()
        i = low.find("<pre>")
        if i == -1:
            return text, "text/html; charset=utf-8"
        j = low.find("</pre>", i)
        inner = text[i + 5: j if j != -1 else len(text)]
        inner = (inner.replace("&amp;", "&").replace("&lt;", "<")
                      .replace("&gt;", ">").replace("&quot;", '"'))
        s = inner.strip()
        if s[:1] in "{[":
            return s, "application/json"
        return text, "text/html; charset=utf-8"

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def log_message(self, fmt, *a):
            print("%s - %s" % (self.address_string(), fmt % a), flush=True)

        def do_GET(self):
            if self.path in ("/healthz", "/health"):
                return self._send(200, b"ok", "text/plain")
            try:
                st, code, html = solve(UP + self.path)
            except Exception as e:
                return self._send(502, json.dumps({"error": str(e)}).encode(), "application/json")
            if st != "ok":
                return self._send(502, json.dumps({"error": "challenge not solved"}).encode(),
                                  "application/json")
            payload, ctype = unwrap(html)
            self._send(code if isinstance(code, int) else 200, payload.encode("utf-8"), ctype)

        def _send(self, code, body, ctype):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    print(f"lucida-solver: {UP} via {FS} on :{PORT}", flush=True)
    ThreadingHTTPServer(("0.0.0.0", PORT), H).serve_forever()
