---
# Plain manifests: the bjw-s app-template chart ships an empty values.yaml,
# which kustomize's helmCharts generator cannot inflate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: lidarr
spec:
  # Stays 1, permanently. /config/lidarr.db is SQLite and single-writer, so a
  # second replica would not share the load, it would contend on the write
  # lock. The one-off trackFile purge that briefly took this to 0 has finished.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
    spec:
      containers:
        - name: lidarr
          # Lidarr's `plugins` branch, not master.
          #
          # Tubifarry is installed through Lidarr's System -> Plugins page,
          # which master does not have - the linuxserver image tracks master,
          # where /api/v1/plugin returns 404 and no plugin can be installed at
          # all. So this needs a develop build, and hotio publishes one.
          # hotio's `testing` stream is Lidarr's develop branch. Plugin
          # support now lives there (src/NzbDrone.Core/Plugins), and the old
          # `plugins` branch has been abandoned - its last commit is
          # 2026-01-18 against develop's 2026-08-23, so staying on it meant
          # forgoing seven months of fixes.
          #
          # This is an upgrade, not a sideways move: develop builds 3.1.4 and
          # the plugins branch built 3.1.2, same major line, so the schema
          # migrations run forward cleanly. Pinned rather than floating on
          # `testing`, like every other image here.
          image: ghcr.io/hotio/lidarr:testing-3.1.3.4987
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8686
          # Sized for the 31k-album mass search, from measurement rather than
          # guesswork. Limits are deliberately UNCHANGED - they are already
          # right:
          #
          #   cpu: "2"    - at 500m this container was throttled on 46-76% of
          #                 CFS periods. At 2 cores it throttles on 0.0%, with
          #                 a measured 24h peak of 1.16 cores. Raising it
          #                 further would buy nothing and this node is at 299%
          #                 CPU-limit overcommit already.
          #   memory: 2Gi - a live AlbumSearch across 15 active indexers holds
          #                 a flat ~320Mi working set; the worst spike seen
          #                 across every pod incarnation in 24h was 1508Mi
          #                 (74% of this limit). Do not raise it: the node only
          #                 has 13824Mi allocatable against 256% memory-limit
          #                 overcommit, and .NET's GC expands to fill whatever
          #                 ceiling it is given, so a bigger limit means more
          #                 uncollected garbage and more node pressure, not a
          #                 safer Lidarr.
          #
          # The requests are what actually needed fixing for a multi-day run.
          # They were 50m/512Mi, which is what the scheduler reserves and what
          # the kubelet ranks evictions by (usage above request). Mid-search
          # eviction would kill a multi-day job and drop a 3.6 GB SQLite file
          # mid-write, so buy headroom over the observed peaks. There is room:
          # node CPU requests sit at 19% and memory requests at 59%, so this
          # takes nothing from qBittorrent, beets or FlareSolverr, which keep
          # their own reservations.
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # /ping takes ~5s on this instance - the database is 3.6 GB and the
          # library is 498 artists - so the original timeoutSeconds: 1 failed
          # every single time. 119 failures in 53 minutes marked the pod
          # NotReady, which emptied the Service endpoints, which made every
          # client (Prowlarr sync, the maintenance CronJob, the cleanup job)
          # fail with "connection refused" against a Lidarr that was actually
          # running fine. Generous timeout, and enough failures to ride out a
          # slow patch rather than yanking it out of service.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
            # One mount, per TRaSH: /data/torrents/music for downloads and
            # /data/media/music for the library, both inside it so imports
            # hardlink instead of copying. Lidarr previously mounted only
            # /music - from a PVC nothing else used - and had no view of the
            # download directory at all, so it could never import anything.
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: lidarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lidarr
  ports:
    - name: http
      port: 8686
      targetPort: http
