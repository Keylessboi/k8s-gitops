---
# Plain manifests: the bjw-s app-template chart ships an empty values.yaml,
# which kustomize's helmCharts generator cannot inflate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: lidarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
    spec:
      containers:
        - name: lidarr
          # Lidarr's `plugins` branch, not master.
          #
          # Tubifarry is installed through Lidarr's System -> Plugins page,
          # which exists only on the plugins branch. The linuxserver image
          # tracks master, where /api/v1/plugin returns 404 and there is no way
          # to install a plugin at all. linuxserver publishes no plugins tag,
          # so this uses hotio's plugins-branch build.
          image: ghcr.io/hotio/lidarr:pr-plugins
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8686
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
            # One mount, per TRaSH: /data/torrents/music for downloads and
            # /data/media/music for the library, both inside it so imports
            # hardlink instead of copying. Lidarr previously mounted only
            # /music - from a PVC nothing else used - and had no view of the
            # download directory at all, so it could never import anything.
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: lidarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lidarr
  ports:
    - name: http
      port: 8686
      targetPort: http
