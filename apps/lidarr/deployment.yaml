---
# Plain manifests: the bjw-s app-template chart ships an empty values.yaml,
# which kustomize's helmCharts generator cannot inflate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: lidarr
spec:
  # TEMPORARILY 0. A one-off maintenance Job is deleting ~150k dead trackFile
  # rows straight out of SQLite, and it must be the only writer. Doing this
  # through Lidarr's API was not viable: every delete round-trips through its
  # ORM against a single-writer database, four workers managed ~16k rows/hour,
  # and twelve were SLOWER because they merely contended on the write lock.
  # Set back to 1 as soon as the Job reports done.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
    spec:
      containers:
        - name: lidarr
          # Lidarr's `plugins` branch, not master.
          #
          # Tubifarry is installed through Lidarr's System -> Plugins page,
          # which master does not have - the linuxserver image tracks master,
          # where /api/v1/plugin returns 404 and no plugin can be installed at
          # all. So this needs a develop build, and hotio publishes one.
          # hotio's `testing` stream is Lidarr's develop branch. Plugin
          # support now lives there (src/NzbDrone.Core/Plugins), and the old
          # `plugins` branch has been abandoned - its last commit is
          # 2026-01-18 against develop's 2026-08-23, so staying on it meant
          # forgoing seven months of fixes.
          #
          # This is an upgrade, not a sideways move: develop builds 3.1.4 and
          # the plugins branch built 3.1.2, same major line, so the schema
          # migrations run forward cleanly. Pinned rather than floating on
          # `testing`, like every other image here.
          image: ghcr.io/hotio/lidarr:testing-3.1.3.4987
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8686
          # Raised from 500m/512Mi after repeated OOMKills. 512Mi was set when
          # this was an empty Lidarr; the restored library is 498 artists and it
          # now loads five Tubifarry providers on top. A release search across
          # every indexer reliably killed the container mid-request, which reads
          # as a search that mysteriously returns nothing.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # /ping takes ~5s on this instance - the database is 3.6 GB and the
          # library is 498 artists - so the original timeoutSeconds: 1 failed
          # every single time. 119 failures in 53 minutes marked the pod
          # NotReady, which emptied the Service endpoints, which made every
          # client (Prowlarr sync, the maintenance CronJob, the cleanup job)
          # fail with "connection refused" against a Lidarr that was actually
          # running fine. Generous timeout, and enough failures to ride out a
          # slow patch rather than yanking it out of service.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
            # One mount, per TRaSH: /data/torrents/music for downloads and
            # /data/media/music for the library, both inside it so imports
            # hardlink instead of copying. Lidarr previously mounted only
            # /music - from a PVC nothing else used - and had no view of the
            # download directory at all, so it could never import anything.
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: lidarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lidarr
  ports:
    - name: http
      port: 8686
      targetPort: http
