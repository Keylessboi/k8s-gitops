---
# FairPlay decryptor sidecar for the AppleMusicarr Lidarr plugin.
#
# Apple Music audio is FairPlay-protected and the plugin performs no decryption itself. The
# shared plugin packaging internalises the DRM types (ILRepack Internalize=true with an empty
# exclude list), so Common's out-of-tree IExternalDownloadHandler assembly seam cannot be
# loaded/cast - a separate process is the only workable design. It also keeps gamdl's Python,
# ffmpeg and native muxer out of the Lidarr image entirely.
#
# Reached only by Lidarr, over the in-cluster Service:
#   http://applemusic-decryptor.lidarr.svc.cluster.local:8080
#
# NO NetworkPolicy is needed. The namespace's app-isolation policy already permits egress to
# 0.0.0.0/0 on 443 (which is how the sidecar reaches amp-api.music.apple.com) and admits
# ingress from the lidarr namespace on any port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applemusic-decryptor
  namespace: lidarr
spec:
  replicas: 1
  # The media volume is a `local` PV bound to the NAS node, so a replacement pod can only
  # start once the old one has released it. Recreate avoids a multi-attach deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: applemusic-decryptor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: applemusic-decryptor
    spec:
      # Same placement constraint as Lidarr itself: the data lives on this node.
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: decryptor
          # Built on the NAS itself (the only host here with a working Docker daemon) and imported
          # straight into the NAS node's containerd. This cluster has no registry, so the tag is
          # local and must never be pulled - a pull fails with ImagePullBackOff rather than
          # falling back. Rebuild steps are in the plugin README.
          # 0.2.0 added the wrapper-v2 backend (WRAPPER_URL) and the Apple ID sign-in page the
          # lidarr Ingress publishes at /applemusic. 0.3.0 replaces the backend with wrapper-lite:
          # it ships amdl (apple-music-dl), switches on LITE_SERVER below, and reports
          # drm.backend="wrapper-lite (amdl)". 0.3.1 adds per-tier retries for wrapper-lite's
          # intermittent "Invalid CKC error" (roughly one key request in sixteen), which
          # otherwise costs that track the tier. 0.3.2 rewrites the album-artist tag (aART) of each
          # downloaded file to the artist Lidarr actually asked for: Apple writes the collaboration
          # credit there ("SOFI TUKKER & Bomba Estéreo" where Lidarr has "Sofi Tukker"), and Lidarr
          # scores the artist component of an import from exactly that tag, so those downloads landed
          # just under its 80% album-match bar and were not imported on arrival. The track artist tag
          # keeps its featured credits and no country tag is written. See docs/doctor-log.md 2026-10-02.
          image: applemusic-decryptor:0.3.2
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/app.py"]
          env:
            # The same volume Lidarr mounts at /data. The plugin sends a directory relative to
            # this root and rebases it onto its own Download Path, so the two agree without
            # duplicating any path sanitisation.
            - {name: OUTPUT_DIR, value: "/data/torrents/apple"}
            - {name: PORT, value: "8080"}
            # Pacing is the main behavioural signal Apple could notice, so it is on by default:
            # one album at a time, with a gap between tracks.
            # One album at a time, ten seconds between tracks, and up to three attempts at a
            # tier before the chain moves on (AMDL_ATTEMPTS_PER_TIER in decryptor/amdl_run.py).
            # The delay is the point of the setting: a backlog draining overnight should look
            # like a subscriber, not a scraper, and pacing is the main behavioural signal Apple
            # could act on.
            - {name: JOB_DELAY_SECONDS, value: "10"}
            - {name: MAX_CONCURRENT, value: "1"}
            # Deliberately off. A proxy changes which address appears in Apple's logs, not who
            # the logs are about; see the note in decryptor/app.py.
            - {name: REQUIRE_PROXY, value: "0"}
            # LITE_SERVER is the switch. Set, app.py selects the wrapper-lite backend, runs amdl
            # against this URL, and reports drm.backend="wrapper-lite (amdl)". Unset, it falls
            # back to the cookie path and can only fetch the DRM-free streams - which /healthz
            # reports as drm.backend="none" rather than failing silently.
            #
            # wrapper-lite, not wrapper-v2. The sibling project under the same author completed
            # AuthenticateFlow where wrapper-v2 cannot (its token harvest calls an undefined
            # symbol in Apple's shipped libraries), and its routed API is what amdl speaks. The
            # two are NOT interchangeable: gamdl speaks wrapper-v2's /me plus a raw decrypt
            # socket, and would fail on the first call it made here.
            #
            # The /applemusic page is served by this same container. Under wrapper-lite it shows
            # the daemon's state and the one-off sign-in command instead of a password form,
            # because wrapper-lite signs in through its own CLI rather than over HTTP.
            - {name: LITE_SERVER, value: "http://applemusic-wrapper.applemusic-wrapper.svc.cluster.local:8080"}
            # Explicitly empty, and that is not noise. The previous commit set WRAPPER_URL on this
            # container, and ArgoCD applies with ServerSideApply, whose list merge keys env entries
            # by name: a name that simply disappears from the manifest is NOT removed from the
            # live object, so the old value survived the swap and the sidecar logged
            # "both LITE_SERVER and WRAPPER_URL are set" on its first start. Declaring it empty
            # is what actually turns the wrapper-v2 path off, and declaring it at all keeps the
            # compatibility switch visible instead of leaving a stale value in the cluster.
            - {name: WRAPPER_URL, value: ""}
          ports:
            - {name: http, containerPort: 8080}
          # LIVENESS, for the same reason the wrapper has one - see its manifest and
          # docs/doctor-log.md 2026-09-30. This sidecar is a Python HTTP server that shells out to
          # amdl, so it can wedge without exiting, and with readiness alone the kubelet would
          # leave it Running-but-NotReady forever while every Apple Music job stalled.
          #
          # /healthz is safe to probe with liveness specifically because it always answers 200:
          # the wrapper's reachability is reported as DATA (body.drm.wrapper, served from the
          # sampler's cache) and never as a probe failure. So this probe can only fail for the one
          # reason a liveness probe should fire - the process has stopped serving its loop - and
          # not because the wrapper is down, which restarting this pod would not fix.
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            # 30s + 4 x 30s = 150s, comfortably past readiness' own 5s + 3 x 20s = 65s grace, so
            # the two probes cannot disagree about a pod that is merely still starting.
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: media-data-nas}
---
apiVersion: v1
kind: Service
metadata:
  name: applemusic-decryptor
  namespace: lidarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: applemusic-decryptor
  ports:
    - {name: http, port: 8080, targetPort: 8080}
