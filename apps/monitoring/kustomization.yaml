---
# Monitoring stack. Prometheus scrapes. Grafana shows. Loki stores logs.
# Alloy ships metrics and logs from every node, Pis included.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: monitoring

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: monitoring
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: observability
      app.kubernetes.io/managed-by: argocd
      homelab/tier: platform
    includeSelectors: false

resources:
  - namespace.yaml
  - monitoring-pvc.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - alertmanager-ingress.yaml
  - dashboard-homelab.yaml
  - smartctl-alerts.yaml
  - temperature-alerts.yaml
  - backup-alerts.yaml
  - minio-probe.yaml
  # Probes every published URL, asserting the status code each SHOULD return.
  - edge-probes.yaml
  - dashboard-disk-health.yaml
  - dashboard-backups.yaml
  - dashboard-app-detail.yaml
  - dashboard-cluster-health.yaml
  - dashboard-namespaces.yaml
  - dashboard-traefik.yaml
  - dashboard-postgres.yaml
  - dashboard-logs.yaml
  - podmonitors-platform.yaml
  - servicemonitors-apps.yaml

helmCharts:
  # Stack: Prometheus, Grafana, Alertmanager, node-exporter.
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 75.18.1
    releaseName: kps
    namespace: monitoring
    includeCRDs: true
    valuesInline:
      prometheus:
        prometheusSpec:
          retention: 15d
          # SMART metrics from the two bare-metal hosts. These cannot be a
          # DaemonSet: LXC 200 has no block devices in /dev at all, so a pod has
          # nothing to read, and the disks that matter (the NAS pool disks)
          # are not the Proxmox host's anyway. The exporters run as systemd
          # units there - see scripts/install-smartctl-exporter.sh - and are
          # scraped over the LAN.
          #
          # additionalScrapeConfigs rather than a ScrapeConfig CR: the chart
          # renders this straight into the operator's secret, with no CRD
          # selector to get wrong.
          additionalScrapeConfigs:
            - job_name: smartctl
              scrape_interval: 60s
              static_configs:
                - targets: [192.168.1.153:9633]
                  labels:
                    host: proxmox
                - targets: [192.168.1.67:9633]
                  labels:
                    host: nas
          nodeSelector:
            homelab/node-class: compute
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          storageSpec:
            volumeClaimTemplate:
              metadata:
                name: prometheus
              spec:
                # TSDB does heavy random IO and mmap; block storage, not a
                # network/object-backed filesystem.
                storageClassName: local-path
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 20Gi
      grafana:
        admin:
          existingSecret: grafana-admin
        # Loki was deployed and Alloy was shipping every pod's logs into it, but
        # Grafana had no Loki datasource - so none of it was reachable. The chart
        # only provisions Prometheus and Alertmanager on its own.
        additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki.monitoring.svc.cluster.local:3100
            jsonData:
              maxLines: 1000
        # grafana.ini reads these with $__file{}, which needs them on disk.
        extraSecretMounts:
          - name: smtp
            secretName: smtp
            mountPath: /etc/secrets/smtp
            readOnly: true
        initChownData:
          enabled: false
        nodeSelector:
          homelab/node-class: compute
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: 2Gi
          # Claim is defined in monitoring-pvc.yaml (juicefs); the class here
          # would be ignored anyway when existingClaim is set.
          existingClaim: grafana
        # OIDC lives in grafana.ini, NOT env. The chart renders env values
        # unquoted into the Deployment, and role_attribute_path contains both
        # double quotes and `&&`, which produced invalid YAML and blocked the
        # whole monitoring app from rendering.
        # The client secret is injected from the Doppler-managed secret.
        envFromSecret: grafana-oidc
        grafana.ini:
          server:
            domain: grafana.sandstorm.chat
            root_url: https://grafana.sandstorm.chat
          # SMTP, so alerts can actually leave the cluster. Backups and
          # certificate renewals run unattended; without this, a failure is only
          # visible to someone who happens to look at Grafana.
          smtp:
            enabled: true
            host: $__file{/etc/secrets/smtp/host}:587
            user: $__file{/etc/secrets/smtp/username}
            password: $__file{/etc/secrets/smtp/password}
            from_address: $__file{/etc/secrets/smtp/from}
            from_name: Grafana
            startTLS_policy: MandatoryStartTLS
          auth.generic_oauth:
            enabled: true
            name: Authentik
            client_id: grafana-oidc
            client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
            scopes: openid profile email groups
            auth_url: https://authentik.sandstorm.chat/application/o/authorize/
            token_url: https://authentik.sandstorm.chat/application/o/token/
            api_url: https://authentik.sandstorm.chat/application/o/userinfo/
            role_attribute_path: contains(groups[*], 'Admin') && 'Admin' || 'Viewer'
            allow_sign_up: true
      alertmanager:
        # Alertmanager routing + SMTP, so disk failures actually reach an inbox.
        # This replaces the chart's default config, but reproduces its two load-
        # bearing pieces - the 'null' receiver and the Watchdog route into it -
        # and only ADDS an email path for the SMART alerts on top.
        config:
          global:
            resolve_timeout: 5m
            # Gmail relay. Host/port/from are connection parameters, not the
            # credential; the password is the credential and stays in the
            # Doppler-synced `smtp` secret, read from a file at send time.
            # Alertmanager only supports a *_file indirection for the password,
            # so the smarthost/from/username are necessarily inline here (they
            # are the same values Grafana's SMTP block already uses).
            smtp_smarthost: "smtp.gmail.com:587"
            smtp_from: "gamingko587@gmail.com"
            smtp_auth_username: "gamingko587@gmail.com"
            # Mounted from the `smtp` secret via alertmanagerSpec.secrets below,
            # at /etc/alertmanager/secrets/<secret>/<key>.
            smtp_auth_password_file: /etc/alertmanager/secrets/smtp/password
            smtp_require_tls: true
          route:
            # Group per disk so a host or drive going bad is one email, not one
            # per attribute that trips.
            group_by: ["alertname", "host", "device"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            # THE DEFAULT IS "null" ON PURPOSE, AND THAT IS NOT THE OLD BUG.
            #
            # Read c8e17fa's comment before changing this. That commit opened
            # the default to email because 165 rules were being evaluated and
            # discarded - ghost crash-looped 523 times behind a firing
            # KubePodCrashLooping nobody could see. Opening it was right for
            # the problem as understood that day, and it is being narrowed
            # again for a reason that is NOT "the emails were annoying".
            #
            # The reason is that this cluster has two audiences and only one
            # of them has an inbox:
            #
            #   * The OWNER is paged only for failures they could not discover
            #     by using the system. Heat, a dying disk, a dead node, a
            #     backup that silently stopped. These need hands or they need
            #     someone to know the safety net is gone.
            #
            #   * A MODEL gets everything else, and gets it by PULL, not push.
            #     The workflow is: the owner notices immich returns 404, says
            #     so, and the model diagnoses. Nothing has to be mailed for
            #     that to work - it has to be RECORDED and cheap to retrieve.
            #
            # KubePodCrashLooping still fires, is still evaluated, and is still
            # queryable: Prometheus retains the ALERTS series for 15 days, so
            # "was anything firing when immich broke?" stays answerable long
            # after the fact. Delivery and retention are separate concerns and
            # only delivery needs to be quiet. Nothing below reduces what this
            # cluster knows - only who gets woken up about it.
            #
            # The test for adding a route to "smart-email" is therefore NOT
            # "is this bad?" - almost everything here is bad. It is:
            #
            #     Would the owner fail to notice this by simply using the
            #     cluster, AND does knowing require a human?
            #
            # Job failures fail that test (a model handles them on report).
            # A NAS disk at 60C passes it (invisible until it dies).
            receiver: "null"
            routes:
              # --- Structurally false or deliberate: keep muted --------------
              #
              # These four are redundant now that the default is "null" - they
              # would land there anyway. They are kept because each one encodes
              # a fact that is expensive to rediscover, and because the moment
              # anyone opens the default again they are load-bearing. Deleting
              # them would delete the knowledge with them.

              # Watchdog is kube-prometheus-stack's heartbeat: it fires ALWAYS,
              # by design, forever. Its purpose is to be sent somewhere
              # EXTERNAL that alerts when it STOPS arriving - and until
              # 2026-09-03 it was routed to "null", which is the one thing it
              # must never be. Discarding a heartbeat leaves the monitoring
              # unable to report its own death, and "no alerts" is exactly what
              # a healthy day looks like.
              #
              # It now POSTs to a receiver on the PROXMOX HOST (192.168.1.153),
              # which relays a staleness alarm to ntfy on travisbackupserver
              # over Tailscale.
              #
              # Why not straight to travisbackupserver: that box is on wlo1
              # behind the room's WiFi router, on a SEPARATE 192.168.1.0/24 -
              # same numbering, different L2 segment. The cluster cannot route
              # to it ("no route to host", not a policy REJECT) and its own
              # local subnet route shadows the tailnet route back. Verified
              # both directions 2026-09-03. pve can reach both, so it relays.
              #
              # HONEST COVERAGE, because a monitoring component that overstates
              # itself is worse than none: pve is a different failure domain
              # from LXC 200, so this catches the container OOMing, swap thrash
              # locking the API server, k3s crashing, and Prometheus or
              # Alertmanager dying - every one of which is a real doctor-log
              # entry. It does NOT catch pve itself dying or a power cut. That
              # is covered from genuinely outside by the edge probe on
              # travisbackupserver, which walks the public internet path.
              #
              # repeat_interval 5m, not the route default of 12h: the whole
              # value is in arriving often enough that absence is quickly
              # meaningful. The watcher allows 20 minutes - four missed beats -
              # before it says anything.
              - receiver: "heartbeat-ntfy"
                matchers:
                  - alertname = "Watchdog"
                group_wait: 0s
                group_interval: 5m
                repeat_interval: 5m
              # InfoInhibitor exists only to suppress other alerts; it is never
              # itself actionable and has no recipient.
              - receiver: "null"
                matchers:
                  - alertname = "InfoInhibitor"
              # k3s ships the scheduler, controller-manager and kube-proxy
              # INSIDE the server binary, with no separate metrics endpoints for
              # kube-state-metrics to scrape. These three therefore fire
              # permanently and can never clear on this distribution - they are
              # false by construction, not by configuration. All three are
              # firing right now.
              - receiver: "null"
                matchers:
                  - alertname =~ "KubeSchedulerDown|KubeControllerManagerDown|KubeProxyDown"
              # The two lidarr mass-search Jobs are a deliberate ~40-day catalog
              # build (apps/lidarr/mass-search-job.yaml documents the run), so
              # "job has not completed" is the intended state for weeks, not a
              # fault.
              - receiver: "null"
                matchers:
                  - alertname = "KubeJobNotCompleted"
                  - job_name =~ "lidarr-mass-search-.*"

              # --- The physical set: these reach a human ---------------------

              # Every rule in smartctl-alerts.yaml is named Smart*. A failing
              # or wearing-out disk is invisible from the application side
              # right up until data is gone.
              - receiver: "smart-email"
                matchers:
                  - alertname =~ "Smart.*"
                # Disk problems are slow-moving; a daily nag is plenty.
                repeat_interval: 24h
              # Temperature rules (temperature-alerts.yaml) are all named Temp*.
              # Heat is the owner's stated example of a thing that SHOULD
              # interrupt them: it is a physical errand (a fan, a filter, a
              # window) and nothing in the software layer will ever show it.
              - receiver: "smart-email"
                matchers:
                  - alertname =~ "Temp.*"
                repeat_interval: 24h
              # Hardware, from node-exporter. A degraded array or a failed
              # array member is the same class as Smart*: physical, invisible,
              # and it silently removes the redundancy everything else assumes.
              - receiver: "smart-email"
                matchers:
                  - alertname =~ "NodeRAIDDegraded|NodeRAIDDiskFailure"
                repeat_interval: 24h
              # The node is gone or unreachable. The owner would notice this
              # eventually - everything stops - but it is a physical errand and
              # the sooner the better. Verified names: kube-prometheus-stack
              # ships KubeNodeNotReady and KubeNodeUnreachable (there is no
              # alert literally called "NodeDown").
              - receiver: "smart-email"
                matchers:
                  - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable"
                repeat_interval: 1h
              # Disk nearly full. Deliberately the ALMOST-OUT-OF pair only, not
              # the *FillingUp predictive variants: the predictive rules fire on
              # 6h/24h trend extrapolation and are the noisy half of this
              # family. Out of space is where resource exhaustion turns into an
              # outage - four incidents in the log, the worst blast radius of
              # any class - and no amount of using the cluster reveals it in
              # advance.
              - receiver: "smart-email"
                matchers:
                  - alertname =~ "NodeFilesystemAlmostOutOfSpace|NodeFilesystemAlmostOutOfFiles"
                repeat_interval: 4h
              # Backup-pipeline rules (backup-alerts.yaml): BackupTooOld is
              # named Backup*, but the WAL archiver rule is WALArchiverFailing
              # - it watches WAL shipping, not backups as such - so the regex
              # unions both prefixes instead of bending the alert name to fit
              # the route.
              #
              # This one is the clearest case for the "could not discover it
              # yourself" test. A stopped backup changes NOTHING observable:
              # every app stays up and every page still loads. MinIO ran with
              # zero drives online for ~20h while every write failed and it was
              # found by accident. This must reach a human.
              - receiver: "smart-email"
                matchers:
                  - alertname =~ "Backup.*|WALArchiver.*"
                # Unlike disks, a backup gap compounds: every hour without a
                # backup widens the recovery-point loss, so nag every 4h until
                # it clears rather than once a day.
                repeat_interval: 4h
              # Blackbox probe rules for MinIO (minio-probe.yaml) are all
              # named MinIO*. Same receiver; a 503 on /minio/health/cluster is
              # the exact signature of the 2026-08-29 outage. MinIO is the
              # substrate the backups land on, so this is the backup route's
              # early warning.
              - receiver: "smart-email"
                matchers:
                  - alertname =~ "MinIO.*"
                repeat_interval: 4h

              # --- Deliberately NOT routed, and why -------------------------
              #
              # KubeJobFailed / KubePodCrashLooping / TargetDown / KubePodNotReady
              #   Real, useful, and firing - six KubeJobFailed right now. They
              #   go to the model on report, not to an inbox. This is the whole
              #   point of the inversion above.
              #
              # NodeMemoryMajorPagesFaults / NodeMemoryHighUtilization /
              # KubeMemoryOvercommit
              #   Firing continuously and correctly: the node genuinely sits at
              #   ~93% of 13.8 GB. Routing a permanently-true alert is how the
              #   whole pipeline ends up back at "null" - the reader learns to
              #   ignore it, then ignores the disk alert next to it. These get
              #   routed only once headroom work makes them capable of being
              #   false. Until then it is a capacity problem, not a paging one.
          receivers:
            - name: "null"
            - name: "smart-email"
            # The heartbeat sink: a 40-line stdlib HTTP receiver on pve that
            # touches a file. Nothing reads the body - only the arrival time
            # matters - so the payload format is irrelevant. send_resolved is
            # off because Watchdog never resolves.
            - name: "heartbeat-ntfy"
              webhook_configs:
                - url: "http://192.168.1.153:9099/beat"
                  send_resolved: false
              email_configs:
                - to: "travis.fiorito@tuta.com"
                  send_resolved: true
          templates:
            - /etc/alertmanager/config/*.tmpl
        alertmanagerSpec:
          # The public URL Alertmanager is published at (see
          # alertmanager-ingress.yaml). The operator passes this to the pods as
          # --web.external-url, and Alertmanager builds the links inside
          # notification emails from it. Left unset it defaults to the
          # in-cluster service address, which is unreachable from any inbox -
          # exactly the bug this fixes.
          externalUrl: https://alertmanager.sandstorm.chat
          # Serve the UI at / so the published route needs no path rewriting
          # between Traefik and the pod.
          routePrefix: /
          # Mounts the `smtp` secret at /etc/alertmanager/secrets/smtp/ so the
          # password_file above resolves. Same Doppler secret Grafana mounts.
          secrets:
            - smtp
          nodeSelector:
            homelab/node-class: compute
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  # Loki: log storage. Small single-binary mode.
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 6.55.0
    releaseName: loki
    namespace: monitoring
    includeCRDs: true
    valuesInline:
      deploymentMode: SingleBinary
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        # Chunks live in MinIO, not on a volume. Loki speaks S3 natively, so
        # it needs no gateway - the object_store below was `filesystem`, which
        # is what kept log storage off S3 entirely.
        storage:
          type: s3
          bucketNames:
            chunks: loki
            ruler: loki
            admin: loki
          s3:
            endpoint: http://192.168.1.67:9000
            region: us-east-1
            s3ForcePathStyle: true
            insecure: true
        schemaConfig:
          configs:
            - from: "2025-01-01"
              store: tsdb
              object_store: s3
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
      # Memcached sidecars: pure overhead on a single-node homelab, and both
      # were stuck Pending anyway.
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      singleBinary:
        replicas: 1
        # S3 credentials for the chunk store. Kept in a secret rather than
        # inlined into values, which would persist them in Helm metadata.
        extraEnvFrom:
          - secretRef:
              name: loki-s3
        # The chart's default is a hard anti-affinity rule spreading replicas
        # across nodes. With one node and one replica that can never be
        # satisfied, so loki-0 sat Pending on "didn't match pod anti-affinity
        # rules" forever.
        affinity: {}
        nodeSelector:
          homelab/node-class: compute
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        persistence:
          # Chunks are in S3 now; this volume only holds the local WAL, so it
          # is small and lives on local disk for write latency.
          enabled: true
          storageClass: local-path
          size: 5Gi
      backend:
        replicas: 0
      read:
        replicas: 0
      write:
        replicas: 0
      # The gateway is an nginx front-end for the microservices deployment.
      # In SingleBinary mode nothing needs it, and `replicas: 0` still left the
      # chart rendering a Service that resolved to no endpoints - which the
      # canary below then tried to query, failing every time for three days.
      # Disabled outright so the Service goes away with it.
      gateway:
        enabled: false
        replicas: 0
      monitoring:
        selfMonitoring:
          enabled: false
          grafanaAgent:
            installOperator: false
      lokiCanary:
        enabled: true
        # Point at Loki itself, NOT the gateway. The canary defaults to
        # loki-gateway:80, which has no endpoints in SingleBinary mode, so
        # every query returned "connection refused" from the day it was
        # deployed:
        #   error querying loki: query_range request failed ...
        #   dial tcp 10.43.208.68:80: connect: connection refused
        #
        # That is worth fixing rather than deleting, because the canary is the
        # one component that proves the whole log path works end to end - it
        # writes a line and then reads it back. A broken canary is the
        # "silent success" shape this cluster keeps producing: present,
        # green-looking, and verifying nothing.
        # NO SCHEME. The chart prepends http:// itself and URL-encodes what
        # it is given, so passing a full URL produced
        #   http://http:%2F%2Floki.monitoring.svc.cluster.local:3100/...
        #   invalid URL escape "%2F"
        # which failed exactly as loudly as the gateway it replaced.
        lokiurl: loki.monitoring.svc.cluster.local:3100
      # Pin the ServiceAccount name. Chart 6.46.0 changed the default from
      # the chart name (`loki`) to the fullname (`loki-loki`) - without this
      # pin the upgrade renames the SA out from under the running pod and
      # breaks its token mount and RBAC.
      serviceAccount:
        name: loki
  # Blackbox exporter: probes endpoints from inside the cluster so Prometheus
  # can watch services that have no exporter of their own. Here it exists for
  # exactly one target - MinIO's /minio/health/cluster on the NAS, which
  # returned 503 for ~20h on 2026-08-29 while live/ready stayed 200 and every
  # backup failed silently. The Probe CR that drives it is minio-probe.yaml.
  - name: prometheus-blackbox-exporter
    repo: https://prometheus-community.github.io/helm-charts
    # Pinned: floating chart versions make an ArgoCD app drift on every
    # re-render, which is how silent staleness happens.
    version: 11.17.2
    releaseName: blackbox-exporter
    namespace: monitoring
    includeCRDs: true
    valuesInline:
      # The release name would otherwise prefix the chart fullname into
      # blackbox-exporter-prometheus-blackbox-exporter; the Probe CR's prober
      # URL reads much better against the short form.
      fullnameOverride: blackbox-exporter
      # The Probe CR is what drives scraping - Prometheus itself fetches
      # /probe?target=... - so the exporter's own ServiceMonitor would only
      # add a target nothing consumes.
      serviceMonitor:
        enabled: false
      # Modules. The point of edge-probes.yaml is not "did it answer" but "did
      # it answer WHAT IT SHOULD", and the stock http_2xx module cannot say
      # that: most of this cluster's routes correctly return 302 (the Authentik
      # forward-auth redirect), which http_2xx scores as a failure, and
      # Obsidian correctly returns 401 because clients speak CouchDB directly.
      #
      # Asserting the exact code is what makes these probes catch the
      # interesting failures rather than only the obvious ones. If a
      # forward-auth route starts answering 200, the gate has fallen off and
      # the app is exposed - a 2xx check would call that healthy.
      #
      # follow_redirects is FALSE on the 302 module on purpose. Following it
      # lands on the Authentik flow, which returns 200, so the assertion would
      # silently become "authentik is up" for fifteen different routes.
      #
      # Helm deep-merges maps, so naming http_2xx here keeps it identical to
      # the chart default rather than dropping it (minio-probe.yaml uses it).
      config:
        modules:
          http_2xx:
            prober: http
            timeout: 5s
            http:
              valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
              follow_redirects: true
              preferred_ip_protocol: ip4
              ip_protocol_fallback: false
          # Forward-auth routes: an unauthenticated GET / must redirect.
          http_302:
            prober: http
            timeout: 5s
            http:
              valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
              valid_status_codes: [302]
              follow_redirects: false
              preferred_ip_protocol: ip4
              ip_protocol_fallback: false
          # Obsidian LiveSync: CouchDB answers unauthenticated requests with
          # 401 by design. 200 here would mean the database went open.
          http_401:
            prober: http
            timeout: 5s
            http:
              valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
              valid_status_codes: [401]
              follow_redirects: false
              preferred_ip_protocol: ip4
              ip_protocol_fallback: false
      nodeSelector:
        homelab/node-class: compute
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  # Alloy: collector agent on every node. Ships to Prometheus and Loki.
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 0.12.6
    releaseName: alloy
    namespace: monitoring
    includeCRDs: true
    valuesInline:
      alloy:
        configMap:
          create: true
          content: |
            discovery.kubernetes "pods" {
              role = "pod"
            }
            // Kubernetes service discovery hands over __meta_* labels, which are
            // discarded unless they are relabelled onto the stream. Without this
            // block Loki held only instance/job/service_name - no namespace, no
            // pod, no container - so logs were being collected and stored but
            // could not be narrowed to an application by any query.
            discovery.relabel "pods" {
              targets = discovery.kubernetes.pods.targets
              rule {
                source_labels = ["__meta_kubernetes_namespace"]
                target_label  = "namespace"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label  = "pod"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label  = "container"
              }
              rule {
                // pod_node_name, not node_name: the pod discovery role emits
                // __meta_kubernetes_pod_node_name, and a relabel rule whose
                // source label does not exist is skipped in silence. Loki had
                // no `node` label at all as a result - the rule looked right
                // and had never once fired.
                //
                // Comments in this block are River, not YAML: only the double
                // slash form is legal. A YAML-style hash is an illegal
                // character here and Alloy then refuses to load at all.
                source_labels = ["__meta_kubernetes_pod_node_name"]
                target_label  = "node"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                target_label  = "app"
              }
            }
            loki.source.kubernetes "pods" {
              targets    = discovery.relabel.pods.output
              forward_to = [loki.write.default.receiver]
            }
            // Kubernetes Events, shipped to Loki so they outlive the ~1h the
            // API server keeps them.
            //
            // This block's absence had a measurable price. On 2026-09-03 three
            // consecutive pg_dump runs failed; by the time anyone looked, the
            // Events explaining WHY had already aged out of etcd, so the only
            // remaining way to learn the cause was to re-run the job and
            // reproduce the failure. That is the most expensive possible
            // diagnosis, and it was caused by a missing four-line component.
            //
            // Events are also where the answers to most "why is this pod not
            // running" questions live - image pull failures, scheduling
            // refusals, probe failures, volume mount errors, evictions - none
            // of which appear in any container's own logs, because the
            // container never started.
            //
            // NOTE FOR A SECOND NODE: Alloy is a DaemonSet, and this component
            // watches the whole cluster rather than one node, so every event
            // would be shipped once per node. On this single-node cluster that
            // is exactly one copy. If the NAS is ever joined, move this to a
            // singleton (a separate Deployment-mode Alloy) or events will
            // double.
            loki.source.kubernetes_events "cluster_events" {
              // Empty = all namespaces.
              namespaces = []
              job_name   = "kubernetes-events"
              log_format = "logfmt"
              forward_to = [loki.write.default.receiver]
            }
            loki.write "default" {
              endpoint {
                url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
              }
            }
            logging { level = "warn" }
        # DaemonSet by default. Runs on Pis with tight limits.
        tolerations:
          - operator: Exists
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
