---
# Monitoring stack. Prometheus scrapes. Grafana shows. Loki stores logs.
# Alloy ships metrics and logs from every node, Pis included.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: monitoring

commonLabels:
  app.kubernetes.io/name: monitoring
  app.kubernetes.io/part-of: homelab
  app.kubernetes.io/component: observability
  app.kubernetes.io/managed-by: argocd
  homelab/tier: platform

resources:
  - namespace.yaml
  - monitoring-pvc.yaml
  - grafana-admin-secret.yaml
  - networkpolicy.yaml

helmCharts:
  # Stack: Prometheus, Grafana, Alertmanager, node-exporter.
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 75.18.1
    releaseName: kps
    namespace: monitoring
    valuesInline:
      prometheus:
        prometheusSpec:
          retention: 15d
          nodeSelector:
            homelab/node-class: compute
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          storageSpec:
            volumeClaimTemplate:
              metadata:
                name: prometheus
              spec:
                storageClassName: nfs-csi
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 20Gi
      grafana:
        admin:
          existingSecret: grafana-admin
        initChownData:
          enabled: false
        nodeSelector:
          homelab/node-class: compute
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          storageClassName: nfs-csi
          size: 2Gi
          existingClaim: grafana
        env:
          GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
          GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
          GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana-oidc"
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "MANAGED_BY_DOPPLER"
          GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authentik.sandstorm.chat/application/o/authorize/"
          GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://authentik.sandstorm.chat/application/o/token/"
          GF_AUTH_GENERIC_OAUTH_API_URL: "https://authentik.sandstorm.chat/application/o/userinfo/"
          GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups"
          GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: 'contains(groups[*], "Admin") && "Admin" || "Viewer"'
          GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
          GF_SERVER_ROOT_URL: "https://grafana.sandstorm.chat"
        grafana.ini:
          server:
            domain: grafana.sandstorm.chat
      alertmanager:
        alertmanagerSpec:
          nodeSelector:
            homelab/node-class: compute
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  # Loki: log storage. Small single-binary mode.
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 6.30.1
    releaseName: loki
    namespace: monitoring
    valuesInline:
      deploymentMode: SingleBinary
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        storage:
          bucketNames:
            chunks: loki-chunks
            ruler: loki-ruler
            admin: loki-admin
        schemaConfig:
          configs:
            - from: "2025-01-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
      singleBinary:
        replicas: 1
        nodeSelector:
          homelab/node-class: compute
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        persistence:
          enabled: true
          storageClass: nfs-csi
          size: 10Gi
      backend:
        replicas: 0
      read:
        replicas: 0
      write:
        replicas: 0
      gateway:
        replicas: 0
      monitoring:
        selfMonitoring:
          enabled: false
          grafanaAgent:
            installOperator: false
      lokiCanary:
        enabled: true
  # Alloy: collector agent on every node. Ships to Prometheus and Loki.
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 0.12.6
    releaseName: alloy
    namespace: monitoring
    valuesInline:
      alloy:
        configMap:
          create: true
          content: |
            discovery.kubernetes "pods" {
              role = "pod"
            }
            loki.source.kubernetes "pods" {
              targets    = discovery.kubernetes.pods.targets
              forward_to = [loki.write.default.receiver]
            }
            loki.write "default" {
              endpoint {
                url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
              }
            }
            logging { level = "warn" }
        # DaemonSet by default. Runs on Pis with tight limits.
        tolerations:
          - operator: Exists
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
