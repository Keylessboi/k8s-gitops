---
# Cluster and node health, provisioned for the Grafana sidecar.
#
# Everything here comes from node-exporter and kube-state-metrics, neither
# of which Prometheus was actually scraping - their ServiceMonitors matched
# no Service. See podmonitors-platform.yaml; without that file every panel
# on this dashboard is empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-health.json: |
    {
      "uid": "cluster-health",
      "title": "Cluster & Node Health",
      "tags": [
        "homelab",
        "kubernetes"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Cluster",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "Nodes ready",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "title": "Pods running",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 3,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "B",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "running"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Pods not running",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "C",
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "not running"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "CPU used",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 9,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "D",
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "cpu"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 6,
          "title": "Memory used",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "E",
              "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "mem"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 92
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 7,
          "title": "Root disk used",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 15,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "F",
              "expr": "100 * (1 - sum(node_filesystem_avail_bytes{mountpoint=\"/\"}) / sum(node_filesystem_size_bytes{mountpoint=\"/\"}))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "disk"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 8,
          "title": "Restarts (1h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "G",
              "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "restarts"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 9,
          "title": "Uptime",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 21,
            "y": 1,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "refId": "H",
              "expr": "max(time() - node_boot_time_seconds)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "uptime"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 10,
          "title": "Node",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 11,
          "title": "CPU by mode",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "I",
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{mode!=\"idle\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "{{mode}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Seconds of CPU per second, summed across cores. Idle is excluded."
        },
        {
          "id": 12,
          "title": "Memory",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "J",
              "expr": "sum(node_memory_MemTotal_bytes) - sum(node_memory_MemAvailable_bytes)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "used"
            },
            {
              "refId": "K",
              "expr": "sum(node_memory_Cached_bytes) + sum(node_memory_Buffers_bytes)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "cache + buffers"
            },
            {
              "refId": "L",
              "expr": "sum(node_memory_MemTotal_bytes)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "title": "Load average",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "M",
              "expr": "node_load1",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "1m"
            },
            {
              "refId": "N",
              "expr": "node_load5",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "5m"
            },
            {
              "refId": "O",
              "expr": "node_load15",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "15m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "title": "Disk throughput",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "P",
              "expr": "sum by (device) (rate(node_disk_read_bytes_total[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "read {{device}}"
            },
            {
              "refId": "Q",
              "expr": "sum by (device) (rate(node_disk_written_bytes_total[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "write {{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 15,
          "title": "Network",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "R",
              "expr": "sum by (device) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*|docker.*|cali.*\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "rx {{device}}"
            },
            {
              "refId": "S",
              "expr": "sum by (device) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*|docker.*|cali.*\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "tx {{device}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 16,
          "title": "Filesystem used",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "T",
              "expr": "100 * (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs|devtmpfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs|devtmpfs\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "{{mountpoint}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 17,
          "title": "Disk IO saturation",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "U",
              "expr": "sum by (device) (rate(node_disk_io_time_seconds_total[5m])) * 100",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "{{device}} busy"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Percent of wall time the device had at least one IO in flight."
        },
        {
          "id": 18,
          "title": "Workloads",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 19,
          "title": "Pods by phase",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "V",
              "expr": "sum by (phase) (kube_pod_status_phase)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
