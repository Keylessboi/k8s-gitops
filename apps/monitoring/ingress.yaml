---
# Grafana only. Prometheus stays internal — it has no auth of its own and
# publishing it would expose the whole metrics surface. Alertmanager is
# published separately (alertmanager-ingress.yaml), behind Authentik
# forward-auth on the entire route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.sandstorm.chat
      secretName: grafana-tls
  rules:
    - host: grafana.sandstorm.chat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kps-grafana
                port:
                  number: 80
