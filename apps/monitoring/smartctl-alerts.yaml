---
# Disk health alerts.
#
# The point of collecting SMART data is to hear about a disk before it takes
# the pool with it, so these fire on the predictive attributes as well as on
# outright failure. Thresholds are deliberately conservative - a homelab disk
# that is merely old should not page anyone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl
  namespace: monitoring
  labels:
    # kube-prometheus-stack's Prometheus selects rules by this label.
    release: kps
spec:
  groups:
    - name: disk-health
      rules:
        # The drive's own verdict. Nothing else in this file matters as much.
        - alert: SmartDeviceFailing
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART self-assessment FAILED on {{ $labels.device }} ({{ $labels.host }})"
            description: >-
              {{ $labels.model_name }} serial {{ $labels.serial_number }} reports
              its own health check as failed. Replace it; do not wait for
              symptoms.

        # Reallocated sectors mean the drive has already run out of spare room
        # once. A non-zero count that is *growing* is the real signal.
        - alert: SmartReallocatedSectors
          expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) has reallocated sectors"
            description: >-
              {{ $value }} reallocated sectors. Watch for growth - a stable
              count on an old disk is tolerable, a rising one is not.

        - alert: SmartPendingSectors
          expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) has pending sectors"
            description: >-
              {{ $value }} sectors are unreadable and awaiting reallocation.
              These are unrecoverable reads happening right now.

        # NVMe reports errors differently from SATA - no reallocated-sector
        # attribute at all - so it needs its own rules.
        - alert: SmartNvmeMediaErrors
          expr: increase(smartctl_device_media_errors[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) logged NVMe media errors"
            description: "{{ $value }} new media errors in the last 24h."

        - alert: SmartNvmeWearout
          expr: smartctl_device_available_spare_ratio < 0.10
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) is running out of spare blocks"
            description: "Available spare is {{ $value | humanizePercentage }}."

        # 60C is where drive vendors generally stop warranting the thing.
        - alert: SmartDeviceHot
          expr: smartctl_device_temperature{temperature_type="current"} > 60
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) is at {{ $value }}C"
            description: "Sustained above 60C. Check airflow before it throttles or fails."

        # If the exporter itself stops, every alert above goes quiet and the
        # disks look fine. That silence is the dangerous failure mode.
        - alert: SmartExporterDown
          expr: up{job="smartctl"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "smartctl_exporter on {{ $labels.host }} is not responding"
            description: >-
              Disk health is no longer being collected from this host, so every
              other disk alert is silently inert.
