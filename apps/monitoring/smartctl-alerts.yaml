---
# Disk health alerts.
#
# The point of collecting SMART data is to hear about a disk before it takes
# the pool with it, so these fire on the predictive attributes as well as on
# outright failure. Thresholds are deliberately conservative - a homelab disk
# that is merely old should not page anyone.
#
# Metric names and semantics below were verified against what the exporter
# (smartctl_exporter 0.14.0) actually exposes on this fleet: one NVMe on each
# host (proxmox, nas) and three SAS pool disks on the NAS (sda/sdb/sdd). The
# NAS pool disks are SAS, not SATA, so they expose no ATA `smartctl_device_
# attribute` series (Reallocated_Sector_Ct / Current_Pending_Sector) at all -
# their reallocation/uncorrectable signals come through the SCSI metrics
# instead. NVMe wear comes through available_spare / percentage_used.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl
  namespace: monitoring
  labels:
    # kube-prometheus-stack's Prometheus selects rules by this label.
    release: kps
spec:
  groups:
    - name: disk-health
      rules:
        # The drive's own verdict. Nothing else in this file matters as much.
        # Verified semantics: 1 = SMART self-assessment PASSED, 0 = FAILED
        # (every healthy disk on the fleet currently reports 1).
        - alert: SmartDeviceFailing
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART self-assessment FAILED on {{ $labels.device }} ({{ $labels.host }})"
            description: >-
              {{ $labels.device }} on {{ $labels.host }} reports its own health
              check as failed. Replace it; do not wait for symptoms.

        # NVMe rolls its failure conditions (spare below threshold, media in
        # read-only, degraded reliability, over-temperature) into one composite
        # bitfield. Non-zero is the controller itself raising a hand.
        - alert: SmartNvmeCriticalWarning
          expr: smartctl_device_critical_warning > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) raised an NVMe critical warning"
            description: >-
              critical_warning bitfield is {{ $value }}. The controller is
              flagging spare exhaustion, media errors, degraded reliability or
              over-temperature. Investigate now.

        # SAS equivalent of reallocated sectors: blocks the drive has retired
        # into its grown defect list. A non-zero count that is *growing* is the
        # real signal - a stable count on an old disk is tolerable.
        - alert: SmartScsiGrownDefects
          expr: smartctl_scsi_grown_defect_list > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) has grown defects"
            description: >-
              {{ $value }} blocks in the grown defect list. Watch for growth -
              a rising count means the disk is shedding sectors.

        # SAS uncorrectable read/write errors. These are unrecoverable IO
        # happening now - the closest SAS analogue to ATA pending sectors.
        - alert: SmartScsiUncorrectedErrors
          expr: >-
            increase(smartctl_read_total_uncorrected_errors[24h]) > 0
            or increase(smartctl_write_total_uncorrected_errors[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) logged uncorrectable IO errors"
            description: "{{ $value }} new uncorrectable read/write errors in the last 24h."

        # NVMe reports errors differently from SAS - a lifetime media-error
        # counter - so it needs its own rule. Alert on new errors, not the
        # standing lifetime total.
        - alert: SmartNvmeMediaErrors
          expr: increase(smartctl_device_media_errors[24h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) logged NVMe media errors"
            description: "{{ $value }} new media errors in the last 24h."

        # NVMe spare blocks. Both available_spare and its threshold are reported
        # as percentages (healthy disks read 100 against a threshold of 10);
        # crossing the threshold is exactly when the controller declares wearout.
        - alert: SmartNvmeSpareLow
          expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) is running out of spare blocks"
            description: >-
              Available spare is {{ $value }}%, below the drive's own threshold.
              The controller now considers this disk worn out.

        # Endurance used, as a percentage of the drive's rated writes. 100 is
        # the vendor's rated end-of-life; 90 gives lead time to order a
        # replacement. Applies to both NVMe and SSD.
        - alert: SmartDeviceWearout
          expr: smartctl_device_percentage_used >= 90
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) is at {{ $value }}% rated wear"
            description: >-
              The drive has used {{ $value }}% of its rated write endurance.
              Plan a replacement before it reaches 100%.

        # 60C is where drive vendors generally stop warranting the thing. Filter
        # to the current reading - the series also carries drive_trip (the
        # manufacturer's shutdown temp), which must not be alerted on directly.
        - alert: SmartDeviceHot
          expr: smartctl_device_temperature{temperature_type="current"} > 60
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} ({{ $labels.host }}) is at {{ $value }}C"
            description: "Sustained above 60C. Check airflow before it throttles or fails."

        # If the exporter itself stops, every alert above goes quiet and the
        # disks look fine. That silence is the dangerous failure mode.
        - alert: SmartExporterDown
          expr: up{job="smartctl"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "smartctl_exporter on {{ $labels.host }} is not responding"
            description: >-
              Disk health is no longer being collected from this host, so every
              other disk alert is silently inert.
