---
# CloudNativePG / Postgres. One cluster backs every app in this homelab,
# so the per-database panels are effectively a per-app breakdown.
#
# Metrics come from the CNPG instance pod on 9187, scraped by the cnpg
# PodMonitor in servicemonitors-apps.yaml. The -rw/-ro/-r Services publish
# 5432 only, which is why this is a PodMonitor and not a ServiceMonitor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgres
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cnpg-postgres.json: |
    {
      "uid": "cnpg-postgres",
      "title": "Postgres (CloudNativePG)",
      "tags": [
        "homelab",
        "postgres",
        "database"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Instance",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "Collector up",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "H",
              "expr": "max(cnpg_collector_up)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "up"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "title": "Backends",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "I",
              "expr": "sum(cnpg_backends_total)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "backends"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "description": "Open server connections. Compare against max_connections before this becomes a refused-connection incident."
        },
        {
          "id": 4,
          "title": "Waiting backends",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "J",
              "expr": "sum(cnpg_backends_waiting_total)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "waiting"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "description": "Backends blocked on a lock. Anything sustained here is a contention problem."
        },
        {
          "id": 5,
          "title": "Longest transaction",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "K",
              "expr": "max(cnpg_backends_max_tx_duration_seconds)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "max tx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 300
                  },
                  {
                    "color": "red",
                    "value": 3600
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "description": "A long-running transaction holds back vacuum and bloats the database."
        },
        {
          "id": 6,
          "title": "Uptime",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "L",
              "expr": "time() - max(cnpg_pg_postmaster_start_time)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "uptime"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 7,
          "title": "Total size",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "M",
              "expr": "sum(cnpg_pg_database_size_bytes)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "size"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          }
        },
        {
          "id": 8,
          "title": "Databases",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "title": "Database size",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "N",
              "expr": "cnpg_pg_database_size_bytes",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "{{datname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "One Postgres cluster backs every app here, so each app is a database on this panel."
        },
        {
          "id": 10,
          "title": "Transactions",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "O",
              "expr": "sum by (datname) (rate(cnpg_pg_stat_database_xact_commit[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "commit {{datname}}"
            },
            {
              "refId": "P",
              "expr": "sum by (datname) (rate(cnpg_pg_stat_database_xact_rollback[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "rollback {{datname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "title": "Cache hit ratio",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "Q",
              "expr": "sum by (datname) (rate(cnpg_pg_stat_database_blks_hit[5m])) / clamp_min(sum by (datname) (rate(cnpg_pg_stat_database_blks_hit[5m]) + rate(cnpg_pg_stat_database_blks_read[5m])), 0.001)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "{{datname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Share of block reads served from shared buffers. Below ~0.95 on a busy database means it is going to disk too often."
        },
        {
          "id": 12,
          "title": "Tuple activity",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 15,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "R",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_fetched[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "fetched"
            },
            {
              "refId": "S",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_inserted[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "inserted"
            },
            {
              "refId": "T",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_updated[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "updated"
            },
            {
              "refId": "U",
              "expr": "sum(rate(cnpg_pg_stat_database_tup_deleted[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "deleted"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "title": "Deadlocks & conflicts",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 15,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "V",
              "expr": "sum by (datname) (rate(cnpg_pg_stat_database_deadlocks[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "deadlocks {{datname}}"
            },
            {
              "refId": "W",
              "expr": "sum by (datname) (rate(cnpg_pg_stat_database_conflicts[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "conflicts {{datname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "title": "WAL, checkpoints & backups",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 15,
          "title": "WAL bytes",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "X",
              "expr": "rate(cnpg_collector_wal_bytes[5m])",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "wal"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 16,
          "title": "Checkpoints",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "Y",
              "expr": "rate(cnpg_pg_stat_bgwriter_checkpoints_timed[5m])",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "timed"
            },
            {
              "refId": "Z",
              "expr": "rate(cnpg_pg_stat_bgwriter_checkpoints_req[5m])",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "requested"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Requested checkpoints outrunning timed ones means max_wal_size is too small for the write rate."
        },
        {
          "id": 17,
          "title": "Buffers written",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(cnpg_pg_stat_bgwriter_buffers_checkpoint[5m])",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "checkpoint"
            },
            {
              "refId": "B",
              "expr": "rate(cnpg_pg_stat_bgwriter_buffers_clean[5m])",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "bgwriter"
            },
            {
              "refId": "C",
              "expr": "rate(cnpg_pg_stat_bgwriter_buffers_backend[5m])",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "backend"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 18,
          "title": "Since last archive",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "D",
              "expr": "max(cnpg_pg_stat_archiver_seconds_since_last_archival)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "legendFormat": "archived"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3600
                  },
                  {
                    "color": "red",
                    "value": 86400
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "description": "WAL archiving is what makes point-in-time recovery possible. A number that keeps climbing means archiving has stopped."
        },
        {
          "id": 19,
          "title": "Archive failures",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
