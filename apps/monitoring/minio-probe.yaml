---
# Blackbox probe of MinIO's CLUSTER health endpoint on the NAS.
#
# This is the probe that would have caught the 2026-08-29 outage in minutes
# instead of 20 hours: when MinIO's drive vanished, /minio/health/cluster
# returned 503 (write/read quorum gone) while /minio/health/live and /ready
# kept returning 200 - so a liveness-style probe against the pod would have
# stayed green straight through the outage. The cluster endpoint is the only
# one that actually reports the failure.
#
# The probe runs from the blackbox exporter deployed in this directory (see
# the helmCharts entry in kustomization.yaml); Prometheus fetches
# /probe?target=... itself, so probe_success lands in Prometheus with
# job="probe/monitoring/minio-health" and instance=<the URL below>.
#
# Egress to 192.168.1.67:9000 is granted by the matching rule in
# networkpolicy.yaml - the catch-all egress rule deliberately excludes
# 192.168.0.0/16, so without it the probe is dropped and MinIO looks
# permanently healthy because nothing is ever collected.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: minio-health
  namespace: monitoring
  labels:
    # The Prometheus CR's probeSelector requires this label and silently
    # ignores anything without it - the same trap as the ServiceMonitors
    # (see servicemonitors-apps.yaml).
    release: kps
spec:
  # 60s: the outage was a NAS boot-order failure, not a flap; a minute of
  # resolution is plenty and keeps the probe load trivial.
  interval: 60s
  # The chart's default http_2xx module: HTTP probe, IPv4 preferred (the NAS
  # is a v4 address), 5s timeout, follows redirects.
  module: http_2xx
  prober:
    # No scheme: the operator rejects prober URLs with one ("should be of the
    # format hostname or hostname:port") and skips the probe entirely.
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://192.168.1.67:9000/minio/health/cluster
---
# The rule the probe above exists for. kustomization.yaml routes
# alertname=~"MinIO.*" to smart-email on the strength of a comment saying the
# rules here are all named MinIO*, but until 2026-10-23 there were none: the
# probe recorded probe_success=0 and nothing turned it into an alert.
# EndpointDown does not cover it either, because it selects
# probe_group="edge" and this target has no such label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minio-health
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: minio-health
      rules:
        - alert: MinIOClusterUnhealthy
          expr: probe_success{job="probe/monitoring/minio-health"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "MinIO cluster health has failed for 5m"
            description: >-
              {{ $labels.instance }} is not answering 2xx. A 503 here means
              MinIO has lost read/write quorum (the 2026-08-29 signature:
              zero drives online), so every backup written to it is failing.
              /minio/health/live can still be 200 while this is down.
        # The probe itself vanishing would also stop the rule above from ever
        # firing, which is the silent case this file was written to end.
        - alert: MinIOProbeAbsent
          expr: absent(probe_success{job="probe/monitoring/minio-health"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No MinIO health probe results for 15m"
            description: >-
              Prometheus has no probe_success series for the MinIO probe, so
              MinIOClusterUnhealthy cannot fire. Check the Probe CR's release
              label, the blackbox exporter, and the monitoring egress rule to
              192.168.1.67:9000.
