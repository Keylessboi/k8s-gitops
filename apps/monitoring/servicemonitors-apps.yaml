---
# Scrape targets for the applications that already expose Prometheus metrics.
#
# These live here rather than beside each app so that one directory owns every
# scrape definition, and because a monitor only has to be *somewhere* - the
# operator selects across all namespaces and each one names its target
# namespace explicitly. apps/traefik/servicemonitor.yaml predates this and is
# left where it is; it also has to create a Service, which cannot be done from
# here because kustomization.yaml forces every resource in this directory into
# the monitoring namespace.
#
# Only apps that serve metrics today are listed. Nothing here adds an exporter
# sidecar - see the tail of this file for what is still uncovered and why.
#
# `release: kps` on every monitor: the operator's selector requires it and
# ignores anything without it, with no event or log line to say so.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd
  namespace: monitoring
  labels:
    release: kps
spec:
  # ArgoCD splits its metrics across several Services - controller, server,
  # repo server, applicationset, notifications - and every one of them names
  # the port `metrics`, so a single monitor covers the lot. Their
  # `app.kubernetes.io/name` labels survive intact: apps/argocd is excluded
  # from the root ApplicationSet, so nothing rewrites them.
  #
  # argocd-dex-server is deliberately absent. It declares a metrics port on
  # 5558 but nothing is listening behind it - the scrape is refused outright,
  # not dropped - because dex only serves telemetry when its config asks for
  # it. Including it bought a permanently down target and the TargetDown
  # alert that comes with one.
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-metrics
          - argocd-server-metrics
          - argocd-repo-server
          - argocd-applicationset-controller
          - argocd-notifications-controller-metrics
  namespaceSelector:
    matchNames: [argocd]
  endpoints:
    - port: metrics
      interval: 30s
---
# CrowdSec exposes decisions, parser hits and bouncer traffic on 6060. The
# agent and the LAPI each publish a different half - the agent counts what it
# read, the LAPI counts what it banned - so both are scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crowdsec
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - crowdsec-service
          - crowdsec-agent-service
  namespaceSelector:
    matchNames: [crowdsec]
  endpoints:
    - port: metrics
      interval: 30s
---
# CNPG publishes Postgres metrics on the instance pod (9187), not on any of the
# -rw/-ro/-r Services, which carry the 5432 port alone. A PodMonitor is what
# the operator itself generates for `enablePodMonitor`, and it keeps working
# across a failover because it selects on the CNPG pod role rather than a
# specific instance name.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  namespaceSelector:
    matchNames: [databases]
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: cnpg
---
# Authentik serves metrics on a container port that no Service publishes, so
# this has to be a PodMonitor.
#
# Scoped to component=server, which is a correction. This selector used to
# match `name: authentik` alone, on the belief that server and worker both
# serve 9300 and report different things. The worker does not - not on
# 2025.12.4. Verified from inside the running worker: 9300 AND 9000 both
# return ECONNREFUSED on its own loopback, so it opens no HTTP listener at
# all, even though the chart sets AUTHENTIK_LISTEN__HTTP and
# AUTHENTIK_LISTEN__METRICS on it. The same test against the server pod
# returns 9300 OPEN. The worker is a Celery consumer here and simply ignores
# those variables; they are chart boilerplate, not evidence of a listener.
#
# That was almost certainly true once and stopped being true across the
# 2025.6.4 -> 2025.12.4 upgrade (a 6-month calver leap). The cost of leaving
# it: a permanently firing TargetDown that can never clear, which is exactly
# the kind of unfixable noise that gets a whole alert pipeline routed to
# "null". If worker task state is wanted later, it has to come from the
# server's metrics or the task API - not from scraping the worker.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  namespaceSelector:
    matchNames: [authentik]
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: authentik
        # Kept although the selector now admits only the server: it keeps the
        # series shape stable if a second component ever starts serving 9300.
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: component
---
# cert-manager tracks certificate expiry and renewal outcomes. Renewals run
# unattended, so a broken one is invisible until a certificate actually expires.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: monitoring
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  namespaceSelector:
    matchNames: [cert-manager]
  endpoints:
    - port: tcp-prometheus-servicemonitor
      interval: 60s
      relabelings:
        - targetLabel: job
          replacement: cert-manager
#
# Deliberately not covered, and what each would take:
#
#   redis        The chart runs redis alone on 6379 with no exporter container,
#                so there is no endpoint to point at. Needs the bitnami chart's
#                `metrics.enabled` sidecar (redis_exporter) before a monitor
#                here would resolve.
#   lidarr,      Servarr applications expose no Prometheus endpoint at all -
#   prowlarr,    only their own JSON API behind an API key. Coverage means
#   readarr      deploying exportarr per app, one container each.
#   qbittorrent, Same shape: an HTTP API, no metrics endpoint. qbittorrent has
#   slskd        a community exporter; slskd has none.
#   immich,      No Prometheus endpoint on the default images. Immich can be
#   nextcloud,   built with OpenTelemetry enabled; Nextcloud needs the
#   navidrome,   serverinfo app plus an exporter; Vaultwarden and Kiwix expose
#   vaultwarden, nothing.
#   kiwix
#   forgejo      Has a built-in /metrics endpoint but it is disabled by default
#                and needs a token set in its config before it serves anything.
#   flaresolverr,
#   byparr       Stateless captcha solvers with no metrics endpoint.
#
# All of these are still covered for CPU, memory, restarts and network by
# cAdvisor and kube-state-metrics, and for behaviour by their logs in Loki.
# What is missing is only application-level detail.
