---
# Backup pipeline alerts -> email the owner when backups stop happening.
#
# Why this file exists: on 2026-08-29 MinIO lost its drive (drives-online: 0)
# and served 503 on /minio/health/cluster for ~20h while live/ready stayed
# 200. CNPG WAL archiving refused (SlowDownWrite), the pgdump CronJob failed
# 3x with BackoffLimitExceeded, and nothing emailed anyone - the outage was
# discovered by hand while taking an unrelated backup. These rules close that
# gap: a repeat pages within ~30 minutes.
#
# Every metric below was verified against what the cnpg exporter actually
# exposes on this cluster (scraped as job="cnpg" by the PodMonitor in
# servicemonitors-apps.yaml; queried live in Prometheus 2026-08-29), NOT
# against documentation:
#
#   * cnpg_collector_last_available_backup_timestamp    epoch of the newest
#     restorable backup (barman base backup). Real value today: 1787973328.
#     The series carries job="cnpg", namespace="databases", pod="app-databases-1"
#     and NO cluster label - so the rules select on job/namespace, which is
#     what the pods actually expose.
#   * cnpg_pg_stat_archiver_failed_count                COUNTER of failed WAL
#     archive attempts (211 total today - most of them from the outage).
#   * cnpg_pg_stat_archiver_seconds_since_last_archival GAUGE, -1 = never.
#     archive_timeout=5min forces a segment out at least every 5 minutes, so
#     a healthy archiver keeps this far below the 30m threshold used here.
#
# Thresholds: base backups run daily at 03:15 (ScheduledBackup
# app-databases-daily), so 26h means "a full cycle missed plus 2h of grace"
# before anyone is woken up.
#
# Alert names are prefixed Backup / WALArchiver so the Alertmanager route in
# kustomization.yaml (alertname =~ "Backup.*|WALArchiver.*") delivers them
# through the EXISTING Gmail SMTP path to travis.fiorito@tuta.com - the
# smart-email receiver is reused, no second SMTP config.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup
  namespace: monitoring
  labels:
    # kube-prometheus-stack's Prometheus selects rules by this label.
    release: kps
spec:
  groups:
    - name: backup-pipeline
      rules:
        # The headline signal: no restorable backup for over a day. Every
        # failure mode downstream of the database - MinIO down, WAL archiving
        # stuck, base backup failing - ends up visible here, which is why this
        # is the critical one. for:15m rides out an exporter scrape blip.
        - alert: BackupTooOld
          expr: time() - cnpg_collector_last_available_backup_timestamp{job="cnpg", namespace="databases"} > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Newest restorable backup is {{ $value | humanizeDuration }} old"
            description: >-
              No restorable CNPG backup for {{ $value | humanizeDuration }} -
              the daily 03:15 cycle has been missed. Check MinIO on the NAS
              (http://192.168.1.67:9000/minio/health/cluster must return 200),
              then the Backup CRs and the pgdump CronJob in the databases
              namespace. Until this clears, WAL and dumps are not landing.

        # WAL shipping is the first domino: when MinIO goes away the archiver
        # fails (or silently stops advancing) long before the daily base
        # backup is due, so this is the early warning. Two verified signals
        # ORed together: the failure counter rising, or no successful archive
        # for 30m (the counter alone misses a stuck-but-not-failing archiver;
        # the staleness gauge alone misses a flapping one).
        - alert: WALArchiverFailing
          expr: >-
            increase(cnpg_pg_stat_archiver_failed_count{job="cnpg", namespace="databases"}[30m]) > 0
            or
            cnpg_pg_stat_archiver_seconds_since_last_archival{job="cnpg", namespace="databases"} > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CNPG WAL archiving is failing or stalled"
            description: >-
              pg_stat_archiver reports failed-count growth or no successful
              archive for over 30m (value: {{ $value }}). Postgres holds WAL
              and will eventually refuse writes (SlowDownWrite). Check MinIO
              on the NAS first - /minio/health/cluster must return 200 - then
              the archiver process on the database pod.

        # The restore drill (apps/databases/restore-drill-cronjob.yaml) is the
        # only thing in this cluster that proves the dumps are restorable
        # rather than merely present. BackupTooOld above watches that backups
        # HAPPEN; this watches that they WORK, which is a different claim and
        # the one that matters on the day it matters.
        #
        # Named Backup* deliberately: that prefix is what the Alertmanager
        # route in apps/monitoring/kustomization.yaml delivers to a human.
        # Under the current routing almost everything else reaches a model on
        # report instead, and this belongs in the small set that does not -
        # nobody discovers an unrestorable backup by using the cluster.
        #
        # LABEL TRAP, verified live: kube-state-metrics' own namespace is what
        # lands in `namespace` (monitoring), while the object's namespace lands
        # in `exported_namespace`. Matching on namespace="databases" here would
        # silently match nothing and this alert would never fire.
        - alert: BackupRestoreDrillFailed
          expr: kube_job_status_failed{exported_namespace="databases", job_name=~"restore-drill-.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Monthly restore drill FAILED - backups may not be restorable"
            description: >-
              The restore drill could not restore one or more database dumps
              from the newest restic snapshot. This does not mean data is lost;
              it means the recovery path is unproven and must be checked now.
              Read the job output for the per-database table:
              kubectl -n databases logs job/<name> -c verify. A FAIL row names
              the database whose dump did not come back.

        # A drill that stops running fails open: no failed Job exists, so the
        # rule above stays quiet forever and the silence reads as success.
        # 40 days allows one missed monthly run plus slack before complaining.
        - alert: BackupRestoreDrillStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{exported_namespace="databases", cronjob="restore-drill"}
            > 40 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Restore drill has not passed in {{ $value | humanizeDuration }}"
            description: >-
              The monthly restore drill has not completed successfully in over
              40 days, so nothing currently proves the backups are restorable.
              Check the CronJob in the databases namespace - suspended, failing
              to schedule, or being deleted before it can run.
