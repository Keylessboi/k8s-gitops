---
# Sits on a compute node. Talks to Newt on the outside host.
# Crowdsec sidecar handles traefik log analysis and blocking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin
  namespace: pangolin
spec:
  # PARKED AT ZERO, deliberately.
  #
  # Pangolin needs a config.yml it has never had in git. The only one that
  # ever existed was a `pangolin-config` ConfigMap created by hand in a past
  # session — invisible to this repo, so every rebuild lost it and the
  # container died on "No configuration file found".
  #
  # Traefik is the front door now (apps/traefik), so nothing depends on
  # Pangolin. Rather than leave it crash-looping and burning restarts, it is
  # scaled to zero until its config is written properly and committed. Set
  # replicas back to 1 at that point.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pangolin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangolin
        app.kubernetes.io/part-of: homelab
    spec:
      nodeSelector:
        homelab/node-class: compute
      containers:
        - name: pangolin
          image: fosrl/pangolin:1.19.2
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: homelab-shared
                optional: true
          volumeMounts:
            # Mounting the same PVC at /app/config and /app/config/data means
            # the second mount shadows the first. Only /app/config is needed;
            # the data subdirectory lives inside it.
            - name: data
              mountPath: /app/config
            - name: traefik-logs
              mountPath: /var/log/traefik
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/linux"
            - name: DISABLE_ONLINE_API
              value: "false"
          ports:
            - name: lapi
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: crowdsec-data
              mountPath: /var/lib/crowdsec/data
            - name: crowdsec-config-writable
              mountPath: /etc/crowdsec
            - name: crowdsec-config
              mountPath: /etc/crowdsec/acquis.yaml
              subPath: acquis.yaml
            - name: crowdsec-tmp
              mountPath: /tmp
            - name: traefik-logs
              mountPath: /var/log/traefik
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pangolin-data
        - name: crowdsec-config
          configMap:
            name: crowdsec-acquis
        - name: crowdsec-data
          emptyDir: {}
        - name: traefik-logs
          emptyDir: {}
        - name: crowdsec-config-writable
          emptyDir: {}
        - name: crowdsec-tmp
          emptyDir: {}
