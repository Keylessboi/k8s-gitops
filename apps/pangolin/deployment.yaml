---
# Sits on a compute node. Talks to Newt on the outside host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin
  namespace: pangolin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pangolin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangolin
        app.kubernetes.io/part-of: homelab
    spec:
      nodeSelector:
        homelab/node-class: compute
      containers:
        - name: pangolin
          image: fosrl/pangolin:1.19.2
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: homelab-shared
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/config/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          args: ["crowdsec", "-config", "/etc/crowdsec/acquis.yaml"]
          volumeMounts:
          - name: crowdsec-config
            mountPath: /etc/crowdsec
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 50m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pangolin-data
        - name: crowdsec-config
          configMap:
            name: crowdsec-acquis
