---
# Sits on a compute node. Talks to Newt on the outside host.
# Crowdsec sidecar handles traefik log analysis and blocking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin
  namespace: pangolin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pangolin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangolin
        app.kubernetes.io/part-of: homelab
    spec:
      nodeSelector:
        homelab/node-class: compute
      containers:
        - name: pangolin
          image: fosrl/pangolin:1.19.2
          ports:
            - name: http
              containerPort: 3001
          env:
            # Signs sessions. Kept out of the ConfigMap and out of git; the
            # hand-made config had this hardcoded to a guessable literal.
            - name: SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: pangolin-secret
                  key: server-secret
          volumeMounts:
            # Mounting the same PVC at /app/config and /app/config/data means
            # the second mount shadows the first. Only /app/config is needed;
            # the data subdirectory lives inside it.
            - name: data
              mountPath: /app/config
            # subPath so the ConfigMap lands as a single file INSIDE the PVC
            # mount rather than replacing the whole directory - Pangolin keeps
            # its SQLite database in the same folder.
            - name: config
              mountPath: /app/config/config.yml
              subPath: config.yml
            - name: traefik-logs
              mountPath: /var/log/traefik
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/linux"
            - name: DISABLE_ONLINE_API
              value: "false"
          ports:
            - name: lapi
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: crowdsec-data
              mountPath: /var/lib/crowdsec/data
            - name: crowdsec-config-writable
              mountPath: /etc/crowdsec
            - name: crowdsec-config
              mountPath: /etc/crowdsec/acquis.yaml
              subPath: acquis.yaml
            - name: crowdsec-tmp
              mountPath: /tmp
            - name: traefik-logs
              mountPath: /var/log/traefik
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: pangolin-config
        - name: data
          persistentVolumeClaim:
            claimName: pangolin-data
        - name: crowdsec-config
          configMap:
            name: crowdsec-acquis
        - name: crowdsec-data
          emptyDir: {}
        - name: traefik-logs
          emptyDir: {}
        - name: crowdsec-config-writable
          emptyDir: {}
        - name: crowdsec-tmp
          emptyDir: {}
