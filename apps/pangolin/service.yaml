apiVersion: v1
kind: Service
metadata:
  name: pangolin
  namespace: pangolin
  annotations:
    metallb.universe.tf/address-pool: lan-pool
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: pangolin
  ports:
  - name: https
    port: 443
    targetPort: 3001
    protocol: TCP
  - name: http
    port: 80
    targetPort: 3001
    protocol: TCP
