---
# ClusterIP, not LoadBalancer.
#
# Pangolin used to hold 192.168.1.240 — the address the router forwards 80/443
# to — while being a plain Deployment that brings no Traefik and no working
# TLS. That made it the cluster's public entrypoint by accident while serving
# nothing. Traefik now owns that address; Pangolin is reached through the
# ingress like any other app until it is either configured properly or dropped.
apiVersion: v1
kind: Service
metadata:
  name: pangolin
  namespace: pangolin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pangolin
  ports:
    - name: http
      port: 80
      # 3002 is the dashboard web UI. 3001 is the INTERNAL api, which is what
      # this pointed at - so the ingress reached a service that never serves
      # the dashboard.
      targetPort: 3002
      protocol: TCP
