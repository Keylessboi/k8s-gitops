apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-allow-egress
  namespace: pangolin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pangolin
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
