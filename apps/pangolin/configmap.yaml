---
# Pangolin's config.yml, in git this time.
#
# The only config this app ever had was a `pangolin-config` ConfigMap created
# by hand in an earlier session. It existed nowhere in the repo, so every
# rebuild lost it and the container died on startup with "No configuration
# file found" - which is why Pangolin was parked at zero replicas.
#
# server.secret is deliberately ABSENT here. Pangolin reads it from the
# SERVER_SECRET environment variable, which comes from a Doppler-managed
# secret. The hand-made version had it hardcoded to a guessable literal
# ("pangolin-k8s-rebuild-secret-2026"); that secret signs sessions, so it does
# not belong in a ConfigMap or in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pangolin-config
  namespace: pangolin
data:
  config.yml: |
    app:
      dashboard_url: "https://pangolin.sandstorm.chat"
      log_level: "info"
      telemetry:
        anonymous_usage: false

    domains:
      sandstorm:
        base_domain: "sandstorm.chat"
        # Traefik already terminates TLS for this hostname via cert-manager,
        # so Pangolin does not resolve certificates itself.
        cert_resolver: "letsencrypt"

    server:
      external_port: 3000
      internal_port: 3001
      next_port: 3002
      internal_hostname: "pangolin"
      session_cookie_name: "p_session_token"
      resource_access_token_param: "p_token"
      resource_session_request_param: "p_session_request"
      cors:
        origins: ["https://pangolin.sandstorm.chat"]
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        allowed_headers: ["X-CSRF-Token", "Content-Type"]
        credentials: false

    # No WireGuard tunnel. The plan is explicit that this deployment runs
    # "no VPN/NEWT - public access with geo-blocking", and Traefik is the
    # ingress path, so gerbil stays off.
    gerbil:
      start_port: 51820
      base_endpoint: "pangolin.sandstorm.chat"
      use_subdomain: false

    flags:
      require_email_verification: false
      # Closed by default: this dashboard is reachable from the internet.
      disable_signup_without_invite: true
      disable_user_create_org: false
      allow_raw_resources: true
