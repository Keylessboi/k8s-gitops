---
# Pangolin: self-hosted ingress. Wraps intranet apps behind a tunnel.
# One deployment plus a PVC for its SQLite data and config.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: pangolin
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: pangolin
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: pangolin

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: pangolin
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: ingress
      app.kubernetes.io/managed-by: argocd
      homelab/tier: platform
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - crowdsec-allow-egress.yaml
  - ingress.yaml
  - crowdsec-configmap.yaml
