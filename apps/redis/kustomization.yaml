---
# The single shared Redis. Previously the Bitnami chart, which failed to pull
# from the cluster ("invalid_reference: invalid tag") because Bitnami's public
# catalog is deprecated. Replaced with plain manifests: fewer moving parts and
# no external chart that can rot.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redis
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      homelab/tier: platform
