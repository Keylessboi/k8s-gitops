---
# Single shared Redis for the whole homelab: Immich, Authentik, Nextcloud,
# and later Funkwhale. Deliberately NOT the Bitnami chart — that catalog is
# deprecated and its image references broke `helm pull` from the cluster.
# Redis is one small container; a chart is pure overhead here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: redis
spec:
  serviceName: redis-master
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # OnRootMismatch, not the default Always. fsGroup makes the kubelet
        # recursively chown every mounted volume before the container starts.
        # Over NFS that walk is O(files) and shows up as the pod sitting in
        # ContainerCreating with only a 'context deadline exceeded' to go on.
        # The volume roots already carry the right ownership, so this skips the
        # walk; if a root ever genuinely mismatches, the full chown still runs.
        fsGroupChangePolicy: OnRootMismatch
        # Without this the pod runs seccomp Unconfined: this node's kubelet has
        # seccompDefault=false, so nothing applies a profile unless a manifest
        # asks. RuntimeDefault blocks the syscalls the container runtime
        # considers dangerous (mount, unshare, kexec, bpf, keyctl, ...). Redis
        # needs none of them - it never even calls madvise(MADV_HUGEPAGE),
        # which is allowed anyway.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          # requirepass is read from the mounted secret at startup so the
          # password never appears in the pod spec or in `kubectl describe`.
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --dir /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  # The key name is load-bearing: consumers expect `redis-password`.
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            # Liveness failure restarts Redis; do not do that over a slow second.
            timeoutSeconds: 5
            failureThreshold: 5
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            # Cheap check, but one second leaves no headroom under load.
            timeoutSeconds: 5
            failureThreshold: 5
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
