---
# Plain manifests rather than a Helm chart.
# The bjw-s app-template chart ships an EMPTY values.yaml, and kustomize's
# helmCharts generator fails on those with "could not parse values file into
# rnode: EOF" — the same failure the doppler chart hit. Navidrome is a single
# container, so a chart buys nothing here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # OnRootMismatch, not the default Always. fsGroup makes the kubelet
        # recursively chown every mounted volume before the container starts.
        # Over NFS that walk is O(files) and shows up as the pod sitting in
        # ContainerCreating with only a 'context deadline exceeded' to go on.
        # The volume roots already carry the right ownership, so this skips the
        # walk; if a root ever genuinely mismatches, the full chown still runs.
        fsGroupChangePolicy: OnRootMismatch
        # Without this the pod runs seccomp Unconfined: this node's kubelet has
        # seccompDefault=false, so nothing applies a profile unless a manifest
        # asks. RuntimeDefault blocks the syscalls the container runtime
        # considers dangerous (mount, unshare, kexec, bpf, keyctl, ...).
        # Navidrome is a Go server plus ffmpeg for transcoding; neither uses
        # them.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          # 0.63.2, up from 0.58.0. The reason is SECONDARY ARTISTS: Navidrome
          # models featured and collaborating performers as "participations"
          # (roles), which postdates 0.58 - on the old version those artists
          # exist only as text inside a track's credits and are not browsable.
          # 18 of the 24 names that looked "missing" from the starred export
          # were exactly this.
          #
          # Participations populate on a FULL RESCAN, not on upgrade alone, and
          # 0.59 shipped a rewritten scanner - so expect one long scan after
          # this lands.
          #
          # Rollback: set this back to 0.58.0 and restore
          # /data/navidrome.db.pre-0.63-upgrade (taken 2026-09-03, 79.5 MB) over
          # /data/navidrome.db. Navidrome is SQLite-only, so it is the one
          # documented exception to the Postgres rule in CONTRIBUTING.md.
          image: deluan/navidrome:0.63.2
          env:
            - name: ND_LOGLEVEL
              value: info
            - name: ND_SCANSCHEDULE
              value: 1h
            # Default is "never": navidrome keeps records for files deleted
            # from the library forever, and their placeholder [Unknown
            # Album]/[Unknown Artist] rows keep rendering in the UI. "full"
            # purges them whenever a full scan runs; hourly incremental scans
            # stay non-destructive. A full scan is `navidrome scan --full`
            # in the container.
            - name: ND_SCANNER_PURGEMISSING
              value: full
            - name: ND_SESSIONTIMEOUT
              value: 720h
            - name: ND_ENABLESHARING
              value: "true"
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            # --- Authentik SSO ---
            #
            # This image has NO native OIDC. The 0.58.0 binary contains
            # ReverseProxyWhitelist/ReverseProxyUserHeader and no openid or
            # OIDC symbol at all, and server/auth.go's only externally
            # authenticated login path is handleLoginFromHeaders(), which reads
            # a username out of a header. So Authentik has to be terminated in
            # front of Navidrome, by the forward-auth middleware on the Ingress,
            # and the identity handed over in this header.
            #
            # Upstream RENAMED these options to ExtAuth.TrustedSources and
            # ExtAuth.UserHeader after this release. navidrome.org documents the
            # new names, which this build does not recognise - and an
            # unrecognised ND_ variable is ignored silently, leaving the app
            # unauthenticated. Do not "correct" them without bumping the image.
            #
            # The whitelist is checked against the connection's ORIGINAL
            # RemoteAddr (realIPMiddleware stashes it before X-Forwarded-For is
            # honoured), so it must contain the address TRAEFIK'S POD dials
            # from, never the browser's. The pod CIDR rather than Traefik's
            # current pod IP: that IP changes on every restart, and a stale /32
            # does not fail loudly - it just stops trusting the header and
            # drops every user back to a login form they have no password for.
            #
            # A /16 means any pod in the cluster could assert a username. That
            # is bounded by networkpolicy.yaml, which only admits port 4533
            # from kube-system (Traefik) and from this namespace.
            - name: ND_REVERSEPROXYWHITELIST
              value: 10.42.0.0/16
            # The header the shared authentik-forward-auth middleware copies
            # out of the Authentik outpost's response. A request carrying this
            # header from a whitelisted address is logged in WITHOUT a
            # password, so every route that does not run forward-auth must
            # delete it first - see strip-auth-headers-middleware.yaml.
            # Last.fm scrobbling. Enabling it only makes the option appear;
            # each listener still authorises their own account from
            # Settings -> Last.fm in the Navidrome UI, so no personal
            # credential lives here - these two values identify the
            # application, nothing more.
            #
            # BOTH are required. A scrobble is a signed write and the
            # signature uses the shared secret, so an API key alone
            # authenticates reads and then fails at submission - which looks
            # like "scrobbling silently does nothing" rather than an error.
            # Last.fm calls exit through the VPN gateway. Navidrome is Go
            # and honours these natively. NO_PROXY is a SUFFIX match on the
            # cluster domain, not a single hostname - naming one host is
            # exactly what sent remux's addon calls out to the internet and
            # lost them (see apps/remux/deployment.yaml).
            - name: HTTPS_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: HTTP_PROXY
              value: http://vpn-gateway.vpn.svc.cluster.local:8888
            - name: NO_PROXY
              value: "localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,.svc,.svc.cluster.local,.cluster.local"
            - name: ND_LASTFM_ENABLED
              value: "true"
            - name: ND_LASTFM_APIKEY
              valueFrom:
                secretKeyRef:
                  name: navidrome-lastfm
                  key: apikey
            - name: ND_LASTFM_SECRET
              valueFrom:
                secretKeyRef:
                  name: navidrome-lastfm
                  key: secret
            - name: ND_REVERSEPROXYUSERHEADER
              value: X-authentik-username
          ports:
            - name: http
              containerPort: 4533
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            # Library scans make a one-second check unreliable.
            timeoutSeconds: 10
            failureThreshold: 6
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            # The shared media volume, narrowed to the library directory.
            # Navidrome only reads, so it does not need the whole /data tree -
            # and ND_DATAFOLDER already occupies /data for its own database.
            - name: music
              mountPath: /music
              subPath: media/music
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: navidrome
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: navidrome
  ports:
    - name: http
      port: 4533
      targetPort: http
