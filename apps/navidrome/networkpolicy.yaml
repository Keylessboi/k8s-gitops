apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # cert-manager creates HTTP-01 solver pods in this namespace on demand and
  # Traefik must reach them on 8089. Without this the ACME challenge 502s and
  # no certificate is ever issued for this host.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8089
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: navidrome
  # Traefik runs in kube-system. Without this the app has no ingress path at
  # all and is unreachable no matter what the Ingress object says.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 4533
      protocol: TCP
  # Octo (apps/downloads/octo.yaml) is a Subsonic proxy that sits in FRONT of
  # Navidrome: everything it does not answer itself is forwarded here, so
  # without this rule Octo is not a degraded experience, it is a blank one.
  # It runs in downloads rather than alongside Navidrome because that is the
  # only namespace whose policy denies direct internet egress - the egress
  # half of this flow is in apps/downloads/networkpolicy.yaml and both are
  # required.
  #
  # Note that ND_REVERSEPROXYWHITELIST is 10.42.0.0/16, so a pod admitted here
  # can assert a username via X-authentik-username. Octo is trusted to that
  # extent deliberately - it is the front door for these clients - and this
  # rule is what keeps the set of such pods small.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: downloads
    ports:
    - port: 4533
      protocol: TCP
  egress:
  # k3s apiserver. Reachable ONLY via ipBlock: a namespaceSelector for the
  # "default" namespace matches PODS in it, never the 10.43.0.1 service IP, so
  # the old rule was a no-op. Every NetworkPolicy in this repo was missing real
  # API access, which hard-broke the API clients (nfs-csi provisioner, doppler
  # operator, cnpg operator, prometheus) and cascaded to every PVC and secret.
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  # k3s DNATs 10.43.0.1:443 to the node's own address before NetworkPolicy
  # egress is evaluated, so the Service rule above matches nothing for a new
  # connection and the API call fails. This is the defect that broke CNPG's
  # base backups and, here, kept the Doppler operator from ever winning leader
  # election - i.e. from ever syncing a secret.
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - port: 6443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
