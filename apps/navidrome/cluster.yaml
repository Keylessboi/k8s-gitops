apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: navidrome-db
  namespace: navidrome
spec:
  instances: 1
  postgresql:
    parameters:
      max_connections: "100"
  storage:
    size: 1Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://navidrome
      endpointURL: http://minio.minio.svc.cluster.local
    retentionPolicy: 30d
