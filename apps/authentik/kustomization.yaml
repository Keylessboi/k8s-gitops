---
# Authentik: SSO for the homelab. Helm release wires server, worker,
# Postgres, and Redis. Everything stays on compute nodes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: authentik

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: identity
      app.kubernetes.io/managed-by: argocd
      homelab/tier: platform
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - ingress.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2025.12.4
    releaseName: authentik
    namespace: authentik
    valuesInline:
      global:
        nodeSelector:
          homelab/node-class: compute
        # The secret key signs every session and token. It used to be set
        # inline to the literal string "MANAGED_BY_DOPPLER" — no DopplerSecret
        # ever replaced it, so that string WAS the signing key. Injected from a
        # real generated secret instead.
        # Credentials are injected as env rather than inlined into values,
        # which would persist them in Helm release metadata.
        env:
          - name: AUTHENTIK_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: authentik-secret-key
                key: secret_key
          - name: AUTHENTIK_POSTGRESQL__PASSWORD
            valueFrom:
              secretKeyRef:
                name: authentik-db-credentials
                key: password
          - name: AUTHENTIK_REDIS__PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-auth
                key: redis-password
          # SMTP. Without it Authentik cannot send password resets or account
          # notifications, so a locked-out user has no self-service route back.
          - name: AUTHENTIK_EMAIL__HOST
            valueFrom:
              secretKeyRef: {name: smtp, key: host}
          - name: AUTHENTIK_EMAIL__PORT
            valueFrom:
              secretKeyRef: {name: smtp, key: port}
          - name: AUTHENTIK_EMAIL__USERNAME
            valueFrom:
              secretKeyRef: {name: smtp, key: username}
          - name: AUTHENTIK_EMAIL__PASSWORD
            valueFrom:
              secretKeyRef: {name: smtp, key: password}
          - name: AUTHENTIK_EMAIL__FROM
            valueFrom:
              secretKeyRef: {name: smtp, key: from}
          # Gmail on 587 is STARTTLS, not implicit TLS. Setting USE_SSL here
          # instead makes the connection hang rather than fail cleanly.
          - name: AUTHENTIK_EMAIL__USE_TLS
            value: "true"
          - name: AUTHENTIK_EMAIL__USE_SSL
            value: "false"
          - name: AUTHENTIK_EMAIL__TIMEOUT
            value: "30"
          # Creates the akadmin account and an API token on first start, so
          # the initial-setup flow never has to be completed by hand and the
          # OIDC providers below can be created through the API. These are
          # only honoured while no admin exists; they are inert afterwards.
          - name: AUTHENTIK_BOOTSTRAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: authentik-bootstrap
                key: password
          - name: AUTHENTIK_BOOTSTRAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: authentik-bootstrap
                key: token
          - name: AUTHENTIK_BOOTSTRAP_EMAIL
            valueFrom:
              secretKeyRef:
                name: authentik-bootstrap
                key: email
      # Backends live under `authentik.postgresql` / `authentik.redis`.
      # There is no top-level `externalDatabase`/`externalRedis` in this chart —
      # those blocks were accepted silently and ignored, leaving the chart
      # defaults (authentik-postgresql, authentik-redis) in the rendered secret.
      # Those Services have never existed, so every worker died on
      # "PostgreSQL connection failed ... Name or service not known".
      authentik:
        postgresql:
          host: app-databases-rw.databases.svc.cluster.local
          port: 5432
          name: authentik
          user: authentik
        redis:
          host: redis-master.redis.svc.cluster.local
      server:
        replicas: 1
        # Same probe-landmine fix as the worker block below: the chart
        # defaults carry timeoutSeconds: 1, which the server's health
        # endpoints blow under post-restart load ('context deadline
        # exceeded' -> Ready=False -> SSO flap).
        livenessProbe:
          httpGet:
            path: /-/health/live/
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /-/health/ready/
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /-/health/live/
            port: http
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      worker:
        replicas: 1
        # Probe timings, explicit. The chart defaults carry timeoutSeconds: 1
        # and `ak healthcheck` is a full python process spawn that exceeds
        # that window under load: after the 2026-08-31 node restart the
        # worker was flooded with outpost reconciliation tasks, the
        # healthcheck blew the 1s window three times, and the kubelet
        # SIGTERMed it into a crash loop (17 restarts; "warm shutdown,
        # exit 0" in the pod's lastState). The startup probe is the real
        # fix - it gates liveness, giving the worker up to 5 minutes to
        # drain a post-restart backlog before liveness starts judging it.
        # Same failure class as the over-tight-probe lesson in the README.
        livenessProbe:
          exec:
            command: [ak, healthcheck]
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command: [ak, healthcheck]
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        startupProbe:
          exec:
            command: [ak, healthcheck]
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      # Use the one shared Postgres and the one shared Redis, not the chart's
      # bundled subcharts.
      postgresql:
        enabled: false
      redis:
        enabled: false
        existingSecretKey: redis-password
