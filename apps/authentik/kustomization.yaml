---
# Authentik: SSO for the homelab. Helm release wires server, worker,
# Postgres, and Redis. Everything stays on compute nodes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: authentik

commonLabels:
  app.kubernetes.io/name: authentik
  app.kubernetes.io/part-of: homelab
  app.kubernetes.io/component: identity
  app.kubernetes.io/managed-by: argocd
  homelab/tier: platform

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - dopplersecret.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2025.6.4
    releaseName: authentik
    namespace: authentik
    valuesInline:
      global:
        nodeSelector:
          homelab/node-class: compute
      authentik:
        # MANAGED_BY_DOPPLER: injected at deploy time via DopplerSecret
        secret_key: "MANAGED_BY_DOPPLER"
      server:
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      worker:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      postgresql:
        enabled: false
      # Both hosts previously named Services in the authentik namespace that do
      # not exist and never did (there is no CNPG cluster here, and Redis lives
      # in the redis namespace), so Authentik could never reach either backend.
      externalDatabase:
        host: "app-databases-rw.databases.svc.cluster.local"
        port: 5432
        name: authentik
        user: authentik
        existingSecret: authentik-db-credentials
        existingSecretKey: password
      redis:
        enabled: false
      externalRedis:
        host: "redis-master.redis.svc.cluster.local"
        port: 6379
        existingSecret: redis-auth
        existingSecretKey: redis-password
