apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # cert-manager creates HTTP-01 solver pods in this namespace on demand and
  # Traefik must reach them on 8089. Without this the ACME challenge 502s and
  # no certificate is ever issued for this host.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8089
      protocol: TCP
  # Traefik itself, serving authentik.sandstorm.chat. Only the ACME solver port
  # was allowed from kube-system, so the app answered 502 through the ingress
  # even with a valid certificate and healthy pods.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 9000
      protocol: TCP
    - port: 9443
      protocol: TCP
  # Prometheus scraping authentik's own metrics on 9300. Only 9000/9443 were
  # open to kube-system, so nothing outside this namespace could reach the
  # metrics port and the login/request series never existed.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9300
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: authentik
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pangolin
  # Memos does its OIDC token exchange and userinfo call server-side. Without
  # this the sign-in fails AFTER the user has already approved in authentik,
  # which is the most confusing possible place for it to break. Other half in
  # apps/memos/networkpolicy.yaml.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: memos
    ports:
    - port: 9000
      protocol: TCP
  # The account provisioner creates users and sets their passwords. The other
  # half is in apps/accounts/networkpolicy.yaml.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: accounts
    ports:
    - port: 9000
      protocol: TCP
  # remux-user-sync reads /api/v3/core/users to mirror authentik's accounts
  # into remux, which has no SSO of its own. The other half of this flow is in
  # apps/remux/networkpolicy.yaml; both sides, always.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: remux
    ports:
    - port: 9000
      protocol: TCP
  egress:
  # k3s apiserver. Reachable ONLY via ipBlock: a namespaceSelector for the
  # "default" namespace matches PODS in it, never the 10.43.0.1 service IP, so
  # the old rule was a no-op. Every NetworkPolicy in this repo was missing real
  # API access, which hard-broke the API clients (nfs-csi provisioner, doppler
  # operator, cnpg operator, prometheus) and cascaded to every PVC and secret.
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  # Central Postgres lives in the databases namespace (one cluster for all apps).
  # k3s DNATs 10.43.0.1:443 to the node's own address before NetworkPolicy
  # egress is evaluated, so the Service rule above matches nothing for a new
  # connection and the API call fails. This is the defect that broke CNPG's
  # base backups and, here, kept the Doppler operator from ever winning leader
  # election - i.e. from ever syncing a secret.
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - port: 6443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: databases
    ports:
    - port: 5432
      protocol: TCP
  # Single shared Redis.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redis
    ports:
    - port: 6379
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
  # The remux Authentik provider runs in proxy mode: the embedded outpost
  # authenticates the request, then dials remux:3000 to forward it. Without
  # this egress rule the outpost's outbound connections are silently dropped.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: remux
    ports:
    - port: 3000
      protocol: TCP
  # Reach our own services through the load balancer.
  # CoreDNS resolves *.sandstorm.chat to 192.168.1.240 in-cluster (see
  # apps/coredns), and the 0.0.0.0/0 rule below deliberately excludes
  # 192.168.0.0/16 - so without this rule that lookup succeeds and the connection
  # is then dropped. Needed by anything doing OIDC discovery against Authentik.
  - to:
    - ipBlock:
        cidr: 192.168.1.240/32
    ports:
    - port: 443
      protocol: TCP
  # ...and the same rule again in post-DNAT terms. k3s translates
  # 192.168.1.240:443 to the Traefik pod at :8443 BEFORE NetworkPolicy egress is
  # evaluated, so the ipBlock rule above matches nothing on a new connection -
  # the identical trap that broke CNPG's base backups and the Doppler operator.
  # Traefik listens on 8443/8000 internally, not 443/80.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8443
      protocol: TCP
    - port: 8000
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 172.16.0.0/12
    ports:
    - protocol: TCP
      port: 587
