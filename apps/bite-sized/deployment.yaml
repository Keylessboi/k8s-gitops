# Bite-sized homework demo: a Rust server plus a Playwright-driven Chromium that holds the
# student's own Google session. Single student, single replica.
#
# WHY CHROMIUM RUNS WITH --no-sandbox HERE: Chromium's sandbox needs unprivileged user
# namespaces, which this locked-down pod (non-root, all caps dropped, RuntimeDefault
# seccomp) deliberately does not have. The pod is the sandbox instead: egress is limited to
# public addresses (networkpolicy.yaml), the root filesystem is read-only, and the only way
# in is through authentik forward-auth.
#
# The profile is unpacked into a RAM-backed emptyDir and deleted on exit, so the only copy
# on disk is the AES-GCM file on the PVC. Its encryption secret arrives from Doppler as an
# env var and is never on that disk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bite-sized
  namespace: bite-sized
  annotations:
    secrets.doppler.com/reload: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bite-sized
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bite-sized
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bite-sized
          image: ghcr.io/keylessboi/bite-sized@sha256:c9bd7dec7369aa7da34738386cef1d1cc64c33f812baed6a23ef2d2eec2fa1b0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: BITES_PROFILE_KEY
              valueFrom:
                secretKeyRef: {name: bite-sized, key: profile-encryption}
            # Accounts: OpenID Connect against Authentik. With BITES_REQUIRE_AUTH the server refuses
            # to start if any of this is missing, so it can never come up without a login.
            - {name: BITES_REQUIRE_AUTH, value: "1"}
            - {name: OIDC_ISSUER, value: "https://authentik.sandstorm.chat/application/o/homework/"}
            - {name: OIDC_REDIRECT_URL, value: "https://homework.sandstorm.chat/auth/callback"}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: bite-sized, key: oidc-client-id}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: bite-sized, key: oidc-client-secret}
            - {name: BITES_MAX_WORKERS, value: "2"}
            - name: HOME
              value: /tmp
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: run, mountPath: /run/bites}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
          # Chromium plus its profile in RAM; the rest of the node is already tight.
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 3Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: bite-sized-data}
        # RAM-backed: the unpacked Chromium profile never touches disk. Counts against the
        # memory limit, hence 3Gi above (two browsers at most).
        - name: run
          emptyDir: {medium: Memory, sizeLimit: 768Mi}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
