# Bite-sized: homework demo for one student, behind authentik forward-auth.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: bite-sized
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: bite-sized
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: bite-sized

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: homework
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - authentik-outpost.yaml

# Prune/Delete protection for PVCs, PVs, Namespaces and CNPG Clusters. See ADR-0012.
components:
  - ../../components/protect-state
