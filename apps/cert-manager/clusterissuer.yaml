---
# The ClusterIssuer ships in the same Application as the cert-manager chart
# that defines its CRD, so on a first sync ArgoCD's dry-run fails with
# "the Kubernetes API could not find cert-manager.io/ClusterIssuer".
#
# SkipDryRunOnMissingResource lets the dry-run pass, and the later sync-wave
# makes it apply after the CRDs and the webhook are actually up.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  acme:
    email: admin@sandstorm.chat
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: traefik
