---
# cert-manager. This app previously contained ONLY a namespace and a
# ClusterIssuer — cert-manager itself was installed nowhere in the repo and
# nowhere in Ansible. So the cert-manager.io CRDs never existed, the
# ClusterIssuer could not apply, and every Ingress in the cluster carried a
# cert-manager.io/cluster-issuer annotation that nothing acted on. No
# certificate was ever issued.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cert-manager
  annotations:
    # Must exist before any app Ingress asks for a certificate.
    argocd.argoproj.io/sync-wave: "-5"

namespace: cert-manager

resources:
  - namespace.yaml
  - clusterissuer.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.16.3
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesInline:
      # `installCRDs` is deprecated; this is the current key.
      crds:
        enabled: true
        keep: true
      global:
        # cert-manager defaults its leader-election lease to kube-system and
        # creates the matching Role there. This kustomization sets
        # `namespace: cert-manager`, which rewrites that Role into
        # cert-manager — so cainjector kept asking for a lease in kube-system
        # where it had no permissions:
        #   leases.coordination.k8s.io "cert-manager-cainjector-leader-election"
        #   is forbidden
        # It therefore never injected the webhook CA bundle, and every
        # cert-manager API call failed with "x509: certificate signed by
        # unknown authority". Point leader election at the namespace the Role
        # actually lands in.
        leaderElection:
          namespace: cert-manager
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      cainjector:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
