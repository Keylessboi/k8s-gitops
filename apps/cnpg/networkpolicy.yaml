apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  # The apiserver calls the CNPG admission webhook on 9443. Blocking it makes
  # every Cluster/Backup resource hang on admission.
  - from:
    - ipBlock:
        cidr: 10.43.0.1/32
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - port: 9443
      protocol: TCP
  egress:
  # k3s apiserver. Reachable ONLY via ipBlock: a namespaceSelector for the
  # "default" namespace matches PODS in it, never the 10.43.0.1 service IP, so
  # the old rule was a no-op. Every NetworkPolicy in this repo was missing real
  # API access, which hard-broke the API clients (nfs-csi provisioner, doppler
  # operator, cnpg operator, prometheus) and cascaded to every PVC and secret.
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  # The operator polls each instance's status endpoint on 8000 and connects on
  # 5432. Restricting this to pods labelled `cnpg.io/cluster: app-databases`
  # left the operator reporting
  #   "Instance Status Extraction Error: HTTP communication issue"
  # against every cluster, which in turn stopped the Database CRs from ever
  # being applied — so no application database was created.
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          cnpg.io/podRole: instance
    ports:
    - {protocol: TCP, port: 5432}
    - {protocol: TCP, port: 8000}
    - {protocol: TCP, port: 9187}
