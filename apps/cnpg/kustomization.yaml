---
# CloudNativePG operator. Provides the Cluster CRD the app databases use.
# The operator is light. It stays on a compute node.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cnpg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: cnpg-system

# `labels` with includeSelectors: false, NOT `commonLabels`.
#
# commonLabels injects its labels into every selector it can find, including
# the podSelector inside our NetworkPolicy. That turned the operator's egress
# rule for `cnpg.io/podRole: instance` into a selector also demanding
# app.kubernetes.io/name=cloudnative-pg and friends — labels the CNPG instance
# pods do not carry. The rule matched nothing, so the operator could not reach
# any instance and every cluster reported
# "Instance Status Extraction Error: HTTP communication issue".
labels:
  - pairs:
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: database
      app.kubernetes.io/managed-by: argocd
      homelab/tier: platform
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.0
    releaseName: cnpg
    namespace: cnpg-system
    includeCRDs: true
    valuesInline:
      nodeSelector:
        homelab/node-class: compute
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      monitoring:
        # Disabled: PodMonitor is a prometheus-operator CRD that lives in the
        # monitoring Application. ArgoCD gives no ordering between Applications,
        # so this raced the CRD and failed the whole cnpg sync with
        # "could not find monitoring.coreos.com/PodMonitor". Re-enable once the
        # monitoring stack is up if CNPG metrics are wanted.
        podMonitorEnabled: false
