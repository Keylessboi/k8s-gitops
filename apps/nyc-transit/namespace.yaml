apiVersion: v1
kind: Namespace
metadata:
  name: nyc-transit
  labels:
    # c1: public MTA GTFS-RT vehicle positions rendered to public map tiles; no
    # accounts, no personal data, no secrets.
    homelab/data-class: c1
    homelab/criticality: tier-3
    app.kubernetes.io/name: nyc-transit
    app.kubernetes.io/part-of: homelab
