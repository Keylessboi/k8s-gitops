---
# NYC live transit - GTFS-RT vehicle map + OsmAnd tile overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: nyc-transit
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: nyc-transit
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: nyc-transit

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: transit
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - ingress.yaml

# Prune/Delete protection for PVCs, PVs, Namespaces and CNPG Clusters, so a
# manifest dropped from git never deletes live data. See ADR-0012.
components:
  - ../../components/protect-state
