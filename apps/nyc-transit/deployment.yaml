apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyc-transit
  namespace: nyc-transit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nyc-transit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nyc-transit}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      nodeSelector: {kubernetes.io/os: linux, homelab/node-class: compute}
      containers:
        - name: app
          # Pinned by digest (HS-WL-01).
          image: ghcr.io/keylessboi/nyc-transit-live@sha256:9d16ba9ce8e224de213fe01ec36639ff67570405a32065ef4742e9965cc02277
          env:
            - {name: PUBLIC_URL, value: "https://transit.sandstorm.chat"}
            - {name: POLL_SECONDS, value: "15"}
          ports: [{containerPort: 8080, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 200Mi}
---
apiVersion: v1
kind: Service
metadata: {name: nyc-transit, namespace: nyc-transit}
spec:
  selector: {app.kubernetes.io/name: nyc-transit}
  ports: [{name: http, port: 8080, targetPort: http}]
