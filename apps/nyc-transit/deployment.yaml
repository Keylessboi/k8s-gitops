apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyc-transit
  namespace: nyc-transit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nyc-transit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nyc-transit}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      # Pinned to the NAS, which is the cluster's only tailnet node, and
      # published with hostPort (CNI portmap) so the phone reaches it at
      # http://100.69.240.8:30880. A NodePort did not work: the NAS refuses
      # connections for node ports of pods on the other node.
      nodeSelector: {kubernetes.io/hostname: nas}
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: app
          # Pinned by digest (HS-WL-01).
          image: ghcr.io/keylessboi/nyc-transit-live@sha256:9d16ba9ce8e224de213fe01ec36639ff67570405a32065ef4742e9965cc02277
          env:
            - {name: PUBLIC_URL, value: "http://100.69.240.8:30880"}
            - {name: POLL_SECONDS, value: "15"}
          ports: [{containerPort: 8080, hostPort: 30880, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 10, failureThreshold: 6}
          # /healthz answers from the process itself (it reports poll age and
          # error count as data and always returns 200; it checks no
          # dependency). Grace is longer than readiness (30 + 20x6 = 150s) so
          # the two never disagree about a pod that is merely starting.
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 60, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 200Mi}
---
apiVersion: v1
kind: Service
metadata: {name: nyc-transit, namespace: nyc-transit}
spec:
  selector: {app.kubernetes.io/name: nyc-transit}
  # No public Ingress, on purpose (owner decision 2026-11-18): tailnet only,
  # via the pod's hostPort on the NAS. sandstorm.chat hosts resolve to the
  # public IP, so a lan-only Ingress would 403 even at home.
  ports: [{name: http, port: 8080, targetPort: http}]
