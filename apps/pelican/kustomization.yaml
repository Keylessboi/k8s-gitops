---
# Pelican Panel: game-server management, successor to Pterodactyl. Deploys after
# the platform (databases wave 5, redis, doppler) so its DB role, DB, redis and
# Doppler-synced secret all exist before the pod starts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: pelican
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: pelican
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: pelican

# `labels` with includeSelectors:false, NOT `commonLabels`. commonLabels
# rewrites immutable Deployment selectors and silently breaks NetworkPolicy
# podSelectors — the same trap documented in every other app here.
labels:
  - pairs:
      app.kubernetes.io/name: pelican
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: game-panel
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - deployment.yaml
  - ingress.yaml
  - admin-job.yaml
