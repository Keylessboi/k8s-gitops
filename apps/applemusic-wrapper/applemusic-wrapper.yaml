---
# FairPlay Streaming (FPS) decrypt daemon for the AppleMusicarr sidecar pair.
#
# WHY THIS EXISTS. applemusic-decryptor shells out to a downloader, and neither gamdl nor amdl
# performs the FairPlay decryption itself against Apple's own libraries: an out-of-process daemon
# does. No image for it is published, because it has to load Apple's own Android native libraries
# - extracted from an Apple Music APK that is not redistributable - so it is built locally by
# wrapper/build.sh in the plugin repo and imported straight into the NAS node's containerd.
#
# WHICH IMPLEMENTATION, AND WHY IT IS NOT wrapper-v2. The sibling project
# github.com/WorldObservationLog/wrapper (branch: lite) is the one that works here. wrapper-v2
# cannot complete AuthenticateFlow at all against these libraries: its token harvest calls
# SVFootHillSessionCtrl::getPersistentKey, which is an UNDEFINED SYMBOL in the shipped .so, so
# every login and every session import fails with "cached-session restore found Apple session
# files but token harvest failed" (upstream issues #8 and #10). wrapper-lite completed the same
# login on the first attempt and raised the 2FA challenge wrapper-v2 never saw.
#
# The two are different API generations, and that decides the downloader as well:
#   wrapper-v2   - POST /login, GET /me, GET /playback, and sample decryption over a RAW TCP
#                  socket on 10020. That is what gamdl speaks.
#   wrapper-lite - one routed HTTP base URL with /status /m3u8 /key /lyrics /webplayback
#                  /license. That is what amdl (zhaarey/apple-music-downloader) speaks.
# So the sidecar runs amdl against this daemon; see apps/lidarr/applemusic-decryptor.yaml and the
# plugin README. There is NO raw decrypt port any more: amdl decrypts in-process, using the
# FairPlay key template this daemon returns from /key.
#
# PRIVILEGES, AND WHY THE NAMESPACE IS NOT lidarr. The rootless launcher unshares a user and mount
# namespace, chroots into a staged Android rootfs and execs AOSP's linker64 inside it, so it needs
# SYS_CHROOT, SYS_ADMIN (for unshare) and SYS_PTRACE, plus unconfined seccomp and AppArmor.
# lidarr enforces PSA baseline, which forbids all of those - and refusal leaves NO pod object at
# all, so the Deployment simply sits at 0/1 with the event on the ReplicaSet. Hence the separate
# namespace; see namespace.yaml.
#
# NO APPLE CREDENTIAL IS IN GIT, and none is read from the environment. The daemon signs in once
# through its own one-shot CLI mode (--login user:pass --code-from-file, which reads the
# verification code from <base-dir>/2fa.txt); the session lands in the wrapper-state volume and
# the daemon refreshes it in place, so the interactive 2FA step is a one-off. See "Signing the
# wrapper in" in the plugin README.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: applemusic-wrapper-state
  namespace: applemusic-wrapper
spec:
  accessModes:
    - ReadWriteOnce
  # local-path, never nfs-csi: this holds Apple's mpl_db/kvs.sqlitedb session database, and
  # ADR-0009 keeps SQLite off NFS.
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: applemusic-wrapper
  namespace: applemusic-wrapper
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the state claim is ReadWriteOnce and node-local, so a
  # replacement pod cannot start until the old one has released it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: applemusic-wrapper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: applemusic-wrapper
      annotations:
        # The chroot launcher is what upstream ships as apparmor:unconfined. Without this the
        # failure is an EPERM on chroot or a SIGSEGV during Apple library load, neither of which
        # names AppArmor.
        container.apparmor.security.beta.kubernetes.io/wrapper: unconfined
    spec:
      # Pinned to one node for two independent reasons: the image lives only in that node's
      # containerd (there is no registry), and the state claim below is node-local.
      nodeSelector:
        kubernetes.io/hostname: nas
      tolerations:
        - {key: storage, operator: Equal, value: "true", effect: NoSchedule}
      securityContext:
        # Unconfined for this pod only. Docker's default seccomp profile is what upstream tests
        # against, and k8s's RuntimeDefault is stricter - it denies part of what SYS_ADMIN
        # implies, and the resulting failure is indistinguishable from a missing .so.
        seccompProfile:
          type: Unconfined
      containers:
        - name: wrapper
          # Built from the lite branch by wrapper/build.sh in the plugin repo and imported into
          # this node's containerd. Pulled never: the tag is local, so a pull fails
          # ImagePullBackOff instead of falling back.
          #
          # THE SOURCE BUILD, NOT THE RELEASE ZIP. The published Wrapper.x86_64.latest.zip is a
          # different API generation: its launcher exposes four single-purpose ports
          # (-D decrypt 10020, -M m3u8 20020, -A account 30020, -K key 40020) and no routed
          # server, and its 10020/20020 do not answer HTTP at all. The lite branch builds
          # wrapper-lite-rootless with the single routed server on one port, default 12340 -
          # which is exactly amdl's lite-server default.
          image: wrapper-lite-src:0.1.0
          imagePullPolicy: IfNotPresent
          # Upstream's launcher ships the routing server, not an entrypoint: rootfs/data is
          # .dockerignore'd so nothing is baked in, and the staged binaries arrive mode 0644, so
          # the exec fails with "execve: Permission denied" - which reads like a security
          # problem and is a permission bit. Both are fixed here rather than in the image so the
          # image stays upstream's build.
          command: ["/bin/sh", "-c"]
          args:
            - >-
              chmod -R a+rx /app/rootfs/system &&
              exec /app/wrapper-lite-rootless
              --host 0.0.0.0 --port 8080
              --device-info "$WRAPPER_DEVICE_INFO"
              --base-dir /data/data/com.apple.android.music/files
          env:
            # A UNIQUE DEVICE IDENTITY, and the last field is the one that matters.
            #
            # Apple's FairPlay DeviceGUID is derived from this AndroidID (wrapper-lite's
            # DeviceGUID::configure() step F4), and the session in the state volume was minted
            # under this exact value. Restoring under a different AndroidID presents a different
            # device to a session keyed to another, so this field is not cosmetic and must match
            # whatever produced mpl_db/kvs.sqlitedb.
            #
            # The other eight fields are wrapper-lite's own default tuple, kept as they are: they
            # describe the client the loaded Apple libraries actually are, and changing them to
            # look newer would make the claim and the code disagree.
            - {name: WRAPPER_DEVICE_INFO, value: "Music/4.9/Android/10/Samsung S9/7663313/en-US/en-US/dc28071e981c439e"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            # /status, not /health: wrapper-lite has no /health. /status is served from the
            # daemon's own configuration and does not consult Apple, so it is a liveness answer
            # and not something that can hang on a slow account call. It also proves the routed
            # server itself is up, which is what the sidecar depends on.
            httpGet: {path: /status, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
            # The Apple library load has to complete before /status answers, and a cold start on
            # this CPU is not fast. The default 3 failures would restart a pod that is working.
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            # PRIVILEGED, not a capability list. The launcher needs a user+mount namespace AND a
            # writable /proc inside it ("mount proc failed: Operation not permitted"), and the
            # three capabilities this used to add are not enough for that: measured on the NAS,
            # SYS_ADMIN+SYS_CHROOT+SYS_PTRACE with unconfined seccomp and AppArmor still fails at
            # mount proc, while --privileged starts cleanly. Root is required for the same family
            # of reasons - a non-root process cannot chroot into a rootfs it does not own, and no
            # fsGroup can fix the ownership of the staged AOSP tree inside the image.
            #
            # This is why the workload is in its own namespace: this is exactly what the lidarr
            # namespace enforces PSA baseline against. See namespace.yaml.
            privileged: true
            runAsUser: 0
          volumeMounts:
            # The mount is what carries the signed-in session across restarts, and its in-chroot
            # path is what --base-dir names. The launcher chroots at /app/rootfs, so the host
            # path /app/rootfs/data/data/com.apple.android.music/files is
            # /data/data/com.apple.android.music/files from inside it - and the launcher mkdirs
            # its base dir AFTER chrooting, so passing the host path here fails with
            # "mkdir base_dir_arg failed: No such file or directory" and then silently runs
            # logged out.
            - {name: state, mountPath: /app/rootfs/data/data/com.apple.android.music/files}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: applemusic-wrapper-state}
---
apiVersion: v1
kind: Service
metadata:
  name: applemusic-wrapper
  namespace: applemusic-wrapper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: applemusic-wrapper
  ports:
    # One port, one protocol. wrapper-lite serves the whole routed API here - manifest, key
    # template, lyrics - and amdl decrypts in-process from the key template it returns, so the
    # raw sample-decryption socket wrapper-v2 used is gone.
    - {name: http, port: 8080, targetPort: 8080}
