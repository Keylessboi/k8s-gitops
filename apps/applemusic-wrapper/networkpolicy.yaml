---
# Default-deny for this namespace. Exactly three flows are opened, and the lidarr side of the
# first one is declared in apps/lidarr/networkpolicy.yaml - a NetworkPolicy allow is
# per-direction AND per-port, so one end alone reads correct and drops the traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-isolation
  namespace: applemusic-wrapper
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the decryptor sidecar, only on the daemon's routed HTTP port.
    #
    # Narrow on purpose, and not just tidy-mindedness: the daemon holds a signed-in Apple Music
    # session, and anything that can reach it can pull that account's catalogue. On a single-node
    # homelab the tempting shortcut is to leave this namespace reachable from everywhere, but then
    # any pod that can be made to issue an HTTP request - an indexer, a metadata proxy, a
    # compromised container - can drive the account.
    #
    # One port now, where wrapper-v2 needed two: /m3u8, /key, /lyrics and /status are all on 8080,
    # and amdl decrypts in-process from the key template it fetches there, so the raw sample
    # socket on 10020 is no longer part of the design.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lidarr
      ports:
        - {port: 8080, protocol: TCP}
    # No rule is needed for the readiness probe: the kubelet is exempt from NetworkPolicy.
  egress:
    # DNS through the cluster resolver. Without this the Apple calls fail with a name-resolution
    # error rather than anything that points at the policy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # ...AND DNS DIRECT TO THE PUBLIC RESOLVERS, WHICH IS NOT REDUNDANT.
    #
    # Apple's libraries resolve names from INSIDE the chroot, where there is no /etc/resolv.conf
    # (the staged rootfs has no /etc at all). With no resolver configuration they fall back to
    # their own built-in public resolver - measured here as 8.8.8.8, which is outside the
    # cluster and therefore not covered by the kube-dns rule above.
    #
    # The symptom is not a name-resolution error. Each lookup times out - 6 s, measured with a
    # UDP probe from this namespace - so the daemon's developer-token fetch logs
    # "devtoken: fetch music.apple.com failed" after ~11 s and then answers every /key with
    # "Invalid CKC error": no developer token, no FairPlay content key. On a host with no
    # NetworkPolicy (where this image was first proved) the same lookup succeeds, so the fault
    # only exists in the cluster.
    #
    # The private ranges are excluded so this cannot become a general DNS egress path into the
    # LAN, and the only thing it opens is port 53.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Apple, over 443 only. amp-api.music.apple.com and the FairPlay licence endpoints. The
    # private ranges are excluded the same way the lidarr policy excludes them, so this cannot
    # be used as a hop to the rest of the homelab.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
      ports:
        - {port: 443, protocol: TCP}
