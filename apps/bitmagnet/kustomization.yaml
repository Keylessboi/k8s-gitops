---
# bitmagnet: self-hosted torrent indexer, DHT crawler and Torznab source.
# Feeds Prowlarr (which re-stamps it into Lidarr/Readarr) — see
# docs/RUNDOWN.md. Deploys after the platform (databases wave 5, doppler
# wave 0) so its DB role, DB and Doppler-synced secret all exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: bitmagnet
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: bitmagnet
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: bitmagnet

# `labels` with includeSelectors:false, NOT `commonLabels`. commonLabels
# rewrites immutable Deployment selectors and silently breaks NetworkPolicy
# podSelectors — the same trap documented in every other app here.
labels:
  - pairs:
      app.kubernetes.io/name: bitmagnet
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: torrent-indexer
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - ingress.yaml
