---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd

namespace: forgejo

# `labels` with includeSelectors:false, NOT `commonLabels` - commonLabels
# rewrites Deployment selectors, which are immutable.
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: forge
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml
  - oauth-source-job.yaml
