---
# Forgejo, self-hosted git.
#
# The GitOps repo this cluster is built from currently lives only on GitHub -
# ArgoCD reads it and Image Updater writes to it - so a local forge removes the
# single external dependency the whole cluster turns on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two Forgejo instances sharing one repository
  # directory will corrupt git objects mid-write.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      nodeSelector:
        homelab/node-class: compute
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.3-rootless
          # The image's entrypoint runs docker-setup.sh (creates the data dirs
          # and writes app.ini on first boot) and then execs whatever args it is
          # given. Overriding args to run environment-to-ini first means the
          # FORGEJO__* variables below are re-applied on EVERY start - without
          # it, docker-setup.sh only templates app.ini once and later config
          # changes silently do nothing because the file already exists.
          args:
            - /bin/sh
            - -c
            - environment-to-ini -o "$GITEA_APP_INI" && exec /usr/local/bin/gitea -c "$GITEA_APP_INI" web
          env:
            - name: FORGEJO__server__ROOT_URL
              value: https://forgejo.sandstorm.chat/
            - name: FORGEJO__server__DOMAIN
              value: forgejo.sandstorm.chat
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            # SSH is off. Enabling it needs a second LoadBalancer address, and
            # MetalLB's only one is already Traefik's. Clone over HTTPS with a
            # personal access token instead.
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: app-databases-rw.databases.svc.cluster.local:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef: {name: forgejo-app, key: db-user}
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef: {name: forgejo-app, key: db-password}
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef: {name: forgejo-app, key: secret-key}
            # Nobody signs up. Accounts arrive through Authentik, and the OAuth
            # source is registered by the Job alongside this.
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION
              value: "true"
            - name: FORGEJO__service__ENABLE_BASIC_AUTHENTICATION
              value: "true"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNIN
              value: "false"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNUP
              value: "false"
            # Private by default - this is a personal forge on a LAN-fronted
            # host, not a public code site.
            - name: FORGEJO__repository__DEFAULT_PRIVATE
              value: "private"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__mailer__ENABLED
              value: "true"
            - name: FORGEJO__mailer__PROTOCOL
              value: smtp+starttls
            - name: FORGEJO__mailer__SMTP_ADDR
              valueFrom:
                secretKeyRef: {name: smtp, key: host}
            - name: FORGEJO__mailer__SMTP_PORT
              value: "587"
            - name: FORGEJO__mailer__USER
              valueFrom:
                secretKeyRef: {name: smtp, key: username}
            - name: FORGEJO__mailer__PASSWD
              valueFrom:
                secretKeyRef: {name: smtp, key: password}
            - name: FORGEJO__mailer__FROM
              valueFrom:
                secretKeyRef: {name: smtp, key: from}
          # PodSecurity `restricted` demands these per CONTAINER; setting them
          # only on the pod is not enough and the ReplicaSet is refused outright
          # with "unrestricted capabilities".
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/healthz, port: http}
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
