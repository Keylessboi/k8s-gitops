# Atmos companion renderer (rhythm-spatial-audio tools/spatial-sidecar; its ADR-0031 amends
# ADR-0023). Lidarr's Webhook -> `serve` -> scoped scan -> orender -> /spatial, which Navidrome
# serves as its second library. A full reconcile runs at startup and every 6 h, so a missed
# webhook only delays a companion.
#
# SQLite state DB: an explicit exemption from CONTRIBUTING rule 1, recorded there and in
# rhythm-spatial-audio docs/decisions/0031-companion-sidecar-in-cluster.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: spatial-sidecar
  annotations:
    argocd.argoproj.io/sync-wave: "20"
namespace: spatial-sidecar
labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: media
      homelab/tier: apps
resources:
  - namespace.yaml
  - volumes.yaml
  - networkpolicy.yaml
  - deployment.yaml
