---
# Kiwix: offline Wikipedia and ZIM file reader.
# Downloads ZIM files from MinIO on startup. Serves content via HTTP.
# Light workload. Runs on a compute node.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kiwix
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: kiwix
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: kiwix

labels:
  - pairs:
      app.kubernetes.io/name: kiwix
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: knowledge
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: true

resources:
  - namespace.yaml
  - pvc-zim.yaml
  - deployment.yaml
  - service.yaml
