apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwix
  namespace: kiwix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kiwix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiwix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/os: linux
        homelab/node-class: compute
      # Kiwix-serve exits immediately if it is handed a glob that matches
      # nothing, so an empty volume means a permanent CrashLoopBackOff. The
      # kustomization claimed ZIM files were fetched from MinIO on startup, but
      # no init container and no download logic ever existed.
      #
      # This seeds one small ZIM if the volume is empty, so the app comes up on
      # its own. Add larger corpora by dropping .zim files into the same NFS
      # share; this init container will then leave it alone.
      initContainers:
        - name: seed-zim
          image: curlimages/curl:8.11.1
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              set -eu
              if ls /data/*.zim >/dev/null 2>&1; then
                echo "ZIM files already present, nothing to seed:"
                ls -la /data/*.zim
                exit 0
              fi
              echo "No ZIM files found. Seeding a starter corpus..."
              base="https://download.kiwix.org/zim/wikipedia/"
              # Kiwix filenames carry a build date (e.g. _2026-05), so a
              # hardcoded URL 404s as soon as upstream rebuilds — which is
              # exactly what happened here. Discover the newest matching file
              # instead. Simple English is a few hundred MB, a sane starter.
              name=$(curl -fsSL "$base" \
                | grep -oE 'wikipedia_en_simple_all_mini_[0-9]{4}-[0-9]{2}\.zim' \
                | sort -u | tail -1)
              if [ -z "$name" ]; then
                echo "Could not find a ZIM to seed in $base" >&2
                exit 1
              fi
              echo "Selected $name"
              # Download to a temp name so a partial transfer is never picked
              # up as a valid corpus by kiwix-serve.
              if curl -fsSL --retry 3 --retry-delay 5 -o /data/.seed.partial "$base$name"; then
                mv /data/.seed.partial "/data/$name"
                echo "Seeded $name"
              else
                rm -f /data/.seed.partial
                echo "Seed download failed; kiwix will not start until a .zim exists" >&2
                exit 1
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: kiwix
          # Pinned: :latest gives no way to reason about what is running.
          image: ghcr.io/kiwix/kiwix-serve:3.7.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # Run through a shell so the glob is actually expanded. Passing
          # "/data/*.zim" as a bare arg made kiwix-serve treat it as a literal
          # filename: "Unable to add the ZIM file '/data/*.zim'".
          command: ["/bin/sh", "-c"]
          args: ["exec kiwix-serve --port=8080 /data/*.zim"]
          ports:
            - containerPort: 8080
              name: http
          # kiwix-serve either has a ZIM open and serves, or it has already
          # exited - but "exited" here means the shell wrapper above dies and
          # the pod restarts, and without a probe the Service kept the endpoint
          # for the whole restart window. GET / is the library index, which
          # kiwix-serve renders from memory: measured at 0.5-0.7ms in-cluster,
          # returning 200.
          #
          # Deliberately generous anyway. An over-tight probe on Lidarr in this
          # cluster emptied a Service's endpoints and cost hours of
          # misdiagnosis, and a large ZIM corpus makes the first index build
          # slower than the steady state - 30s of grace, then two minutes of
          # genuine unresponsiveness before the endpoint is pulled.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kiwix-zim
