---
# ConvertX: self-hosted file converter (1000+ formats via ffmpeg, LibreOffice,
# ImageMagick, pandoc, calibre, ...). Conversions run as local subprocesses, so
# the pod needs no internet egress - and it must never be reachable without a
# login, because a converter that runs arbitrary binaries is the last thing
# this cluster publishes unauthenticated.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: convertx
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: convertx
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: convertx

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: convertx
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: file-conversion
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - ingress.yaml
