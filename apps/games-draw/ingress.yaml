apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-draw
  namespace: games-draw
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec@kubernetescrd,kube-system-rate-limit@kubernetescrd,kube-system-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - draw.sandstorm.chat
    secretName: games-draw-tls
  rules:
  - host: draw.sandstorm.chat
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: games-draw
            port:
              number: 8080
