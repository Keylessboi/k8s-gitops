apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-draw
  namespace: games-draw
spec:
  # spec.replicas is deliberately NOT set: ArgoCD uses server-side apply, so a
  # field absent from git is not owned by ArgoCD and selfHeal never reverts a
  # manual scale. Meant to be OFF unless someone is playing:
  #   wake: kubectl -n games-draw scale deploy/scribble --replicas=1
  #   stop: --replicas=0
  # A fresh Deployment starts at 1 replica; scale it to 0 after the first sync.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: games-draw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: games-draw
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
        homelab/node-class: compute
      containers:
        - name: games-draw
          image: docker.io/biosmarcel/scribble.rs@sha256:9d1d651538de3a95e2d318f134ad9c1e9740945cb87835ac7c1cdfbd82a9c775
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - {name: PORT, value: "8080"}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

