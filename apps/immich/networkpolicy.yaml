apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: allow-traefik-ingress
spec:
  ingress:
  # cert-manager creates HTTP-01 solver pods in this namespace on demand and
  # Traefik must reach them on 8089. Without this the ACME challenge 502s and
  # no certificate is ever issued for this host.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8089
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 2283
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
