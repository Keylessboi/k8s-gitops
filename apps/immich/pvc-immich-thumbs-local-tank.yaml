---
# Immich thumbnails (regenerable cache): moved to the encrypted tank pool (policy §12.4). The old claim
# immich-thumbs-local stays declared for rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-thumbs-local-tank
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 10Gi
