---
# Immich: photo library. Helm release runs server, worker, and ML.
# CNPG Cluster holds the catalogue. WAL ships to MinIO.
# The photo library lives on an NFS claim.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: immich
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
    argocd.argoproj.io/managed-by: argocd-applicationset

namespace: immich

# `labels` with includeSelectors:false, NOT `commonLabels`.
# commonLabels rewrites every selector it finds - Deployment/Service
# selectors and NetworkPolicy podSelectors alike. Deployment selectors
# are immutable, so changing these labels made ArgoCD fail with
# 'spec.selector: field is immutable', and it silently broke
# NetworkPolicy podSelectors by adding labels the target pods lack.
labels:
  - pairs:
      app.kubernetes.io/name: immich
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/component: photos
      app.kubernetes.io/managed-by: argocd
      homelab/tier: apps
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - ingress.yaml


helmCharts:
  - name: immich
    repo: https://immich-app.github.io/immich-charts
    version: 0.12.0
    releaseName: immich
    namespace: immich
    valuesInline:
      # This chart is built on the bjw-s common library, so env belongs under
      # controllers.main.containers.main.env. A top-level `env:` block — which
      # is what used to be here — is silently ignored, leaving the chart's
      # defaults in place. That is why immich-server kept dying with
      # "getaddrinfo ENOTFOUND database": it was still resolving the chart's
      # default hostname.
      controllers:
        main:
          # The chart ships readiness/liveness probes with timeoutSeconds: 1.
          # On this node that is not a health check, it is a load test: the app
          # answers /api/server/ping in well under a second when idle, but
          # under memory pressure a single scheduling delay trips it, three
          # times in a row marks the pod NotReady, and a rolling update then
          # never completes - both ReplicaSets stay up, which costs another
          # ~500 MB and makes the pressure worse. Exactly that happened during
          # the 2026-09-04 library restore: the pod logged "Immich Server is
          # listening on 2283" and "Machine learning server became healthy",
          # answered ping with 200 on a port-forward, and still sat 0/1 for
          # fifteen minutes.
          #
          # 5s is still a real check - a wedged app does not answer in 5s
          # either - it just stops reporting a busy node as a broken one.
          probes:
            readiness:
              spec:
                timeoutSeconds: 5
                periodSeconds: 15
                failureThreshold: 6
            liveness:
              spec:
                timeoutSeconds: 5
                periodSeconds: 30
                failureThreshold: 6
          containers:
            main:
              image:
                # Pinned explicitly: chart 0.12.0 defaults to its appVersion
                # (v2.6.3) and lags upstream releases. The tag is bumped ahead
                # of the chart, one release step at a time - Immich does not
                # support skipping versions safely (destructive DB migrations).
                # v3.0.0 breaking changes checked: DB already on VectorChord
                # (vchord 0.4.1, pgvecto.rs drop is a no-op), node CPU meets
                # x86-64-v2, none of the removed env vars are set here, OAuth
                # issuer is a valid https URL.
                tag: v3.1.0
              env:
                # Central Postgres, not a per-app cluster.
                DB_HOSTNAME: app-databases-rw.databases.svc.cluster.local
                DB_DATABASE_NAME: immich
                DB_USERNAME: immich
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-credentials
                      key: password
                # Shared Redis. This was an empty string, which alone stopped
                # Immich from ever starting.
                REDIS_HOSTNAME: redis-master.redis.svc.cluster.local
                REDIS_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: redis-auth
                      key: redis-password
                # OIDC settings as a declared file rather than clicks in the
                # admin UI. Immich exposes no env vars for OAuth, so without
                # this the login page shows no SSO button no matter what
                # Authentik has configured on its side.
                IMMICH_CONFIG_FILE: /config/immich.json
      # bjw-s persistence, NOT immich.persistence - that key is a chart-specific
      # shim for the library volume only, and anything else placed under it is
      # silently dropped (the mount simply never appears in the Deployment).
      #
      # globalMounts puts the file in every container of the controller, which
      # is what we want: IMMICH_CONFIG_FILE is set on both containers, so both
      # need the path to exist.
      persistence:
        config:
          enabled: true
          type: secret
          name: immich-config
          globalMounts:
            - path: /config
              readOnly: true

      postgres:
        enabled: false
      # No `redis:` key here — the chart removed that subchart in 0.10.0 and
      # now hard-fails if it is present at all. Redis is wired purely through
      # the REDIS_HOSTNAME / REDIS_PASSWORD env vars above.

      machine-learning:
        enabled: true
        controllers:
          main:
            containers:
              main:
                image:
                  # Kept in lockstep with the server tag above: Immich requires
                  # server and ML to run the exact same version.
                tag: v3.1.0
        nodeSelector:
          homelab/node-class: compute
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
      server:
        nodeSelector:
          homelab/node-class: compute
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
      immich:
        persistence:
          library:
            enabled: true
            existingClaim: immich-library
