---
# The account provisioner. See apps/accounts/app.py for what it does and, more
# importantly, what it deliberately does not.
#
# Python's stdlib http.server, with the source mounted from a ConfigMap
# generated out of app.py - so the code is reviewable as a Python file in git
# rather than as an indented blob inside YAML, and no image needs building or
# hosting for ~350 lines with no dependencies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  namespace: accounts
spec:
  replicas: 1
  # One at a time: two replicas racing the same "create if absent" against
  # three systems is a way to make duplicate accounts for no benefit. This
  # serves one form to one person.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: accounts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounts
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: accounts
          image: python:3.12-alpine3.20
          command: ["python3", "-u", "/app/app.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8080"
            - name: AUTHENTIK_URL
              value: http://authentik-server.authentik.svc.cluster.local
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef: {name: accounts, key: authentik-api-token}
            - name: INVIDIOUS_URL
              value: http://invidious.invidious.svc.cluster.local
            - name: REMUX_URL
              value: http://remux.remux.svc.cluster.local:3000
            - name: REMUX_ADMIN_USER
              value: admin
            - name: REMUX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: accounts, key: remux-admin-password}
            # Second gate, independent of the ingress middleware list.
            - name: REQUIRED_GROUP
              value: "authentik Admins"
            - name: NTFY_URL
              value: http://192.168.1.153:9098/homelab-alerts
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 300m, memory: 192Mi}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: accounts-src
