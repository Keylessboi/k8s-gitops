# Component host only: no accounts, no client listener. Exists so the owner's Snikket
# (travis@snikket.sandstorm.chat) can federate (s2s, 5269) with the iMessage bridge, which
# connects as an external component (5347, cluster-internal only). `hosts` is a placeholder
# vhost: the component domain imessage.sandstorm.chat must NOT also be a vhost, or the
# component handshake silently fails (tested 2026-10-20, ejabberd 26.09).
hosts:
  - local.invalid

# COMPONENT_SECRET is a macro defined in the generated file below: the init container writes
# it from the Doppler-managed Secret `ejabberd-component` into a memory-backed volume, so the
# value is never in this file, in git, or in an environment variable.
include_config_file: /run/ejabberd-secret/component.yml

loglevel: info

certfiles:
  - /etc/ejabberd-tls/tls.crt
  - /etc/ejabberd-tls/tls.key

listen:
  # Server-to-server. STARTTLS is mandatory (s2s_use_starttls below).
  - port: 5269
    ip: "::"
    module: ejabberd_s2s_in
    max_stanza_size: 524288
  # Direct-TLS server-to-server (XEP-0368, SRV _xmpps-server._tcp): TLS from the first byte,
  # so STARTTLS stripping is not possible. Peers that support it prefer it over 5269.
  - port: 5270
    ip: "::"
    module: ejabberd_s2s_in
    tls: true
    max_stanza_size: 524288
  # External component (XEP-0114). Only the ClusterIP Service exposes it, and the
  # NetworkPolicy admits only the bridge's namespace.
  - port: 5347
    ip: "::"
    module: ejabberd_service
    access: all
    hosts:
      imessage.sandstorm.chat:
        password: COMPONENT_SECRET
    shaper: fast
  # Health probes only (TCP). No request handlers, so every path 404s.
  - port: 5280
    ip: "::"
    module: ejabberd_http
    request_handlers: {}

# No c2s listener, no registration, no accounts, no admin API.
# STARTTLS is mandatory and peer certificates are verified against the system CA store.
# (`required_trusted` is deprecated in 26.09 and would also drop dialback; see modules below.)
s2s_use_starttls: required
ca_file: /etc/ssl/certs/ca-certificates.crt
# TLS 1.2 minimum (1.3 is negotiated whenever the peer supports it) with AEAD suites only;
# no compression. Pure 1.3-only would lock out peers still on 1.2.
s2s_protocol_options:
  - no_sslv3
  - no_tlsv1
  - no_tlsv1_1
s2s_ciphers: "ECDHE+AESGCM:ECDHE+CHACHA20"
s2s_dns_retries: 2
s2s_dns_timeout: 10
outgoing_s2s_timeout: 30
negotiation_timeout: 30
s2s_access: s2s

# Federation allowlist, checked against the remote server's domain. Add a peer here to
# federate with another server.
acl:
  federation_peers:
    server:
      - snikket.sandstorm.chat

access_rules:
  s2s:
    - allow: federation_peers
    - deny: all

shaper:
  fast: 100000
shaper_rules:
  fast:
    - fast

auth_method: internal
default_db: mnesia
# cert-manager owns the certificate; ejabberd's built-in ACME must not try to get its own.
acme:
  auto: false

# Dialback is the fallback when a peer cannot authenticate by certificate (Let's Encrypt no
# longer issues clientAuth certs, so SASL EXTERNAL may not be offered either way). The s2s
# allowlist above still confines it to snikket.sandstorm.chat. Once federation is proven to
# work with certificate auth (watch the log for "SASL EXTERNAL"), delete this module to make
# S2S certificate-only.
modules:
  mod_s2s_dialback: {}
