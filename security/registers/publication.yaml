register: publication
kind: exception
policy: 01-policy.md §9.7
requirement: HS-NET-06
# An entry lets one Ingress publish its listed routes without the identity
# provider. It takes effect only with status "approved" and a valid owner
# signature (scripts/security/approve.py). An agent MAY add or edit an entry
# with status "proposed". It cannot approve one. Editing an approved entry
# breaks its signature, so the entry stops taking effect until the owner signs
# it again. Criteria values: met | not-met | unverified.
entries:
  - id: P-01
    ingress: ghost/ghost
    routes: [blog.sandstorm.chat/]
    basis: public
    reason: Public web content. The admin path /ghost has the application's own staff login.
    criteria: {reason: met, data: met, login: unverified, accounts: met, function: met}
    status: approved
    approved_on: 2026-10-06
    approval_note: "Approved by the agent at the owner's request on 2026-10-06; not individually reviewed."
    review_by: 2027-10-01
