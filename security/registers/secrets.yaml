register: secrets
kind: inventory
policy: 01-policy.md §12.3
requirement: HS-ROT-01..05
# One entry per Doppler-managed Secret. Generated 2026-10-06 from the rendered manifests; keep it
# current (CI fails when a DopplerSecret has no entry). Never put a value here.
# origin:    database | internal | app-generated | oidc | deploy-key | external | encryption-key | config
# rotatable: yes (change in Doppler only) | coupled (also change in another system)
#            external (provider console) | no (rotation destroys data; reason in method)
# reload:    auto (Deployment has secrets.doppler.com/reload) | per-run (Job reads it at start)
#            operator (read by a platform operator) | manual (restart by hand) | none (no consumer in the repo)
# last_rotated: date, or unknown. period_months: the longest age allowed (policy §12.3).
entries:
  - id: S-01
    secret: accounts/accounts
    keys: [AUTHENTIK_API_TOKEN, PROWLARR_API_KEY]
    origin: app-generated
    rotatable: "coupled"
    method: "The app generates the key. Rotate in the app, then update Doppler."
    reload: auto
    consumers: [Deployment/accounts]
    period_months: 12
    last_rotated: unknown
  - id: S-02
    secret: authentik/smtp
    keys: [SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM]
    origin: external
    rotatable: "external"
    method: "Rotate in the provider console, then change the value in Doppler."
    reload: manual
    consumers: [Deployment/authentik-server, Deployment/authentik-worker]
    period_months: 12
    last_rotated: unknown
  - id: S-03
    secret: bitmagnet/bitmagnet-db
