    origin: database
    rotatable: "yes"
    method: "Change the password in Doppler. The operator updates the CNPG role and the app's secret, and the app reloads."
    reload: auto
    consumers: [Deployment/bitmagnet]
    period_months: 12
    last_rotated: unknown
